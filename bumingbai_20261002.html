<script>
const D=[{"t": "00:00:04", "p": "", "o": "袁莉：大家好，欢迎来到不明白播客，我是主持人袁莉。", "e": "Yuan Li: Hello, everyone. Welcome to the Bumingbai Podcast. I'm your host, Yuan Li.", "d": 6, "r": "播客", "z": 3.12, "n": 12}, {"t": "00:00:04", "p": "", "o": "本期节目源自于社交媒体平台Threads上的一则贴文《说出一百个在中国生活感觉自己很低贱的瞬间》。", "e": "This episode grew out of a post on the social media platform Threads titled ‘One Hundred Moments When Living in China Made You Feel Worthless.’", "d": 7, "r": "低贱", "z": 3.02, "n": 23}, {"t": "00:00:04", "p": "", "o": "这则帖子目前收到了两万七千多条回复。", "e": "The post has received more than 27,000 replies so far.", "d": 5, "r": "七千", "z": 3.39, "n": 10}, {"t": "00:00:04", "p": "", "o": "评论里有人说时薪没有充电宝高；有人说是需要翻墙打游戏；有人说是打了很多字，又因为害怕全部删掉的时候。", "e": "Some commenters said their hourly wage was lower than the cost of a power bank; others said they had to use a VPN to play games; still others described typing out a long message and then deleting the whole thing out of fear.", "d": 7, "r": "删掉", "z": 3.31, "n": 29}, {"t": "00:00:04", "p": "", "o": "我对这些回复充满了好奇，希望听到背后的具体故事，于是发起了这期征集。", "e": "I was very curious about these responses and wanted to hear the specific stories behind them, so I put out this call for submissions.", "d": 5, "r": "征集", "z": 3.91, "n": 18}, {"t": "00:00:04", "p": "", "o": "下面是我们收到的部分听众投稿，一些语音投稿要求不变声，一些应投稿者要求进行了变声，还有一些是文字投稿，由我代为朗读。", "e": "Here are some of the submissions we received. Some contributors asked to use their own voices, while others requested voice alteration. Some sent written submissions, which I'll read aloud.", "d": 7, "r": "朗读", "z": 3.44, "n": 31}, {"t": "00:00:04", "p": "", "o": "为简洁起见，我们对文字和录音进行了删减和编辑。", "e": "For the sake of brevity, we have shortened and edited the written submissions and recordings.", "d": 5, "r": "删减", "z": 3.8, "n": 14}, {"t": "00:00:04", "p": "", "o": "从上网的不易到求职和工作的艰辛，听众们讲述了不同的经历，谢谢大家的踊跃参与。", "e": "From the difficulties of getting online to the hardships of job hunting and work, our listeners have shared a range of experiences. Thank you all for taking part so enthusiastically.", "d": 6, "r": "踊跃", "z": 3.63, "n": 22}, {"t": "00:00:04", "p": "", "o": "不明白播客希望是你们的树洞，是你们的地下电台，在这个黑暗与不确定的年代，帮助你们听到彼此的声音，看到具体的个人。", "e": "The Bumingbai Podcast hopes to be your confessional, your underground radio station, helping you hear one another's voices and see the real people behind them in this dark and uncertain era.", "d": 7, "r": "播客", "z": 3.12, "n": 31}, {"t": "00:00:04", "p": "", "o": "首先是来自济南，还在上大学的小Y讲述自己订阅ChatGPT的艰辛。", "e": "First, Xiao Y, a university student from Jinan, tells us how difficult it was to subscribe to ChatGPT.", "d": 5, "r": "艰辛", "z": 3.8, "n": 15}, {"t": "00:01:31", "p": "", "o": "小Y：暑假到了，我想订阅OpenAI的ChatGPT Plus会员。", "e": "Xiao Y: When summer vacation arrived, I wanted to subscribe to OpenAI's ChatGPT Plus.", "d": 4, "r": "暑假", "z": 3.98, "n": 9}, {"t": "00:01:31", "p": "", "o": "为此，我提前跑到国内某家银行办了一张支持万事达境外支付的储蓄卡。", "e": "To do that, I went in advance to a bank in China and opened a debit card that supported overseas payments through Mastercard.", "d": 7, "r": "储蓄卡", "z": 2.83, "n": 18}, {"t": "00:01:31", "p": "", "o": "本以为这样就能够正常订阅ChatGPT Plus ，但当我在订阅页面输入卡号和地址之后，却一直无法完成订阅。", "e": "I thought that would let me subscribe to ChatGPT Plus normally, but after entering my card number and address on the subscription page, I still couldn't complete the subscription.", "d": 5, "r": "订阅", "z": 4.03, "n": 22}, {"t": "00:01:31", "p": "", "o": "困惑之下，我去YouTube搜索了相关攻略才了解到银行卡号的前六位，也就是BRN，可以用来识别发卡机构和发卡地区。", "e": "Confused, I searched YouTube for tutorials and learned that the first six digits of a bank card, known as the BIN, can identify the issuing institution and region.", "d": 7, "r": "发卡", "z": 3.14, "n": 26}, {"t": "00:01:31", "p": "", "o": "由于我使用的是中国大陆银行发行的银行卡，最终还是无法完成订阅。", "e": "Because my card was issued by a bank in mainland China, I still couldn't complete the subscription.", "d": 5, "r": "订阅", "z": 4.03, "n": 16}, {"t": "00:01:31", "p": "", "o": "我只能通过第三方渠道购买苹果礼品卡才充值到美区的Apple Store ，终于订阅成功。", "e": "I had to buy an Apple gift card through a third-party channel and add the funds to the U.S. Apple Store before I finally managed to subscribe.", "d": 5, "r": "礼品", "z": 3.74, "n": 16}, {"t": "00:01:31", "p": "", "o": "面对当下世界如此蓬勃的AI浪潮，身为一个中国的年轻人，想要订阅一个AI工具竟然如此困难，甚至还要想办法绕路寻找攻略，提前学习如何翻墙。", "e": "With the AI boom sweeping the world, it's astonishingly difficult for a young person in China to subscribe to an AI tool; you even have to find workarounds, search for tutorials, and learn in advance how to get around the Great Firewall.", "d": 7, "r": "绕路", "z": 3.26, "n": 30}, {"t": "00:01:31", "p": "", "o": "这让我感受到了一股深深的低贱感。", "e": "That left me with a profound feeling of being treated as less than human.", "d": 6, "r": "低贱", "z": 3.02, "n": 11}, {"t": "00:02:38", "p": "", "o": "袁莉：23岁的吉米来自东北，出于个人原因，需要在不同的操作系统上配置VPN。", "e": "Yuan Li: Jimmy, 23, is from northeastern China. For personal reasons, they need to configure a VPN on different operating systems.", "d": 5, "r": "吉米", "z": 3.71, "n": 16}, {"t": "00:02:38", "p": "", "o": "TA说：", "e": "They said:", "d": 1, "r": "说", "z": 6.55, "n": 1}, {"t": "00:02:55", "p": "", "o": "吉米：当我因为网络问题而反复尝试的时候，就会觉得生活在这里真的好低贱。", "e": "Jimmy: When I keep trying over and over because of network problems, I feel that living here is truly degrading.", "d": 7, "r": "低贱", "z": 3.02, "n": 20}, {"t": "00:02:55", "p": "", "o": "每次下载软件配置网络的时候，真的让我觉得很烦。", "e": "Every time I download software and configure the network, it's really frustrating.", "d": 6, "r": "很烦", "z": 3.24, "n": 12}, {"t": "00:02:55", "p": "", "o": "其实一开始我也不是说要看多么反对尖锐的内容，我只是想在不同的环境下都能从GitHub上拉东西。", "e": "At first, I wasn't even trying to view particularly controversial or sharply critical content. I just wanted to be able to pull things from GitHub in different environments.", "d": 5, "r": "尖锐", "z": 4.15, "n": 27}, {"t": "00:02:55", "p": "", "o": "最近的风头比较紧，机场在不停的换协议、更新客户端。", "e": "Things have been especially sensitive lately, and VPN providers keep changing protocols and updating their clients.", "d": 6, "r": "风头", "z": 3.43, "n": 13}, {"t": "00:02:55", "p": "", "o": "每次手动的重复做这些东西的时候，都让我觉得很烦躁很讨厌。", "e": "Having to repeat all of this manually every time makes me feel irritated and disgusted.", "d": 5, "r": "烦躁", "z": 3.63, "n": 17}, {"t": "00:02:55", "p": "", "o": "还有就是，说出这些话的时候，其实我内心是有害怕的，并且我还怕这个录音的内容被监测到，这种自我恐惧的存在也让我觉得自己很低贱。", "e": "Also, when I say these things, I'm genuinely afraid inside. I'm even worried that this recording might be monitored. Living with this fear of myself also makes me feel degraded.", "d": 7, "r": "低贱", "z": 3.02, "n": 37}, {"t": "00:03:43", "p": "", "o": "袁莉：对于翻墙，来自武汉的张女士也有类似的感想。", "e": "Yuan Li: Zhang, a woman from Wuhan, has similar feelings about getting around the Great Firewall.", "d": 5, "r": "翻墙", "z": 3.49, "n": 12}, {"t": "00:03:47", "p": "", "o": "张女士：我是来自湖北武汉的张女士。", "e": "Ms. Zhang: I'm Ms. Zhang, from Wuhan, Hubei Province.", "d": 2, "r": "来自", "z": 5.38, "n": 8}, {"t": "00:03:47", "p": "", "o": "看到这个征稿，我的第一反应是当我听您的节目需要挂VPN、当我投稿需要用我自己并不常用的Gmail、当我选择要变声的这些时刻。", "e": "When I saw this call for submissions, my first thoughts were the times when I need a VPN to listen to your program, when I have to use a Gmail account I rarely use to submit my story, and when I choose to have my voice altered.", "d": 7, "r": "征稿", "z": 2.96, "n": 35}, {"t": "00:03:47", "p": "", "o": "我是刚入职武汉某医院的博士后。", "e": "I've just started a postdoctoral position at a hospital in Wuhan.", "d": 5, "r": "入职", "z": 3.53, "n": 9}, {"t": "00:03:47", "p": "", "o": "去年找工作的时候我发现和用人单位谈薪资待遇是一个禁忌话题，没有人会告诉我真实的情况。", "e": "When I was looking for a job last year, I found that discussing salary and benefits with an employer was taboo. No one would tell me what the real situation was.", "d": 7, "r": "用人单位", "z": 2.88, "n": 23}, {"t": "00:03:47", "p": "", "o": "在最后签劳动合同的网站上，我发现合同附件根本就没有上传，整个网页只有一个巨大的确定按钮。", "e": "On the website where I was supposed to sign my employment contract, I discovered that the contract attachments hadn't been uploaded at all. The entire webpage had just one enormous ‘Confirm’ button.", "d": 6, "r": "劳动合同", "z": 3.49, "n": 23}, {"t": "00:03:47", "p": "", "o": "以及我发现只有我和我的另一个朋友对此感到愤怒，而身边的大部分人都没有异议的时候，这些时候我感觉自己很低贱。", "e": "I also felt degraded when I realized that only another friend and I were angry about this, while most people around us had no objections.", "d": 7, "r": "低贱", "z": 3.02, "n": 31}, {"t": "00:03:47", "p": "", "o": "在上班之后，当我需要在医院值24小时班，但实际连续工作时间将近三十个小时，并且夜班费只有五十块钱的时候。", "e": "After I started work, I had to cover a 24-hour hospital shift, but in reality I worked nearly 30 hours straight, and the night-shift allowance was only 50 yuan.", "d": 7, "r": "三十个", "z": 3.05, "n": 27}, {"t": "00:03:47", "p": "", "o": "我所在的医院在疫情中被政府大肆表扬。", "e": "The government lavishly praised the hospital where I work during the pandemic.", "d": 5, "r": "大肆", "z": 3.88, "n": 11}, {"t": "00:03:47", "p": "", "o": "而疫情结束、医保缺钱的时候，政府开始倒查二十年。", "e": "But after the pandemic ended and health insurance funds ran short, the government began investigating the previous 20 years.", "d": 6, "r": "缺钱", "z": 3.11, "n": 11}, {"t": "00:03:47", "p": "", "o": "我知道医院的好几个主任领导因此自杀，有成功的，有没成功的。", "e": "I know several department heads and hospital leaders who died by suicide because of this; some attempts succeeded and others did not.", "d": 4, "r": "好几个", "z": 4.12, "n": 16}, {"t": "00:03:47", "p": "", "o": "当然，过去他们赚了很多不应该赚的钱，他们的积蓄也可能是我这辈子无法企及的。", "e": "Of course, they had made a lot of money they shouldn't have in the past, and their savings may be beyond anything I could ever accumulate in my lifetime.", "d": 7, "r": "企及", "z": 2.93, "n": 22}, {"t": "00:03:47", "p": "", "o": "他们这么做也可能是作秀，也可能是为了保全家庭财富。", "e": "Perhaps they were putting on a show, or perhaps they were trying to protect their families' wealth.", "d": 6, "r": "作秀", "z": 3.42, "n": 14}, {"t": "00:03:47", "p": "", "o": "但是有的时候我觉得自己和他们一样低贱，我们都遭受着系统性的压迫，而缺乏制度性的保护。", "e": "But sometimes I feel just as degraded as they are. We are all subjected to systemic oppression and lack institutional protection.", "d": 7, "r": "低贱", "z": 3.02, "n": 23}, {"t": "00:05:21", "p": "", "o": "袁莉：来自成都的月亮在离职休息一年后开始重新找工作。", "e": "Yuan Li: Moon, from Chengdu, began looking for work again after taking a year off following their resignation.", "d": 5, "r": "离职", "z": 3.91, "n": 14}, {"t": "00:05:21", "p": "", "o": "TA给我们讲述了这个过程中的种种困难。", "e": "They told us about the many difficulties they encountered along the way.", "d": 3, "r": "讲述", "z": 4.51, "n": 10}, {"t": "00:05:32", "p": "", "o": "月亮：大家好，我叫月亮，今年26岁，本科毕业。", "e": "Moon: Hello, everyone. My name is Moon. I'm 26 and have a bachelor's degree.", "d": 6, "r": "本科毕业", "z": 3.23, "n": 9}, {"t": "00:05:32", "p": "", "o": "去年八月，因为受不了上一份工作精神和身体上的双重压力，我选择裸辞休息。", "e": "Last August, unable to bear the combined mental and physical pressure of my previous job, I quit without lining up another job and took time to rest.", "d": 8, "r": "裸辞", "z": 2.48, "n": 18}, {"t": "00:05:32", "p": "", "o": "近几个月来，在拼命找工作中，长达快一年的gap期成了我洗不掉的污点。", "e": "Over the past few months, as I've desperately searched for work, a gap of almost a year has become a stain I can't wash away.", "d": 8, "r": "洗不掉", "z": 2.44, "n": 18}, {"t": "00:05:32", "p": "", "o": "在和我沟通过的HR里，所有人都在盘问我为什么裸辞、为什么休息了这么久才开始找工作、gap期间是在干嘛等等一系列问题。", "e": "Every HR representative I've spoken with has grilled me with questions: Why did I quit without another job lined up? Why did I wait so long to look for work again? What was I doing during the gap? And so on.", "d": 8, "r": "裸辞", "z": 2.48, "n": 29}, {"t": "00:05:32", "p": "", "o": "我一开始如实回答，说自己休息了一小段时间，然后就开始提升自己，补充学习行业知识等。", "e": "At first, I answered honestly, saying I'd taken a short break and then started working on myself and studying more about my industry.", "d": 5, "r": "如实", "z": 3.73, "n": 21}, {"t": "00:05:32", "p": "", "o": "但这样沟通下来，几乎没有后续的流程推进，简历就这样石沉大海。", "e": "But after these conversations, almost none of the hiring processes moved forward, and my résumé simply disappeared into a black hole.", "d": 4, "r": "简历", "z": 4.26, "n": 14}, {"t": "00:05:32", "p": "", "o": "后来朋友出主意，让我编造一次意外事故，说事故后需要治疗和修养身体。", "e": "Later, a friend suggested that I make up an accident and say I needed time for treatment and recovery afterward.", "d": 6, "r": "意外事故", "z": 3.15, "n": 17}, {"t": "00:05:32", "p": "", "o": "在上一通面试电话里，我照做了，结果对方接着问，是什么事故？", "e": "I followed that advice during my most recent phone interview, and the interviewer immediately asked what kind of accident it was.", "d": 5, "r": "一通", "z": 3.62, "n": 17}, {"t": "00:05:32", "p": "", "o": "骨折还是骨裂？", "e": "Was it a fracture or a hairline fracture?", "d": 7, "r": "骨裂", "z": 2.48, "n": 3}, {"t": "00:05:32", "p": "", "o": "一般休息几个月不就好了吗？", "e": "Wouldn't a few months of rest normally be enough?", "d": 5, "r": "好了吗", "z": 3.53, "n": 7}, {"t": "00:05:32", "p": "", "o": "怎么休息了这么久才又准备找工作呢？", "e": "Why was I only getting ready to look for work again after such a long break?", "d": 5, "r": "这么久", "z": 3.82, "n": 10}, {"t": "00:05:32", "p": "", "o": "那种逼问的语气以及我回答后对方不相信的态度，让我觉得自己像个犯人。", "e": "The interrogating tone and the interviewer's disbelief in my answers made me feel like a criminal.", "d": 7, "r": "逼问", "z": 3.01, "n": 20}, {"t": "00:05:32", "p": "", "o": "除了上面这些问题，我也还被问到过是不是独生子女、是否婚恋、是否在岗位所在的城市有买房，甚至问到我父母的工作。", "e": "Besides these questions, I've also been asked whether I'm an only child, whether I'm in a relationship or married, whether I own a home in the city where the job is based, and even what my parents do for a living.", "d": 8, "r": "婚恋", "z": 2.83, "n": 29}, {"t": "00:05:32", "p": "", "o": "我感觉自己的隐私在不断被剥削。", "e": "I feel as though my privacy is constantly being exploited.", "d": 4, "r": "隐私", "z": 4.27, "n": 9}, {"t": "00:05:32", "p": "", "o": "我不情不愿却又模棱两可的回答着这些问题。", "e": "I answer these questions reluctantly, and often evasively.", "d": 9, "r": "模棱两可", "z": 0.59, "n": 10}, {"t": "00:05:32", "p": "", "o": "但我知道自己明明可以拒绝回答。", "e": "But I know perfectly well that I could refuse to answer.", "d": 4, "r": "明明", "z": 4.22, "n": 8}, {"t": "00:05:32", "p": "", "o": "我觉得这很低贱。", "e": "I find this degrading.", "d": 6, "r": "低贱", "z": 3.02, "n": 5}, {"t": "00:05:32", "p": "", "o": "每当HR和面试官居高临下的审问我，而我却需要绞尽脑汁想出让他们满意的答案时，我觉得自己很低贱。", "e": "Whenever HR staff and interviewers question me from a position of superiority, while I have to rack my brain to come up with answers that will satisfy them, I feel degraded.", "d": 10, "r": "居高临下", "z": 1.16, "n": 24}, {"t": "00:05:32", "p": "", "o": "现在我的工作依然没有着落，我不知道那些公司想要什么样的人，每过一天，我就觉得自己在就业市场上就变得更低贱了一点。", "e": "I still haven't found a job. I don't know what kind of people these companies want, and with every passing day, I feel a little more degraded in the job market.", "d": 7, "r": "着落", "z": 3.01, "n": 33}, {"t": "00:07:12", "p": "", "o": "袁莉：同样与找工作有关的投稿是29岁的芬奇。", "e": "Yuan Li: Another submission about job hunting comes from Finch, age 29.", "d": 6, "r": "芬奇", "z": 3.09, "n": 12}, {"t": "00:07:12", "p": "", "o": "TA来自山东潍坊，TA想分享一段自己的工作经历。", "e": "Finch is from Weifang, Shandong Province, and wants to share an experience from their working life.", "d": 3, "r": "一段", "z": 4.95, "n": 10}, {"t": "00:07:22", "p": "", "o": "芬奇：拿我现在国内私企工作来说，每周休息一天，一个月休息四天。", "e": "Finch: At my current job with a private company in China, I get one day off a week, or four days off a month.", "d": 7, "r": "私企", "z": 2.75, "n": 14}, {"t": "00:07:22", "p": "", "o": "想休假得和领导请假，若上级领导不同意，则没办法休假。", "e": "To take leave, you have to ask your manager; if a higher-level manager doesn't approve it, you can't take time off.", "d": 6, "r": "上级领导", "z": 3.45, "n": 14}, {"t": "00:07:22", "p": "", "o": "我身边同事有为休假而辞职的情况。", "e": "Some of my colleagues have quit just to get time off.", "d": 4, "r": "休假", "z": 4.02, "n": 10}, {"t": "00:07:22", "p": "", "o": "过年值班回不了家，而且不是三薪，只不过比平时工作日多给一百块钱。", "e": "When I have to work during Lunar New Year, I can't go home, and I don't get triple pay—just an extra 100 yuan compared with a regular workday.", "d": 6, "r": "一百块", "z": 3.13, "n": 17}, {"t": "00:07:22", "p": "", "o": "工作经常无偿义务劳动式的加班，到采收期加班到八、九点是常有的事。", "e": "Unpaid overtime is common. During harvest season, working until eight or nine at night is routine.", "d": 8, "r": "采收期", "z": 2.07, "n": 17}, {"t": "00:07:22", "p": "", "o": "而且工资被压榨到了极致。", "e": "And wages have been squeezed to the absolute limit.", "d": 5, "r": "压榨", "z": 3.4, "n": 7}, {"t": "00:07:22", "p": "", "o": "虽然包吃住，但是刚毕业的本科生试用期只有3500元，刚毕业的硕士生试用期只有4600元。", "e": "Although meals and accommodation are provided, newly graduated bachelor's-degree holders earn only 3,500 yuan during probation, while new master's graduates earn just 4,600 yuan.", "d": 6, "r": "硕士生", "z": 3.2, "n": 18}, {"t": "00:07:22", "p": "", "o": "大天朝，我们年轻人是“八九六四精神的传承者”。", "e": "In this great Celestial Empire, we young people are ‘inheritors of the 8-9-6-4 spirit.’", "d": 6, "r": "传承者", "z": 3.13, "n": 10}, {"t": "00:07:22", "p": "", "o": "每天八点上班，九点下班。", "e": "We start work at eight in the morning and finish at nine at night.", "d": 4, "r": "九点", "z": 3.76, "n": 5}, {"t": "00:07:22", "p": "", "o": "每周工作六天，每月休息四天。", "e": "We work six days a week and get four days off a month.", "d": 5, "r": "六天", "z": 3.4, "n": 6}, {"t": "00:07:22", "p": "", "o": "现在年轻人找工作就是一堆人抢食吃，抢不到饿死，抢到恶心死。", "e": "For young people today, looking for a job is like a crowd fighting over scraps: if you don't get any, you starve; if you do, you're sickened by it.", "d": 6, "r": "抢食", "z": 3.28, "n": 16}, {"t": "00:07:22", "p": "", "o": "这些经历给我最大的感受是，中国经济完了，低工资高工时，没时间谈恋爱，结婚生子，在中国生活看不到一点的希望和未来。", "e": "What these experiences have made me feel most strongly is that China's economy is finished. Wages are low and hours are long, there's no time to date, marry, or have children, and I can see no hope or future in living in China.", "d": 6, "r": "工时", "z": 3.57, "n": 29}, {"t": "00:08:39", "p": "", "o": "袁莉：我们也收到了住在海外的听众投稿，下面是生活在欧洲名叫小浩的听众留言。", "e": "Yuan Li: We also received submissions from listeners living abroad. Next is a message from Xiao Hao, who lives in Europe.", "d": 5, "r": "投稿", "z": 3.75, "n": 20}, {"t": "00:08:47", "p": "", "o": "小浩：袁莉，你好，我叫小浩。", "e": "Xiao Hao: Hello, Yuan Li. My name is Xiao Hao.", "d": 3, "r": "你好", "z": 4.69, "n": 6}, {"t": "00:08:47", "p": "", "o": "我生活在欧洲，但是每年大概会有一个月的时间回到中国，跟我的父母一起居住。", "e": "I live in Europe, but I return to China for about a month every year to stay with my parents.", "d": 4, "r": "一个月", "z": 4.68, "n": 20}, {"t": "00:08:47", "p": "", "o": "我之前使用的VPN这次在中国又使用不了，还好我提前做了准备，下载了好几个VPN ，其中有一个仍然可以使用。", "e": "The VPN I used before didn't work in China this time either. Luckily, I'd prepared in advance and downloaded several VPNs, one of which still worked.", "d": 5, "r": "好几个", "z": 4.12, "n": 25}, {"t": "00:08:47", "p": "", "o": "这已经不是我第一次因为使用不了而更换VPN了。", "e": "This isn't the first time I've had to switch VPNs because one stopped working.", "d": 4, "r": "更换", "z": 4.35, "n": 11}, {"t": "00:08:47", "p": "", "o": "我感觉这里的网络屏蔽越来越厉害。", "e": "I feel that internet censorship and blocking here are getting more and more severe.", "d": 4, "r": "屏蔽", "z": 3.94, "n": 8}, {"t": "00:08:47", "p": "", "o": "第二，我本身是同性恋，以前我在国内用的一款很受欢迎的同志交友软件，现在也不能下载了，感觉这个群体的公共生活空间和存在感还在继续被挤压。", "e": "Second, I'm gay, and a popular gay dating app I used in China can no longer be downloaded. It feels as though this community's public spaces and visibility continue to be squeezed out.", "d": 6, "r": "挤压", "z": 3.66, "n": 37}, {"t": "00:08:47", "p": "", "o": "第三，我觉得国内地铁的安检措施有一些太极端了，很不尊重公民的自由。", "e": "Third, I think security checks on the subway in China are somewhat extreme and show very little respect for citizens' freedom.", "d": 6, "r": "安检", "z": 3.5, "n": 19}, {"t": "00:08:47", "p": "", "o": "比如你随身携带的一瓶水都要让你喝一口，或者放到仪器上检测。", "e": "For example, even if you carry a bottle of water, they make you take a sip or put it through a machine for inspection.", "d": 6, "r": "随身携带", "z": 3.03, "n": 17}, {"t": "00:08:47", "p": "", "o": "有一次我带了一把小型的水果刀，根本不属于管制刀具，也被工作人员说教了一番，还把我的水果刀用胶带封了起来。", "e": "Once, I was carrying a small fruit knife that wasn't a controlled weapon at all, but a staff member lectured me and even sealed the knife with tape.", "d": 7, "r": "刀具", "z": 3.17, "n": 30}, {"t": "00:08:47", "p": "", "o": "最后还有一点让我印象特别深刻，这次在国内，我感觉网购外卖和刷短视频特别火，满大街都是外卖员，到处都看到人们在刷短视频。", "e": "Finally, something else left a deep impression on me during this trip to China: online shopping, food delivery, and short-video apps seem hugely popular. Delivery workers are everywhere, and everywhere you look, people are watching short videos.", "d": 7, "r": "刷短", "z": 3.36, "n": 32}, {"t": "00:08:47", "p": "", "o": "我从未看过一个国家如此多中老年人也如此的痴迷于刷短视频。", "e": "I've never seen another country where so many middle-aged and elderly people are so obsessed with short videos.", "d": 7, "r": "中老年人", "z": 2.9, "n": 15}, {"t": "00:08:47", "p": "", "o": "整个社会沉迷于短视频和物质主义，没有多少对国家走向和社会发展的有意义的探讨。", "e": "Society as a whole is immersed in short videos and materialism, with little meaningful discussion about the country's direction or social development.", "d": 6, "r": "沉迷于", "z": 3.23, "n": 21}, {"t": "00:08:47", "p": "", "o": "在我父母生活的这个城市，大家好像也都没有什么精气神，很少看到有人会对你露出微笑，很少有人会有一些基本的礼貌，比如没有人会等你先出电梯，先下地铁，也经常会有人插队。", "e": "In the city where my parents live, people seem to have little energy or spirit. I rarely see anyone smile at you or show basic courtesy. For example, no one waits for you to exit an elevator first or get off the subway first, and people often cut in line.", "d": 9, "r": "精气神", "z": 2.24, "n": 46}, {"t": "00:08:47", "p": "", "o": "说完这些，我竟然感到有稍微的自责，我是不是太negative了？", "e": "After saying all this, I actually feel a little guilty. Am I being too negative?", "d": 6, "r": "自责", "z": 3.41, "n": 13}, {"t": "00:10:42", "p": "", "o": "袁莉：接下来是同样生活在欧洲，名叫狮子的听众分享了TA记忆深刻的几件事。", "e": "Yuan Li: Next, Lion, who also lives in Europe, shares a few incidents that have stayed with them.", "d": 6, "r": "几件事", "z": 3.04, "n": 17}, {"t": "00:10:50", "p": "", "o": "狮子：我是狮子，我在欧洲。", "e": "Lion: I'm Lion, and I live in Europe.", "d": 3, "r": "狮子", "z": 4.43, "n": 7}, {"t": "00:10:50", "p": "", "o": "如果要说我所经历的几件事情，第一件就是我小时候在田埂边上骑一辆破烂的自行车，然后迎面而来的一辆小轿车载着一个村干部。", "e": "Of the things I've experienced, the first happened when I was a child. I was riding a battered bicycle along a field ridge when a car carrying a village official came toward me.", "d": 10, "r": "迎面而来", "z": 1.2, "n": 29}, {"t": "00:10:50", "p": "", "o": "可能我挡着了他们的路，村干部下车将年纪只有4、5岁的我一脚踹进了田里，弄得我浑身是泥。", "e": "Maybe I was blocking their way. The village official got out and kicked me, when I was only four or five years old, right into the field, leaving me covered in mud.", "d": 7, "r": "村干部", "z": 3.18, "n": 27}, {"t": "00:10:50", "p": "", "o": "第二件事情，上高三的时候，那时候压力相当的大。", "e": "The second incident happened when I was in my final year of high school, when the pressure was enormous.", "d": 5, "r": "第二件", "z": 3.82, "n": 12}, {"t": "00:10:50", "p": "", "o": "然后有一次我路过了教堂，我觉得唱诗的音乐很好听，然后我就去听歌。", "e": "One time I passed a church. I thought the hymns sounded beautiful, so I went in to listen.", "d": 6, "r": "唱诗", "z": 3.4, "n": 19}, {"t": "00:10:50", "p": "", "o": "不知道是被哪位同学看见了，就被他举报给了班主任。", "e": "I don't know which classmate saw me, but they reported me to the homeroom teacher.", "d": 5, "r": "哪位", "z": 3.81, "n": 15}, {"t": "00:10:50", "p": "", "o": "班主任就在全班同学面前宣布说我信了邪教，然后同时通知了我父母，然后鼓动全班同学一起嘲笑我。", "e": "The teacher announced in front of the entire class that I'd joined a cult, then informed my parents and encouraged the whole class to mock me.", "d": 6, "r": "邪教", "z": 3.57, "n": 23}, {"t": "00:10:50", "p": "", "o": "然后父母呢也就信了，然后几个月都没有给我生活费，我吃了几个月的白馒头。", "e": "My parents believed it too and stopped giving me living expenses for several months, so I ate plain steamed buns for months.", "d": 6, "r": "生活费", "z": 3.62, "n": 21}, {"t": "00:10:50", "p": "", "o": "再就是一个污染非常严重的一个化工厂气体泄露，所以搞得周围一大片城乡地区有很多人，患了呼吸道疾病。", "e": "Then there was a gas leak at a highly polluting chemical plant, which caused many people across a large surrounding urban and rural area to develop respiratory illnesses.", "d": 6, "r": "化工厂", "z": 3.3, "n": 25}, {"t": "00:10:50", "p": "", "o": "然后他们的解决方案就是给每个人封口费二十元，然后警告大家，谁敢说出去就有你们的果子可以吃。", "e": "Their solution was to pay each person 20 yuan as hush money and warn everyone that anyone who talked about it would suffer the consequences.", "d": 8, "r": "封口费", "z": 2.17, "n": 24}, {"t": "00:12:15", "p": "", "o": "袁莉：来自湖南张家界的Diamond投稿说：", "e": "Yuan Li: Diamond, from Zhangjiajie in Hunan Province, sent in this submission:", "d": 5, "r": "投稿", "z": 3.75, "n": 7}, {"t": "00:12:19", "p": "", "o": "Diamond：说到中国让我觉得最低贱的瞬间，最低贱的词就是我听到“牛马”这个词。", "e": "Diamond: When I think of the moments in China that make me feel most degraded, the most degrading word is ‘oxen and horses’—a slang term for people treated like beasts of burden.", "d": 7, "r": "低贱", "z": 3.02, "n": 20}, {"t": "00:12:19", "p": "", "o": "我觉得听到这个词，不管是我的大学的同学开玩笑。", "e": "I feel this way whenever I hear the term, even when university classmates use it jokingly.", "d": 4, "r": "开玩笑", "z": 4.39, "n": 13}, {"t": "00:12:19", "p": "", "o": "毕业后，我翻朋友圈看到很多人说什么“牛马的日常生活”这些，我觉得这瞬间都让我觉得非常的低贱，让我觉得非常的沮丧，也非常的挫败。", "e": "After graduation, I scrolled through my WeChat Moments and saw lots of people posting things like ‘the daily life of an ox or horse.’ Those moments make me feel deeply degraded, depressed, and defeated.", "d": 7, "r": "低贱", "z": 3.02, "n": 35}, {"t": "00:12:19", "p": "", "o": "我觉得人为什么活着活着…", "e": "I wonder why, as people go on living…", "d": 3, "r": "活着", "z": 4.57, "n": 6}, {"t": "00:12:19", "p": "", "o": "你活的就是那么的辛苦，你活的那么的忍辱负重。", "e": "…they have to live so painfully, enduring humiliation and bearing such heavy burdens.", "d": 9, "r": "忍辱负重", "z": 1.0, "n": 13}, {"t": "00:12:19", "p": "", "o": "而且好像你都被说成牛马了，你离自由好像就很遥远，但是自由…", "e": "It seems that once you're called a beast of burden, freedom feels very far away. But freedom…", "d": 6, "r": "说成", "z": 3.25, "n": 17}, {"t": "00:12:19", "p": "", "o": "这样的词就感觉在中国非常的绝望。", "e": "…the very word makes life in China feel utterly hopeless.", "d": 3, "r": "绝望", "z": 4.45, "n": 10}, {"t": "00:12:19", "p": "", "o": "然后当你说你不愿意当牛马的时候，别人就好像会觉得”你以为你是谁？”大家都是要吃苦，都是优中选优，都是努力竞争，就觉得非常的残酷。", "e": "When you say you don't want to be a beast of burden, people seem to respond, ‘Who do you think you are?’ Everyone has to suffer, compete to be the best of the best, and strive to outdo one another. It feels incredibly cruel.", "d": 9, "r": "中选优", "z": 2.27, "n": 38}, {"t": "00:12:19", "p": "", "o": "就感觉是要把别人打死，争来争去的。", "e": "It feels like everyone is trying to beat everyone else to death, fighting endlessly over scraps.", "d": 5, "r": "争来", "z": 3.57, "n": 10}, {"t": "00:12:19", "p": "", "o": "就像查建英老师说的饥民意识一样。", "e": "It's like the ‘famine mentality’ that writer Cha Jianying talks about.", "d": 5, "r": "饥民", "z": 3.37, "n": 9}, {"t": "00:12:19", "p": "", "o": "我觉得这些东西听着让我觉得非常的低贱。", "e": "Hearing all of this makes me feel deeply degraded.", "d": 6, "r": "低贱", "z": 3.02, "n": 12}, {"t": "00:13:39", "p": "", "o": "袁莉：来自北京的荆棘果发来文字稿。", "e": "Yuan Li: Jingjiguo, from Beijing, sent in a written submission.", "d": 5, "r": "发来", "z": 3.51, "n": 9}, {"t": "00:13:39", "p": "", "o": "TA说：身在墙内，不敢录制声音，只能把感触写出来。", "e": "They said that, living behind the Great Firewall, they didn't dare record their voice and could only write down their feelings.", "d": 5, "r": "感触", "z": 3.58, "n": 12}, {"t": "00:13:39", "p": "", "o": "TA写道：我很难回答在中国什么时候感到低贱，因为对我来说，这种感觉不是某一个具体事件，而是一种长期存在的感受。", "e": "They wrote: It's hard for me to say when I feel degraded in China, because for me this isn't about one specific incident but a feeling that has persisted for a long time.", "d": 7, "r": "低贱", "z": 3.02, "n": 27}, {"t": "00:13:39", "p": "", "o": "我会明显感觉到，普通人对自己的生活工作表达乃至未来都缺乏真正的决定权。", "e": "I clearly feel that ordinary people have no real say over their own lives, work, expression, or even their future.", "d": 6, "r": "决定权", "z": 3.16, "n": 18}, {"t": "00:13:39", "p": "", "o": "现在中国的毕业生很难找到工作，超过35岁的很难保住工作。", "e": "It's now very difficult for graduates in China to find jobs, and people over 35 struggle to keep theirs.", "d": 5, "r": "保住", "z": 4.02, "n": 14}, {"t": "00:13:39", "p": "", "o": "但另一边，习近平打算干到150岁，继续祸害中国人，胡搞瞎搞，让目前二十岁年轻人的孙子都逃不过习近平执政，实在太让人绝望。", "e": "Meanwhile, Xi Jinping plans to stay in power until he's 150, continuing to harm the Chinese people and act recklessly. Even the grandchildren of today's 20-year-olds may not escape his rule. It's utterly despairing.", "d": 7, "r": "瞎搞", "z": 3.18, "n": 27}, {"t": "00:13:39", "p": "", "o": "作为一个35岁以上已经离开电脑相关工作的人，我会越来越强烈的感受到普通人的处境和最高权力之间巨大的反差。", "e": "As someone over 35 who has already left work related to computers, I feel ever more strongly the huge contrast between ordinary people's circumstances and the highest levels of power.", "d": 6, "r": "反差", "z": 3.54, "n": 27}, {"t": "00:13:39", "p": "", "o": "普通人到了这个年龄，会担心自己是否还能找到工作，而国家最高领导人的权力却没有相应的退出机制。", "e": "At this age, ordinary people worry about whether they'll still be able to find work, while the country's top leader has no corresponding mechanism for leaving office.", "d": 5, "r": "普通人", "z": 3.95, "n": 25}, {"t": "00:13:39", "p": "", "o": "相较于我年轻时所经历的网络环境，我也明显感觉到这些年公共讨论的空间越来越小。", "e": "Compared with the internet environment I experienced when I was younger, I can also clearly see that the space for public discussion has shrunk over the years.", "d": 5, "r": "相较", "z": 4.04, "n": 22}, {"t": "00:13:39", "p": "", "o": "今天身处中国，我在表达这些看法时，甚至首先想到的是隐私和安全。", "e": "Living in China today, when I express these views, the first things I think about are privacy and safety.", "d": 5, "r": "身处", "z": 3.91, "n": 17}, {"t": "00:13:39", "p": "", "o": "这本身就是我所说的低贱感之一。", "e": "That, in itself, is one part of the feeling of degradation I'm talking about.", "d": 6, "r": "低贱", "z": 3.02, "n": 9}, {"t": "00:13:39", "p": "", "o": "来自上海的R小姐来信写道：这个标题触动我的原因并不是因为过去有多穷或者多辛苦。", "e": "Ms. R from Shanghai wrote: What struck me about this title wasn't how poor or how hard my life used to be.", "d": 5, "r": "触动", "z": 3.88, "n": 22}, {"t": "00:13:39", "p": "", "o": "我确实过着交完房租吃饭钱都不够的日子，但我其实从来不觉得这算是多苦，而是长久以来因为没钱买不起房子、在婚恋市场被男性鄙夷，甚至想把你当成玩物的羞耻感。", "e": "I really did go through periods when I couldn't afford food after paying rent, but I never thought that was especially hard. What hurt was the long-standing shame of not having enough money to buy a home, being looked down on by men in the dating and marriage market, and even being treated as a plaything.", "d": 10, "r": "鄙夷", "z": 1.33, "n": 41}, {"t": "00:13:39", "p": "", "o": "我是上海的八零后女性。", "e": "I'm a woman born in the 1980s and from Shanghai.", "d": 3, "r": "零", "z": 4.64, "n": 8}, {"t": "00:13:39", "p": "", "o": "当年因为我父母重男轻女的观念，觉得我是女的，不需要准备房子，我就连嫁妆都没有就嫁给了我前夫。", "e": "Because my parents favored boys and believed that, as a woman, I didn't need a home of my own, I married my ex-husband without even a dowry.", "d": 10, "r": "重男轻女", "z": 1.46, "n": 27}, {"t": "00:13:39", "p": "", "o": "然而我低估了这个社会的市侩，在他们一次家族聚会上，他一个亲戚酒后说买不起房子就是穷瘪三。", "e": "But I underestimated how mercenary society could be. At a family gathering, one of his relatives, after drinking, said that anyone who couldn't afford a home was a pathetic pauper.", "d": 10, "r": "市侩", "z": 1.24, "n": 24}, {"t": "00:13:39", "p": "", "o": "后来我离婚了，把生活的所有注意力放在工作上。", "e": "I later divorced and devoted all my attention to work.", "d": 4, "r": "注意力", "z": 4.2, "n": 12}, {"t": "00:13:39", "p": "", "o": "当时在外企，除了上班，还周末开滴滴送外卖、做平面模特，看到有什么能做兼职都去报名，拼命存钱，只为自己想给自己买个小房子安顿下来。", "e": "I was working at a foreign company, and besides my regular job, I drove for Didi and delivered food on weekends, worked as a print model, and signed up for any side gig I could find. I saved desperately, all so I could buy myself a small home and settle down.", "d": 8, "r": "安顿下来", "z": 2.42, "n": 36}, {"t": "00:13:39", "p": "", "o": "单身的十多年里，其实有不少男性追求，有的一看我家境不太好就立刻退出，有的则是已婚，厚颜无耻，要我做小三。", "e": "During the more than ten years I was single, quite a few men pursued me. Some immediately backed off when they saw that my family wasn't well-off; others were married and shamelessly wanted me to be their mistress.", "d": 10, "r": "厚颜无耻", "z": 1.51, "n": 27}, {"t": "00:13:39", "p": "", "o": "在中国这个社会，假如一个女性年轻又有些姿色，却没有靠山，其实是莫大的危险和劣势。", "e": "In Chinese society, a young woman who is attractive but has no one to protect or support her is at a tremendous disadvantage and in real danger.", "d": 8, "r": "姿色", "z": 2.38, "n": 21}, {"t": "00:13:39", "p": "", "o": "生活的转折发生在疫情后，机缘巧合的机会，我开始接触炒股，抓住了这轮AI牛市，到今天不仅有了足以买房的资本，还实现了财务自由。", "e": "My life changed after the pandemic. By chance, I started investing in stocks and caught the current AI bull market. Now I have not only enough capital to buy a home, but have also achieved financial independence.", "d": 9, "r": "机缘巧合", "z": 2.09, "n": 32}, {"t": "00:16:58", "p": "", "o": "袁莉：最后一位来自广东，名叫白枭的公益组织工作者给我们发来了这段录音。", "e": "Yuan Li: Our final submission is this recording from Baixiao, a charity worker in Guangdong.", "d": 8, "r": "白枭", "z": 2.35, "n": 17}, {"t": "00:17:03", "p": "", "o": "白枭：目前我在广东某城市生活，为一家公益组织兼职工作。", "e": "Baixiao: I currently live in a city in Guangdong and work part-time for a charitable organization.", "d": 8, "r": "白枭", "z": 2.35, "n": 14}, {"t": "00:17:03", "p": "", "o": "我们主要面向市中心某区的流浪人员，工作内容包括巡查、了解流浪人员情况、给予一定物资帮助，以及配合政府方面将他们劝离或者送返入户籍地。", "e": "We mainly serve homeless people in a central urban district. Our work includes patrols, learning about people's circumstances, providing some material assistance, and cooperating with the government to persuade them to leave or return to their registered places of residence.", "d": 7, "r": "返入", "z": 2.97, "n": 31}, {"t": "00:17:03", "p": "", "o": "近几个月内，我在工作中接触的流浪者数量不断增加。", "e": "Over the past few months, the number of homeless people I've encountered at work has steadily increased.", "d": 6, "r": "近几个月", "z": 2.96, "n": 12}, {"t": "00:17:03", "p": "", "o": "广东许多工厂的用工情况愈发不稳定，因此我们发现许多流浪者穿着工服出现在街头，或是辗转于各个救助站之间。", "e": "Employment at many factories in Guangdong has become increasingly unstable, so we've found many homeless people wearing factory uniforms on the streets or moving between different shelters.", "d": 7, "r": "工服", "z": 3.13, "n": 25}, {"t": "00:17:03", "p": "", "o": "另一方面，由于APEC即将于广东召开，各市都有可能会承担外事工作，甚至需要恭迎圣驾。", "e": "Meanwhile, because APEC is about to be held in Guangdong, each city may be assigned foreign-affairs duties and may even have to welcome dignitaries with great ceremony.", "d": 8, "r": "恭迎", "z": 2.4, "n": 18}, {"t": "00:17:03", "p": "", "o": "全广东涉及市容市貌的部门在这数月内都进入高度紧张的状态。", "e": "For several months, departments across Guangdong responsible for the appearance of cities and towns have been on high alert.", "d": 8, "r": "市貌", "z": 2.45, "n": 17}, {"t": "00:17:03", "p": "", "o": "我们也被卷入政府动员式的工作之中。", "e": "We've also been drawn into this government-style mobilization.", "d": 4, "r": "卷入", "z": 3.98, "n": 10}, {"t": "00:17:03", "p": "", "o": "因政策工作方针收紧，不但我们对流浪者的帮扶受到了限制，我们也被迫参与更多驱赶他们的行动。", "e": "As policy and work directives have tightened, not only has our ability to help homeless people been restricted, but we've also been forced to take part in more efforts to drive them away.", "d": 7, "r": "帮扶", "z": 3.18, "n": 24}, {"t": "00:17:03", "p": "", "o": "一旦民政、街道办或派出所发现滞留流浪者，如果不能毫无成本的立刻使其摆脱困境，就会直接希望能将其送返户籍地，或送入救助站。", "e": "When civil affairs departments, neighborhood offices, or police stations find homeless people staying in an area, if they can't get them out of their predicament immediately and at no cost, they want to send them back to their registered hometowns or put them in shelters.", "d": 7, "r": "送返", "z": 2.99, "n": 29}, {"t": "00:17:03", "p": "", "o": "然而，对于我不少我先前提及的流浪者而言，这两个选择都是不可接受的。", "e": "Yet for many of the homeless people I've mentioned, neither option is acceptable.", "d": 6, "r": "流浪者", "z": 3.23, "n": 18}, {"t": "00:17:03", "p": "", "o": "救助站会没收联系工具，使入住者无法求职且不能久留。", "e": "Shelters confiscate their means of communication, making it impossible for residents to look for jobs, and they can't stay for long.", "d": 6, "r": "久留", "z": 3.0, "n": 13}, {"t": "00:17:03", "p": "", "o": "而对于回乡，他们一般都坚决拒绝，那里更是什么机会都没有。", "e": "As for returning home, they generally refuse outright, because there are even fewer opportunities there.", "d": 5, "r": "回乡", "z": 3.63, "n": 14}, {"t": "00:17:03", "p": "", "o": "遇到这类情况，政府机构时常只能让我们将其劝离本辖区，好像只要劝至其他区域，这个人就不存在了一样。", "e": "In such cases, government agencies often can only ask us to persuade people to leave our jurisdiction, as though moving them to another area makes them cease to exist.", "d": 7, "r": "劝离", "z": 3.23, "n": 27}, {"t": "00:17:03", "p": "", "o": "因此，我们已经看到不少各个市辖区互相将流浪者踢皮球的情况。", "e": "As a result, we've seen many districts pass homeless people back and forth like a hot potato.", "d": 8, "r": "踢皮球", "z": 2.27, "n": 13}, {"t": "00:17:03", "p": "", "o": "每当出现需要与流浪者直接互动的情况。", "e": "Whenever a situation requires direct interaction with homeless people,", "d": 6, "r": "流浪者", "z": 3.23, "n": 9}, {"t": "00:17:03", "p": "", "o": "为避免出现被人目击暴力执法的风险，基本总是我们民间组织出场，为政府单位冲锋陷阵。", "e": "to avoid the risk of someone witnessing violent enforcement, it is almost always a civil society organization like ours that steps in and takes the lead for government agencies.", "d": 9, "r": "冲锋陷阵", "z": 1.29, "n": 18}, {"t": "00:17:03", "p": "", "o": "在民政、警方或救助站要求下，近一个月我们已经陪送不下十位流浪人员通过火车返乡。", "e": "At the request of civil affairs departments, police, or shelters, over the past month we've accompanied more than ten homeless people by train back to their hometowns.", "d": 6, "r": "救助站", "z": 3.2, "n": 19}, {"t": "00:17:03", "p": "", "o": "遇到这类工作场合，我的工作内容不可避免的会遇到不少侵犯人权的状况。", "e": "In situations like these, my work inevitably involves many violations of human rights.", "d": 5, "r": "不可避免", "z": 3.85, "n": 18}, {"t": "00:17:03", "p": "", "o": "一件令我印象深刻的案例是，今年七月，我曾参与押送一位表现出精神分裂妄想症的流浪阿姨去其他城市。", "e": "One case that left a deep impression on me occurred this July, when I helped escort a homeless woman who showed signs of paranoid delusions associated with schizophrenia to another city.", "d": 8, "r": "妄想症", "z": 2.71, "n": 25}, {"t": "00:17:03", "p": "", "o": "她身上携带的刀具等所谓管制物品，派出所便直接出动，以保护公共安全为由将其进行管理。", "e": "Because she was carrying knives and other items deemed controlled objects, the local police station came out and took charge of her in the name of protecting public safety.", "d": 7, "r": "刀具", "z": 3.17, "n": 22}, {"t": "00:17:03", "p": "", "o": "警方阿姨的家人给予了我们免责许可，组织负责人和派出所督促我们将其押送到私家车上，一路对他进行控制，并最后硬拉入了亲属的住处。", "e": "Her family gave us permission absolving us of liability, and the head of our organization and the police station urged us to put her in a private car, restrain her throughout the journey, and finally drag her into a relative's home.", "d": 7, "r": "押送", "z": 3.14, "n": 34}, {"t": "00:17:03", "p": "", "o": "在此过程中，当我们试图对其施加人身控制时，她大喊大叫，拳打脚踢。", "e": "As we tried to physically restrain her, she screamed and kicked and punched.", "d": 9, "r": "拳打脚踢", "z": 0.8, "n": 16}, {"t": "00:17:03", "p": "", "o": "我也一时被这愤怒的反应冲昏了头脑，采取更加严厉的行为。", "e": "I was momentarily swept up in her angry reaction and responded with even harsher behavior.", "d": 7, "r": "冲昏", "z": 2.63, "n": 16}, {"t": "00:17:03", "p": "", "o": "回到家，每当想起自己的行为，便感到深深的愧疚。", "e": "When I got home, I felt deeply guilty whenever I thought about what I'd done.", "d": 6, "r": "愧疚", "z": 3.32, "n": 12}, {"t": "00:17:03", "p": "", "o": "尽管存在精神障碍，但她那种恐惧与厌恶无疑是真实的、清醒的。", "e": "Although she had a mental illness, her fear and disgust were undoubtedly real and clear-minded.", "d": 5, "r": "精神障碍", "z": 3.56, "n": 15}, {"t": "00:17:03", "p": "", "o": "而我们这些行动只是在激化流浪者与我们之间的矛盾。", "e": "Our actions only intensified the conflict between homeless people and us.", "d": 6, "r": "流浪者", "z": 3.23, "n": 13}, {"t": "00:17:03", "p": "", "o": "虽然按照法律，她没有民事行为能力，家人能帮他做决定，但是这些事情显然过火了。", "e": "Although, under the law, she lacked civil capacity and her family could make decisions for her, what happened was clearly excessive.", "d": 7, "r": "民事行为", "z": 3.03, "n": 19}, {"t": "00:17:03", "p": "", "o": "难道这里的任何人理应受到这样的对待吗？", "e": "Does anyone here deserve to be treated this way?", "d": 4, "r": "理应", "z": 3.93, "n": 10}, {"t": "00:17:03", "p": "", "o": "我对自己感到了无比恶心。", "e": "I felt utterly disgusted with myself.", "d": 3, "r": "无比", "z": 4.37, "n": 7}, {"t": "00:17:03", "p": "", "o": "回想起来，我仿佛幻视自己回到疫情期间，套进了白大褂中，扮演着拥有了微小的权柄，便无所忌惮进行施暴的那些人们。", "e": "Looking back, I could almost see myself transported back to the pandemic, wearing a white coat and playing the role of those people who, after gaining even a little authority, felt free to abuse others without restraint.", "d": 10, "r": "无所忌惮", "z": 0.0, "n": 25}, {"t": "00:17:03", "p": "", "o": "从工厂与工地克扣工资并裁员，政府机构试图摆脱责任，搪塞上级任务，再到我们作为公益组织持政府资助，服从命令，每一道流程都在将他们推入更不利的处境之中。", "e": "From factories and construction sites withholding wages and laying people off, to government agencies trying to shirk responsibility and fob off tasks from their superiors, to our government-funded charity obeying orders, every step pushes these people into an even more disadvantageous position.", "d": 10, "r": "搪塞", "z": 1.08, "n": 39}, {"t": "00:17:03", "p": "", "o": "而这种责任的转嫁推脱，在我看来，正是基层在流浪者管理方面愈发出现问题的主要原因。", "e": "In my view, this passing of responsibility from one party to another is the main reason local-level efforts to manage homelessness are increasingly failing.", "d": 7, "r": "转嫁", "z": 3.02, "n": 19}, {"t": "00:17:03", "p": "", "o": "另一个让我深感不利的例证是，近两月来，有越来越多患有严重慢性病的流浪者出现在求助的行列中。", "e": "Another troubling example is that, over the past two months, more and more homeless people with serious chronic illnesses have come seeking help.", "d": 7, "r": "慢性病", "z": 3.2, "n": 27}, {"t": "00:17:03", "p": "", "o": "在过去医疗系统经费尚可的时候，我所在的城市会在定点医院为“三无人员”提供专项小额资金救治。", "e": "When the healthcare system had more funding, the city where I work provided small, dedicated funds for treating people with no family, income, or legal support at designated hospitals.", "d": 7, "r": "定点医院", "z": 2.7, "n": 22}, {"t": "00:17:03", "p": "", "o": "然而医患矛盾愈发激烈，加上医疗经费紧缩，这部分资金被首当其冲的砍去。", "e": "But as doctor-patient conflicts have intensified and medical funding has tightened, this funding was among the first to be cut.", "d": 6, "r": "医患", "z": 3.02, "n": 15}, {"t": "00:17:03", "p": "", "o": "相应的街道民政与救助站同时意识到，如果花救助经费为其买药，万一出现问题，责任显然需要自己承担。", "e": "Local civil affairs offices and shelters also realized that if they used relief funds to buy medicine and something went wrong, they would clearly be held responsible.", "d": 7, "r": "救助站", "z": 3.2, "n": 24}, {"t": "00:17:03", "p": "", "o": "于是我看到了一位因强拆而无法办理低保、流浪他乡的病人，已经因高血糖而无法看清道路，面对警察的反复驱赶，在同一个社区硬撑了三日，反复游走于各个基层部门，但从未获得任何医疗帮助。", "e": "So I saw a patient who had become homeless far from home after being unable to obtain minimum-living-assistance benefits because of a forced demolition. Their blood sugar was so high they could barely see where they were going. Despite repeated attempts by police to drive them away, they struggled on in the same neighborhood for three days, repeatedly going from one local agency to another, but never received any medical help.", "d": 8, "r": "高血糖", "z": 2.39, "n": 46}, {"t": "00:17:03", "p": "", "o": "我的有些同行会批评其中不少人，指控他们是依靠病例向政府单位进行乞讨。", "e": "Some of my colleagues criticize many of these people, accusing them of using their medical records to beg government agencies for money.", "d": 6, "r": "乞讨", "z": 3.47, "n": 19}, {"t": "00:17:03", "p": "", "o": "但是这一说法显然站不住脚。", "e": "But that claim clearly doesn't hold up.", "d": 6, "r": "站不住脚", "z": 3.03, "n": 6}, {"t": "00:17:03", "p": "", "o": "这些人显然不能直接将处方药变为现金。", "e": "These people obviously can't turn prescription medicines directly into cash.", "d": 6, "r": "处方药", "z": 3.04, "n": 9}, {"t": "00:17:03", "p": "", "o": "更何况，讽刺的是，街道救助站在为他们买票送走的时候，可从未吝惜过经费。", "e": "What's more, ironically, the neighborhood offices and shelters have never been stingy with funds when buying tickets to send them away.", "d": 9, "r": "吝惜", "z": 0.56, "n": 18}, {"t": "00:17:03", "p": "", "o": "在从事这份工作的过程中，我愈发感到，就算在中国的发达地区，由于目前制度性的设计，任何基层服务工作都免不了遭遇道德困境。", "e": "Through this work, I've increasingly come to feel that even in China's more developed regions, the way the system is designed means that frontline service work inevitably involves moral dilemmas.", "d": 7, "r": "免不了", "z": 3.35, "n": 30}, {"t": "00:17:03", "p": "", "o": "而这些处于社会边缘的流浪者，则是在愈发恶劣的社会环境之下首先被牺牲的群体。", "e": "And homeless people on the margins of society are the first group sacrificed as the social environment grows harsher.", "d": 6, "r": "流浪者", "z": 3.23, "n": 21}, {"t": "00:17:03", "p": "", "o": "也许很多人会觉得这些流浪者离自己的生活很远，但我不由得想到，谁能保证假以时日，许多光鲜亮丽的中产不会沦落到这种状态，不是已经存在不少35岁被裁员，身负房贷车贷，还上有老、下有小的白领们从事已经竞争激烈的外卖、出租车行业了吗？", "e": "Some may think homeless people are far removed from their own lives, but I can't help wondering: who can guarantee that, given enough time, many well-dressed, comfortable middle-class people won't end up in the same situation? Aren't there already many white-collar workers over 35 who have been laid off, have mortgages and car loans, support elderly parents and young children, and are entering the already fiercely competitive food-delivery and ride-hailing industries?", "d": 9, "r": "假以时日", "z": 1.96, "n": 55}, {"t": "00:17:03", "p": "", "o": "何况这些人与所谓的廉价劳动力高度重合。", "e": "Besides, these people overlap substantially with what is called the cheap labor force.", "d": 6, "r": "重合", "z": 3.27, "n": 10}, {"t": "00:17:03", "p": "", "o": "对于我们这些享受到红利、衣食无忧的人，他们的处境怎么会事不关己呢？", "e": "For those of us who have benefited from the system and have enough to eat and wear, how can their plight have nothing to do with us?", "d": 9, "r": "事不关己", "z": 1.15, "n": 16}, {"t": "00:17:03", "p": "", "o": "后人哀之而不见之，亦是后人而复哀后人也。", "e": "Later generations grieve for those who came before without learning from them, and then become the very people whom later generations grieve for in turn.", "d": 9, "r": "哀之而", "z": 1.36, "n": 11}, {"t": "00:23:37", "p": "", "o": "袁莉：本期节目到这里就结束了，谢谢每一位投稿的听众。", "e": "Yuan Li: That's the end of this episode. Thank you to every listener who sent in a submission.", "d": 5, "r": "本期", "z": 3.52, "n": 14}, {"t": "00:23:37", "p": "", "o": "不明白播客希望大家能继续踊跃投稿，讲述自己的故事，帮助我们了解中国和中国人的真实近况。", "e": "The Bumingbai Podcast hopes you'll continue to share your stories enthusiastically and help us understand the real situation in China and among Chinese people today.", "d": 7, "r": "播客", "z": 3.12, "n": 23}, {"t": "00:23:37", "p": "", "o": "谢谢收听，我们下期再见。", "e": "Thanks for listening. See you next time.", "d": 4, "r": "收听", "z": 3.94, "n": 5}, {"t": "00:23:37", "p": "", "o": "谢谢你们一直以来对不明白播客的大力支持，在这里我希望大家采取更多行动来支持播客，YouTube频道上的观众朋友们，你们可以点击视频下方的订阅按钮，关注我们的频道，并点击小铃铛打开提醒，以便第一时间看到最新的节目。", "e": "Thank you for your continued generous support of the Bumingbai Podcast. I hope you'll take more steps to support us. If you're watching on our YouTube channel, click the Subscribe button below the video to follow our channel, and click the bell to turn on notifications so you can see our latest episodes as soon as they're released.", "d": 7, "r": "播客", "z": 3.12, "n": 52}, {"t": "00:23:37", "p": "", "o": "我们也呼吁大家主动给节目点赞留言或者分享给身边的朋友。", "e": "We also encourage you to like, comment on, or share the show with friends.", "d": 4, "r": "留言", "z": 4.49, "n": 16}, {"t": "00:23:37", "p": "", "o": "每一期节目的友好互动对播客来说都是继续走下去的动力，我们也希望力所能及的朋友们能加入我们的YouTube会员，或者访问不明白播客网站捐赠页面，参与单次或者月度的捐赠、直播、talk show、下午茶专题。", "e": "The positive engagement each episode receives gives the podcast the motivation to keep going. If you're able, we also hope you'll become a YouTube member or visit the donation page on the Bumingbai Podcast website to make a one-time or monthly donation, or take part in our livestreams, talk shows, and afternoon-tea specials.", "d": 9, "r": "播客网", "z": 2.12, "n": 45}, {"t": "00:23:37", "p": "", "o": "我们希望带给大家更多有趣的谈话，及时的资讯与专业的分析，这都需要更多人员和资金的投入。", "e": "We want to bring you more engaging conversations, timely information, and professional analysis, all of which require more staff and funding.", "d": 5, "r": "带给", "z": 4.24, "n": 26}, {"t": "00:23:37", "p": "", "o": "欢迎点击不明白播客简介上的链接或本期的show notes来支持我们做出更多更好的节目。", "e": "Please click the link in the Bumingbai Podcast description or visit this episode's show notes to support us in making more and better programs.", "d": 7, "r": "更多更好", "z": 2.9, "n": 19}];
const out=document.getElementById('out'),f=document.getElementById('f'),histogram=document.getElementById('histogram');
const col=n=>`hsl(${Math.round(130-(n-1)*13)},55%,45%)`;
function renderHistogram(){
  const counts=Array.from({length:10}, (_,i)=>({level:i+1,count:D.filter(x=>x.d===i+1).length}));
  const max=Math.max(...counts.map(c=>c.count),1);
  histogram.innerHTML='<div class="hist-title">Difficulty distribution</div>' + counts.map(c=>`
    <div class="hist-row">
      <span>${c.level}</span>
      <div class="hist-track"><span class="hist-fill" style="width:${(c.count/max)*100}%"></span></div>
      <span>${c.count}</span>
    </div>
  `).join('');
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){
  renderHistogram();
  out.replaceChildren();let last=null;const level=f.value;
  D.forEach(x=>{
    if(level !== 'all' && x.d !== Number(level)) return;
    const key=x.t+'|'+x.p;
    if(key!==last&&(x.t||x.p)){last=key;const h=el('div','t');
      if(x.t)h.append('['+x.t+'] ');
      if(x.p){const b=el('b','',x.p+':');h.append(b)}
      out.append(h)}
    const s=el('div','s');s.tabIndex=0;s.setAttribute('role','button');
    s.append(el('div','',x.e||x.o));
    const d=el('div','d',x.d+'/10');const m=el('div','m');const i=el('i');
    i.style.width=(x.d*10)+'%';i.style.background=col(x.d);m.append(i);d.append(m);s.append(d);
    const z=el('div','zh');
    if(x.e){const o=el('div','o',x.o);o.lang="zh";z.append(o)}
    z.append(el('div','i',x.r?('Rarest word: '+x.r+'  (Zipf '+(x.z===null?'?':x.z.toFixed(2))+')  ·  '+x.n+' words'):(x.n+' words')));
    s.append(z);
    const tg=()=>s.classList.toggle('open');
    s.onclick=tg;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
    out.append(s);
  });
}
f.onchange=render;
document.getElementById('all').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.add('open'));
document.getElementById('none').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.remove('open'));
render();
</script></body></html>
