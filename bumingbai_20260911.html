有深度。", "e": "Zha Jianying: That's why I think Asking Heaven About the People is so good. It's grand and expansive.", "d": 4, "r": "简洁", "z": 3.92, "n": 5}, {"t": "", "p": "", "o": "查建英：有深度，很 sharp ，而且有血气。", "e": "Yuan Li: Grand, concise, and profound.", "d": 5, "r": "血气", "z": 3.46, "n": 7}, {"t": "", "p": "", "o": "“我知道我可能赢不了，我可能成功不了。", "e": "Zha Jianying: Profound, sharp, and full of spirit.", "d": 2, "r": "赢", "z": 5.0, "n": 10}, {"t": "", "p": "", "o": "So what. Fuck You!", "e": "\"I know I may not win. I may not succeed.", "d": 1, "r": "", "z": null, "n": 0}, {"t": "", "p": "", "o": "就是这种感觉.", "e": "So what? Fuck you!\"", "d": 1, "r": "感觉", "z": 5.44, "n": 3}, {"t": "", "p": "", "o": "袁莉：我得有希望。", "e": "That's the feeling.", "d": 2, "r": "得有", "z": 4.97, "n": 4}, {"t": "", "p": "", "o": "这个裴令史他跑去见张角，他就说: “你让他们相信一个不存在的东西真的会来。”张角就反问说: “那存在的给过他们什么?”", "e": "Yuan Li: I have to have hope.", "d": 6, "r": "反问", "z": 3.47, "n": 33}, {"t": "", "p": "", "o": "查建英：这就是我前面说的反转。", "e": "Pei goes to see Zhang Jiao and says, \"You're making them believe that something that doesn't exist will really come.\" Zhang Jiao asks in response, \"Then what has the thing that does exist ever given them?\"", "d": 5, "r": "反转", "z": 3.53, "n": 8}, {"t": "", "p": "", "o": "袁莉：我觉得他在说，人要相信一点东西。", "e": "Zha Jianying: That's the reversal I mentioned earlier.", "d": 2, "r": "相信", "z": 5.4, "n": 11}, {"t": "", "p": "", "o": "你不能整天就在那说：“哎呀怎么办？", "e": "Yuan Li: I think he's saying that people need to believe in something.", "d": 5, "r": "哎呀", "z": 3.76, "n": 9}, {"t": "", "p": "", "o": "没办法，拿这个人没办法，拿什么东西都没有办法。”人要有一点点相信。", "e": "You can't spend all day saying, \"Oh, what can we do? There's no way; we can't do anything about this person, we can't do anything about anything.\" People need to believe in something, even a little.", "d": 4, "r": "一点点", "z": 4.3, "n": 18}, {"t": "", "p": "", "o": "查建英：要有一点。", "e": "Zha Jianying: They need at least a little.", "d": 1, "r": "一点", "z": 5.51, "n": 4}, {"t": "", "p": "", "o": "所以这又说到我们以前谈过这个信仰的问题。", "e": "That brings us back to the question of faith we've discussed before.", "d": 3, "r": "信仰", "z": 4.8, "n": 13}, {"t": "", "p": "", "o": "中国人一直缺失信仰，中国的宗教都太现世了。", "e": "China has always lacked faith; Chinese religions are too focused on worldly matters.", "d": 6, "r": "现世", "z": 3.35, "n": 12}, {"t": "", "p": "", "o": "儒家变成了一种国家宗教以后，它特别功利，特别正统，然后把所有外来的信仰都改造了。", "e": "Once Confucianism became a kind of state religion, it became very utilitarian and orthodox, and it reshaped all imported faiths.", "d": 6, "r": "功利", "z": 3.16, "n": 21}, {"t": "", "p": "", "o": "最明显的就是佛教，历史上有三次灭佛。", "e": "Buddhism is the clearest example. Historically, there were three major campaigns to suppress Buddhism.", "d": 4, "r": "灭", "z": 4.26, "n": 11}, {"t": "", "p": "", "o": "我推荐一本汉学家 Arthur F. Wright 写的书，不厚的，有中文版，叫《中国历史中的佛教》。", "e": "I'd recommend a book by the sinologist Arthur F. Wright. It's not very long and has a Chinese translation; it's called Buddhism in Chinese History.", "d": 8, "r": "汉学家", "z": 2.26, "n": 17}, {"t": "", "p": "", "o": "讲佛教到了中国以后怎样被改造，实际上变得完全不是原来的样子了。", "e": "It explains how Buddhism was transformed after it arrived in China, until it became quite different from what it had originally been.", "d": 3, "r": "改造", "z": 4.75, "n": 17}, {"t": "", "p": "", "o": "当然佛教本身也有它的问题：它比较软弱，它要出世。", "e": "Of course, Buddhism has its own problems: it's rather passive and seeks to withdraw from the world.", "d": 5, "r": "出世", "z": 3.54, "n": 14}, {"t": "", "p": "", "o": "袁莉：我原来在北京住的时候，有一个好朋友，她是拉拉，但又信佛。", "e": "Yuan Li: When I lived in Beijing, I had a good friend who was a lesbian and also a Buddhist.", "d": 6, "r": "信佛", "z": 3.24, "n": 18}, {"t": "", "p": "", "o": "我也不说她粉红，但她就是自己说因为信佛所以完全不要反抗，。", "e": "I wouldn't call her a nationalist, but she herself said that because she believed in Buddhism, she didn't want to resist at all.", "d": 6, "r": "信佛", "z": 3.24, "n": 17}, {"t": "", "p": "", "o": "查建英：佛系生活。", "e": "Zha Jianying: A Buddhist, go-with-the-flow kind of life.", "d": 5, "r": "佛系", "z": 3.25, "n": 3}, {"t": "", "p": "", "o": "袁莉：“要逆来顺受，不要去反抗”，我因为这件事情和她吵了很多次。", "e": "Yuan Li: She said, \"Accept whatever happens; don't resist.\" I argued with her about this many times.", "d": 9, "r": "逆来顺受", "z": 0.77, "n": 16}, {"t": "", "p": "", "o": "后来我去了杭州一个挺有名的寺院，那个住持四十多岁，戴着眼镜，非常有思想，跟我们聊了一个多小时，我因为和那朋友吵过太多次了，我专门就此问了住持。", "e": "Later, I went to a well-known temple in Hangzhou. The abbot was in his forties, wore glasses, and was very thoughtful. We talked for over an hour. Because I'd argued with that friend so often, I specifically asked him about this.", "d": 8, "r": "四十多岁", "z": 2.57, "n": 40}, {"t": "", "p": "", "o": "我说：“你们佛教是说永远不要反抗吗？", "e": "I said, \"Does Buddhism teach that you should never resist?", "d": 3, "r": "反抗", "z": 4.61, "n": 10}, {"t": "", "p": "", "o": "面对邪恶也不要反抗？", "e": "That you shouldn't resist evil either?", "d": 3, "r": "反抗", "z": 4.61, "n": 5}, {"t": "", "p": "", "o": "也要逆来顺受？”他说：“不是这样子的，还是要分善恶的。”我觉得，真正懂佛教的人不会说不要反抗的话，但是在中国流传的佛教非常强调逆来顺受，而且非常世俗。", "e": "That you should just accept whatever happens?\" He said, \"No, it's not like that. You still have to distinguish good from evil.\" I think people who truly understand Buddhism wouldn't say that we shouldn't resist, but the Buddhism practiced in China strongly emphasizes submission and is very worldly.", "d": 10, "r": "逆来顺受", "z": 0.77, "n": 38}, {"t": "", "p": "", "o": "信佛是为了带来好运，带来孩子。", "e": "People believe in Buddhism to bring good luck or have children.", "d": 5, "r": "信佛", "z": 3.24, "n": 7}, {"t": "", "p": "", "o": "查建英：都被中国化了嘛。", "e": "Zha Jianying: It's all been Sinicized.", "d": 2, "r": "嘛", "z": 5.11, "n": 6}, {"t": "", "p": "", "o": "这有一个很长的过程，因为佛教汉代才进中国。", "e": "This was a long process, because Buddhism only entered China during the Han dynasty.", "d": 5, "r": "汉代", "z": 3.54, "n": 13}, {"t": "", "p": "", "o": "到了唐代的时候就有了著名的几次灭佛。", "e": "By the Tang dynasty, there had already been several famous campaigns to suppress Buddhism.", "d": 5, "r": "唐代", "z": 3.91, "n": 13}, {"t": "", "p": "", "o": "还出现了“援儒”。", "e": "There was also the movement to \"defend Confucianism.\"", "d": 5, "r": "儒", "z": 3.45, "n": 5}, {"t": "", "p": "", "o": "韩愈这个大散文家，他说“佛教已经把我们本来的国教、儒给带坏了，可见它的影响有多大。”实际上也是因为东汉以后战火不断、死人无数，佛教才有机会进入中国，因为百姓太苦了，需要有信仰、有来世、有盼头，所以佛教的确最早在底层传开。", "e": "Han Yu, the great prose writer, said that Buddhism had corrupted our original state doctrine, Confucianism—which shows just how influential it had become. In fact, Buddhism had a chance to enter China because after the Eastern Han there were constant wars and countless deaths. Ordinary people suffered terribly and needed faith, an afterlife, and something to look forward to, so Buddhism first spread among the lower classes.", "d": 7, "r": "盼头", "z": 2.96, "n": 58}, {"t": "", "p": "", "o": "然后进入上层，开始有钱、有庙产。", "e": "Then it reached the upper classes and began accumulating wealth and temple property.", "d": 4, "r": "上层", "z": 4.17, "n": 8}, {"t": "", "p": "", "o": "到了唐朝，到处都是寺庙，威胁到儒家的正统，于是韩愈来“援儒”。", "e": "By the Tang dynasty there were temples everywhere, threatening Confucian orthodoxy, so Han Yu came forward to \"defend Confucianism.\"", "d": 6, "r": "韩愈", "z": 3.27, "n": 17}, {"t": "", "p": "", "o": "这是儒家把佛教收服了，把它化成自己的一部分。", "e": "Confucianism subdued Buddhism and made it part of itself.", "d": 6, "r": "收服", "z": 3.24, "n": 13}, {"t": "", "p": "", "o": "然后又开始收服道教，这样一来，最后信仰就彻底变成一元化了，只能有一个信仰，而且这个信仰非常世俗。", "e": "Then it began to absorb Daoism as well. In the end, faith became completely monolithic: there could be only one faith, and it was very worldly.", "d": 8, "r": "一元化", "z": 2.57, "n": 22}, {"t": "", "p": "", "o": "这是中国一个非常长久，一直到现在都很要命的问题，就是中国人没有信仰。", "e": "This is a deep-rooted problem in China that continues to be serious today: Chinese people lack faith.", "d": 5, "r": "要命", "z": 3.69, "n": 19}, {"t": "", "p": "", "o": "我的一个老朋友，他自己并不是基督徒。", "e": "An old friend of mine isn't a Christian himself.", "d": 5, "r": "老朋友", "z": 3.82, "n": 9}, {"t": "", "p": "", "o": "有一次他问一个他的好朋友，一个基督徒的一个教父：“上帝爱人有没有例外？”意思就是说，“那中国呢？", "e": "Once he asked a good friend of his, a Christian priest, \"Does God's love for humanity have any exceptions?\" In other words, \"What about China?", "d": 6, "r": "教父", "z": 3.62, "n": 23}, {"t": "", "p": "", "o": "是不是上帝不爱我们呢？", "e": "Does God not love us?", "d": 3, "r": "上帝", "z": 4.84, "n": 6}, {"t": "", "p": "", "o": "中国为什么我们老这么倒霉呢？”我在想，是因为上帝不爱我们吗？", "e": "Why are we in China always so unlucky?\" I wonder: is it because God doesn't love us?", "d": 5, "r": "倒霉", "z": 4.03, "n": 16}, {"t": "", "p": "", "o": "还是因为我们不爱上帝呢？", "e": "Or is it because we don't love God?", "d": 3, "r": "上帝", "z": 4.84, "n": 7}, {"t": "", "p": "", "o": "袁莉：我们最后再来说一点吧。", "e": "Yuan Li: Let's say one last thing.", "d": 2, "r": "来说", "z": 5.32, "n": 7}, {"t": "", "p": "", "o": "《问苍生》里最后裴令史老了，他还继续坚持写妖，他的邻居都看着他笑，觉得他是一个怪老头，还在坚持写这些东西。", "e": "At the end of Asking Heaven About the People, Pei is old, but he still keeps writing about demons. His neighbors look at him and laugh, thinking he's a strange old man who keeps writing these things.", "d": 5, "r": "妖", "z": 4.09, "n": 32}, {"t": "", "p": "", "o": "然后他说，如果只写民不聊生四个字，后人可能一翻就过去了。", "e": "He says that if he only writes the four characters meaning \"the people cannot make a living,\" future generations might flip past them without a second thought.", "d": 9, "r": "民不聊生", "z": 1.06, "n": 16}, {"t": "", "p": "", "o": "可是写墙里长出人，树上长着脸，后人也许会停下来问：”好好的世道怎么尽出怪事？”我觉得这是一个关于写作的问题。", "e": "But if he writes about people growing out of walls and faces appearing on trees, future generations might stop and ask, \"Why are so many strange things happening in a supposedly well-ordered world?\" I think this raises a question about writing.", "d": 7, "r": "里长", "z": 3.01, "n": 30}, {"t": "", "p": "", "o": "我是记者，我们这种写新闻的人，就是写民不聊生。", "e": "I'm a journalist, and people like us who write the news just write that the people cannot make a living.", "d": 9, "r": "民不聊生", "z": 1.06, "n": 12}, {"t": "", "p": "", "o": "然后说民是怎么不聊生的。", "e": "Then we explain how people are unable to make a living.", "d": 6, "r": "聊生", "z": 3.21, "n": 8}, {"t": "", "p": "", "o": "查建英：需要新的语言，为什么我就看《问苍生》就越觉得欣赏？", "e": "Zha Jianying: We need a new language. That's why the more I watch Asking Heaven About the People, the more I admire it.", "d": 3, "r": "欣赏", "z": 4.7, "n": 15}, {"t": "", "p": "", "o": "为什么我们老是在谈要改良、要改造监狱之类的？", "e": "Why are we always talking about reform or making prisons better, and so on?", "d": 4, "r": "谈要", "z": 4.16, "n": 12}, {"t": "", "p": "", "o": "你要换一个思维，就是英文讲的要think out of the box，你要跳出这个盒子，需要一个新的视角、新的思维、新的语言，否则的话大家都已经习以为常了，觉得民不聊生很正常，甚至会说：“美国不也有很多问题吗”？", "e": "You have to change your way of thinking. As the English phrase goes, you have to think outside the box. You need a new perspective, a new way of thinking, a new language. Otherwise, people have become so accustomed to everything that they think it's normal for people to be unable to make a living. They might even say, \"Doesn't America have lots of problems too?\"", "d": 10, "r": "民不聊生", "z": 1.06, "n": 46}, {"t": "", "p": "", "o": "你要换一个语言：“这事情就是中国的问题，不是美国的问题”。", "e": "You have to change the framing: \"This is China's problem, not America's problem.\"", "d": 6, "r": "要换", "z": 3.1, "n": 14}, {"t": "", "p": "", "o": "我很烦，什么问题都拿美国来比，“你看美国也有问题”。", "e": "I'm sick of people comparing everything with America and saying, \"Look, America has problems too.\"", "d": 6, "r": "很烦", "z": 3.24, "n": 15}, {"t": "", "p": "", "o": "袁莉：就是叫 Whataboutism，美国也怎么怎么样。", "e": "Yuan Li: That's whataboutism—saying, \"What about America? It has problems too.\"", "d": 2, "r": "怎么样", "z": 5.32, "n": 7}, {"t": "", "p": "", "o": "查建英：但是，中国的问题和美国的问题完全不在一个轨道上，不在一个历史时间上。", "e": "Zha Jianying: But China's problems and America's problems are on completely different tracks and belong to different historical periods.", "d": 4, "r": "轨道", "z": 4.59, "n": 21}, {"t": "", "p": "", "o": "我说的极端点就是中国在政治上还没有进入现代，而政治不是只是政治，它是整个人类的一个文明层次。", "e": "To put it in extreme terms, China has not yet entered modernity politically. And politics isn't just politics; it's a level of human civilization as a whole.", "d": 6, "r": "在政治上", "z": 3.3, "n": 25}, {"t": "", "p": "", "o": "我很信亚里士多德，他说人天生和动物的不同，因为人类有语言、有理性、有政治，人是一个政治的动物。", "e": "I have great faith in Aristotle. He said that humans differ naturally from animals because we have language, reason, and politics; humans are political animals.", "d": 7, "r": "亚里士多德", "z": 3.2, "n": 26}, {"t": "", "p": "", "o": "你剥夺了他的政治，他没有政治之后，他还是真正的人吗？", "e": "If you deprive someone of politics, if they have no political life, are they still truly human?", "d": 4, "r": "剥夺", "z": 4.48, "n": 16}, {"t": "", "p": "", "o": "我的意思就是说你要换一种思维，换一种语言，人们才能意识到现在的中国的问题不是美国的问题，就是中国的问题。", "e": "What I mean is that people need a different way of thinking and a different language to realize that China's problems today are not America's problems; they are China's own.", "d": 7, "r": "要换", "z": 3.1, "n": 28}, {"t": "", "p": "", "o": "而且现在对于西方来说，中国的问题就是世界的问题，因为这么一个巨大体量的一个妖，实际上它是一个怪胎，是吧？", "e": "And for the West, China's problems are now the world's problems, because this enormous entity called China is actually a monster, a freak, isn't it?", "d": 7, "r": "体量", "z": 3.05, "n": 27}, {"t": "", "p": "", "o": "中国的崛起，现在开始发散的影响力。", "e": "China's rise is now beginning to project its influence outward.", "d": 6, "r": "发散", "z": 3.26, "n": 8}, {"t": "", "p": "", "o": "什么叫“东升西降”？", "e": "What does \"the East is rising and the West is declining\" mean?", "d": 1, "r": "叫", "z": 5.58, "n": 4}, {"t": "", "p": "", "o": "就是开始去扩张去腐蚀，", "e": "It means expanding and corroding from within.", "d": 4, "r": "腐蚀", "z": 3.83, "n": 6}, {"t": "", "p": "", "o": "袁莉：现在欧盟已经受不了，你看德国大众又宣布裁员五万人。", "e": "Yuan Li: The European Union can't take it anymore. Look, Volkswagen in Germany has just announced that it will cut fifty thousand jobs.", "d": 5, "r": "五万", "z": 3.64, "n": 13}, {"t": "", "p": "", "o": "查建英：这种经济性的扩张、软性的征服，和当年的冷战不一样。", "e": "Zha Jianying: This kind of economic expansion and soft conquest is different from the Cold War.", "d": 6, "r": "软性", "z": 3.06, "n": 14}, {"t": "", "p": "", "o": "俄国还是一个二愣子，硬碰硬，没有这些手腕，这种软性的方式——在你不知不觉中我已经做大，而且我会用一种你也想要的东西，就是实惠，来吸引你。", "e": "Russia is still a blunt instrument, relying on direct confrontation. It doesn't have these techniques. This softer approach means that, before you even notice, I've grown powerful, and I attract you with something you also want: material benefits.", "d": 10, "r": "二愣子", "z": 1.62, "n": 34}, {"t": "", "p": "", "o": "人性都是软的嘛，我用这种你想要的东西来制服你。", "e": "Human nature is weak, after all. I use what you want to bring you under my control.", "d": 4, "r": "软", "z": 4.41, "n": 16}, {"t": "", "p": "", "o": "袁莉：我最后再说一句，我觉得这个“妖”就是对应“境外势力”。", "e": "Yuan Li: I'll say one last thing: I think the \"demon\" corresponds to \"foreign forces.\"", "d": 4, "r": "妖", "z": 4.09, "n": 13}, {"t": "", "p": "", "o": "最后这部剧点了一句话，说：“后人读妖，勿问鬼神问苍生。”就说现在的人读新闻，不要去问什么境外势力，不要去问美国怎么样？", "e": "At the end, the drama states: \"When later generations read of demons, let them ask not about ghosts and gods, but about the people.\" In other words, when people today read the news, they shouldn't ask about foreign forces or what America is doing.", "d": 7, "r": "鬼神", "z": 3.39, "n": 33}, {"t": "", "p": "", "o": "你问一问你现在的生活是怎么样子就好了，只问中国的事情。", "e": "They should ask what their own lives are like now, and focus on what's happening in China.", "d": 6, "r": "问一问", "z": 3.28, "n": 17}, {"t": "", "p": "", "o": "查建英：就是你问问你是不是活得像个人，是不是有尊严？", "e": "Zha Jianying: Ask whether you're living like a human being, whether you have dignity.", "d": 4, "r": "活得", "z": 3.99, "n": 12}, {"t": "", "p": "", "o": "袁莉：大家好，欢迎来到不明白播客，我是主持人袁莉，谢谢你们一直以来对不明白播客的大力支持，在这里我希望大家采取更多行动来支持播客。", "e": "Yuan Li: Hello, everyone, and welcome to the Un-Understandable podcast. I'm your host, Yuan Li. Thank you for your continued support. Here, I'd like to encourage you to take more action to support the podcast.", "d": 7, "r": "播客", "z": 3.12, "n": 33}, {"t": "", "p": "", "o": "YouTube 频道上的观众朋友们，你们可以点击。", "e": "To our viewers on YouTube, you can click", "d": 4, "r": "点击", "z": 4.24, "n": 9}, {"t": "", "p": "", "o": "视频下方的订阅按钮，关注我们的频道，并点击小铃铛打开提醒，以便第一时间看到最新的节目。", "e": "the Subscribe button below the video to follow our channel, and click the bell to turn on notifications so you'll be the first to see our latest episodes.", "d": 6, "r": "铃铛", "z": 3.24, "n": 22}, {"t": "", "p": "", "o": "我们也呼吁大家主动给节目点赞留言或者分享给身边的朋友。", "e": "We also encourage you to like, comment on, or share each episode with friends.", "d": 4, "r": "留言", "z": 4.49, "n": 16}, {"t": "", "p": "", "o": "每一期节目的友好互动对播客来说都是继续走下去的动力，我们也希望力所能及的朋友们能加入我们的 YouTube 会员，或者访问不明白播客网站捐赠页面。", "e": "Friendly interaction with every episode gives the podcast the motivation to keep going. And if you can, we hope you'll become a YouTube member or visit the donation page on the Un-Understandable podcast website.", "d": 9, "r": "播客网", "z": 2.12, "n": 36}, {"t": "", "p": "", "o": "参与单次或者月度的捐赠直播、Talkshow、下午茶专题，我们希望带给大家更多有趣的谈话，及时的资讯与专业的分析，这都需要更多人员和资金的投入。", "e": "You can make a one-time or monthly donation. Our livestreams, talk shows, and afternoon-tea features aim to bring you more engaging conversations, timely news, and expert analysis, all of which require more staff and funding.", "d": 7, "r": "下午茶", "z": 3.16, "n": 35}, {"t": "", "p": "", "o": "欢迎点击不明白播客简介上的链接或本期的show notes来支持我们做出更多更好的节目。", "e": "Please click the link in the Un-Understandable podcast description or the show notes for this episode to help us make more and better programs.", "d": 7, "r": "更多更好", "z": 2.9, "n": 19}];
const out=document.getElementById('out'),f=document.getElementById('f'),histogram=document.getElementById('histogram');
const col=n=>`hsl(${Math.round(130-(n-1)*13)},55%,45%)`;
function renderHistogram(){
  const counts=Array.from({length:10}, (_,i)=>({level:i+1,count:D.filter(x=>x.d===i+1).length}));
  const max=Math.max(...counts.map(c=>c.count),1);
  histogram.innerHTML='<div class="hist-title">Difficulty distribution</div>' + counts.map(c=>`
    <div class="hist-row">
      <span>${c.level}</span>
      <div class="hist-track"><span class="hist-fill" style="width:${(c.count/max)*100}%"></span></div>
      <span>${c.count}</span>
    </div>
  `).join('');
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}

    prog.append(el('div','progress-label',pct+'%'));

    s.append(el('div','',x.e||x.o));
    const d=el('div','d',x.d+'/10');const m=el('div','m');const i=el('i');
    i.style.width=(x.d*10)+'%';i.style.background=col(x.d);m.append(i);d.append(m);s.append(d);
    const z=el('div','zh');
    if(x.e){const o=el('div','o',x.o);o.lang="zh";z.append(o)}
    z.append(el('div','i',x.r?('Rarest word: '+x.r+'  (Zipf '+(x.z===null?'?':x.z.toFixed(2))+')  ·  '+x.n+' words'):(x.n+' words')));
    s.append(z);
    const tg=()=>s.classList.toggle('open');
    s.onclick=tg;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
    out.append(s);
  });
}
f.onchange=render;
document.getElementById('all').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.add('open'));
document.getElementById('none').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.remove('open'));
render();
</script></body></html>
