<script>
const D=[{"t": "", "p": "", "o": "袁莉：查老师，我们再吃一点东西，我刚才还说我已经好多年都不怎么喜欢吃西瓜了，因为我在宁夏长大。", "e": "Yuan Li: Teacher Zha, let's have a little more to eat. I was just saying that I haven't really liked watermelon for many years, because I grew up in Ningxia.", "d": 7, "r": "好多年", "z": 3.31, "n": 26}, {"t": "", "p": "", "o": "查建英：对。", "e": "Zha Jianying: Right.", "d": 1, "r": "对", "z": 6.63, "n": 2}, {"t": "", "p": "", "o": "袁莉：我记得我小的时候吃的所有水果都特别好， 沙漠里的甜西瓜，还有很甜的水果。", "e": "Yuan Li: I remember that all the fruit I ate as a child was especially good—sweet watermelons from the desert, and other very sweet fruit.", "d": 6, "r": "很甜", "z": 3.25, "n": 23}, {"t": "", "p": "", "o": "查建英：难怪你这么甜，亲爱的。", "e": "Zha Jianying: No wonder you're so sweet, darling.", "d": 4, "r": "难怪", "z": 4.11, "n": 7}, {"t": "", "p": "", "o": "又爱看《甜蜜蜜》。", "e": "And you love watching Comrades: Almost a Love Story, too.", "d": 7, "r": "甜蜜蜜", "z": 2.4, "n": 3}, {"t": "", "p": "", "o": "袁莉： 哎，又开始揭我老底。", "e": "Yuan Li: Hey, you're exposing my old secrets again.", "d": 5, "r": "老底", "z": 3.47, "n": 7}, {"t": "", "p": "", "o": "查建英：可不是吗？", "e": "Zha Jianying: Aren't I?", "d": 4, "r": "可不是", "z": 4.13, "n": 3}, {"t": "", "p": "", "o": "要不是曾志伟在里边撒了一把盐，整个就是一个《甜腻腻》，好吗？", "e": "If Zeng Zhiwei hadn't thrown a handful of salt into it, the whole thing would just be called Too Sweet and Cloying, okay?", "d": 9, "r": "甜腻腻", "z": 1.21, "n": 14}, {"t": "", "p": "", "o": "袁莉：好吧。", "e": "Yuan Li: All right.", "d": 1, "r": "吧", "z": 5.98, "n": 3}, {"t": "", "p": "", "o": "您看我们这种在西北这种风沙与酷寒的天气里长大的人，总是想要一点甜的嘛。", "e": "People like us who grew up in the Northwest, amid sandstorms and bitter cold, always want a little sweetness.", "d": 8, "r": "酷寒", "z": 2.38, "n": 22}, {"t": "", "p": "", "o": "查建英：怎么可能不甜呢？", "e": "Zha Jianying: How could you not be sweet?", "d": 4, "r": "甜", "z": 4.25, "n": 6}, {"t": "", "p": "", "o": "袁莉：我们今天说一下：最近在B站上有一个AI创作的历史剧叫《问苍生》，特别火，二十多分钟。", "e": "Yuan Li: Today, let's talk about an AI-made historical drama that's recently become hugely popular on Bilibili. It's called Asking Heaven About the People, and it's a little over twenty minutes long.", "d": 8, "r": "二十多分钟", "z": 2.2, "n": 19}, {"t": "", "p": "", "o": "在B站上应该是五天就有一千多万的播放量，如果算全平台（在中国各种各样的平台）就已经有五六千万的这种播放量。", "e": "On Bilibili, it apparently got more than ten million views in just five days. Across all platforms in China, it has already had fifty or sixty million views.", "d": 9, "r": "一千多万", "z": 2.01, "n": 29}, {"t": "", "p": "", "o": "我看 YouTube 上很多可能是盗版，但也看的人很多。", "e": "A lot of what I've seen on YouTube is probably pirated, but it's getting plenty of views there too.", "d": 5, "r": "盗版", "z": 3.97, "n": 13}, {"t": "", "p": "", "o": "我是怎么第一次听说呢？", "e": "How did I first hear about it?", "d": 2, "r": "听说", "z": 4.91, "n": 6}, {"t": "", "p": "", "o": "我在 Signal 上有个群，有很多台湾的朋友，他们说《问苍生》在台湾也无比受欢迎。", "e": "I have a group on Signal with a lot of Taiwanese friends. They said Asking Heaven About the People is incredibly popular in Taiwan, too.", "d": 4, "r": "受欢迎", "z": 4.26, "n": 19}, {"t": "", "p": "", "o": "我就觉得，哇，好有意思！", "e": "I thought, wow, that's interesting!", "d": 3, "r": "有意思", "z": 4.38, "n": 6}, {"t": "", "p": "", "o": "这些人都是台湾的知识分子，他们怎么会去看一个AI的剧？", "e": "These people are all Taiwanese intellectuals. Why would they watch an AI drama?", "d": 4, "r": "知识分子", "z": 4.23, "n": 15}, {"t": "", "p": "", "o": "我本来还对 AI 这个东西比较有偏见，看了一下我也觉得， 哇！", "e": "I was a bit prejudiced against AI myself, but I watched it and thought, wow!", "d": 4, "r": "偏见", "z": 4.14, "n": 16}, {"t": "", "p": "", "o": "没有想到这个剧还挺有意思的。", "e": "I hadn't expected it to be quite interesting.", "d": 3, "r": "有意思", "z": 4.38, "n": 8}, {"t": "", "p": "", "o": "而且我自己感觉完成度还挺高的，台词写得也很有意思。", "e": "And I felt it was actually pretty polished, and the dialogue was interesting, too.", "d": 5, "r": "完成度", "z": 3.88, "n": 15}, {"t": "", "p": "", "o": "反正一看我就觉得，我好像能体会到为什么有这么多人喜欢看了。", "e": "Anyway, as soon as I watched it, I felt I could understand why so many people liked it.", "d": 4, "r": "体会", "z": 4.38, "n": 19}, {"t": "", "p": "", "o": "现在网上对这个剧的讨论还挺多的，已经有了很多的金句在被大家各种地讨论。", "e": "There's been quite a lot of discussion about the drama online, and many of its punchy lines are being debated and shared.", "d": 6, "r": "金句", "z": 3.51, "n": 23}, {"t": "", "p": "", "o": "查老师， 您看了没有呢？", "e": "Teacher Zha, have you watched it?", "d": 2, "r": "查", "z": 4.93, "n": 7}, {"t": "", "p": "", "o": "您看完什么感觉？", "e": "What did you think after watching it?", "d": 2, "r": "完", "z": 5.2, "n": 5}, {"t": "", "p": "", "o": "查建英：这部 AI 剧《问苍生》，说实话，我倒是因为你的提醒我才第一次看。", "e": "Zha Jianying: Honestly, I only watched this AI drama, Asking Heaven About the People, because you brought it to my attention.", "d": 4, "r": "说实话", "z": 4.13, "n": 16}, {"t": "", "p": "", "o": "而且我第一次看的时候， 觉得这什么呀，没有太多感觉。", "e": "The first time I watched it, I thought, \"What is this?\" It didn't make much of an impression on me.", "d": 3, "r": "呀", "z": 5.07, "n": 14}, {"t": "", "p": "", "o": "可是因为你告诉我有很多人在关注，多少多少的播放量，又说咱们要聊一下，我才看了第二遍。", "e": "But you told me so many people were paying attention to it, gave me the view counts, and said we were going to discuss it, so I watched it a second time.", "d": 7, "r": "第二遍", "z": 3.12, "n": 26}, {"t": "", "p": "", "o": "第二遍我的确就看进去了，感觉跟第一遍很不一样。", "e": "The second time, I really got into it, and my impression was very different from the first.", "d": 6, "r": "第二遍", "z": 3.12, "n": 13}, {"t": "", "p": "", "o": "所以我得承认，我不是一看就被它抓住。", "e": "So I have to admit it didn't grab me right away.", "d": 5, "r": "一看", "z": 3.76, "n": 11}, {"t": "", "p": "", "o": "袁莉：你竟然看了两遍，感谢感谢。", "e": "Yuan Li: You actually watched it twice! Thank you, thank you.", "d": 6, "r": "两遍", "z": 3.03, "n": 8}, {"t": "", "p": "", "o": "查建英：你们这种 intellectual 的人，可能一看，一鼻子就闻出来这里面有名堂。", "e": "Zha Jianying: Intellectuals like you may sniff out that there's something going on here as soon as you watch it.", "d": 6, "r": "名堂", "z": 3.32, "n": 17}, {"t": "", "p": "", "o": "袁莉：不是，我这不是整天搞新闻嘛。", "e": "Yuan Li: No, it's because I'm doing journalism all day.", "d": 4, "r": "整天", "z": 4.3, "n": 9}, {"t": "", "p": "", "o": "搞新闻的人整天都在看新的东西，我这一看就看到大众情绪，", "e": "People in journalism are always looking at new things. When I watched this, I immediately noticed the public mood—", "d": 5, "r": "一看", "z": 3.76, "n": 17}, {"t": "", "p": "", "o": "查建英：但是对《奥德赛》你就是例外，是吧？", "e": "Zha Jianying: But with The Odyssey, you're the exception, right?", "d": 4, "r": "例外", "z": 4.34, "n": 9}, {"t": "", "p": "", "o": "袁莉：《奥德赛》，我没有看出来大众情绪。", "e": "Yuan Li: I didn't pick up on the public mood in The Odyssey.", "d": 3, "r": "大众", "z": 4.78, "n": 8}, {"t": "", "p": "", "o": "没有，我就说这个是完全脱离大众的 。", "e": "No, I said it was completely detached from ordinary people.", "d": 3, "r": "脱离", "z": 4.65, "n": 10}, {"t": "", "p": "", "o": "好了我们不讲《奥德赛》了，否则我又要被一大堆人骂一顿。", "e": "All right, let's stop talking about The Odyssey, or a whole bunch of people will come after me again.", "d": 5, "r": "一大堆", "z": 3.71, "n": 16}, {"t": "", "p": "", "o": "查建英：就说这个《问苍生》，首先我得承认，AI 短剧我看得很少，就是所谓的爽剧，几乎没有看过。", "e": "Zha Jianying: As for Asking Heaven About the People, I have to admit that I rarely watch AI short dramas. The so-called wish-fulfillment dramas—I hardly ever watch them.", "d": 7, "r": "爽剧", "z": 3.16, "n": 22}, {"t": "", "p": "", "o": "袁莉：我也没看过几个。", "e": "Yuan Li: I've hardly watched any either.", "d": 3, "r": "看过", "z": 4.71, "n": 6}, {"t": "", "p": "", "o": "查建英：而且我看过的几个也都是什么霸道总裁。", "e": "Zha Jianying: And the few I've seen were all about domineering CEOs.", "d": 5, "r": "霸道", "z": 3.54, "n": 12}, {"t": "", "p": "", "o": "据说一共就两大套路还是三大套路：一类是“霸道总裁爱上绝经的我”；另一类是穿越系统，就是从当代穿越到明代，然后你在那边是皇帝。", "e": "Apparently there are only two or three basic formulas: one is \"a domineering CEO falls in love with menopausal me\"; another is the time-travel system, where someone from the present travels back to the Ming dynasty and becomes an emperor there.", "d": 7, "r": "另一类", "z": 3.16, "n": 34}, {"t": "", "p": "", "o": "我认为这一类穿越的基本就是各种白日梦，而且它那个桥段，我看两遍就觉得，假的不能再假，而且都特无聊， 所以我基本上就不太看。", "e": "I think these time-travel stories are basically various kinds of daydreams. After watching a couple of their scenes, I find them so fake they couldn't be faker, and incredibly boring, so I generally don't watch them.", "d": 7, "r": "两遍", "z": 3.03, "n": 35}, {"t": "", "p": "", "o": "袁莉：我以前特别喜欢看“快手”。", "e": "Yuan Li: I used to love watching Kuaishou.", "d": 2, "r": "手", "z": 5.26, "n": 8}, {"t": "", "p": "", "o": "“快手”刚开始的时候，我特别喜欢看农村人他们怎么结婚，结婚时穿什么样的婚纱，还有怎么钓鱼、养猪，这些我以前都特别爱看。", "e": "When Kuaishou first started, I loved watching how people in the countryside got married, what wedding dresses they wore, and things like fishing and raising pigs. I used to love all that.", "d": 7, "r": "养猪", "z": 3.11, "n": 31}, {"t": "", "p": "", "o": "查建英：我也是无比爱看这一类的东西。", "e": "Zha Jianying: I absolutely loved watching that kind of thing, too.", "d": 5, "r": "爱看", "z": 3.54, "n": 10}, {"t": "", "p": "", "o": "比如一对农村夫妻他们用家里的垃圾袋做成一个大泡泡裙，一个男的穿上一双很高的高跟鞋，可能是十块钱的塑料鞋，然后在院子里走台步，搞笑无比。", "e": "For example, a rural couple might make a huge puffy skirt out of a household garbage bag. The man puts on a pair of very high heels, maybe ten-yuan plastic shoes, then struts around the courtyard like a runway model. It's hilarious.", "d": 7, "r": "垃圾袋", "z": 2.94, "n": 37}, {"t": "", "p": "", "o": "但是这种 AI 短剧我反而看得很少，所以你这次让我看，我第一次看的时候。", "e": "But I haven't watched many AI short dramas, so when you asked me to watch this one, the first time I watched it—", "d": 6, "r": "短剧", "z": 3.4, "n": 19}, {"t": "", "p": "", "o": "没什么感觉，因为又是一堆古装嘛。", "e": "I didn't feel much, because it was another bunch of period costumes.", "d": 5, "r": "古装", "z": 3.37, "n": 8}, {"t": "", "p": "", "o": "它是古装志怪剧，给我的第一感觉就是那种我不太喜欢的那种中国人的模样；穿着那些衣服，一会儿下跪，一会儿哭，苦哈哈的，都很惨，很悲催。", "e": "It's a period supernatural-fantasy drama. My first impression was that the Chinese characters looked like the kind I don't really like: dressed in those clothes, kneeling one moment and crying the next, all miserable, tragic, and wretched.", "d": 8, "r": "很悲", "z": 2.63, "n": 35}, {"t": "", "p": "", "o": "然后一个书生在那儿，好像他是一个启蒙者、布道者。", "e": "Then there's a scholar standing there, seeming to be an enlightener, a preacher.", "d": 6, "r": "启蒙者", "z": 3.0, "n": 11}, {"t": "", "p": "", "o": "但是，我之后再第二次看，我就觉得这个剧本和台词都写得好。", "e": "But when I watched it a second time, I thought the script and dialogue were well written.", "d": 5, "r": "台词", "z": 3.96, "n": 17}, {"t": "", "p": "", "o": "而且作为AI剧，我当然没有什么可以用来比较，但我觉得完全用AI做，没有一个真人出演，在我看来它已经相当流畅了。", "e": "And as an AI drama, I don't have much to compare it with, of course, but I think it's quite fluid for something made entirely with AI, without any real actors appearing.", "d": 6, "r": "在我看来", "z": 3.74, "n": 26}, {"t": "", "p": "", "o": "袁莉：对，而且我觉得里面的人看着不是很AI 的感觉。", "e": "Yuan Li: Right, and I think the people in it don't look too AI-generated.", "d": 3, "r": "看着", "z": 4.98, "n": 13}, {"t": "", "p": "", "o": "查建英：对对对，人长得比较标准。", "e": "Zha Jianying: Right, right. Their faces look fairly conventional.", "d": 2, "r": "标准", "z": 5.32, "n": 8}, {"t": "", "p": "", "o": "袁莉：这个片子讲的是东汉末年一个虚构的兰台令史，叫裴令史。", "e": "Yuan Li: The film is about a fictional Lantai court historian named Pei, set at the end of the Eastern Han dynasty.", "d": 7, "r": "台令史", "z": 2.66, "n": 14}, {"t": "", "p": "", "o": "他的工作呢，是调查全国各地发生的妖异的现象。", "e": "His job is to investigate strange and supernatural phenomena happening all over the country.", "d": 6, "r": "妖异", "z": 2.92, "n": 13}, {"t": "", "p": "", "o": "比如说墙里长出了人，树上长出了脸，白衣人闯进了皇宫。", "e": "For example, people growing out of walls, faces appearing on trees, or a man in white breaking into the imperial palace.", "d": 6, "r": "里长", "z": 3.01, "n": 16}, {"t": "", "p": "", "o": "但是他慢慢地发现，这些所谓的妖背后其实都是人。", "e": "But he gradually discovers that behind these so-called monsters, there are actually people.", "d": 4, "r": "妖", "z": 4.09, "n": 14}, {"t": "", "p": "", "o": "反正就是好几个故事，最后到了张角的这个黄巾军起义。", "e": "Anyway, there are several stories, and it eventually leads to Zhang Jiao's Yellow Turban Rebellion.", "d": 4, "r": "好几个", "z": 4.12, "n": 12}, {"t": "", "p": "", "o": "这个剧的背景就是在一个非常苦的，民不聊生的一个年代，出现了很多很怪异的事情。", "e": "The story takes place in a terrible era when ordinary people can barely survive, and all kinds of strange things are happening.", "d": 9, "r": "民不聊生", "z": 1.06, "n": 21}, {"t": "", "p": "", "o": "然后这个裴令史呢，他要去判案。", "e": "Pei has to investigate cases.", "d": 6, "r": "判案", "z": 3.12, "n": 8}, {"t": "", "p": "", "o": "他会被叫去判断说这是人作的怪，还是妖作的怪。", "e": "He's called in to determine whether a strange occurrence was caused by a person or by a demon.", "d": 6, "r": "妖作", "z": 3.07, "n": 15}, {"t": "", "p": "", "o": "如果写“人”，被逮住的人就会被处死；但如果说是“妖”，这事就没了。", "e": "If he writes \"human,\" the person arrested will be executed; if he says it's a demon, the matter goes no further.", "d": 7, "r": "逮住", "z": 2.55, "n": 18}, {"t": "", "p": "", "o": "就是这样的一个故事。", "e": "That's the story.", "d": 1, "r": "故事", "z": 5.46, "n": 5}, {"t": "", "p": "", "o": "查建英：我觉得其实稍微用心一点看，就发现它这里边其实做了很多改造。", "e": "Zha Jianying: I think if you watch a little more attentively, you'll realize that it has made quite a few adaptations.", "d": 5, "r": "用心", "z": 4.0, "n": 18}, {"t": "", "p": "", "o": "在中国，志怪小说渊远流长。", "e": "China has a long tradition of supernatural tales.", "d": 9, "r": "渊远流长", "z": 0.0, "n": 6}, {"t": "", "p": "", "o": "它直接取材的就是干宝的《搜神记》，这是中国志怪小说的鼻祖。", "e": "Its direct source is Gan Bao's In Search of the Supernatural, the foundational work of Chinese tales of the strange.", "d": 6, "r": "鼻祖", "z": 3.03, "n": 17}, {"t": "", "p": "", "o": "之后的《唐传奇》，《太平广记》，一直到《聊斋志异》，都是《搜神记》之后的事了。", "e": "The later Tang tales, Extensive Records of the Taiping Era, and all the way through Strange Tales from a Chinese Studio came after In Search of the Supernatural.", "d": 3, "r": "记", "z": 4.85, "n": 15}, {"t": "", "p": "", "o": "所以它取了这个志怪小说的源头，然后把它改造了。", "e": "So it takes the genre back to its source and then reworks it.", "d": 5, "r": "源头", "z": 4.0, "n": 15}, {"t": "", "p": "", "o": "当然它另外加进去了张角的黄巾起义，这是一个中国人里凡是上过小学、中学，不用上大学都知道的人物。", "e": "Of course, it also adds Zhang Jiao's Yellow Turban Rebellion, a figure every Chinese person who went to primary or middle school knows about—you don't even need to have gone to university.", "d": 6, "r": "加进去", "z": 3.67, "n": 26}, {"t": "", "p": "", "o": "四九年以来共产党的这一套叙事就是——农民起义是正义的。", "e": "Since 1949, the Communist Party's narrative has been that peasant uprisings are righteous.", "d": 6, "r": "四九年", "z": 2.97, "n": 12}, {"t": "", "p": "", "o": "这种马克思主义历史叙事讲的是民不聊生、官逼民反。", "e": "This Marxist historical narrative is about people being unable to make a living and officials driving them to revolt.", "d": 9, "r": "民不聊生", "z": 1.06, "n": 9}, {"t": "", "p": "", "o": "袁莉：我们的国歌也是“起来，不愿做奴隶的人们”。", "e": "Yuan Li: Our national anthem also says, \"Arise, ye who refuse to be slaves.\"", "d": 5, "r": "国歌", "z": 3.81, "n": 13}, {"t": "", "p": "", "o": "查建英：所以它的元素就是用了好几种志怪小说，加上张角的正义的农民起义，还有《国歌》。", "e": "Zha Jianying: So it combines several kinds of supernatural tales with Zhang Jiao's righteous peasant rebellion and the national anthem.", "d": 7, "r": "好几种", "z": 3.06, "n": 20}, {"t": "", "p": "", "o": "它里面的几句所谓后来被广泛流传的金句，比如“你们不是天生该跪”，等于就是《国歌》加上《国际歌》，对吧？", "e": "Some of the lines that later became widely circulated catchphrases, like \"You weren't born to kneel,\" are basically a combination of the national anthem and The Internationale, right?", "d": 6, "r": "金句", "z": 3.51, "n": 24}, {"t": "", "p": "", "o": "袁莉：对，“你们不是天生该跪，你们不是天生该饿”。", "e": "Yuan Li: Right: \"You weren't born to kneel; you weren't born to starve.\"", "d": 4, "r": "天生", "z": 4.14, "n": 12}, {"t": "", "p": "", "o": "查建英：这几句好像是振聋发聩，但是至今没有被禁，我认为 TA 很聪明。", "e": "Zha Jianying: Those lines sound almost earth-shattering, yet the drama hasn't been banned so far. I think the creator is very clever.", "d": 9, "r": "振聋发聩", "z": 0.0, "n": 15}, {"t": "", "p": "", "o": "我猜这个作者一定是个年轻人。", "e": "I guess the creator must be young.", "d": 3, "r": "年轻人", "z": 4.75, "n": 8}, {"t": "", "p": "", "o": "你从TA的名字也可以看得出，因为叫“青瓜蛋”、“青瓜蛋子”嘛，肯定是一个年轻人。", "e": "You can tell from the name, too: \"Qingguadan\"—literally something like \"green cucumber egg\"—or \"Qingguadanzi.\" It must be a young person.", "d": 7, "r": "青瓜", "z": 2.81, "n": 18}, {"t": "", "p": "", "o": "我之所以看了第二遍以后非常欣赏，一个是因为 TA显然是一个年轻人，至少是一个科技人士，或者说很会用科技的人。", "e": "The reason I admired it so much after the second viewing is, first, that the creator is clearly young—at the very least, a tech person, or someone very good with technology.", "d": 7, "r": "第二遍", "z": 3.12, "n": 26}, {"t": "", "p": "", "o": "据说TA用了 ChatGPT，还有一种国内的AI。", "e": "Apparently they used ChatGPT and another AI tool from China.", "d": 3, "r": "据说", "z": 4.57, "n": 7}, {"t": "", "p": "", "o": "袁莉：Seedance，字节跳动的一个特别好的做 AI 视频的工具。", "e": "Yuan Li: Seedance, a very good AI video tool from ByteDance.", "d": 5, "r": "字节", "z": 3.53, "n": 12}, {"t": "", "p": "", "o": "查建英：所以我就觉得，这么一个二十六分钟的短剧，居然就一个人，可能用了几台电脑，在家里面就做出来了。", "e": "Zha Jianying: So I find it amazing that a twenty-six-minute short drama could be made by one person, perhaps using a few computers, at home.", "d": 6, "r": "二十六", "z": 3.35, "n": 26}, {"t": "", "p": "", "o": "据说是用了几个月，但也够可以的了。", "e": "They say it took a few months, but that's still quite an accomplishment.", "d": 3, "r": "据说", "z": 4.57, "n": 11}, {"t": "", "p": "", "o": "一个半个小时的短剧啊，就 TA 一个人做，一个演员都没有，也就做出来了，而且还相当流畅。", "e": "A short drama that's half an hour long, made by one person with no actors at all—and it came out pretty smoothly.", "d": 6, "r": "短剧", "z": 3.4, "n": 23}, {"t": "", "p": "", "o": "这个剧，从文学性上讲，我为什么说 TA 的台词写得好呢？", "e": "Why do I say the dialogue is well written, in literary terms?", "d": 5, "r": "文学性", "z": 3.87, "n": 15}, {"t": "", "p": "", "o": "你看他的几个来源，都是经典：不论是中国传统文学经典，还是共产党的国家叙事中的经典（农民起义)、抑或是《国际歌》、《国歌》这些共产主义的经典，TA全都放在一起了。", "e": "Look at its sources: they're all classics. It draws on classical Chinese literature, the classic Communist national narrative of peasant uprisings, and communist classics such as The Internationale and the national anthem. The creator has put them all together.", "d": 7, "r": "农民起义", "z": 3.37, "n": 35}, {"t": "", "p": "", "o": "你一听，全部都是这些经典，这就是TA到现在也没被禁的原因。", "e": "You hear all these classics in it. That's why it hasn't been banned yet.", "d": 6, "r": "被禁", "z": 3.27, "n": 15}, {"t": "", "p": "", "o": "我觉得也的确啊，TA犯了错吗？", "e": "And really, has the creator done anything wrong?", "d": 7, "r": "犯了错", "z": 2.56, "n": 7}, {"t": "", "p": "", "o": "并没有，全是很正确的叙事。", "e": "No. Everything is framed in a politically correct way.", "d": 4, "r": "叙事", "z": 3.89, "n": 7}, {"t": "", "p": "", "o": "可是你再一看，就不是那么回事了。", "e": "But when you look again, it's not quite what it seems.", "d": 6, "r": "那么回事", "z": 3.19, "n": 8}, {"t": "", "p": "", "o": "最近我发给一个国内的朋友，他看了以后，第一评论是 “反动至极啊”。", "e": "Recently I sent it to a friend in China. After watching it, his first comment was, \"It's utterly reactionary.\"", "d": 5, "r": "至极", "z": 3.76, "n": 17}, {"t": "", "p": "", "o": "袁莉： 反动至极是吗？", "e": "Yuan Li: Utterly reactionary, really?", "d": 4, "r": "至极", "z": 3.76, "n": 5}, {"t": "", "p": "", "o": "你看我的这种嗅觉，对这种事情的嗅觉特别灵敏。", "e": "See? My nose for this kind of thing is especially sharp.", "d": 5, "r": "嗅觉", "z": 3.48, "n": 13}, {"t": "", "p": "", "o": "我一看，哇，这个真的是反动至极。", "e": "I watched it and thought, wow, this really is utterly reactionary.", "d": 5, "r": "一看", "z": 3.76, "n": 8}, {"t": "", "p": "", "o": "查建英：而且它这肯定是活不长，马上就要下架。", "e": "Zha Jianying: And it definitely won't last long. It'll be taken down any minute.", "d": 5, "r": "下架", "z": 3.42, "n": 11}, {"t": "", "p": "", "o": "袁莉：但是现在还在。", "e": "Yuan Li: But it's still up now.", "d": 1, "r": "但是", "z": 5.85, "n": 5}, {"t": "", "p": "", "o": "查建英：还在，B站上，几千万的点击。", "e": "Zha Jianying: Still up on Bilibili, with tens of millions of views.", "d": 5, "r": "几千万", "z": 3.53, "n": 7}, {"t": "", "p": "", "o": "所以我觉得这个人很聪明。", "e": "So I think this person is very clever.", "d": 3, "r": "聪明", "z": 4.65, "n": 7}, {"t": "", "p": "", "o": "可是你一看它的 message，实际上的题旨又相当深，而且很尖锐。", "e": "But if you look at its message, the actual theme is quite profound and sharp.", "d": 7, "r": "题旨", "z": 2.8, "n": 14}, {"t": "", "p": "", "o": "它不光是官不聊生，还把这些人已经活到必须假装成妖怪才能说出真话的程度表达出来了，就是这个判官。", "e": "It's not just about officials making life impossible for people; it also shows that people have been driven to the point where they must pretend to be demons in order to speak the truth. That's what the judge represents.", "d": 7, "r": "聊生", "z": 3.21, "n": 27}, {"t": "", "p": "", "o": "实际上，从东汉的历史来说，中国的传统一直就是怕天有异象，因为这证明皇帝可能失去天意了，“我的统治可能做不长了”。", "e": "Historically, in the Eastern Han, China was always afraid of strange celestial omens, because they could mean the emperor had lost Heaven's mandate—that his rule might not last much longer.", "d": 7, "r": "异象", "z": 3.01, "n": 29}, {"t": "", "p": "", "o": "所以朝廷很怕有妖怪的，因为这可能就是一种示警。", "e": "So the court was afraid of demons and monsters, because they might be warnings.", "d": 7, "r": "示警", "z": 2.65, "n": 12}, {"t": "", "p": "", "o": "你想，《问苍生》的来源就是李商隐那句名诗。", "e": "Think about it: the title Asking Heaven About the People comes from a famous line by Li Shangyin.", "d": 5, "r": "名诗", "z": 3.65, "n": 11}, {"t": "", "p": "", "o": "汉文帝去找贾生，一个博古通今的秀才，他知道整个天象、天文地理和人世间统治是怎么互相作用的。", "e": "Emperor Wen of Han went to see Jia Yi, a scholar who knew the past and present and understood how the heavens, astronomy, geography, and human rule interacted.", "d": 9, "r": "博古通今", "z": 1.08, "n": 21}, {"t": "", "p": "", "o": "所以呢，讲到半夜，这句诗是-“可怜半夜虚前席，不问苍生问鬼神”，意思就是说这个皇帝听得入迷， 因为他讲的是鬼神的事儿。", "e": "They talked late into the night. The poem says, \"Pity that he moved his seat forward at midnight, yet asked not about the people, but about ghosts and gods.\" The emperor was enthralled because Jia Yi was talking about ghosts and spirits.", "d": 7, "r": "入迷", "z": 3.12, "n": 32}, {"t": "", "p": "", "o": "这李商隐呢，是个会写非常漂亮的诗的酸秀才。", "e": "Li Shangyin was a rather plaintive scholar who wrote beautiful poetry.", "d": 5, "r": "秀才", "z": 3.56, "n": 14}, {"t": "", "p": "", "o": "他把这句诗其实是在暗暗表达他自己的怀才不遇，没被重用：虽然这个皇帝看起来很重用贾生，但这个皇帝并不关心国计民生，还是问这些神神鬼鬼的事。", "e": "With that line, he was indirectly expressing his own frustration at being unrecognized and not being given important posts. Although the emperor seemed to value Jia Yi, he didn't care about the people's livelihood or the affairs of state; he was still asking about spirits and ghosts.", "d": 10, "r": "怀才不遇", "z": 0.88, "n": 39}, {"t": "", "p": "", "o": "可是他不知道的是：实际上神鬼的事就是国家大事，是最大的事儿。", "e": "But what he didn't understand was that the business of spirits and ghosts was actually a matter of state—the biggest matter of all.", "d": 5, "r": "神鬼", "z": 3.61, "n": 17}, {"t": "", "p": "", "o": "因为神鬼要是出来，天有异象了，那就证明皇帝统治不好。", "e": "Because if ghosts appeared and heaven showed strange signs, that proved the emperor wasn't governing well.", "d": 6, "r": "异象", "z": 3.01, "n": 13}, {"t": "", "p": "", "o": "袁莉：是天意、天命。", "e": "Yuan Li: It was Heaven's will, Heaven's mandate.", "d": 5, "r": "天意", "z": 3.33, "n": 4}, {"t": "", "p": "", "o": "查建英：皇帝会想：“我可能就失去天命了，我可能就当不成皇帝了。”可是这个青瓜蛋做的《问苍生》，我觉得非常有意思地把这个叙事扭了一下。", "e": "Zha Jianying: The emperor would think, \"Maybe I've lost Heaven's mandate; maybe I won't be able to remain emperor.\" But in Qingguadan's Asking Heaven About the People, I think the narrative is twisted in a very interesting way.", "d": 8, "r": "青瓜", "z": 2.81, "n": 35}, {"t": "", "p": "", "o": "其实它里面扭了好几下，你发现没有？", "e": "Actually, it twists things several times. Did you notice?", "d": 6, "r": "好几下", "z": 2.87, "n": 9}, {"t": "", "p": "", "o": "一个是把这个人变成妖以后，话才有可能说出来，朝廷才会害怕，才会听，而这个人才能活下来，表达出来。", "e": "One twist is that only after someone becomes a demon can they speak; only then will the court be afraid and listen, and only then can that person survive and get their message across.", "d": 6, "r": "表达出来", "z": 3.89, "n": 28}, {"t": "", "p": "", "o": "这等于说它把平日说的妖言惑众，含沙射影，春秋笔法等等全放进去了，你发现没有？", "e": "It's as if it brings together the familiar ideas of demonic speech misleading the public, indirect insinuation, and the subtle, oblique style of historical writing. Do you see?", "d": 9, "r": "妖言惑众", "z": 0.17, "n": 18}, {"t": "", "p": "", "o": "它实际上影射的是当下：现在你不能说真话。", "e": "It's really alluding to the present: today, you can't speak the truth.", "d": 5, "r": "影射", "z": 3.48, "n": 11}, {"t": "", "p": "", "o": "你如果说真话，你可能就被杀头，或者至少你会被消声，对吧？", "e": "If you tell the truth, you may be beheaded, or at least silenced, right?", "d": 6, "r": "消声", "z": 3.14, "n": 16}, {"t": "", "p": "", "o": "袁莉：哦，你是这么看的。", "e": "Yuan Li: Oh, that's how you see it.", "d": 2, "r": "哦", "z": 5.23, "n": 7}, {"t": "", "p": "", "o": "查建英：我觉得是这样的，这个剧就是在含沙射影。", "e": "Zha Jianying: That's what I think. The drama is making indirect allusions.", "d": 9, "r": "含沙射影", "z": 0.99, "n": 11}, {"t": "", "p": "", "o": "袁莉：这部剧写到，有一个人，他的父亲因为交不起粮，被官府打了三十鞭，晚上死了，连尸首都找不到了。", "e": "Yuan Li: In the drama, a man's father couldn't pay his grain tax, so the authorities beat him thirty times. He died that night, and even his body couldn't be found.", "d": 7, "r": "交不起", "z": 2.87, "n": 28}, {"t": "", "p": "", "o": "然后这个儿子呢，就在树上刻了父亲的一个脸。", "e": "So the son carved his father's face into a tree.", "d": 5, "r": "树上", "z": 3.82, "n": 13}, {"t": "", "p": "", "o": "说找不到他，总得给他留个痕迹。", "e": "He said that if he couldn't find his father, he had to leave some trace of him.", "d": 5, "r": "总得", "z": 3.65, "n": 10}, {"t": "", "p": "", "o": "然后这个裴令史呢，明明知道是他刻的，还是说这是妖干的。", "e": "Pei knew perfectly well that the son had carved it, but still said a demon had done it.", "d": 6, "r": "他刻", "z": 3.04, "n": 15}, {"t": "", "p": "", "o": "这个儿子就问裴令史，为什么要判定是妖做的？", "e": "The son asked Pei why he had ruled that it was a demon.", "d": 6, "r": "妖做", "z": 3.09, "n": 11}, {"t": "", "p": "", "o": "裴令史说，在这个世道上人说的话不算数，只有妖说的话，朝廷才会怕。", "e": "Pei said, \"In this world, what people say doesn't count. Only when a demon speaks will the court be afraid.\"", "d": 8, "r": "不算数", "z": 2.27, "n": 17}, {"t": "", "p": "", "o": "好有意思。", "e": "That's so interesting.", "d": 3, "r": "有意思", "z": 4.38, "n": 2}, {"t": "", "p": "", "o": "查建英：这就是它的第一个反转，其实后来还有反转。", "e": "Zha Jianying: That's the first reversal; there are more later.", "d": 5, "r": "反转", "z": 3.53, "n": 11}, {"t": "", "p": "", "o": "袁莉：我再说一个反转吧。", "e": "Yuan Li: Let me describe another reversal.", "d": 5, "r": "反转", "z": 3.53, "n": 6}, {"t": "", "p": "", "o": "你说的这个反转，它不光是一个民间反抗，朝廷的人也希望把这事儿说成是妖。", "e": "The reversal you mentioned isn't just about popular resistance. People within the court also want the incident to be described as the work of a demon.", "d": 6, "r": "说成", "z": 3.25, "n": 22}, {"t": "", "p": "", "o": "有一个白衣人跑到了皇帝的寝宫外面装神弄鬼，然后那个裴令史呢，明明知道这个是人，但是他呢，如果承认是人，就表示有人可以自由出入皇宫；写成妖呢，大家都安全。", "e": "A man in white ran to the outside of the emperor's bedchamber and acted like a spirit. Pei knew perfectly well he was human, but if he admitted that, it would mean someone could freely enter the palace. Calling him a demon kept everyone safe.", "d": 10, "r": "装神弄鬼", "z": 1.27, "n": 40}, {"t": "", "p": "", "o": "这个大家，是指皇宫里的人。", "e": "By \"everyone,\" he means the people inside the palace.", "d": 4, "r": "皇宫", "z": 3.95, "n": 8}, {"t": "", "p": "", "o": "他说：“妖贵们并不真的怕妖，他们只是怕责任落到他们头上。”他还说：“一个妖字，人就活了，朝廷的脸也保住了。”我觉得这个真的是写得很好。", "e": "He says, \"The nobles aren't really afraid of demons; they're just afraid of responsibility landing on them.\" He also says, \"One word—'demon'—lets a person live and saves the court's face.\" I think that's really well written.", "d": 7, "r": "妖贵", "z": 2.98, "n": 40}, {"t": "", "p": "", "o": "查建英：对，你就马上看到了现在的很多事，你不觉得吗？", "e": "Zha Jianying: Right. You immediately think of so many things happening today, don't you?", "d": 3, "r": "马上", "z": 4.81, "n": 15}, {"t": "", "p": "", "o": "剧里面有个宦官，管所有的内宫的事情。", "e": "There's a eunuch in the drama who oversees everything in the inner palace.", "d": 5, "r": "宦官", "z": 3.42, "n": 10}, {"t": "", "p": "", "o": "他等于在配合裴令史，说你赶快说他是妖吧。", "e": "He's essentially cooperating with Pei, telling him to hurry up and say the man is a demon.", "d": 6, "r": "妖吧", "z": 3.08, "n": 12}, {"t": "", "p": "", "o": "虽然他明白这是个人，但这样说他们就都没有责任，脱了干系了。", "e": "He knows it's a person, but if they call him a demon, none of them will be responsible; they'll be off the hook.", "d": 6, "r": "干系", "z": 3.16, "n": 18}, {"t": "", "p": "", "o": "现在的很多官员也是这样：他们会自动联想到不作为是最安全的。", "e": "Many officials today behave the same way: they instinctively realize that doing nothing is the safest option.", "d": 4, "r": "联想", "z": 4.28, "n": 18}, {"t": "", "p": "", "o": "袁莉：一个是不作为是最安全。", "e": "Yuan Li: First, doing nothing is the safest option.", "d": 1, "r": "安全", "z": 5.61, "n": 8}, {"t": "", "p": "", "o": "再一个我想起来四月份的时候，国家安全部在微信公众号写了一篇关于躺平的文章，说有某境外组织资助躺平网红。", "e": "Another thing it reminds me of: in April, the Ministry of State Security posted an article on its WeChat public account about \"lying flat,\" claiming that some foreign organization was funding influencers who promoted it.", "d": 7, "r": "躺平", "z": 3.37, "n": 28}, {"t": "", "p": "", "o": "原因是它不想让大家整天都很丧，发各种“我们不想工作呀“之类的很丧的帖子。", "e": "The reason was that it didn't want people to be so gloomy all the time, posting things like \"We don't want to work\" and other depressing messages.", "d": 8, "r": "很丧", "z": 2.35, "n": 20}, {"t": "", "p": "", "o": "我就觉得现在这个“境外势力”基本上就是“妖”。", "e": "I feel like the term \"foreign forces\" today basically means \"demons.\"", "d": 4, "r": "妖", "z": 4.09, "n": 10}, {"t": "", "p": "", "o": "把什么东西都说成是境外势力，可以解释这个事情为什么发生， 还可以推责。", "e": "Calling anything the work of foreign forces explains why it happened and lets people shift the blame.", "d": 7, "r": "推责", "z": 3.0, "n": 18}, {"t": "", "p": "", "o": "查建英：你看这境外势力就是现在的妖。", "e": "Zha Jianying: See? Foreign forces are today's demons.", "d": 4, "r": "妖", "z": 4.09, "n": 10}, {"t": "", "p": "", "o": "你想啊，这个境外嘛，它不在我们宫内（国内），它是外边的。", "e": "Think about it: \"foreign\" means they're not inside our palace—that is, inside the country. They're outside.", "d": 6, "r": "宫内", "z": 3.32, "n": 16}, {"t": "", "p": "", "o": "袁莉：是超出我们能力的。", "e": "Yuan Li: They're beyond our capabilities.", "d": 4, "r": "超出", "z": 4.15, "n": 6}, {"t": "", "p": "", "o": "查建英：超出我们控制的，我们没有办法，这是境外的势力干的事儿，妖怪干的事儿。", "e": "Zha Jianying: Beyond our control. There's nothing we can do; it was the work of foreign forces, the work of demons.", "d": 5, "r": "妖怪", "z": 3.78, "n": 20}, {"t": "", "p": "", "o": "而且呢，从晚清的时候就有这么一个怪圈，就是说洋人怕百姓，百姓怕皇帝，皇帝怕洋人。", "e": "And since the late Qing dynasty, there's been this strange cycle: foreigners fear the people, the people fear the emperor, and the emperor fears foreigners.", "d": 6, "r": "晚清", "z": 3.17, "n": 21}, {"t": "", "p": "", "o": "这个圈到现在还是这样啊。", "e": "That cycle is still in place today.", "d": 5, "r": "圈到", "z": 3.73, "n": 6}, {"t": "", "p": "", "o": "其实现在的中国就是大清的延伸，帝制加上加上极权的这么一个延伸。", "e": "In fact, today's China is an extension of the Great Qing—a continuation of imperial rule combined with totalitarianism.", "d": 6, "r": "帝制", "z": 3.15, "n": 16}, {"t": "", "p": "", "o": "思维其实是很类似的。", "e": "The way of thinking is very similar.", "d": 3, "r": "思维", "z": 4.69, "n": 6}, {"t": "", "p": "", "o": "朝廷实际上最怕的，仍是洋人。", "e": "What the court is really most afraid of is still foreigners.", "d": 5, "r": "洋人", "z": 3.56, "n": 7}, {"t": "", "p": "", "o": "你别看一天到晚在讲民族主义，那其实是哪壶不开提哪壶。", "e": "Don't be fooled by the constant talk of nationalism. That's just poking at the very thing they don't want to discuss.", "d": 6, "r": "一天到晚", "z": 3.43, "n": 17}, {"t": "", "p": "", "o": "越要警惕洋人，越证明怕洋人。", "e": "The more they warn people to beware of foreigners, the more it proves they fear foreigners.", "d": 5, "r": "洋人", "z": 3.56, "n": 8}, {"t": "", "p": "", "o": "国家安全最重要，什么民不聊生，消费紧缩，这都不要紧，最重要的还是地缘政治，“境外势力跟我们过不去的话，那这个政权就危险”。", "e": "National security is paramount. People being unable to make a living and consumption shrinking don't matter; what matters most is geopolitics. If foreign forces oppose us, then the regime is in danger.", "d": 10, "r": "民不聊生", "z": 1.06, "n": 28}, {"t": "", "p": "", "o": "袁莉：还有和平演变，八九年以后最怕的就是和平演变。", "e": "Yuan Li: And \"peaceful evolution\"—after 1989, that's what they feared most.", "d": 8, "r": "八九年", "z": 2.16, "n": 9}, {"t": "", "p": "", "o": "查建英：都是“妖”蛾子。", "e": "Zha Jianying: They're all \"demon\" tricks.", "d": 7, "r": "蛾子", "z": 2.29, "n": 5}, {"t": "", "p": "", "o": "这“妖”蛾子最终的源头都是在外边的。", "e": "The ultimate source of these \"demons\" is always outside.", "d": 7, "r": "蛾子", "z": 2.29, "n": 11}, {"t": "", "p": "", "o": "里边我们好解决，可以关门打狗，就跟蚊子一样，掐一个就能掐一地对不对？", "e": "Problems inside are easy to handle: you can shut the door and beat the dogs trapped inside, like squashing mosquitoes—you squash one and can squash a whole patch, right?", "d": 8, "r": "关门打狗", "z": 2.03, "n": 19}, {"t": "", "p": "", "o": "你们能反到哪去？", "e": "How far can you rebel?", "d": 5, "r": "到哪去", "z": 3.38, "n": 4}, {"t": "", "p": "", "o": "但是“妖”是可怕的，是吧？", "e": "But \"demons\" are frightening, aren't they?", "d": 4, "r": "妖", "z": 4.09, "n": 7}, {"t": "", "p": "", "o": "“妖”遵从的是另外一种法律。", "e": "\"Demons\" follow a different set of laws.", "d": 5, "r": "遵从", "z": 3.71, "n": 7}, {"t": "", "p": "", "o": "所以这里又是一个反转对吧？", "e": "So that's another reversal, right?", "d": 5, "r": "反转", "z": 3.53, "n": 8}, {"t": "", "p": "", "o": "把这个妖和责任什么的又给扭了一下。", "e": "It twists the ideas of demons and responsibility once again.", "d": 5, "r": "扭", "z": 3.71, "n": 11}, {"t": "", "p": "", "o": "之后其实你会发现，前面是惨兮兮的，老百姓是真苦啊，越到后边，则从悲壮走向悲凉。", "e": "As the drama goes on, you realize that at first everything is miserable and ordinary people are truly suffering; later, the mood shifts from tragic heroism to bleak desolation.", "d": 9, "r": "惨兮兮", "z": 1.25, "n": 21}, {"t": "", "p": "", "o": "剧中裴令史要去查， 因为不得了了，好多人草木皆兵，真的有很多人要造反了。", "e": "Pei is sent to investigate because things have become alarming. People are panicking, seeing danger everywhere, and many really are about to rebel.", "d": 9, "r": "草木皆兵", "z": 1.25, "n": 18}, {"t": "", "p": "", "o": "而这个源头，这个妖首，就是张角。", "e": "The source of it all, the demon leader, is Zhang Jiao.", "d": 6, "r": "妖首", "z": 3.0, "n": 7}, {"t": "", "p": "", "o": "他去见这个妖首，进去以后的对话很有意思，又是一个反转。", "e": "Pei goes to meet this demon leader, and their conversation is very interesting—another reversal.", "d": 6, "r": "妖首", "z": 3.0, "n": 15}, {"t": "", "p": "", "o": "裴令史说：你在骗人，这个符水完全救不了他们，你只是给了他们一个虚幻的、不真实的希望，这能管什么用？", "e": "Pei says, \"You're deceiving people. This talisman water can't save them at all. You've only given them an illusory, unreal hope. What good can that do?\"", "d": 8, "r": "符水", "z": 2.77, "n": 28}, {"t": "", "p": "", "o": "张角的台词也写得好：“符水至少给他们一口热汤，让他们觉得我在苦难当中还有点儿安慰”。", "e": "Zhang Jiao's line is also well written: \"At least the talisman water gives them a bowl of hot soup, something that comforts them a little amid their suffering.\"", "d": 7, "r": "符水", "z": 2.77, "n": 23}, {"t": "", "p": "", "o": "他还说：“苍天没有来，皇帝不也当了这么久吗？”这是非常有深意的一句话，等于是直指当下。", "e": "He also says, \"Heaven hasn't arrived, but hasn't the emperor been ruling for all these years?\" That's a very profound line, effectively pointing straight at the present.", "d": 7, "r": "深意", "z": 3.03, "n": 25}, {"t": "", "p": "", "o": "“苍天已死，黄天当立”，裴令史拿这句话问张角：“你许诺的黄天是不会来的”。", "e": "\"The Blue Heaven is dead; the Yellow Heaven shall rise.\" Pei uses that line to challenge Zhang Jiao: \"The Yellow Heaven you've promised will never come.\"", "d": 6, "r": "当立", "z": 3.67, "n": 21}, {"t": "", "p": "", "o": "张角说：“那苍天呢？”就是说现在这个朝代，当年也是由农民起义立起来的，起事时也曾许诺要带来天下太平。", "e": "Zhang Jiao asks, \"Then what about the Blue Heaven?\" In other words, the current dynasty was also founded by a peasant rebellion; when it rose up, it too promised peace throughout the land.", "d": 7, "r": "天下太平", "z": 2.92, "n": 25}, {"t": "", "p": "", "o": "跟着他起义，造反，他会给百姓带来苍天，天下太平，但实际上苍天没来。", "e": "Those who joined the rebellion were told that if they rose up with him, he would bring the Blue Heaven and peace to the people. But the Blue Heaven never came.", "d": 7, "r": "天下太平", "z": 2.92, "n": 16}, {"t": "", "p": "", "o": "起义者成了新的腐败的皇帝，坐稳了。", "e": "The rebels became new, corrupt emperors and secured their rule.", "d": 6, "r": "坐稳", "z": 3.32, "n": 10}, {"t": "", "p": "", "o": "这不等于就是在说历史是在循环。", "e": "Isn't that saying history repeats itself?", "d": 3, "r": "循环", "z": 4.66, "n": 10}, {"t": "", "p": "", "o": "张角很明白：“我这个许诺是不会成立的”。", "e": "Zhang Jiao understands perfectly: \"The promise I'm making won't come true.\"", "d": 2, "r": "成立", "z": 5.45, "n": 10}, {"t": "", "p": "", "o": "我觉得这个反转有意思，TA没有把这个张角写成一个历史上真正的起义者。", "e": "I think this reversal is interesting. The creator hasn't written Zhang Jiao as the historical rebel really was.", "d": 6, "r": "起义者", "z": 3.42, "n": 16}, {"t": "", "p": "", "o": "实际上很多农民起义，最后要不然被剿灭了，要不然起义者成了新的皇帝，又进入一轮新的循环，永远是百姓在底下要不做炮灰，要不然又成了新的奴隶，对吧？", "e": "In reality, many peasant rebellions were either crushed or their leaders became new emperors, starting another cycle. The people below were always either cannon fodder or new slaves, right?", "d": 9, "r": "剿灭", "z": 2.05, "n": 39}, {"t": "", "p": "", "o": "就是个盛世和衰世的循环。", "e": "It's a cycle of prosperity and decline.", "d": 7, "r": "衰世", "z": 2.67, "n": 7}, {"t": "", "p": "", "o": "这个盛世和衰世的循环，其实这个张角很清楚。", "e": "And this Zhang Jiao understands that cycle very clearly.", "d": 7, "r": "衰世", "z": 2.67, "n": 11}, {"t": "", "p": "", "o": "不是历史上的张角，是这个青瓜蛋写的张角。", "e": "I'm talking not about the historical Zhang Jiao, but the Zhang Jiao written by Qingguadan.", "d": 7, "r": "青瓜", "z": 2.81, "n": 11}, {"t": "", "p": "", "o": "真正历史上张角实际上是个军事独裁者，他弄了很多兵起义，他要成了，他肯定是一个新的皇帝和强人。", "e": "The historical Zhang Jiao was actually a military dictator. He raised a large army to rebel; if he'd won, he surely would have become a new emperor, a strongman.", "d": 7, "r": "强人", "z": 3.28, "n": 27}, {"t": "", "p": "", "o": "问题是青瓜蛋笔下的张角并不糊涂。", "e": "But the Zhang Jiao in Qingguadan's story isn't deluded.", "d": 6, "r": "青瓜", "z": 2.81, "n": 10}, {"t": "", "p": "", "o": "他已经咳血，快死了。", "e": "He's coughing up blood and close to death.", "d": 7, "r": "咳血", "z": 2.42, "n": 4}, {"t": "", "p": "", "o": "他明白这个循环，知道自己带不来苍天。", "e": "He understands the cycle and knows he can't bring the Blue Heaven.", "d": 5, "r": "带不来", "z": 3.57, "n": 8}, {"t": "", "p": "", "o": "但是，再下面一个反转，我觉得就更是悲壮到悲凉了。", "e": "But the next reversal, I think, makes the story go from tragic heroism to utter bleakness.", "d": 6, "r": "悲凉", "z": 3.0, "n": 13}, {"t": "", "p": "", "o": "张角最后说起义的时间到了，他在揭竿而起之前做了一个演讲。", "e": "At the end, Zhang Jiao says the time for rebellion has come. Before raising the banner, he gives a speech.", "d": 9, "r": "揭竿而起", "z": 0.0, "n": 16}, {"t": "", "p": "", "o": "他说：“我知道你们明天可能就会死，很多人可能都回不了家，后人甚至不会替你们收尸。", "e": "He says, \"I know you may die tomorrow.", "d": 7, "r": "收尸", "z": 2.87, "n": 23}, {"t": "", "p": "", "o": "我知道你们很害怕这个结果，可能要掉脑袋，看不到黄天。", "e": "Many of you may never make it home, and future generations may not even bury your bodies.", "d": 4, "r": "看不到", "z": 4.36, "n": 13}, {"t": "", "p": "", "o": "你们知道吗？", "e": "I know you're afraid of that outcome. You may lose your heads and never see the Yellow Heaven.", "d": 1, "r": "你们", "z": 5.8, "n": 3}, {"t": "", "p": "", "o": "我也很怕。", "e": "Do you know something?", "d": 2, "r": "怕", "z": 4.95, "n": 4}, {"t": "", "p": "", "o": "我更怕的是你们的子孙，在死之前，还要喊皇恩浩荡。", "e": "I'm afraid, too.", "d": 9, "r": "皇恩浩荡", "z": 0.4, "n": 13}, {"t": "", "p": "", "o": "你们的妈妈死了之后，还没有人来给她收尸。", "e": "What I fear even more is that your children and grandchildren will still have to praise the emperor's boundless grace right before they die.", "d": 7, "r": "收尸", "z": 2.87, "n": 13}, {"t": "", "p": "", "o": "你们连姓名都留不下。”他的意思是说，黄天只会出现在每一个不肯再跪的人头上。", "e": "After your mother dies, no one even comes to collect her body.", "d": 5, "r": "不下", "z": 3.94, "n": 24}, {"t": "", "p": "", "o": "袁莉：对，我觉得这是最反动的一个地方。", "e": "You won't even be able to leave your names behind.\" He means that the Yellow Heaven will appear only above the heads of those who refuse to kneel any longer.", "d": 4, "r": "反动", "z": 4.29, "n": 11}, {"t": "", "p": "", "o": "查建英：最反动，也是最热血的：“你跪是跪不来，你死也是死。", "e": "Yuan Li: Right. I think this is the most reactionary part of all.", "d": 5, "r": "热血", "z": 3.93, "n": 18}, {"t": "", "p": "", "o": "很多人在死之前很久就已经半死了。", "e": "Zha Jianying: The most reactionary, and the most stirring: \"You can't kneel your way to it. If you die, you die.", "d": 6, "r": "半死", "z": 3.21, "n": 10}, {"t": "", "p": "", "o": "我要还给他们那口气，虽然可能结局都是死，但是至少有一口气。", "e": "Many people have been half-dead long before they actually die.", "d": 5, "r": "口气", "z": 3.97, "n": 16}, {"t": "", "p": "", "o": "你站起来了，你是站着死的，你不是跪着死的。” 后来到故事结尾，官兵杀来了，张角人头落地。", "e": "I want to give them back that breath of life. Even if the ending may be death for everyone, at least they'll have that breath.", "d": 6, "r": "人头", "z": 3.83, "n": 26}, {"t": "", "p": "", "o": "你记得吗？", "e": "You stood up. You'll die standing, not on your knees.\" Later, at the end of the story, the soldiers arrive and Zhang Jiao is beheaded.", "d": 2, "r": "记得", "z": 5.07, "n": 3}, {"t": "", "p": "", "o": "剧中那个跟随张角的女孩对裴令史说了一句话：“人死了，我们也失败了，可是有些东西还是飞起来了。”那时候你看画面里很多黄色头巾飞上了天，蛮有诗意，但又非常悲凉。", "e": "Do you remember?", "d": 8, "r": "飞上了", "z": 2.86, "n": 44}, {"t": "", "p": "", "o": "什么东西飞起来了呢？", "e": "The girl who followed Zhang Jiao says to Pei, \"We've died, and we've failed, but some things have still taken flight.\" At that moment, you see lots of yellow headscarves flying up into the sky. It's quite poetic, but also very bleak.", "d": 2, "r": "飞", "z": 4.87, "n": 6}, {"t": "", "p": "", "o": "是灵魂吗？", "e": "What has taken flight?", "d": 3, "r": "灵魂", "z": 4.72, "n": 3}, {"t": "", "p": "", "o": "是精神吗？", "e": "Is it the soul?", "d": 2, "r": "精神", "z": 5.25, "n": 3}, {"t": "", "p": "", "o": "是，我觉得是。", "e": "Is it the spirit?", "d": 1, "r": "觉得", "z": 5.75, "n": 4}, {"t": "", "p": "", "o": "我看到这个画面的时候我觉得，很多年来我一直感叹，中国缺少的不是聪明而是正确的价值观，是对正确的价值观的信仰和勇气，就是热血。", "e": "Yes, I think so.", "d": 6, "r": "很多年", "z": 3.66, "n": 33}, {"t": "", "p": "", "o": "这个民族已经失败太多，已经跪了太多次了。", "e": "When I saw that scene, I thought about how I've lamented for years that what China lacks isn't intelligence, but the right values—and faith in and courage to uphold those values. It's that fire in the blood.", "d": 4, "r": "跪", "z": 4.24, "n": 12}, {"t": "", "p": "", "o": "最近一个朋友看了这部《问苍生》之后，他的一个评论给我感触很深。", "e": "This nation has failed too many times and knelt too many times.", "d": 6, "r": "感触", "z": 3.58, "n": 18}, {"t": "", "p": "", "o": "他说，有些民族是马背上的，有些民族是车上的，有些民族是膝盖上的。", "e": "Recently, after a friend watched Asking Heaven About the People, a comment of his really struck me.", "d": 5, "r": "膝盖", "z": 3.93, "n": 18}, {"t": "", "p": "", "o": "非常悲凉。", "e": "He said some peoples are on horseback, some are in cars, and some are on their knees.", "d": 6, "r": "悲凉", "z": 3.0, "n": 2}, {"t": "", "p": "", "o": "就是说，中国人就是一个天生的要跪的民族，所以是没有未来的。", "e": "It's deeply bleak.", "d": 5, "r": "就是说", "z": 4.02, "n": 16}, {"t": "", "p": "", "o": "大家都等着别人去出头，或者等着一个青天大老爷。", "e": "In other words, Chinese people are a nation born to kneel, so they have no future.", "d": 6, "r": "青天", "z": 3.43, "n": 13}, {"t": "", "p": "", "o": "所以这部剧的突破让我觉得，“青瓜蛋”一定是年轻人。", "e": "Everyone waits for someone else to stand up, or for a benevolent, upright official to save them.", "d": 7, "r": "青瓜", "z": 2.81, "n": 13}, {"t": "", "p": "", "o": "在这个大多数人没有血性，习惯了失败，习惯了逆来顺受的这么一个民族，这么一个国度，在这么一个巨大的专制机器的统治之下，只有是一个还有一些有血性的年轻人， 才能用这么大的力量，以一己之力写出这么一个东西来。", "e": "That's why this drama's breakthrough makes me think Qingguadan must be young.", "d": 10, "r": "逆来顺受", "z": 0.77, "n": 53}, {"t": "", "p": "", "o": "其实等于就是在说：“死我也要死得像个人，我知道可能没有明天”。", "e": "In a nation and country where most people lack fire in their blood, are used to failure, and are accustomed to submitting meekly, under the rule of such an enormous autocratic machine, only a young person with some spirit could use such force and, single-handedly, write something like this.", "d": 5, "r": "要死", "z": 4.0, "n": 17}, {"t": "", "p": "", "o": "你知道我第一联想是什么吗？", "e": "It's essentially saying, \"Even if I die, I want to die as a human being. I know there may be no tomorrow.\"", "d": 4, "r": "联想", "z": 4.28, "n": 8}, {"t": "", "p": "", "o": "很奇怪，我联想到了香港的勇武派。", "e": "Do you know what my first association was?", "d": 7, "r": "勇武", "z": 2.77, "n": 10}, {"t": "", "p": "", "o": "前几年的时候，我不妨说我对他们的态度连跟我哥哥都有分歧。", "e": "Strangely enough, I thought of Hong Kong's militant protesters.", "d": 5, "r": "不妨", "z": 4.03, "n": 19}, {"t": "", "p": "", "o": "袁莉：就是2019年的时候，反送中。", "e": "A few years ago, I might as well admit that my view of them differed even from my brother's.", "d": 4, "r": "反送", "z": 4.05, "n": 7}, {"t": "", "p": "", "o": "查建英：2019年的时候，七百万人口的城市有一百万人上街，这是不得了的事。", "e": "Yuan Li: That was in 2019, during the anti-extradition protests.", "d": 6, "r": "七百万", "z": 3.35, "n": 17}, {"t": "", "p": "", "o": "1989年的时候，北京有一百万人上街，但北京是一个更大的城市。", "e": "Zha Jianying: In 2019, a million people took to the streets in a city of seven million. That was extraordinary.", "d": 5, "r": "一百万", "z": 3.68, "n": 16}, {"t": "", "p": "", "o": "袁莉：而且有全国各地来的人。", "e": "In 1989, a million people took to the streets in Beijing, but Beijing is a much bigger city.", "d": 2, "r": "各地", "z": 5.06, "n": 8}, {"t": "", "p": "", "o": "查建英：是啊，就是站起来了那么一次，对吧？", "e": "Yuan Li: And people had come from all over the country.", "d": 2, "r": "一次", "z": 5.54, "n": 11}, {"t": "", "p": "", "o": "香港却有这么大的比例上街。", "e": "Zha Jianying: Yes, people stood up that one time, right?", "d": 3, "r": "比例", "z": 4.92, "n": 8}, {"t": "", "p": "", "o": "之后有很多声音，包括一些老民运的人，都说要“和理非”，说要见好就收。", "e": "But in Hong Kong, such a large proportion of the population took to the streets.", "d": 9, "r": "见好就收", "z": 1.78, "n": 18}, {"t": "", "p": "", "o": "他们说：“我们的错误就是当年我们没有见好就收，当时我们太激进了”。", "e": "Afterward there were many voices, including some from the older democracy movement, saying to stick to \"peaceful, rational, nonviolent\" methods and quit while ahead.", "d": 9, "r": "见好就收", "z": 1.78, "n": 15}, {"t": "", "p": "", "o": "我不同意。", "e": "They said, \"Our mistake back then was that we didn't quit while we were ahead; we were too radical.\"", "d": 2, "r": "同意", "z": 5.15, "n": 3}, {"t": "", "p": "", "o": "袁莉：很多从八九年过来，甚至和我年纪差不多大的人都主张“和理非”。", "e": "I disagree.", "d": 8, "r": "八九年", "z": 2.16, "n": 17}, {"t": "", "p": "", "o": "查建英： 对，就是你要和平、理性、非暴力，这样才有可能保住一些成果 然后避免秋后算账。", "e": "Yuan Li: Many people who came of age around 1989, even those about my age, advocate \"peaceful, rational, nonviolent\" methods.", "d": 9, "r": "秋后算账", "z": 1.3, "n": 18}, {"t": "", "p": "", "o": "我说扯淡吧，王八蛋。", "e": "Zha Jianying: Right. They say you have to be peaceful, rational, and nonviolent to preserve some gains and avoid being punished afterward.", "d": 5, "r": "扯淡", "z": 3.36, "n": 5}, {"t": "", "p": "", "o": "你知不知道，实际上你就是再退让，再妥协，假设学生撤回校园，它就不秋后算账了吗？", "e": "I say that's bullshit, you bastards.", "d": 9, "r": "秋后算账", "z": 1.3, "n": 19}, {"t": "", "p": "", "o": "它就不开坦克出来了吗？", "e": "Do you realize that even if you keep retreating and compromising—even if the students withdraw to their campuses—does that mean there won't be a reckoning afterward?", "d": 3, "r": "坦克", "z": 4.55, "n": 7}, {"t": "", "p": "", "o": "不给你们一个一个抓起来了吗？", "e": "Does it mean they won't send in the tanks?", "d": 2, "r": "抓", "z": 5.18, "n": 9}, {"t": "", "p": "", "o": "一直到白纸运动都是这样。", "e": "Won't they arrest you one by one?", "d": 6, "r": "白纸", "z": 3.07, "n": 7}, {"t": "", "p": "", "o": "这么小的一个闪运，就一个周末的运动。", "e": "It was the same with the White Paper protests.", "d": 6, "r": "闪运", "z": 3.08, "n": 10}, {"t": "", "p": "", "o": "袁莉：白纸运动是多么的“和理非”，而且很多人连口号都不敢喊了。", "e": "That was such a small, fleeting movement—just one weekend.", "d": 6, "r": "白纸", "z": 3.07, "n": 17}, {"t": "", "p": "", "o": "查建英：是啊，就一张白纸，上面口号都没有，最后结果怎么样呢？", "e": "Yuan Li: The White Paper protests were so \"peaceful, rational, and nonviolent,\" and many people didn't even dare to chant slogans.", "d": 8, "r": "一张白纸", "z": 2.06, "n": 13}, {"t": "", "p": "", "o": "所以我佩服香港青年，为什么我佩服他们？", "e": "Zha Jianying: Exactly. Just a blank sheet of paper, with no slogans on it. And what was the result?", "d": 4, "r": "佩服", "z": 3.93, "n": 9}, {"t": "", "p": "", "o": "我当然反对暴力，我当然不愿意流血，任何一个生命死去都是悲剧。", "e": "That's why I admire Hong Kong's young people. Why do I admire them?", "d": 5, "r": "流血", "z": 4.07, "n": 16}, {"t": "", "p": "", "o": "但我非常理解他们这种“我死也要争一口气”的态度。", "e": "Of course I oppose violence, and of course I don't want bloodshed. Every life lost is a tragedy.", "d": 5, "r": "一口气", "z": 3.97, "n": 14}, {"t": "", "p": "", "o": "“我知道香港这么小，我们是螳臂当车，我们可能扭转不了局面”。", "e": "But I deeply understand their attitude of \"Even if I die, I have to stand up for my dignity.\"", "d": 9, "r": "螳臂当车", "z": 0.0, "n": 13}, {"t": "", "p": "", "o": "但用广东话说，就是“揽炒”：“我们就一起撞吧”。", "e": "\"I know Hong Kong is so small, and we're like an insect trying to stop a chariot. We may not be able to turn things around.\"", "d": 6, "r": "广东话", "z": 3.34, "n": 12}, {"t": "", "p": "", "o": "我就佩服这口气，有这样的血性青年，才是希望。", "e": "But in Cantonese, it's called laam caau—\"Let's crash together.\"", "d": 6, "r": "血性", "z": 3.16, "n": 13}, {"t": "", "p": "", "o": "我一直就说，我不相信什么人民创造历史。", "e": "I admire that spirit. Young people with that kind of courage are the hope.", "d": 2, "r": "创造", "z": 5.14, "n": 11}, {"t": "", "p": "", "o": "你知道，我们从小长大被如此教育的，什么人民创造历史，但实际上都是个人创造的，由一个一个的个人。", "e": "I've always said I don't believe in the idea that \"the people make history.\"", "d": 5, "r": "从小", "z": 4.32, "n": 25}, {"t": "", "p": "", "o": "我那时候写 Tide Players（《弄潮儿》）的时候，我已经对以前那种改良、渐进、“和理非”的这种秉持了很多年的这种希望和信念已经看破了之后，我在那本书的结尾说：“我看现在的中国就像央视那个大楼，超前现代的设计，却实际上被一个老大哥在监控着，这是一老大哥监视下的美丽新世界。", "e": "You know, we were taught that from childhood: the people make history. But in reality, individuals make history, one person at a time.", "d": 9, "r": "弄潮儿", "z": 2.06, "n": 67}, {"t": "", "p": "", "o": "这是两头怪兽（极权和资本主义的最坏的两个方面）的结合。", "e": "When I wrote Tide Players, I had already lost faith in the hopes and convictions I'd held for years about reform, gradualism, and \"peaceful, rational, nonviolent\" action.", "d": 5, "r": "两头", "z": 3.53, "n": 15}, {"t": "", "p": "", "o": "这就是前景。", "e": "At the end of that book, I wrote: \"Today's China looks to me like the CCTV building: a futuristic design, yet actually monitored by Big Brother. It's a brave new world under Big Brother's surveillance.", "d": 3, "r": "前景", "z": 4.27, "n": 3}, {"t": "", "p": "", "o": "所以有什么希望？", "e": "It's a combination of two monsters—the worst aspects of totalitarianism and capitalism.", "d": 1, "r": "希望", "z": 5.72, "n": 4}, {"t": "", "p": "", "o": "当然剩下的就是绝望。", "e": "That's the outlook.", "d": 3, "r": "绝望", "z": 4.45, "n": 5}, {"t": "", "p": "", "o": "我想到了一个美国的女性人类学家，叫 Margaret Mead，她也是一位女权公知。", "e": "So what hope is there?", "d": 6, "r": "人类学家", "z": 3.09, "n": 15}, {"t": "", "p": "", "o": "她有一句话：“这个世界不要不相信有理想的有行动力的一些个体公民的力量，不要怀疑他们能够改造世界，他们能够改变世界。", "e": "Of course, all that's left is despair.\"", "d": 5, "r": "个体", "z": 4.5, "n": 31}, {"t": "", "p": "", "o": "事实上，世界一直都是由这样的人改变的。”从这点上，我不相信马克思的所谓“人民创造历史”，我相信另一个马克思——马克斯·韦伯。", "e": "I thought of an American female anthropologist, Margaret Mead, who was also a prominent feminist public intellectual.", "d": 5, "r": "这点", "z": 4.48, "n": 30}, {"t": "", "p": "", "o": "他认为并不是由人民创造历史，因为人民经常是滞后的，是乌合之众。", "e": "She said, \"Never doubt the power of a small group of committed, idealistic citizens to change the world. In fact, it's the only thing that ever has.\" I don't believe Marx's claim that \"the people make history\"; I believe in another Marx—Max Weber.", "d": 6, "r": "乌合之众", "z": 3.14, "n": 16}, {"t": "", "p": "", "o": "人民因为其所受的教育和生存需要所限，他们不可能领先于世界。", "e": "He argued that history isn't made by the people, because the masses are often behind the times and can become a mob.", "d": 4, "r": "所受", "z": 4.38, "n": 17}, {"t": "", "p": "", "o": "最敏锐、最有牺牲精神和最有信念的，恰恰是那些有行动力有信仰的个人。", "e": "Limited by their education and need to survive, the masses cannot lead the world.", "d": 5, "r": "敏锐", "z": 3.79, "n": 21}, {"t": "", "p": "", "o": "这样的人如果越来越多，真的能够改变世界。", "e": "The most perceptive, self-sacrificing, and committed people are precisely those individuals who act and believe.", "d": 2, "r": "越来越", "z": 5.07, "n": 10}, {"t": "", "p": "", "o": "不论科学上、信念上还是宗教上，其实都是这样。", "e": "If there are more and more people like that, they really can change the world.", "d": 4, "r": "信念", "z": 4.33, "n": 12}, {"t": "", "p": "", "o": "我们看到历代都是如此。", "e": "This applies in science, in conviction, and in religion.", "d": 4, "r": "历代", "z": 4.03, "n": 6}, {"t": "", "p": "", "o": "袁莉：确实是这样。", "e": "That's what we see throughout history.", "d": 2, "r": "确实", "z": 5.21, "n": 4}, {"t": "", "p": "", "o": "刚去世的美国女权运动领袖 Gloria Steinem，她就是这样。", "e": "Yuan Li: That's certainly true.", "d": 3, "r": "去世", "z": 4.51, "n": 9}, {"t": "", "p": "", "o": "她刚开始并没有很强烈地表达。", "e": "Gloria Steinem, the American feminist leader who just died, was like that.", "d": 2, "r": "表达", "z": 4.97, "n": 9}, {"t": "", "p": "", "o": "她当然相信女权，但没有说她要付诸多么大的行动，她只是一个记者。", "e": "At first, she didn't express herself very forcefully.", "d": 5, "r": "女权", "z": 4.11, "n": 18}, {"t": "", "p": "", "o": "但是呢，她后来开始创办杂志，做很多的事情，去促进很多法律的通过。", "e": "Of course she believed in women's rights, but she didn't say she was going to take some huge action; she was just a journalist.", "d": 4, "r": "创办", "z": 4.51, "n": 17}, {"t": "", "p": "", "o": "就是各种各样的这样的人，自己刚开始可能都没有想到可以做这么多事，但是回过头来看，没有这些人就没有女性今天这样子的自由， 虽然没有完全和男性平等，但是已经上升了很多。", "e": "But later she began publishing a magazine and doing many other things to help get laws passed.", "d": 10, "r": "回过头来", "z": 1.76, "n": 43}, {"t": "", "p": "", "o": "查建英：很大的进步。", "e": "People like this may not initially imagine that they can accomplish so much, but looking back, without them women wouldn't have the freedoms they have today. Women still aren't fully equal to men, but things have improved enormously.", "d": 2, "r": "很大", "z": 4.99, "n": 4}, {"t": "", "p": "", "o": "古今中外，你看，实际上都是这样的例子。", "e": "Zha Jianying: It's been tremendous progress.", "d": 7, "r": "古今中外", "z": 2.6, "n": 9}, {"t": "", "p": "", "o": "为什么我说这个年轻人，这个青瓜蛋，我第二次看我非常地欣赏，我觉得带来了希望，让我看到一丝亮光，我发给了很多我的同代的在国内的朋友，他们都没看过，而且都不知道这部剧。", "e": "Look at examples from every era and every part of the world. That's how it works.", "d": 8, "r": "青瓜", "z": 2.81, "n": 47}, {"t": "", "p": "", "o": "袁莉： B站是相对年轻的。", "e": "That's why I admire this young creator, Qingguadan, so much after watching it a second time. It gave me hope and showed me a glimmer of light. I sent it to many friends of my generation in China, and none of them had seen it or even heard of it.", "d": 2, "r": "相对", "z": 5.02, "n": 6}, {"t": "", "p": "", "o": "查建英：这就是一个知识代沟。", "e": "Yuan Li: Bilibili's audience is relatively young.", "d": 6, "r": "代沟", "z": 2.82, "n": 6}, {"t": "", "p": "", "o": "其实他们非常希望中国有这种血气有改变，但是一个是他们人已经老去，对吧？", "e": "Zha Jianying: That's a generational knowledge gap.", "d": 6, "r": "血气", "z": 3.46, "n": 20}, {"t": "", "p": "", "o": "他们就说那美好的仗我也打过了，或者说我现在反正已经到这个份上，我也不需要去关心这些大众的这些短视频呀，什么爽剧的，都很低级。", "e": "Actually, these people desperately want China to have this kind of spirit and to change, but one thing is that they're old now, right?", "d": 6, "r": "仗", "z": 3.81, "n": 41}, {"t": "", "p": "", "o": "他们看的都是一些更高端的，很多人在讨论一些很高大上的东西， 比如理论上怎么能改变中国，他们反而不去关心这种年轻人和普通人。", "e": "They say, \"I've already fought the good fight,\" or, \"At this point in my life, I don't need to bother with these mass-market short videos and wish-fulfillment dramas; they're lowbrow.\"", "d": 6, "r": "普通人", "z": 3.95, "n": 35}, {"t": "", "p": "", "o": "因为这些年轻人用的是另外一种语言方式，老一代的人会看得莫名其妙。", "e": "They watch more high-end material. Many discuss grand, abstract questions, like how to change China in theory, while overlooking young people and ordinary people.", "d": 6, "r": "老一代", "z": 3.47, "n": 15}, {"t": "", "p": "", "o": "觉得这有什么好看的？", "e": "These young people use a different kind of language, which the older generation finds baffling.", "d": 3, "r": "好看", "z": 4.74, "n": 6}, {"t": "", "p": "", "o": "真的有一些当年的“老公知”，或者是今天的一些自认为的自由派精英…", "e": "They think, \"What's so good about this?\"", "d": 5, "r": "自由派", "z": 3.6, "n": 17}, {"t": "", "p": "", "o": "袁莉：自认的 establishment，实际上是非常边缘的。", "e": "There really are some old public intellectuals from back then, or today's self-proclaimed liberal elites...", "d": 5, "r": "自认", "z": 3.58, "n": 8}, {"t": "", "p": "", "o": "查建英：所以这种有血气、有能力、有智慧的年轻人是非常珍贵的。", "e": "Yuan Li: The self-proclaimed establishment, though in reality they're very marginal.", "d": 6, "r": "血气", "z": 3.46, "n": 15}, {"t": "", "p": "", "o": "袁莉：我觉得现在真的很有意思，最近我在写中国互联网越来越“丧”，又看到豆瓣上另一个特别受欢迎的视频，虽然没到《问苍生》受欢迎的程度。", "e": "Zha Jianying: That's why young people with spirit, ability, and intelligence are so precious.", "d": 7, "r": "丧", "z": 3.35, "n": 33}, {"t": "", "p": "", "o": "它讲的是当你的资产降为零时怎样在桥洞下生存，其实就是一个教大家怎么做一个无家可归者的《桥洞生存法则》，竟然一度是B站第二热门的视频。", "e": "Yuan Li: I think what's happening now is really interesting. I've recently been writing about how increasingly gloomy the Chinese internet has become, and I saw another hugely popular video on Douban, though it hasn't reached the popularity of Asking Heaven About the People.", "d": 8, "r": "无家可归者", "z": 2.65, "n": 37}, {"t": "", "p": "", "o": "我昨天看时，已经有六七百万播放量了。", "e": "It explains how to survive under a bridge when your assets fall to zero. It's basically a \"Rules for Surviving Under a Bridge\" guide teaching people how to become homeless, and at one point it was Bilibili's second-most-popular video.", "d": 7, "r": "六七百", "z": 2.35, "n": 11}, {"t": "", "p": "", "o": "好有意思，居然有那么多人想看这个东西。", "e": "When I looked yesterday, it already had six or seven million views.", "d": 4, "r": "有意思", "z": 4.38, "n": 11}, {"t": "", "p": "", "o": "你想想看，去年年底“牢A”还在嘲笑美国的无家可归者，结果现在在中国大家都去看怎么做一个无家可归者了。", "e": "It's fascinating that so many people want to watch something like this.", "d": 8, "r": "无家可归者", "z": 2.65, "n": 24}, {"t": "", "p": "", "o": "而且我看下面的评论也很有意思，有人贴了照片，说：“这就是我现在的生活”。", "e": "Think about it: at the end of last year, \"Lao A\" was still mocking America's homeless, and now people in China are watching videos about how to become homeless.", "d": 4, "r": "有意思", "z": 4.38, "n": 20}, {"t": "", "p": "", "o": "虽然 B站现在变得很多，以前B站上是喜欢动漫的八零后、九零后人群为主， 后来就变成一个粉红与毛左聚集的平台。", "e": "The comments are interesting, too. Someone posted a photo and said, \"This is my life now.\"", "d": 7, "r": "九零", "z": 3.02, "n": 29}, {"t": "", "p": "", "o": "这个《桥洞生存法则》也是可能和B站的观众群比较契合的。", "e": "Bilibili has changed a lot. It used to be dominated by people born in the 1980s and 1990s who liked anime; later it became a platform where nationalists and Maoist leftists gathered.", "d": 6, "r": "桥洞", "z": 3.23, "n": 14}, {"t": "", "p": "", "o": "有意思的是，我们党不是已经消除贫困了吗？", "e": "This Rules for Surviving Under a Bridge may also fit Bilibili's audience.", "d": 4, "r": "有意思", "z": 4.38, "n": 11}, {"t": "", "p": "", "o": "然后我们这个伟大的事业就是整天在赢的。", "e": "What's interesting is, didn't our Party already eradicate poverty?", "d": 4, "r": "整天", "z": 4.3, "n": 11}, {"t": "", "p": "", "o": "查建英：现在新一轮的消除地方债又开始了，他们永远是会在从胜利走向更大的胜利，你不用想，他永远是制造出来一个新的问题，然后他说这个问题，你看我要解决，而且我必然解决，不管他解决没有，最后他一定宣布我已经解决了。", "e": "And isn't our great cause supposedly winning every single day?", "d": 5, "r": "债", "z": 4.06, "n": 60}, {"t": "", "p": "", "o": "袁莉：你看《问苍生》这么多人看，我们这种人一看就说：“这简直真是无比反动”，再看《桥洞生存法则》，制作非常粗糙，它告诉你不要找湿气重的地方，不要找有摄像头的地方，也不要到太热闹的地方，因为有汽车尾气。", "e": "Zha Jianying: Now there's another campaign to eliminate local-government debt. They're always moving from one victory to an even greater victory. Don't even think about it: they create a new problem, then say, \"Look, I'm going to solve it, and of course I will.\" Whether or not they solve it, in the end they always announce that they've solved it.", "d": 9, "r": "汽车尾气", "z": 2.12, "n": 52}, {"t": "", "p": "", "o": "有趣的是，中国不是说大家都没见过无家可归者吗？", "e": "Yuan Li: Look, when people like us watch Asking Heaven About the People, we immediately say, \"This is unbelievably reactionary.\" Then there's Rules for Surviving Under a Bridge, which is very crudely made. It tells you not to choose a damp place, not to stay somewhere with cameras, and not to go somewhere too busy because of vehicle exhaust.", "d": 7, "r": "无家可归者", "z": 2.65, "n": 12}, {"t": "", "p": "", "o": "很多城市的小孩没见过乞丐和无家可归者。", "e": "What's interesting is that China supposedly has no homeless people for the public to see.", "d": 7, "r": "无家可归者", "z": 2.65, "n": 9}, {"t": "", "p": "", "o": "查建英：疫情之前，包括我自己亲友群里都有这样的小粉红，他们自己都觉得：“你们说的那些问题，我们就——”", "e": "Many children in Chinese cities have never seen beggars or homeless people.", "d": 5, "r": "粉红", "z": 3.9, "n": 26}, {"t": "", "p": "", "o": "袁莉：觉得我们中国没有。", "e": "Zha Jianying: Before the pandemic, even in my own family-and-friends group, there were little nationalists who thought, \"Those problems you talk about—we just don't have them—\"", "d": 1, "r": "觉得", "z": 5.75, "n": 5}, {"t": "", "p": "", "o": "查建英：“没有啊，只有西方有。", "e": "Yuan Li: They thought China didn't have them.", "d": 2, "r": "西方", "z": 5.2, "n": 6}, {"t": "", "p": "", "o": "我们在这都混得很好。”疫情之后他们知道了，然后经济下行之后他们又知道了。", "e": "Zha Jianying: \"No, only the West has those problems.", "d": 6, "r": "下行", "z": 3.67, "n": 21}, {"t": "", "p": "", "o": "铁拳不锤到自己身上的时候，他都不觉得疼的。", "e": "We're doing great here.\" After the pandemic, they found out. Then, when the economy started declining, they found out again.", "d": 8, "r": "不锤到", "z": 1.77, "n": 12}, {"t": "", "p": "", "o": "别人疼，他们可以视而不见。", "e": "Until the iron fist hits them personally, they don't feel the pain.", "d": 5, "r": "视而不见", "z": 3.61, "n": 5}, {"t": "", "p": "", "o": "袁莉：我觉得现在疼的人太多了。", "e": "They can turn a blind eye to other people's pain.", "d": 4, "r": "疼", "z": 4.41, "n": 10}, {"t": "", "p": "", "o": "查建英：疼的人越来越多。", "e": "Yuan Li: I think far too many people are suffering now.", "d": 3, "r": "疼", "z": 4.41, "n": 6}, {"t": "", "p": "", "o": "袁莉：可能是因为我以前在小红书上搜过失业相关的东西，我现在一打开，天呐，铺天盖地，没完没了，全都是讲失业的。", "e": "Zha Jianying: More and more people are suffering.", "d": 7, "r": "铺天盖地", "z": 3.16, "n": 26}, {"t": "", "p": "", "o": "各种失业与找不到工作，还有”不要回家乡了，家乡没有工作“。", "e": "Yuan Li: Maybe it's because I once searched Xiaohongshu for things related to unemployment. Now whenever I open it, my God, it's everywhere, nonstop—everything is about losing your job.", "d": 4, "r": "家乡", "z": 4.4, "n": 14}, {"t": "", "p": "", "o": "还有微信给我推荐的文章，也都是这种中年失业，全是无比得丧。", "e": "All kinds of posts about unemployment and not being able to find work, and \"Don't go back to your hometown; there are no jobs there.\"", "d": 6, "r": "丧", "z": 3.35, "n": 18}, {"t": "", "p": "", "o": "查建英：我觉得年轻人有他们的对策，他们的反抗，会用一种新的更聪明的语言。", "e": "The articles WeChat recommends to me are also all about middle-aged people losing their jobs, all incredibly depressing.", "d": 5, "r": "对策", "z": 4.14, "n": 20}, {"t": "", "p": "", "o": "他们完全知道，党国最怕的是组织型的行动。", "e": "Zha Jianying: I think young people have their own strategies and ways of resisting. They'll use a new, more ingenious language.", "d": 5, "r": "最怕", "z": 3.92, "n": 11}, {"t": "", "p": "", "o": "我们知道白纸运动实际上都只在一些媒体上有公告，他们并没有成立真的组织，但他们会用一种新的形式，新的语言来反抗，就像这部《问苍生》一样。", "e": "They know perfectly well that what the Party-state fears most is organized action.", "d": 7, "r": "白纸", "z": 3.07, "n": 38}, {"t": "", "p": "", "o": "他们是一个一个的个人，各处小狐狸出没的感觉，而相比起来我党则是一个庞然大物。", "e": "We know the White Paper movement was only announced in certain media, and they didn't establish a real organization. But people will resist through new forms and new language, just like this drama, Asking Heaven About the People.", "d": 9, "r": "庞然大物", "z": 0.47, "n": 20}, {"t": "", "p": "", "o": "袁莉：我因为写这个专栏，我专门和李老师聊过。", "e": "They're individuals, like little foxes popping up here and there, while the Party is a gigantic beast by comparison.", "d": 6, "r": "聊过", "z": 3.02, "n": 11}, {"t": "", "p": "", "o": "看李老师的 Twitter 账号发的很多内容，现在不仅仅是个体在讲述自己的困难，还有一些人会用另一种方式表达。", "e": "Yuan Li: Because I was writing this column, I specifically spoke with Teacher Li.", "d": 5, "r": "不仅仅", "z": 4.38, "n": 25}, {"t": "", "p": "", "o": "比如有一个视频里的人在说”中国共产党是最伟大的党“，下面的留言则全是哭脸。", "e": "Looking at the many posts on Teacher Li's Twitter account, it's not just individuals describing their own hardships anymore; some people express themselves in other ways.", "d": 6, "r": "哭脸", "z": 3.63, "n": 22}, {"t": "", "p": "", "o": "一排一排的特别整齐的哭脸，竟然有四万多个评论。", "e": "For example, in one video someone says, \"The Chinese Communist Party is the greatest party,\" while the comments below are all crying-face emojis.", "d": 7, "r": "四万多个", "z": 2.39, "n": 11}, {"t": "", "p": "", "o": "查建英：哭是真的同情还是讽刺呢？", "e": "Rows and rows of perfectly aligned crying faces—there are more than forty thousand comments.", "d": 4, "r": "讽刺", "z": 4.35, "n": 8}, {"t": "", "p": "", "o": "袁莉：当然全是讽刺。", "e": "Zha Jianying: Are the tears genuine sympathy or sarcasm?", "d": 3, "r": "讽刺", "z": 4.35, "n": 5}, {"t": "", "p": "", "o": "我还采访了维也纳大学的一位教授，他最近专门写了一篇文章，研究乌鲁木齐大火时的网络表达。", "e": "Yuan Li: Of course it's all sarcasm.", "d": 5, "r": "大火", "z": 4.2, "n": 23}, {"t": "", "p": "", "o": "有很多人利用官方的 hashtag（热搜），来发那些骂人的内容。", "e": "I also interviewed a professor at the University of Vienna who recently wrote an article studying online expression during the Ürümqi fire.", "d": 5, "r": "骂人", "z": 3.6, "n": 14}, {"t": "", "p": "", "o": "这种行为叫 subversive amplification，即颠覆性放大—— 利用官方的热搜词来发自己想要发的东西，挺有意思。", "e": "Many people used official hashtags—trending search terms—to post insulting or critical content.", "d": 7, "r": "颠覆性", "z": 3.03, "n": 21}, {"t": "", "p": "", "o": "李老师说，实际上，很多人发的时候，他们没有意识到自己发这个东西有什么问题。", "e": "This is called \"subversive amplification\": using official trending terms to post what you actually want to say. It's quite interesting.", "d": 4, "r": "人发", "z": 4.49, "n": 18}, {"t": "", "p": "", "o": "比如说小红书上好多公务员，还有事业单位的，国企的，都在说我几个月没有发工资了。", "e": "Teacher Li said that when many people post these things, they don't realize there's anything problematic about what they're saying.", "d": 5, "r": "书上", "z": 3.68, "n": 19}, {"t": "", "p": "", "o": "他们认为这就是自己的生活，没觉得这个东西有什么政治性。", "e": "For example, lots of civil servants, public-institution employees, and state-owned-enterprise workers on Xiaohongshu say they haven't been paid for months.", "d": 6, "r": "政治性", "z": 3.13, "n": 14}, {"t": "", "p": "", "o": "查建英：没有政治性。", "e": "They think they're just describing their lives; they don't see anything political about it.", "d": 5, "r": "政治性", "z": 3.13, "n": 3}, {"t": "", "p": "", "o": "袁莉：对，他们没有政治性，但是你要看多了，就知道情况很差。", "e": "Zha Jianying: Nothing political about it.", "d": 6, "r": "政治性", "z": 3.13, "n": 15}, {"t": "", "p": "", "o": "他们还在互相说：”你是在什么样类型的单位工作？", "e": "Yuan Li: Right, they don't think it's political, but when you see enough of it, you realize how bad things are.", "d": 3, "r": "什么样", "z": 4.67, "n": 13}, {"t": "", "p": "", "o": "你在什么企业或单位？", "e": "They ask one another, \"What kind of organization do you work for?", "d": 1, "r": "单位", "z": 5.56, "n": 6}, {"t": "", "p": "", "o": "你几个月没发工资，我几个月没发工资。”就好像大家在正常地互相了解情况。", "e": "What company or institution are you at?", "d": 5, "r": "发工资", "z": 3.72, "n": 19}, {"t": "", "p": "", "o": "因为大家都不好过嘛，也想知道别人过得怎么样。", "e": "You haven't been paid for months? I haven't been paid for months either.\" It's as if they're just normally comparing notes.", "d": 5, "r": "不好过", "z": 3.44, "n": 12}, {"t": "", "p": "", "o": "但我们看多了会觉得，哇，情况真的很差。", "e": "Because everyone's having a hard time, and they want to know how other people are doing.", "d": 3, "r": "哇", "z": 4.62, "n": 11}, {"t": "", "p": "", "o": "查建英：我这一段时间老觉得，中国的精英作为一个整体是令人失望的。", "e": "But when we see enough of it, we think, wow, things really are bad.", "d": 4, "r": "精英", "z": 4.3, "n": 16}, {"t": "", "p": "", "o": "因为这些年轻人或者所谓底层的民众，他们从切身的生活体验上已经知道，现在的生活不是我要的。", "e": "Zha Jianying: Lately I've often felt that China's elites, as a whole, are disappointing.", "d": 6, "r": "切身", "z": 3.31, "n": 24}, {"t": "", "p": "", "o": "他们可能话语权不够，反抗的能力也有限。", "e": "These young people and so-called ordinary people at the bottom already know from their own lived experience that this isn't the life they want.", "d": 6, "r": "话语权", "z": 3.28, "n": 9}, {"t": "", "p": "", "o": "这么大一个社会，我们说了很多次，它要改变，需要一种合力，你不能只靠这些全是松散、弱小的个人。", "e": "They may not have much of a voice, and their ability to resist is limited.", "d": 6, "r": "松散", "z": 3.61, "n": 26}, {"t": "", "p": "", "o": "一个时机或者一个危机来了，大家一拥而上，实际上这样也很容易被镇压。", "e": "For a society this large, as we've said many times, change requires a collective force. You can't rely only on scattered, weak individuals.", "d": 9, "r": "一拥而上", "z": 0.84, "n": 16}, {"t": "", "p": "", "o": "社会改变需要一种合力。", "e": "If an opportunity or crisis arrives and everyone rushes in at once, that can also be easily suppressed.", "d": 4, "r": "合力", "z": 3.96, "n": 5}, {"t": "", "p": "", "o": "但是精英群体，我不得不说，除了那些有勇气，有信念，已经被打压而丧失了话语权的人，其他那些仍有话语权的人还在用各种姿态跪舔，还在配合着吃这碗饭，而且他们吃得还不错。", "e": "Social change requires a collective force.", "d": 7, "r": "碗饭", "z": 3.0, "n": 48}, {"t": "", "p": "", "o": "哪怕有一些曾经的自由派，现在也全都转向了。", "e": "But the elite—I have to say that, apart from those who have courage and conviction but have been silenced by repression, the others who still have a voice continue to grovel in all kinds of ways. They keep cooperating to earn their living, and they're doing quite well for themselves.", "d": 5, "r": "自由派", "z": 3.6, "n": 11}, {"t": "", "p": "", "o": "最近有个例子，前两天摇滚歌手何勇去世了，网上有一些人纪念他。", "e": "Even some former liberals have now all changed sides.", "d": 6, "r": "摇滚歌手", "z": 2.95, "n": 14}, {"t": "", "p": "", "o": "他代表九十年代的文艺人，直面现实，直接表达。", "e": "Here's a recent example: the rock singer He Yong died a couple of days ago, and some people online commemorated him.", "d": 6, "r": "九十年代", "z": 3.31, "n": 10}, {"t": "", "p": "", "o": "他可能很粗粝，歌词和音乐性我们先不说，也许不能跟崔健比。", "e": "He represented the artists of the 1990s who faced reality and spoke directly.", "d": 9, "r": "粗粝", "z": 1.27, "n": 16}, {"t": "", "p": "", "o": "但是，他就是”我直说良心“。", "e": "He may have been rough around the edges; we can set aside his lyrics and musicianship for now, and perhaps he couldn't compare with Cui Jian.", "d": 5, "r": "直说", "z": 3.49, "n": 6}, {"t": "", "p": "", "o": "他的《垃圾场》写得多么粗粝。", "e": "But his attitude was, \"I'll speak plainly, according to my conscience.\"", "d": 9, "r": "粗粝", "z": 1.27, "n": 7}, {"t": "", "p": "", "o": "袁莉：但写得很好啊。", "e": "His song \"Garbage Dump\" was so raw.", "d": 1, "r": "写", "z": 5.61, "n": 7}, {"t": "", "p": "", "o": "查建英：写得非常好。", "e": "Yuan Li: But it was really good.", "d": 1, "r": "非常", "z": 5.59, "n": 5}, {"t": "", "p": "", "o": "袁莉：非常形象：", "e": "Zha Jianying: It was very good.", "d": 2, "r": "形象", "z": 4.93, "n": 3}, {"t": "", "p": "", "o": "查建英：“吃的都是良心，拉的全是思想”；还有“有人减肥，有人饿死没粮”； 最后大喊：“有没有希望？", "e": "Yuan Li: Very vivid:", "d": 6, "r": "没粮", "z": 3.27, "n": 20}, {"t": "", "p": "", "o": "人活着总要有幻想”，直抒胸臆。", "e": "Zha Jianying: \"What we eat is conscience; what we shit out is thought.\" And, \"Some people diet, while others starve without food.\"", "d": 9, "r": "直抒胸臆", "z": 0.0, "n": 6}, {"t": "", "p": "", "o": "当年的这样的人在曾登上了很大的舞台，可这些人现在都到哪里去了？", "e": "Finally he shouts, \"Is there any hope? A person has to have some illusions to live!\" He speaks straight from the heart.", "d": 4, "r": "登上", "z": 4.33, "n": 21}, {"t": "", "p": "", "o": "所谓‘魔岩三杰’中的另外两位，窦唯和张楚，当初我就很讨厌。", "e": "People like that once stood on major stages. But where are they now?", "d": 7, "r": "魔岩", "z": 2.9, "n": 15}, {"t": "", "p": "", "o": "张楚那首歌叫《上帝保佑吃完了饭的人民》，多么扯淡。", "e": "I always disliked the other two members of the so-called \"Three Heroes of Magic Rock,\" Dou Wei and Zhang Chu.", "d": 6, "r": "扯淡", "z": 3.36, "n": 12}, {"t": "", "p": "", "o": "至于窦唯，后来又去搞一些莫名其妙的东西。", "e": "Zhang Chu's song was called \"God Bless the People Who Have Finished Eating.\" What nonsense.", "d": 5, "r": "莫名其妙", "z": 3.73, "n": 10}, {"t": "", "p": "", "o": "我一个朋友看了《问苍生》后说：从立意和勇气上，它已经把张艺谋、陈凯歌甩下一百条街了。", "e": "As for Dou Wei, later he went off and made all sorts of incomprehensible things.", "d": 7, "r": "甩下", "z": 3.04, "n": 23}, {"t": "", "p": "", "o": "我觉得说得对。", "e": "After a friend watched Asking Heaven About the People, he said that in terms of its vision and courage, it had left Zhang Yimou and Chen Kaige a hundred blocks behind.", "d": 6, "r": "说得对", "z": 3.09, "n": 3}, {"t": "", "p": "", "o": "这些有话语权的人，你们不用住在桥洞底下，都住在名流花园里。", "e": "I think he's right.", "d": 6, "r": "桥洞", "z": 3.23, "n": 16}, {"t": "", "p": "", "o": "他们的良心也被狗吃了吗？", "e": "Those of you with a public voice don't have to live under a bridge; you all live in elite gated communities.", "d": 4, "r": "良心", "z": 4.08, "n": 9}, {"t": "", "p": "", "o": "全都去拍《建党伟业》，抗美援朝之类的东西。", "e": "Has your conscience been eaten by dogs?", "d": 6, "r": "抗美援朝", "z": 3.3, "n": 9}, {"t": "", "p": "", "o": "袁莉：还有国安部指导拍的张艺谋导的谍战片。", "e": "They all go off and make things like The Founding of a Party and films about resisting U.S. aggression and aiding Korea.", "d": 9, "r": "导的谍", "z": 0.68, "n": 10}, {"t": "", "p": "", "o": "查建英：还有一些人可能本来有良心。", "e": "Yuan Li: And spy thrillers directed by Zhang Yimou under the guidance of the Ministry of State Security.", "d": 4, "r": "良心", "z": 4.08, "n": 8}, {"t": "", "p": "", "o": "大概十来年前，有一个叫谭维维的女歌手，曾经跟崔健同台演唱。", "e": "Zha Jianying: Some people may once have had a conscience.", "d": 6, "r": "女歌手", "z": 3.37, "n": 16}, {"t": "", "p": "", "o": "她唱华阴老腔，很有力道。", "e": "About ten years ago, a singer named Tan Weiwei once performed onstage with Cui Jian.", "d": 6, "r": "老腔", "z": 2.9, "n": 7}, {"t": "", "p": "", "o": "后来我就关注这个人，因为她是一个原始的是有生命力的有力量的一个歌手，也很年轻，大概是八零后还是九零后。", "e": "She sang the traditional Huayin laoqiang style with tremendous force.", "d": 7, "r": "九零", "z": 3.02, "n": 32}, {"t": "", "p": "", "o": "后来呢，我发现她不断上春晚，去唱那些什么祖国这一类的歌。", "e": "I started following her because she was a raw, vital, powerful singer, and quite young—probably born in the 1980s or 1990s.", "d": 5, "r": "春晚", "z": 3.57, "n": 17}, {"t": "", "p": "", "o": "我一说我的祖国，我又想起来王菲。", "e": "Later, I noticed that she kept appearing on the Spring Festival Gala, singing songs about the motherland and things like that.", "d": 3, "r": "祖国", "z": 4.69, "n": 10}, {"t": "", "p": "", "o": "袁莉：我也正想说王菲，以前都以为她是“仙女”。", "e": "As soon as I mention \"my motherland,\" I think of Faye Wong.", "d": 5, "r": "仙女", "z": 3.69, "n": 13}, {"t": "", "p": "", "o": "查建英：你一听仙女就直到有问题了。", "e": "Yuan Li: I was just about to mention Faye Wong, too. We used to think she was a fairy.", "d": 5, "r": "仙女", "z": 3.69, "n": 10}, {"t": "", "p": "", "o": "陈凯歌拍了一部什么电影，王菲在电影里用甜蜜蜜的声音唱《我和我的祖国》，穿着一条虚无缥缈的白裙子，就是一个《小时代》的造型。", "e": "Zha Jianying: As soon as you hear \"fairy,\" you know there's a problem.", "d": 10, "r": "虚无缥缈", "z": 0.0, "n": 32}, {"t": "", "p": "", "o": "她还唱过什么“你是大海， 我是海的影子。”", "e": "Chen Kaige made some film in which Faye Wong sang \"My Motherland and Me\" in her sweet voice, wearing a wispy white dress, with a look straight out of Tiny Times.", "d": 4, "r": "影子", "z": 4.12, "n": 13}, {"t": "", "p": "", "o": "袁莉：我完全无法想象，拍《重庆森林》的王菲跟这个有什么关系。", "e": "She also sang something like, \"You are the sea, and I am the shadow of the sea.\"", "d": 3, "r": "想象", "z": 4.72, "n": 15}, {"t": "", "p": "", "o": "查建英：那是当年的香港电影造了一个神，而现在这样的艺人，一堆一堆的。", "e": "Yuan Li: I can't imagine how the Faye Wong from Chungking Express has anything to do with this.", "d": 6, "r": "香港电影", "z": 3.44, "n": 18}, {"t": "", "p": "", "o": "这样的歌，比如《我和我的祖国》，八十年代李谷一唱，还能唱出来一点感觉。", "e": "Zha Jianying: Hong Kong cinema created an icon back then, and now there are artists like this everywhere.", "d": 8, "r": "李谷一", "z": 2.39, "n": 17}, {"t": "", "p": "", "o": "虽然也是我不喜欢的民族主义，就是那种“祖国是妈我是宝”，“你是大海，我是浪花”，这一类扯淡的歌。", "e": "A song like \"My Motherland and Me,\" when Li Guyi sang it in the 1980s, could still convey a little feeling.", "d": 7, "r": "浪花", "z": 3.08, "n": 27}, {"t": "", "p": "", "o": "但是问题是，八十年代，这个国家确实在开放中，人们是有希望的，那时候唱还可以，反正挺朴实的吧。", "e": "I still disliked its nationalism—the kind of nonsense about \"the motherland is my mother and I'm her treasure,\" or \"you are the sea and I'm a wave.\"", "d": 6, "r": "朴实", "z": 3.4, "n": 25}, {"t": "", "p": "", "o": "到后来就全被改造了。", "e": "But in the 1980s, the country really was opening up, and people had hope. Singing it then was acceptable; it was fairly simple and sincere.", "d": 3, "r": "改造", "z": 4.75, "n": 7}, {"t": "", "p": "", "o": "王菲唱的时候就像《小时代》，跟郭敬明他们一样，变成一些“小我”。", "e": "Later, everything was reengineered.", "d": 3, "r": "唱", "z": 4.69, "n": 16}, {"t": "", "p": "", "o": "他们倒是钱挣得不少，却穷得只剩下钱，这个“我”越来越小。", "e": "When Faye Wong sings it, it's like Tiny Times, like Guo Jingming and his crowd; everything becomes about the small self.", "d": 6, "r": "挣得", "z": 3.13, "n": 16}, {"t": "", "p": "", "o": "袁莉：小到不能再小了。", "e": "They've made plenty of money, yet they're so impoverished that money is all they have. The self keeps getting smaller.", "d": 1, "r": "小", "z": 5.89, "n": 7}, {"t": "", "p": "", "o": "查建英：你被挤到了一个角落，原来你还有一个舞台，好像虽然有只大蟒蛇在后边虎视眈眈地看着你，但是你还能感觉我是一个舞台中央的明星。", "e": "Yuan Li: Smaller than it could possibly get.", "d": 10, "r": "虎视眈眈", "z": 0.0, "n": 36}, {"t": "", "p": "", "o": "可是最后给你挤、挤、挤，把你挤在一个小角落，你还不肯放弃，还在那跳呢。", "e": "Zha Jianying: You've been squeezed into a corner. You used to have a stage; although a huge python was watching you from behind, you could still feel you were the star at the center of the stage.", "d": 5, "r": "角落", "z": 4.18, "n": 23}, {"t": "", "p": "", "o": "袁莉：挤到角落还在旋转。", "e": "But eventually they keep squeezing and squeezing you into a tiny corner, and you still refuse to give up—you keep dancing there.", "d": 4, "r": "角落", "z": 4.18, "n": 7}, {"t": "", "p": "", "o": "查建英：所以我觉得《问苍生》特别好，非常大气。", "e": "Yuan Li: Spinning even after being squeezed into the corner.", "d": 4, "r": "大气", "z": 4.33, "n": 10}, {"t": "", "p": "", "o": "袁莉：大气，简洁，
