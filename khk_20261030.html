const out=document.getElementById('out'),histogram=document.getElementById('histogram');
const gotoPercent=document.getElementById('goto-percent');
const progressStatus=document.getElementById('progress-status');
const storageKey='transcript-reader-progress-d52da491a13ce986';
const col=n=>`hsl(${Math.round(130-(n-1)*13)},55%,45%)`;
window.history.scrollRestoration='manual';
let maxFlippedIndex=-1;
try{
  const raw=localStorage.getItem(storageKey);
  if(raw){
    const candidate=JSON.parse(raw);
    if(candidate&&Number.isInteger(candidate.maxFlippedIndex)&&
       candidate.maxFlippedIndex>=0&&candidate.maxFlippedIndex<D.length){
      maxFlippedIndex=candidate.maxFlippedIndex;
    }
  }
}catch(error){
  progressStatus.textContent='Progress storage is unavailable in this browser';
}
function renderHistogram(){
  const counts=Array.from({length:10}, (_,i)=>({level:i+1,count:D.filter(x=>x.d===i+1).length}));
  const max=Math.max(...counts.map(c=>c.count),1);
  histogram.innerHTML='<div class="hist-title">Difficulty distribution</div>' + counts.map(c=>`
    <div class="hist-row">
      <span>${c.level}</span>
      <div class="hist-track"><span class="hist-fill" style="width:${(c.count/max)*100}%"></span></div>
      <span>${c.count}</span>
    </div>
  `).join('');
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){
  renderHistogram();
  out.replaceChildren();let last=null;const total=Math.max(D.length,1);
  D.forEach((x,idx)=>{
    const key=x.t+'|'+x.p;
    if(key!==last&&(x.t||x.p)){last=key;const h=el('div','t');
      if(x.t)h.append('['+x.t+'] ');
      if(x.p){const b=el('b','',x.p+':');h.append(b)}
      out.append(h)}
    const s=el('div','s');s.tabIndex=0;s.setAttribute('role','button');
    s.dataset.index=idx;
    const prog=el('div','progress');
    const track=el('div','progress-track');
    const fill=el('div','progress-fill');
    const pct=Math.round(((idx+1)/total)*100);
    fill.style.height=pct+'%';
    track.append(fill);
    prog.append(track);
    prog.append(el('div','progress-label',pct+'%'));
    s.append(prog);
    s.append(el('div','',x.e||x.o));
    const d=el('div','d',x.d+'/10');const m=el('div','m');const i=el('i');
    i.style.width=(x.d*10)+'%';i.style.background=col(x.d);m.append(i);d.append(m);s.append(d);
    const z=el('div','zh');
    if(x.e){const o=el('div','o',x.o);o.lang="th";z.append(o)}
    z.append(el('div','i',x.r?('Rarest word: '+x.r+'  (Zipf '+(x.z===null?'?':x.z.toFixed(2))+')  ·  '+x.n+' words'):(x.n+' words')));
    s.append(z);
    const tg=()=>{
      s.classList.toggle('open');
      if(s.classList.contains('open'))saveProgress(idx);
    };
    s.onclick=tg;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
    out.append(s);
  });
}
function saveProgress(index){
  maxFlippedIndex=Math.max(maxFlippedIndex,index);
  const pct=Math.round(((maxFlippedIndex+1)/Math.max(D.length,1))*100);
  try{
    localStorage.setItem(storageKey,JSON.stringify({maxFlippedIndex}));
    progressStatus.textContent='Saved at '+pct+'%';
  }catch(error){
    progressStatus.textContent='Progress could not be saved in this browser';
  }
}
document.getElementById('all').onclick=()=>{
  document.querySelectorAll('.s').forEach(e=>e.classList.add('open'));
  if(D.length)saveProgress(D.length-1);
};
document.getElementById('none').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.remove('open'));
function goToPercent(){
  const percent=Number(gotoPercent.value);
  if(gotoPercent.value.trim()===''||!Number.isFinite(percent)||percent<0||percent>100){
    gotoPercent.setCustomValidity('Enter a percentage from 0 to 100.');
    gotoPercent.reportValidity();
    return;
  }
  gotoPercent.setCustomValidity('');
  const index=Math.max(0,Math.ceil((percent/100)*D.length)-1);
  const sentence=out.querySelector('.s[data-index="'+index+'"]');
  if(sentence){
    sentence.scrollIntoView({block:'start'});
    progressStatus.textContent='At '+percent+'% — open a sentence to save progress';
  }
}
document.getElementById('goto').onclick=goToPercent;
gotoPercent.onkeydown=e=>{if(e.key==='Enter')goToPercent()};
render();
if(maxFlippedIndex>=0){
  requestAnimationFrame(()=>{
    const sentence=out.querySelector('.s[data-index="'+maxFlippedIndex+'"]');
    if(sentence){
      sentence.scrollIntoView({block:'start'});
      const pct=Math.round(((maxFlippedIndex+1)/Math.max(D.length,1))*100);
      progressStatus.textContent='Resumed at '+pct+'%';
    }
  });
}else{
  progressStatus.textContent='Open a sentence to save progress';
}
