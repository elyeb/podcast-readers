<script>
const D=[{"t": "", "p": "", "o": "0001 | 袁莉：非常欢迎大家来到第三届不明白节。", "e": "Yuan Li: A very warm welcome to everyone at the third Un-Breaking Festival.", "d": 4, "r": "第三届", "z": 3.63, "n": 9}, {"t": "", "p": "", "o": "0002 | 不明白播客是2022年5月上海封城期间我在韩国创办的，我那时在韩国工作。", "e": "I founded the Un-Breaking podcast in South Korea in May 2022, during the Shanghai lockdown. I was working in South Korea at the time.", "d": 7, "r": "播客", "z": 3.12, "n": 19}, {"t": "", "p": "", "o": "0003 | 2023年初，播客做的第一个大活动就是在东大，当时也是阿古智子老师请我来做分享。", "e": "In early 2023, the podcast's first major event was at the University of Tokyo. Professor Tomoko Ako had also invited me to give a talk then.", "d": 7, "r": "智子", "z": 3.09, "n": 21}, {"t": "", "p": "", "o": "0004 | 那个时候疫情刚刚结束，我没有想到会有那么多人来。", "e": "The pandemic had just ended, and I had no idea so many people would come.", "d": 5, "r": "疫情", "z": 4.47, "n": 14}, {"t": "", "p": "", "o": "0005 | 我们定了一个好像一、两百人的场地。", "e": "We booked a venue that I think held one or two hundred people.", "d": 5, "r": "两百人", "z": 2.52, "n": 9}, {"t": "", "p": "", "o": "0006 | 结果人来的太多太多了，我们临时换了一个场地，好像就是在这。", "e": "But far, far more people showed up, so we had to switch venues at the last minute. I think it was right here.", "d": 6, "r": "场地", "z": 4.23, "n": 18}, {"t": "", "p": "", "o": "0007 | 所以，我非常荣幸今天又能回到这里和大家做第三届不明白节。", "e": "So I am very honored to be back here today for the third Un-Breaking Festival.", "d": 6, "r": "第三届", "z": 3.63, "n": 16}, {"t": "", "p": "", "o": "0008 | 那个时候我意识到，大家仅仅听到声音是不够的，仅仅在网络上连接是不够的，大家还是很想能够聚在一起，因为人是社会动物，想要感受到同类的温度。", "e": "Back then, I realized that just hearing people's voices wasn't enough, and connecting online wasn't enough. People still really wanted to gather in person, because humans are social animals and want to feel the warmth of others like themselves.", "d": 9, "r": "聚在一起", "z": 3.51, "n": 37}, {"t": "", "p": "", "o": "0009 | 所以到了2024年，我们就有了第一届不明白节，今天是第三届。", "e": "So in 2024, we held the first Un-Breaking Festival. Today is the third.", "d": 5, "r": "第三届", "z": 3.63, "n": 15}, {"t": "", "p": "", "o": "0010 | 有人说，这是一个“反贼聚会”，我一直非常反感这个词。", "e": "Some people call this an “anti-government dissident gathering.” I've always strongly disliked that term.", "d": 5, "r": "反贼", "z": 3.23, "n": 13}, {"t": "", "p": "", "o": "0011 | 我想，我自己、今天的嘉宾还有在座的很多人都不是要“反什么”，我们是“要什么”——我们要真相、要自由、要尊严，要一个“我们值得的中国”。", "e": "I think that I, today's guests, and many people here aren't trying to be “against” anything. We're saying what we “want”: we want truth, freedom, dignity, and a China that “we deserve.”", "d": 9, "r": "在座", "z": 3.52, "n": 34}, {"t": "", "p": "", "o": "0012 | 接下来我们就请第一位嘉宾，推特上的“李老师不是你老师”出场。", "e": "Now let's welcome our first guest, “Teacher Li Is Not Your Teacher” on Twitter.", "d": 5, "r": "出场", "z": 4.16, "n": 14}, {"t": "", "p": "", "o": "0013 | （现场鼓掌）", "e": "(Applause)", "d": 3, "r": "鼓掌", "z": 3.83, "n": 2}, {"t": "", "p": "", "o": "0014 | 今年有不明白节，大家要感谢李老师。", "e": "We have an Un-Breaking Festival this year thanks to Teacher Li.", "d": 3, "r": "节", "z": 4.93, "n": 9}, {"t": "", "p": "", "o": "0015 | 实际上到九月份的时候，我都没有特别下定决心要办这个不明白节。", "e": "Actually, as late as September, I hadn't firmly decided that we would hold this festival.", "d": 6, "r": "下定决心", "z": 3.63, "n": 16}, {"t": "", "p": "", "o": "0016 | 我和李老师在台湾碰到的时候，李老师说：“不明白节当然要每年都办了，你一定要办啊！”", "e": "When Teacher Li and I ran into each other in Taiwan, he said, “Of course the Un-Breaking Festival has to happen every year. You absolutely have to hold it!”", "d": 7, "r": "碰到", "z": 4.34, "n": 24}, {"t": "", "p": "", "o": "0017 | 我说：“哦，好吧。”", "e": "I said, “Oh, all right.”", "d": 2, "r": "哦", "z": 5.23, "n": 5}, {"t": "", "p": "", "o": "0018 | 他说：“我来出场。”", "e": "He said, “I'll appear as a guest.”", "d": 3, "r": "出场", "z": 4.16, "n": 5}, {"t": "", "p": "", "o": "0019 | 我一听这个，那咱一定要办，是不是？", "e": "When I heard that, I thought, well, then we absolutely have to hold it, right?", "d": 4, "r": "咱", "z": 4.14, "n": 9}, {"t": "", "p": "", "o": "0020 | 就冲他出场，咱们都得一定要办。", "e": "We have to hold it just to get him on stage, don't we?", "d": 4, "r": "出场", "z": 4.16, "n": 10}, {"t": "", "p": "", "o": "0021 | 李老师从小学画画，后来在微博上写爱情小说——我把你的老底都揭了…", "e": "Teacher Li started studying painting in elementary school. Later, he wrote romance stories on Weibo. I'm revealing all your secrets here...", "d": 6, "r": "老底", "z": 3.47, "n": 17}, {"t": "", "p": "", "o": "0022 | （现场笑）", "e": "(Laughter)", "d": 2, "r": "笑", "z": 5.2, "n": 2}, {"t": "", "p": "", "o": "0023 | 李老师：没关系", "e": "Teacher Li: That's fine.", "d": 2, "r": "没关系", "z": 4.41, "n": 2}, {"t": "", "p": "", "o": "0024 | 袁莉：你是一个典型的文艺青年，从来没有想过做“反贼”。", "e": "Yuan Li: You're a typical artsy young man. You never imagined becoming an “anti-government dissident.”", "d": 5, "r": "反贼", "z": 3.23, "n": 14}, {"t": "", "p": "", "o": "0025 | 到2019年香港反送中的时候，其实你也没有那么特别的关注。", "e": "Even during Hong Kong's anti-extradition movement in 2019, you weren't paying all that much attention.", "d": 5, "r": "反送", "z": 4.05, "n": 15}, {"t": "", "p": "", "o": "0026 | 是在白纸运动的时候，你把你自己的推特账号搞成了一个信息集散地，大家都可以给你投稿，然后你发出来。", "e": "It was during the White Paper Movement that you turned your own Twitter account into an information hub. People could send you submissions, and you would post them.", "d": 9, "r": "白纸", "z": 3.07, "n": 29}, {"t": "", "p": "", "o": "0027 | 突然之间你就成了中国头号“反贼”，你被各种骚扰，你的社交账户全都被关掉，你的家人被威胁、被骚扰。", "e": "All of a sudden, you became China's number-one “dissident.” You were harassed in all sorts of ways, all your social media accounts were shut down, and your family members were threatened and harassed.", "d": 8, "r": "反贼", "z": 3.23, "n": 27}, {"t": "", "p": "", "o": "0028 | 特别厉害的时候，你其实也动摇过，说干脆自己把这个账户关了算了。", "e": "When things got especially intense, you even wavered and thought maybe you should just close the account yourself.", "d": 6, "r": "动摇", "z": 4.1, "n": 18}, {"t": "", "p": "", "o": "0029 | 我一直都很好奇，2025年冬天，我采访你的时候，我问你，你觉得自己现在是不是已经成了一个革命者，你也很犹豫。", "e": "I've always been curious. When I interviewed you in the winter of 2025, I asked whether you thought you had become a revolutionary, and you were very hesitant.", "d": 9, "r": "革命者", "z": 3.37, "n": 29}, {"t": "", "p": "", "o": "0030 | 我想问一下，如果别人现在问你：“你是谁？”，你给自己会定一个什么标签？", "e": "So let me ask: if someone asked you now, “Who are you?”, what label would you give yourself?", "d": 6, "r": "会定", "z": 4.03, "n": 19}, {"t": "", "p": "", "o": "0031 | 李老师：哇，你都没给我和大家打招呼的机会。", "e": "Teacher Li: Wow, you haven't even given me a chance to say hello to everyone.", "d": 5, "r": "打招呼", "z": 3.92, "n": 12}, {"t": "", "p": "", "o": "0032 | （现场笑）", "e": "(Laughter)", "d": 2, "r": "笑", "z": 5.2, "n": 2}, {"t": "", "p": "", "o": "0033 | 袁莉：你不知道吗？", "e": "Yuan Li: Didn't you know?", "d": 2, "r": "知道", "z": 5.97, "n": 5}, {"t": "", "p": "", "o": "0034 | 不明白播客从不让嘉宾给大家打招呼！", "e": "The Un-Breaking podcast never lets its guests greet the audience!", "d": 4, "r": "播客", "z": 3.12, "n": 9}, {"t": "", "p": "", "o": "0035 | 李老师：OK，好的好的。", "e": "Teacher Li: OK, all right.", "d": 2, "r": "好", "z": 6.24, "n": 5}, {"t": "", "p": "", "o": "0036 | 首先我想说一下我的感受，因为我可能有很多很多年都没有和这么多中国人共处一室了，所以其实我现在还是蛮紧张的。", "e": "First, I want to talk about how I feel, because I may not have been in a room with this many Chinese people for many, many years. So, to be honest, I'm quite nervous right now.", "d": 10, "r": "共处一室", "z": 1.57, "n": 30}, {"t": "", "p": "", "o": "0037 | 昨天你给我提纲的时候，其实我也想了很久，我要说什么，我要表达什么，但是好像现在也都全忘了…", "e": "When you sent me the outline yesterday, I spent a long time thinking about what I wanted to say and express, but it seems I've forgotten it all now...", "d": 8, "r": "提纲", "z": 3.25, "n": 28}, {"t": "", "p": "", "o": "0038 | 袁莉：我也都忘了，所以就瞎聊吧。", "e": "Yuan Li: I've forgotten it all too, so let's just chat.", "d": 5, "r": "瞎聊", "z": 2.93, "n": 10}, {"t": "", "p": "", "o": "0039 | 李老师：对，所以说到“革命者”这个词的话，我觉得这其实是一个很沉重的词。", "e": "Teacher Li: Right. As for the word “revolutionary,” I think it's actually a very weighty word.", "d": 6, "r": "革命者", "z": 3.37, "n": 19}, {"t": "", "p": "", "o": "0040 | 特别是对于从小学习中国历史的我们来说，“革命者”非常的宏大、非常有献身的精神啊等等等等。", "e": "Especially for those of us who studied Chinese history from childhood, “revolutionary” evokes something grand, a spirit of great sacrifice, and so on.", "d": 7, "r": "革命者", "z": 3.37, "n": 21}, {"t": "", "p": "", "o": "0041 | 但是在过去的一年里，我突然意识到一个事情——当共产党觉得你是一个革命者的时候，你最好是一个革命者。", "e": "But over the past year, I suddenly realized something: when the Communist Party considers you a revolutionary, you'd better be one.", "d": 8, "r": "革命者", "z": 3.37, "n": 26}, {"t": "", "p": "", "o": "0042 | 为什么这么说呢？", "e": "Why do I say that?", "d": 2, "r": "这么", "z": 5.69, "n": 4}, {"t": "", "p": "", "o": "0043 | 因为从白纸运动开始，一直到今天，实际上我所遭受的待遇，或者说我和我的团队所遭受的待遇，说明共产党实际上就是拿我们当革命者去对待。", "e": "Because from the beginning of the White Paper Movement until today, the way I've been treated—or the way my team and I have been treated—shows that the Communist Party really does treat us as revolutionaries.", "d": 9, "r": "白纸", "z": 3.07, "n": 34}, {"t": "", "p": "", "o": "0044 | 从我自己的角度，我觉得我们做的东西也没有那么的先锋性。", "e": "From my own perspective, I don't think what we do is all that radical.", "d": 5, "r": "先锋", "z": 4.35, "n": 17}, {"t": "", "p": "", "o": "0045 | 我们也并没有做什么特别有创意的东西，我们做的事情也没有特别的能够颠覆国家政权，是吧？", "e": "We haven't done anything particularly creative, and what we do isn't especially capable of overthrowing the state, is it?", "d": 7, "r": "颠覆", "z": 4.05, "n": 25}, {"t": "", "p": "", "o": "0046 | 我们只是发一发国内给我们的投稿，只是发一发中国国内的新闻，只是去帮中国的高中生、中国的打工人有一个平台，让他们去表述自己的遭遇等等等等。", "e": "We simply publish submissions sent to us from inside China, share news from China, and provide a platform for Chinese high school students and working people to describe what has happened to them, and so on.", "d": 9, "r": "等等等等", "z": 3.68, "n": 37}, {"t": "", "p": "", "o": "0047 | 但是，我们遭遇的是什么呢？", "e": "But what have we faced?", "d": 3, "r": "遭遇", "z": 4.6, "n": 7}, {"t": "", "p": "", "o": "0048 | 我在意大利遭遇了跨国镇压。", "e": "I have experienced transnational repression in Italy.", "d": 3, "r": "跨国", "z": 4.13, "n": 7}, {"t": "", "p": "", "o": "0049 | 我的很多朋友被找，比如说方脸、若辉，他们仅仅是因为和我在一起工作，他们的父母会被打电话，要求你们的孩子不准再和李颖一起工作。", "e": "Many of my friends have been approached. For example, Fanglian and Ruohui. Simply because they work with me, their parents get phone calls telling them that their children must stop working with Li Ying.", "d": 9, "r": "方脸", "z": 3.67, "n": 33}, {"t": "", "p": "", "o": "0050 | 所以对我们来说，我觉得这很莫名其妙。", "e": "So to us, I think this is completely baffling.", "d": 4, "r": "莫名其妙", "z": 3.73, "n": 9}, {"t": "", "p": "", "o": "0051 | 过去的几年里，实际上我一直在逃避“革命者”这个概念。", "e": "Over the past few years, I've actually been avoiding the concept of being a “revolutionary.”", "d": 5, "r": "革命者", "z": 3.37, "n": 12}, {"t": "", "p": "", "o": "0052 | 从我的角度，我不觉得我是革命者。", "e": "From my perspective, I don't think I'm a revolutionary.", "d": 5, "r": "革命者", "z": 3.37, "n": 10}, {"t": "", "p": "", "o": "0053 | 因为我觉得我做的事情没有那么的革命。", "e": "Because I don't think what I do is all that revolutionary.", "d": 3, "r": "革命", "z": 5.36, "n": 11}, {"t": "", "p": "", "o": "0054 | 我们只是在做和过去的前辈一样的事情。", "e": "We're simply doing what our predecessors did.", "d": 4, "r": "前辈", "z": 4.12, "n": 11}, {"t": "", "p": "", "o": "0055 | 那是过去的前辈他们走过的路，我们只是继续在这条路上走。", "e": "They walked this path before us, and we're just continuing along it.", "d": 5, "r": "前辈", "z": 4.12, "n": 16}, {"t": "", "p": "", "o": "0056 | 但是为什么这些重担就压在我身上呢？", "e": "But why should all these heavy burdens fall on me?", "d": 5, "r": "重担", "z": 3.39, "n": 10}, {"t": "", "p": "", "o": "0057 | 所以我过去会有委屈的时候，会有逃避的时候。", "e": "So in the past, there were times when I felt aggrieved, and times when I tried to avoid it.", "d": 5, "r": "委屈", "z": 3.73, "n": 13}, {"t": "", "p": "", "o": "0058 | 当我这样的时候，实际上他就给我们造成了很大的困扰和很多的麻烦。", "e": "When I did that, it actually caused us a great deal of trouble and many difficulties.", "d": 6, "r": "困扰", "z": 4.3, "n": 19}, {"t": "", "p": "", "o": "0059 | 就是因为你没有准备好，但是他持续用这样的方式来对待你。", "e": "It's because you're not prepared, but they keep treating you this way.", "d": 5, "r": "对待", "z": 4.82, "n": 16}, {"t": "", "p": "", "o": "0060 | 这样的话，我们实际上就会失去很多很多。", "e": "As a result, we actually stand to lose a great deal.", "d": 4, "r": "很多很多", "z": 3.35, "n": 7}, {"t": "", "p": "", "o": "0061 | 所以，如果今天说我是一个什么样的角色，我可能会说：“从白纸运动到今天，我们依然是一个服务者的角色。”我们帮助国内那些不敢发声的人，不愿意去承担风险的人，我们去替他们承担这个风险，他们把视频、图片发给我们，我们在海外把这些消息传播出去，通过这样的方式让更多的中国人知道自己身边正在发生什么。", "e": "So if you ask what role I play today, I might say: “From the White Paper Movement until now, our role is still that of a service provider.” We help people inside China who don't dare to speak out or don't want to take the risks. We take those risks on their behalf. They send us videos and photos, and from overseas we spread the information so that more Chinese people can learn what's happening around them.", "d": 9, "r": "白纸", "z": 3.07, "n": 77}, {"t": "", "p": "", "o": "0062 | 我觉得这就是我们作为一个服务者的角色。", "e": "I think that's our role as service providers.", "d": 4, "r": "服务者", "z": 4.35, "n": 10}, {"t": "", "p": "", "o": "0063 | 到现在为止，我们有了很多其他的工作。", "e": "By now, we've taken on a lot of other work as well.", "d": 4, "r": "为止", "z": 4.66, "n": 10}, {"t": "", "p": "", "o": "0064 | 这些工作实际上也是我们希望能够帮助更多的年轻人，更多的小团体能够去成长起来。", "e": "That work is also intended to help more young people and more small groups grow and develop.", "d": 6, "r": "小团体", "z": 4.05, "n": 19}, {"t": "", "p": "", "o": "0065 | 所以如果你问我们现在是一个什么角色，我觉得我们是“革命者当中的服务者”。", "e": "So if you ask what role we play now, I would say we're “service providers among the revolutionaries.”", "d": 6, "r": "革命者", "z": 3.37, "n": 18}, {"t": "", "p": "", "o": "0066 | 袁莉：你能描述一下自己现在每天的日常吧。", "e": "Yuan Li: Could you describe what your daily life looks like now?", "d": 4, "r": "日常", "z": 4.77, "n": 11}, {"t": "", "p": "", "o": "0067 | 大家可能会有点好奇，你在干嘛呢？", "e": "People may be curious about what you're doing.", "d": 4, "r": "好奇", "z": 4.45, "n": 9}, {"t": "", "p": "", "o": "0068 | 你在白纸运动的时候一天十几个小时发推特，你现在主要的工作有哪几块呢？", "e": "During the White Paper Movement, you spent more than ten hours a day posting on Twitter. What are the main areas of your work now?", "d": 7, "r": "白纸", "z": 3.07, "n": 20}, {"t": "", "p": "", "o": "0069 | 李老师：我现在的工作和之前完全不一样。", "e": "Teacher Li: My work now is completely different from what it used to be.", "d": 3, "r": "之前", "z": 5.45, "n": 10}, {"t": "", "p": "", "o": "0070 | 过去，我可能完全是在家里工作，完全是处理这些投稿、新闻等等等等。", "e": "In the past, I probably worked entirely from home, handling submissions, news, and so on.", "d": 5, "r": "等等等等", "z": 3.68, "n": 15}, {"t": "", "p": "", "o": "0071 | 但是现在的我们的团队其实越来越大。", "e": "But our team has been growing steadily.", "d": 3, "r": "团队", "z": 5.03, "n": 9}, {"t": "", "p": "", "o": "0072 | 有很多有理想、有抱负的年轻人加入我们的团队，帮我一起处理这些工作。", "e": "Many idealistic, ambitious young people have joined the team to help me handle this work.", "d": 6, "r": "抱负", "z": 3.58, "n": 18}, {"t": "", "p": "", "o": "0073 | 所以实际上我有了更多的时间，可以在现实中做一些线下的工作。", "e": "So in practice, I have more time to do things offline and in person.", "d": 6, "r": "线下", "z": 3.98, "n": 18}, {"t": "", "p": "", "o": "0074 | 这对我还蛮新鲜的。", "e": "That's quite new for me.", "d": 3, "r": "蛮", "z": 4.23, "n": 7}, {"t": "", "p": "", "o": "0075 | 因为我之前实际上没有这些经验，对我来说，2022年到2026年这四年就像一个大学一样，我可能是从“李老师不是你老师”这个新闻账号里毕业了。", "e": "Because I didn't have this kind of experience before. For me, the four years from 2022 to 2026 have been like university. I may have graduated from the news account “Teacher Li Is Not Your Teacher.”", "d": 8, "r": "账号", "z": 4.51, "n": 33}, {"t": "", "p": "", "o": "0076 | 到了现在，我有了一个全新的工作。", "e": "Now I've moved on to an entirely new job.", "d": 4, "r": "全新", "z": 4.52, "n": 10}, {"t": "", "p": "", "o": "0077 | 我们现在有不同的团队在处理各种各样不同的事情，我就负责出面，负责去世界各地把我们的事情和中国的事情告诉大家。", "e": "We have different teams handling all kinds of different things. I take responsibility for appearing in public and telling people around the world about our work and what's happening in China.", "d": 8, "r": "各种各样", "z": 3.78, "n": 29}, {"t": "", "p": "", "o": "0078 | 袁莉：你其实是在做一种倡议活动，去见议会啊、政府啊——你说的详细点，让大家知道你在做什么。", "e": "Yuan Li: You're essentially doing advocacy work, meeting with parliaments and governments. Explain in more detail so everyone knows what you're doing.", "d": 8, "r": "倡议", "z": 4.17, "n": 27}, {"t": "", "p": "", "o": "0079 | 李老师：OK ，从2025年，因为我们开始做很多对中国国内的高中生、打工人等等等等这些项目。", "e": "Teacher Li: OK. Starting in 2025, we began many projects for high school students, working people, and others inside China.", "d": 6, "r": "等等等等", "z": 3.68, "n": 18}, {"t": "", "p": "", "o": "0080 | 同时，也因为我们自己也遭受了很多的跨国镇压，让我们失去了很多的东西，所以我们觉得不能继续把这些东西停留在网上。", "e": "At the same time, because we ourselves had experienced a great deal of transnational repression and lost many things as a result, we felt we couldn't keep all this work confined to the internet.", "d": 8, "r": "跨国", "z": 4.13, "n": 30}, {"t": "", "p": "", "o": "0081 | 同时我们也意识到，很多情况在发生变化。", "e": "We also realized that a lot of things were changing.", "d": 4, "r": "发生变化", "z": 3.16, "n": 9}, {"t": "", "p": "", "o": "0082 | 如果大家有印象的话，从2022年白纸运动到现在，四年过去了，可能当时和我一起的博主里，现在还在当“反贼”的，应该没有几个了。", "e": "If you remember, four years have passed since the 2022 White Paper Movement. Of the bloggers who were with me at the time, there probably aren't many who are still “dissidents” today.", "d": 9, "r": "白纸", "z": 3.07, "n": 32}, {"t": "", "p": "", "o": "0083 | 所以我们觉得这个情况好像在发生变化，我们也意识到，很多事情好像不仅仅需要让中国人知道中国在发生什么，我们也需要让外国人直到在发生什么。", "e": "So we felt that the situation seemed to be changing. We also realized that it wasn't enough simply to let Chinese people know what was happening in China; we also needed to let people in other countries know.", "d": 9, "r": "发生变化", "z": 3.16, "n": 34}, {"t": "", "p": "", "o": "0084 | 所以我们现在一个很重要的工作是定期去世界各地和各地的智库、机构以及政府交流，去告诉他们中国正在发生什么，帮助他们去做对中国的认识等等。", "e": "So one important part of our work now is to regularly visit different parts of the world and meet with local think tanks, organizations, and governments to tell them what's happening in China and help them develop a better understanding of the country.", "d": 8, "r": "智库", "z": 3.89, "n": 36}, {"t": "", "p": "", "o": "0085 | 袁莉：为什么这个重要呢？", "e": "Yuan Li: Why is that important?", "d": 2, "r": "重要", "z": 5.75, "n": 5}, {"t": "", "p": "", "o": "0086 | 李老师：因为我们在网上已经做的足够大了。", "e": "Teacher Li: Because we've already built a sufficiently large presence online.", "d": 4, "r": "足够", "z": 4.87, "n": 11}, {"t": "", "p": "", "o": "0087 | 袁莉：为什么他们了解是重要的呢？", "e": "Yuan Li: Why is it important for them to understand?", "d": 3, "r": "了解", "z": 5.44, "n": 8}, {"t": "", "p": "", "o": "0088 | 李老师：在我的感受当中，很多人从事对于中国的工作，但实际上他们对中国的了解不是那么多。", "e": "Teacher Li: In my experience, many people work on China-related issues, but in reality they don't know that much about China.", "d": 6, "r": "当中", "z": 4.85, "n": 23}, {"t": "", "p": "", "o": "0089 | 袁莉：对，“中国人”。", "e": "Yuan Li: Right—about the Chinese people.", "d": 2, "r": "对", "z": 6.63, "n": 4}, {"t": "", "p": "", "o": "0090 | 李老师：对，我觉得他们对于“中国”很了解，就是“中国很好”、“很厉害”、“他们的机器人会翻跟头”、“经济增长值很高”、“他们一直在变得特别特别好”。", "e": "Teacher Li: Right. I think they know a lot about “China” in the sense that “China is great,” “China is powerful,” “its robots can do backflips,” “its economic growth is very high,” and “it's getting better and better.”", "d": 9, "r": "翻跟头", "z": 2.4, "n": 32}, {"t": "", "p": "", "o": "0091 | 他们接触的英文媒体上看到很多人去了中国，中国东西便宜，高楼大厦又多。", "e": "They see a lot in English-language media about people visiting China, how cheap things are there, and how many skyscrapers there are.", "d": 5, "r": "便宜", "z": 4.57, "n": 18}, {"t": "", "p": "", "o": "0092 | 但是普通中国人的生活是什么样？", "e": "But what is life like for ordinary Chinese people?", "d": 3, "r": "什么样", "z": 4.67, "n": 8}, {"t": "", "p": "", "o": "0093 | 对于这些人来说，他们实际上是不知道的。", "e": "These people actually don't know.", "d": 3, "r": "实际上", "z": 4.92, "n": 10}, {"t": "", "p": "", "o": "0094 | 他们并不知道这些高楼大厦、这些会翻跟头的机器人、这些电动车背后的代价是什么，他并不知道。", "e": "They don't know the price paid for those skyscrapers, those robots that do backflips, and those electric vehicles. They have no idea.", "d": 7, "r": "翻跟头", "z": 2.4, "n": 18}, {"t": "", "p": "", "o": "0095 | 他并不知道一个普通的比亚迪的工人一个月才拿多少钱薪水。", "e": "They don't know how little an ordinary BYD factory worker earns in a month.", "d": 5, "r": "并不知道", "z": 3.63, "n": 14}, {"t": "", "p": "", "o": "0096 | 所以这也是我们希望他们知道的一些事情。", "e": "So these are some of the things we want them to know.", "d": 3, "r": "事情", "z": 5.48, "n": 11}, {"t": "", "p": "", "o": "0097 | 袁莉：大家可以看我以前和李老师做过几期播客，我们讲他在意大利受到了怎样的跨国镇压。", "e": "Yuan Li: You can listen to the several episodes I previously did with Teacher Li, where we discussed the kind of transnational repression he experienced in Italy.", "d": 7, "r": "播客", "z": 3.12, "n": 23}, {"t": "", "p": "", "o": "0098 | 你现在叫自己什么“跨国镇压博物馆”，是吧？", "e": "Now you call yourself the “Transnational Repression Museum,” right?", "d": 4, "r": "跨国", "z": 4.13, "n": 10}, {"t": "", "p": "", "o": "0099 | 就是所有能经历的都经历了。", "e": "You've experienced just about everything there is to experience.", "d": 3, "r": "经历", "z": 5.17, "n": 8}, {"t": "", "p": "", "o": "0100 | 你曾经生活在极端的恐惧之中。", "e": "You used to live in a state of extreme fear.", "d": 3, "r": "极端", "z": 4.62, "n": 8}, {"t": "", "p": "", "o": "0101 | 我记得24年跟你可能是第一次聊天的时候，你说你可能一个星期都不出自己的楼，每天就是叫麦当劳吃。", "e": "I remember when we first spoke, probably in 2024, you said you might go a whole week without leaving your apartment building, just ordering McDonald's every day.", "d": 8, "r": "麦当劳", "z": 3.99, "n": 27}, {"t": "", "p": "", "o": "0102 | 那你为什么现在决定出来？", "e": "So why have you now decided to come out?", "d": 2, "r": "出来", "z": 5.68, "n": 6}, {"t": "", "p": "", "o": "0103 | 还要公开露面。", "e": "And to appear in public.", "d": 3, "r": "露面", "z": 3.75, "n": 3}, {"t": "", "p": "", "o": "0104 | 次我在纽时写你，要给你拍照，你那会儿还没有想好，那也就是半年前。", "e": "When I wrote about you for The New York Times and wanted to photograph you, you hadn't made up your mind yet. That was only about six months ago.", "d": 7, "r": "半年前", "z": 3.24, "n": 21}, {"t": "", "p": "", "o": "0105 | 到现在这几个月又发生了什么？", "e": "What has happened over these past few months?", "d": 3, "r": "几个", "z": 5.36, "n": 9}, {"t": "", "p": "", "o": "0106 | 你为什么不怕了呢？", "e": "Why aren't you afraid anymore?", "d": 3, "r": "不怕", "z": 4.33, "n": 5}, {"t": "", "p": "", "o": "0107 | 李老师：其实这个话题挺得罪人的。", "e": "Teacher Li: This topic could actually offend some people.", "d": 4, "r": "得罪人", "z": 2.94, "n": 7}, {"t": "", "p": "", "o": "0108 | 因为就在一个月之前，我还在拒绝别人给我拍照什么的。", "e": "Because just one month ago, I was still refusing to let people take my picture and things like that.", "d": 5, "r": "拍照", "z": 4.31, "n": 15}, {"t": "", "p": "", "o": "0109 | 其实说真话，我确实是因为不明白节。", "e": "To tell the truth, it's really because of the Un-Breaking Festival.", "d": 4, "r": "真话", "z": 3.8, "n": 9}, {"t": "", "p": "", "o": "0110 | （现场热烈鼓掌）", "e": "(Enthusiastic applause)", "d": 3, "r": "热烈鼓掌", "z": 2.73, "n": 2}, {"t": "", "p": "", "o": "0111 | 袁莉：好荣幸啊。", "e": "Yuan Li: I'm so honored.", "d": 2, "r": "啊", "z": 5.92, "n": 4}, {"t": "", "p": "", "o": "0112 | 李老师：对，因为作为不明白节的一个老听众嘛，袁莉姐跟我说今年不准备办了，我觉得这其实是一个很遗憾的事情。", "e": "Teacher Li: Right. As a longtime listener of the Un-Breaking podcast, when Sister Yuan Li told me privately that she wasn't planning to hold it this year, I thought that would be a real shame.", "d": 8, "r": "听众", "z": 4.1, "n": 31}, {"t": "", "p": "", "o": "0113 | 因为我私下接触很多的国内的记者、媒体等等等等，很多人润出来之后，他们没有办法继续从事之前的工作，可能要去打工，要去做体力劳动，要去当厨师、开饭馆等等等等。", "e": "Because I have contact privately with many journalists and media workers from inside China. After many of them flee the country, they can't continue doing the work they used to do. They may have to take laboring jobs, do physical work, become cooks, or open restaurants, and so on.", "d": 9, "r": "人润", "z": 2.99, "n": 38}, {"t": "", "p": "", "o": "0114 | 那他们过去十几二十年的记者从业经验就完全没有办法去继续做了。", "e": "That means they can no longer make use of the ten or twenty years of journalistic experience they've accumulated.", "d": 7, "r": "十几二十年", "z": 2.26, "n": 16}, {"t": "", "p": "", "o": "0115 | 我觉得这是非常可惜的事情。", "e": "I think that's a great loss.", "d": 3, "r": "可惜", "z": 4.71, "n": 8}, {"t": "", "p": "", "o": "0116 | 有不明白节这个平台可以每年有一期这样的活动，我觉得很重要。", "e": "I think it's very important to have a platform like the Un-Breaking Festival that can hold an event like this every year.", "d": 6, "r": "一期", "z": 4.09, "n": 17}, {"t": "", "p": "", "o": "0117 | 所以我觉得我应该支持一下，但是其他的我也支持不了，所以我只能出卖一下色相了。", "e": "So I felt I should show my support. I couldn't offer much else, so I could only sell a little of my good looks.", "d": 7, "r": "色相", "z": 3.61, "n": 21}, {"t": "", "p": "", "o": "0118 | （现场笑）", "e": "(Laughter)", "d": 2, "r": "笑", "z": 5.2, "n": 2}, {"t": "", "p": "", "o": "0119 | 袁莉：是（出卖）你的安全好吗？", "e": "Yuan Li: You mean putting your safety on the line?", "d": 3, "r": "出卖", "z": 4.29, "n": 8}, {"t": "", "p": "", "o": "0120 | 李老师：其实从另外一点来说，因为我其实算是一个被跨国镇压非常非常多的人，最近我们看得到中共对海外的跨国镇压变得越来越严重，甚至在一些地方出现打人，或者开车撞人这样一些行为。", "e": "Teacher Li: There's another aspect to it. I've experienced a great deal of transnational repression. Recently, we've seen the CCP's transnational repression overseas becoming increasingly severe. In some places, there have even been assaults and people being hit by cars.", "d": 9, "r": "打人", "z": 3.68, "n": 45}, {"t": "", "p": "", "o": "0121 | 我觉得在这样的时候，我能够站出来露面，可能也会给他们一些信心。", "e": "I think that at a time like this, my being willing to step forward and appear in public may give other people some confidence.", "d": 6, "r": "露面", "z": 3.75, "n": 18}, {"t": "", "p": "", "o": "0122 | 我是这样觉得。", "e": "That's how I see it.", "d": 2, "r": "觉得", "z": 5.75, "n": 4}, {"t": "", "p": "", "o": "0123 | （现场鼓掌）", "e": "(Applause)", "d": 3, "r": "鼓掌", "z": 3.83, "n": 2}, {"t": "", "p": "", "o": "0124 | 袁莉：赞。", "e": "Yuan Li: That's great.", "d": 2, "r": "赞", "z": 4.53, "n": 2}, {"t": "", "p": "", "o": "0125 | 你跟我说过，你做了你们认为的最坏的打算。", "e": "You told me that you had made what you considered the worst-case preparations.", "d": 5, "r": "坏", "z": 4.93, "n": 15}, {"t": "", "p": "", "o": "0126 | 李老师：今天吗？", "e": "Teacher Li: Today?", "d": 2, "r": "今天", "z": 5.65, "n": 3}, {"t": "", "p": "", "o": "0127 | 袁莉：不是今天，不是今天。", "e": "Yuan Li: No, not today.", "d": 2, "r": "今天", "z": 5.65, "n": 5}, {"t": "", "p": "", "o": "0128 | 当时我问你，你的生命会怎么怎样，你说“我做了最坏的打算。” 你怎么能做到带着这种打算去正常的做事、生活？", "e": "When I asked you at the time what might happen to your life, you said, “I've prepared for the worst.” How can you go about working and living normally with that kind of expectation?", "d": 8, "r": "做事", "z": 4.2, "n": 32}, {"t": "", "p": "", "o": "0129 | 李老师：我觉得恰恰是有这种打算，反而才能更好的去工作和生活。", "e": "Teacher Li: I think it's precisely by preparing for that possibility that I'm able to work and live better.", "d": 5, "r": "恰恰", "z": 4.02, "n": 16}, {"t": "", "p": "", "o": "0130 | 过去，实际上我一直处在一种恐惧当中，那是因为我不知道自己会面对什么。", "e": "In the past, I was constantly afraid because I didn't know what I might have to face.", "d": 6, "r": "处在", "z": 4.1, "n": 17}, {"t": "", "p": "", "o": "0131 | 比如说在白纸运动的时候，实际上我是非常恐惧的。", "e": "For example, during the White Paper Movement, I was actually terrified.", "d": 5, "r": "白纸", "z": 3.07, "n": 12}, {"t": "", "p": "", "o": "0132 | 这种恐惧是什么呢？", "e": "What was that fear?", "d": 3, "r": "恐惧", "z": 4.65, "n": 5}, {"t": "", "p": "", "o": "0133 | 后来我想了。", "e": "I thought about it later.", "d": 2, "r": "后来", "z": 5.3, "n": 4}, {"t": "", "p": "", "o": "0134 | 这种恐惧其实是我从小被灌输的概念，就是你不能说任何话，你不能做任何出格的事情，不然的话警察会立刻的找到你，警察会立刻发现你等等等等。", "e": "It was really an idea instilled in me from childhood: you mustn't say anything, you mustn't do anything out of line, or the police will immediately come looking for you, the police will immediately find out, and so on.", "d": 9, "r": "出格", "z": 3.07, "n": 36}, {"t": "", "p": "", "o": "0135 | 所以在白纸运动时，我那三天每天都会非常非常的亢奋和紧张，我总是觉得自己发完这个帖子，警察就会直接上门把我抓走。", "e": "So during those three days of the White Paper Movement, I was extremely worked up and nervous every day. I always thought that as soon as I posted something, the police would come straight to my door and arrest me.", "d": 10, "r": "亢奋", "z": 1.21, "n": 33}, {"t": "", "p": "", "o": "0136 | 袁莉：虽然你在意大利、在米兰。", "e": "Yuan Li: Even though you were in Italy, in Milan.", "d": 2, "r": "虽然", "z": 5.66, "n": 7}, {"t": "", "p": "", "o": "0137 | 李老师：对，但这些并没有发生。", "e": "Teacher Li: Right, but none of that happened.", "d": 2, "r": "发生", "z": 5.83, "n": 7}, {"t": "", "p": "", "o": "0138 | 所以我其实每天都很恐惧，我觉得：“哎呀我应该怎么办？”。", "e": "So I was afraid every day, thinking, “Oh no, what should I do?”", "d": 5, "r": "哎呀", "z": 3.76, "n": 13}, {"t": "", "p": "", "o": "0139 | 但后来过了白纸运动之后，我反而不那么恐惧了。", "e": "But after the White Paper Movement ended, I actually became less afraid.", "d": 5, "r": "白纸", "z": 3.07, "n": 13}, {"t": "", "p": "", "o": "0140 | 第一方面是我发现原来没有那么神通广大。", "e": "First, I discovered that they weren't nearly as omnipotent as I had imagined.", "d": 3, "r": "原来", "z": 5.22, "n": 9}, {"t": "", "p": "", "o": "0141 | 另外一方面我发现好像很多东西是我自己在害怕。", "e": "On the other hand, I realized that a lot of the fear was coming from within me.", "d": 4, "r": "一方面", "z": 4.48, "n": 12}, {"t": "", "p": "", "o": "0142 | 所以慢慢的，我觉得我的勇气是一点一点起来的。", "e": "So gradually, I felt my courage growing little by little.", "d": 5, "r": "一点一点", "z": 3.34, "n": 12}, {"t": "", "p": "", "o": "0143 | 但是后来到了2024年年底，我在意大利的房子终于被他们找到了。", "e": "But then, at the end of 2024, they finally found my home in Italy.", "d": 5, "r": "年底", "z": 4.76, "n": 16}, {"t": "", "p": "", "o": "0144 | 在那之前，我大概逃了有差不多一年多的时间。", "e": "Before that, I had spent roughly a year or more on the run.", "d": 4, "r": "逃", "z": 4.61, "n": 13}, {"t": "", "p": "", "o": "0145 | 在这段时间里，我感觉自己可能暴露了行踪，我就会搬家。", "e": "During that period, whenever I felt my whereabouts might have been exposed, I would move.", "d": 6, "r": "行踪", "z": 3.48, "n": 15}, {"t": "", "p": "", "o": "0146 | 一年多之后，我觉得他们应该找不到了，可以松口气了，结果过了一周他们就找到了这里。", "e": "After more than a year, I thought they probably wouldn't find me and that I could finally relax. But just one week later, they found the place.", "d": 7, "r": "松口气", "z": 2.86, "n": 22}, {"t": "", "p": "", "o": "0147 | 找到之后，实际上我过了非常惊心动魄的一个月。", "e": "After they found it, I went through an extremely nerve-racking month.", "d": 5, "r": "惊心动魄", "z": 3.14, "n": 10}, {"t": "", "p": "", "o": "0148 | 那一个月里，在米兰的“徐某人”带着我一起到处搬家。", "e": "During that month, “Mr. Xu” in Milan took me from place to place, moving house with me.", "d": 5, "r": "搬家", "z": 4.0, "n": 14}, {"t": "", "p": "", "o": "0149 | 我们带着我的两只猫，像逃亡一样到处搬。", "e": "We took my two cats and moved around like fugitives.", "d": 5, "r": "逃亡", "z": 3.97, "n": 12}, {"t": "", "p": "", "o": "0150 | 最后我觉得太累了，我说我要回去，然后我就回到家里等他们来，然后也确实等到他们了。", "e": "In the end, I was so exhausted that I said I wanted to go back. So I returned home and waited for them to come—and, sure enough, they did.", "d": 7, "r": "等到", "z": 4.44, "n": 25}, {"t": "", "p": "", "o": "0151 | 有一天我正在床上刷手机，突然看到我门铃的警报响了。", "e": "One day, I was lying in bed scrolling on my phone when I suddenly saw the alert from my doorbell camera go off.", "d": 6, "r": "门铃", "z": 3.02, "n": 15}, {"t": "", "p": "", "o": "0152 | 我在我的门铃上装了一个摄像头。", "e": "I had installed a camera in my doorbell.", "d": 5, "r": "门铃", "z": 3.02, "n": 9}, {"t": "", "p": "", "o": "0153 | 两个意大利人——后来我知道他们是黑手党——就在我的门前，看着我的门，然后指指点点。", "e": "Two Italians—later I learned they were members of the Mafia—were standing outside my door, looking at it and pointing at things.", "d": 7, "r": "指指点点", "z": 3.09, "n": 19}, {"t": "", "p": "", "o": "0154 | 当时我想：“哦，完了，他们终于过来了。”当时徐某人给了我一把打钢珠的那种气枪——我先说一下，这是合法的——当时他给我的时候我还不想要，我说我肯定用不到这个东西。", "e": "At the time I thought, “Oh, that's it. They've finally come.” Mr. Xu had given me an air gun that shoots steel BBs. Let me make clear first that it was legal. When he gave it to me, I hadn't wanted it. I said I was sure I'd never need it.", "d": 9, "r": "钢珠", "z": 2.62, "n": 48}, {"t": "", "p": "", "o": "0155 | 他说没关系，你留着备用。", "e": "He said, “That's fine. Just keep it as a precaution.”", "d": 4, "r": "备用", "z": 3.87, "n": 7}, {"t": "", "p": "", "o": "0156 | 所以我当时的第一反应，就拿着枪堵在门口，然后我在想：“完了，他们终于要来了。”", "e": "So my first reaction was to grab the gun and stand guard at the door. I thought, “That's it. They're finally coming for me.”", "d": 7, "r": "堵", "z": 4.04, "n": 23}, {"t": "", "p": "", "o": "0157 | 我当时感觉那很短的一分钟里，我的人生好像已经过了一遍。", "e": "In that very brief minute, I felt as though my entire life flashed before my eyes.", "d": 5, "r": "一分钟", "z": 4.31, "n": 17}, {"t": "", "p": "", "o": "0158 | 我在回忆我的人生，我的人生怎么样怎么样，对，那一刻我真的觉得自己的恐惧到了很高的一个点。", "e": "I was looking back over my life, thinking about what it had been like, and so on. Yes, at that moment I truly felt my fear reach an extremely high point.", "d": 7, "r": "那一刻", "z": 3.77, "n": 24}, {"t": "", "p": "", "o": "0159 | 我觉得我可能接下来我就要死掉了。", "e": "I thought I might be about to die.", "d": 4, "r": "要死", "z": 4.0, "n": 10}, {"t": "", "p": "", "o": "0160 | 但是那两个人就开始掏东西，掏东西的时候我就很紧张，然后我就在想我要怎么死的帅一点。", "e": "But those two men started taking things out. When they began pulling things out, I got very nervous and started thinking about how I could die in a cool-looking way.", "d": 8, "r": "掏", "z": 3.57, "n": 28}, {"t": "", "p": "", "o": "0161 | 但最后什么都没有发生。", "e": "But in the end, nothing happened.", "d": 2, "r": "最后", "z": 5.64, "n": 6}, {"t": "", "p": "", "o": "0162 | 那两个人掏出了一个喷漆，然后开始在我门上喷，喷了什么呢？", "e": "The two men took out a spray-paint can and started spraying my door. What did they spray?", "d": 6, "r": "喷漆", "z": 3.31, "n": 17}, {"t": "", "p": "", "o": "0163 | 就喷了意大利语的“强奸”两个字。", "e": "They sprayed the Italian word for “rape.”", "d": 4, "r": "喷", "z": 4.23, "n": 8}, {"t": "", "p": "", "o": "0164 | 喷完他们就走了。", "e": "Then they left.", "d": 4, "r": "喷完", "z": 3.18, "n": 5}, {"t": "", "p": "", "o": "0165 | 所以我当时是愣在那里，我说这是干什么？", "e": "So I just stood there, stunned, thinking, what was that supposed to be?", "d": 5, "r": "愣", "z": 3.64, "n": 12}, {"t": "", "p": "", "o": "0166 | 好像觉得我的咖位是不是还不够啊？", "e": "I almost wondered whether I wasn't important enough for them to do more.", "d": 5, "r": "咖位", "z": 2.68, "n": 9}, {"t": "", "p": "", "o": "0167 | 但是从那个事情之后，我就不太恐惧了。", "e": "But after that incident, I wasn't very afraid anymore.", "d": 4, "r": "恐惧", "z": 4.65, "n": 11}, {"t": "", "p": "", "o": "0168 | 因为我意识到他们对我做的很多很多的事情，甚至包括他们在国内找我的父母，找我所有的微信上的好友，甚至找我在国内的关注者。", "e": "Because I realized that after all the things they'd done to me—including looking for my parents in China, contacting all my WeChat friends, and even contacting people in China who followed me—they seemed not to dare do anything when they actually found me.", "d": 9, "r": "很多很多", "z": 3.35, "n": 37}, {"t": "", "p": "", "o": "0169 | 但是他们真找到我的时候，他们好像又不敢做什么，所以从那个时候我就胆子越来越大了。", "e": "So from that point on, I became bolder and bolder.", "d": 7, "r": "胆子", "z": 3.69, "n": 23}, {"t": "", "p": "", "o": "0170 | 袁莉：对，厉害哦。", "e": "Yuan Li: Right. That's impressive.", "d": 2, "r": "厉害", "z": 4.78, "n": 4}, {"t": "", "p": "", "o": "0171 | 我记得还有一个细节，你说你一直都在想，如果他们来的时候，找到你门上的时候，你一定要打开直播，让向全世界广播。", "e": "I remember another detail: you said that if they came and reached your door, you would definitely start a livestream and broadcast it to the whole world.", "d": 9, "r": "门上", "z": 3.45, "n": 31}, {"t": "", "p": "", "o": "0172 | 但是当时你太紧张了， 都忘了打开了，所以这也是一个遗憾。", "e": "But at the time you were so nervous that you forgot to start it. So that's another regret.", "d": 5, "r": "太紧张", "z": 3.86, "n": 16}, {"t": "", "p": "", "o": "0173 | 下面我们来聊一聊你收件箱里看到的中国。", "e": "Now let's talk about the China you see in your inbox.", "d": 6, "r": "收件箱", "z": 2.0, "n": 11}, {"t": "", "p": "", "o": "0174 | 你能不能先跟给我们说一下，你的推特、你的X的收件箱扮演了一个什么样的角色，你这个收件箱里面都会有多少，大家都会发你什么样的东西？", "e": "Could you first explain what role your Twitter—your X— inbox plays? How much comes into it, and what kinds of things do people send you?", "d": 10, "r": "收件箱", "z": 2.0, "n": 39}, {"t": "", "p": "", "o": "0175 | 李老师：在座的还有人不知道吗？", "e": "Teacher Li: Are there still people here who don't know?", "d": 4, "r": "在座", "z": 3.52, "n": 8}, {"t": "", "p": "", "o": "0176 | 袁莉：也不见得呀，我都很好奇，虽然我那么了解你每天发的东西。", "e": "Yuan Li: Not necessarily. I'm curious too, even though I know so much about what you post every day.", "d": 6, "r": "不见得", "z": 3.61, "n": 17}, {"t": "", "p": "", "o": "0177 | 李老师：实际上，我觉得我们这个账号比较特殊一点是国内的很多很多、各行各业的人都会给我们投稿。", "e": "Teacher Li: Actually, one thing that makes our account rather unusual is that people from all kinds of professions and walks of life inside China send us submissions.", "d": 7, "r": "很多很多", "z": 3.35, "n": 22}, {"t": "", "p": "", "o": "0178 | 这里边的人是什么人都有，从普通的高中生、初中生，到外卖员、工地的工人，甚至是体制内的事业编，医生啊，教师啊，都会包括。", "e": "They include all sorts of people, from ordinary high school and middle school students to food-delivery workers, construction workers, and even public-sector employees, doctors, and teachers.", "d": 9, "r": "外卖", "z": 3.66, "n": 34}, {"t": "", "p": "", "o": "0179 | 国安，还有解放军，他们也都会给我们投稿。", "e": "People from state security and the People's Liberation Army send us submissions too.", "d": 4, "r": "投稿", "z": 3.75, "n": 10}, {"t": "", "p": "", "o": "0180 | 我觉得这是一个很意外，或者说让我觉得这个工作很有意思的一点就是每天打开这个私信箱，你会看到中国的方方面面。", "e": "I think this is something quite unexpected, and one of the things that makes this work so interesting to me: every day, when you open the direct-message inbox, you see every facet of China.", "d": 9, "r": "方方面面", "z": 3.32, "n": 29}, {"t": "", "p": "", "o": "0181 | 我觉得这个体验是很难和大家形容的。", "e": "I find this experience very hard to describe to people.", "d": 4, "r": "形容", "z": 4.47, "n": 11}, {"t": "", "p": "", "o": "0182 | 但是你会觉得，哇，原来中国是这个样子。", "e": "But you find yourself thinking, wow, so this is what China is really like.", "d": 4, "r": "哇", "z": 4.62, "n": 10}, {"t": "", "p": "", "o": "0183 | 所以我觉得里面有一些比较奇怪的，比如说一些外卖员在路上看到什么执法事件，或者不公平的事件，他们会拍给我们。", "e": "So there are some rather unusual things in there. For example, delivery workers may see law-enforcement incidents or injustices while out on the road, and they'll film them and send them to us.", "d": 8, "r": "外卖", "z": 3.66, "n": 29}, {"t": "", "p": "", "o": "0184 | 比如我们也会看到一些公务员跟我们说：“哎，你知不知道我们已经几个月没有薪水了，已经很久没有发出绩效了。”还有人跟我们说：“哎，你知不知道我们是事业编，是编外的人员，我们这个医院已经很久没有发出薪水了，但是编内的医生在朋友圈里吐槽，说，就是因为你们这些编外的人太多了，所以导致我们发不了工资。", "e": "We also hear from civil servants who say, “Hey, did you know we haven't been paid for several months? Our performance bonuses haven't been issued for ages.” Others tell us, “Hey, did you know we're public-institution employees, but we're not on the official staff establishment? Our hospital hasn't paid us in a long time, while doctors who are on the official payroll complain on their WeChat Moments that it's because there are too many people like us who aren't on the official establishment that they can't get paid. They say it would all be fine if you just fired us.” Things like that.", "d": 9, "r": "知不知道", "z": 3.42, "n": 77}, {"t": "", "p": "", "o": "0185 | 如果把你们开除都就好了。”类似这样的东西。", "e": "We've also received submissions from state security personnel.", "d": 4, "r": "开除", "z": 4.35, "n": 12}, {"t": "", "p": "", "o": "0186 | 我们也有收到国安的投稿。", "e": "For example, they send us material that the Cyberspace Administration has forwarded to them and instructed them to handle.", "d": 4, "r": "投稿", "z": 3.75, "n": 7}, {"t": "", "p": "", "o": "0187 | 比如说他们会给我们发一些网信办发过来、让他们处理的东西。", "e": "Content moderators tell us about these things.", "d": 6, "r": "网信", "z": 3.09, "n": 15}, {"t": "", "p": "", "o": "0188 | 那些审核员会跟我们说这些东西。", "e": "For example, they'll receive a notice suddenly telling them to block a clip from one of Chai Jing's videos across the entire internet.", "d": 4, "r": "审核员", "z": 3.3, "n": 8}, {"t": "", "p": "", "o": "0189 | 比如说他们收到一个消息，突然要让他们去封禁柴静的一条视频的片段，要全网封禁。", "e": "But that video might already be several months old.", "d": 7, "r": "封禁", "z": 3.09, "n": 20}, {"t": "", "p": "", "o": "0190 | 但是那个视频可能已经是几个月之前的了。", "e": "Something like the Mbappé incident happened this time: for some reason, material from several months earlier suddenly gets dug up and they are told to block all of it.", "d": 3, "r": "几个", "z": 5.36, "n": 11}, {"t": "", "p": "", "o": "0191 | 像这一次这个姆巴佩的事情，不知道为什么，几个月前东西突然被翻出来，然后要全部封禁。", "e": "State security personnel have also told us that they held a meeting specifically to discuss me. They took photos during the meeting and sent them to us, saying, “We're discussing your issues today.”", "d": 7, "r": "封禁", "z": 3.09, "n": 22}, {"t": "", "p": "", "o": "0192 | 还有比如国安说，他们在开会专门讨论我的问题，然后他们就在后面拍照发给我们，说我们今天在讨论你们的问题。", "e": "(Laughter)", "d": 8, "r": "发给", "z": 4.01, "n": 28}, {"t": "", "p": "", "o": "0193 | （现场笑）", "e": "I think the range of things we see is incredibly rich.", "d": 2, "r": "笑", "z": 5.2, "n": 2}, {"t": "", "p": "", "o": "0194 | 我觉得方方面面非常的丰富。", "e": "Even members of the People's Liberation Army send us private messages saying that they're actually very short of supplies.", "d": 4, "r": "方方面面", "z": 3.32, "n": 6}, {"t": "", "p": "", "o": "0195 | 甚至解放军也会跟我们私信说：我们实际上很缺物资。", "e": "They have to compete to claim their supplies through a mini-program, and often they can't get them.", "d": 5, "r": "私信", "z": 3.58, "n": 13}, {"t": "", "p": "", "o": "0196 | 我们要在一个小程序上抢我们的物资，然后还经常抢不到。", "e": "They think this is a serious problem.", "d": 5, "r": "物资", "z": 4.58, "n": 16}, {"t": "", "p": "", "o": "0197 | 他们觉得这个问题很严重。", "e": "Others say, “We're studying at a military academy, but the things we learn are either very outdated, like something from a video game in the 2000s, or highly advanced things that we don't understand. But in the end, we graduate anyway,” and so on.", "d": 2, "r": "严重", "z": 5.41, "n": 6}, {"t": "", "p": "", "o": "0198 | 还有人说：我们在军校里学习，但是感觉军校里学的东西要么就是很落后，像两千年代的电子游戏一样的东西，要么就是很高精尖的东西，我们又不懂，但最后我们也毕业了等等等等。", "e": "When Li Keqiang died, some civil servants also told us that they felt they had let everyone down.", "d": 9, "r": "等等等等", "z": 3.68, "n": 43}, {"t": "", "p": "", "o": "0199 | 包括李克强去世的时候，也有这些公务员跟我们说他们觉得很对不起大家。", "e": "They felt they hadn't made society better.", "d": 5, "r": "去世", "z": 4.51, "n": 17}, {"t": "", "p": "", "o": "0200 | 他们觉得自己没有让这个社会变得更好。", "e": "They had once wanted to join the civil service because they hoped to make the country and society better. But unfortunately, they couldn't do it; they were constrained by too many limitations.", "d": 3, "r": "更好", "z": 4.96, "n": 9}, {"t": "", "p": "", "o": "0201 | 他们曾经想要进入公务员这个群体，是希望想让这个国家变得更好，让这个社会变得更好，但是很遗憾他们做不到，自己限制太多了。", "e": "If that person is listening today, I hope I've helped convey your message to everyone here.", "d": 8, "r": "公务员", "z": 4.53, "n": 31}, {"t": "", "p": "", "o": "0202 | 如果这位朋友在听的话，我希望今天我有帮你把这个话给大家带到。", "e": "(Applause)", "d": 6, "r": "带到", "z": 4.25, "n": 19}, {"t": "", "p": "", "o": "0203 | （现场鼓掌）", "e": "Yuan Li: What have been the biggest trends in the submissions you and your team have received in 2026?", "d": 3, "r": "鼓掌", "z": 3.83, "n": 2}, {"t": "", "p": "", "o": "0204 | 袁莉：26年，你和你的团队收到的投稿最大的趋势是什么？", "e": "Give us a brief picture of what China is like now.", "d": 5, "r": "投稿", "z": 3.75, "n": 15}, {"t": "", "p": "", "o": "0205 | 给我们大家brief一下中国现在是怎么样？", "e": "Teacher Li: I think there are two aspects. On the one hand, people's mood inside China is changing. It's a bit like China in 2022.", "d": 3, "r": "怎么样", "z": 5.32, "n": 8}, {"t": "", "p": "", "o": "0206 | 李老师：我觉得两个方面，一方面是中国国内的人，他们的情绪正在变得不太一样，有点像是2022年的中国。", "e": "Perhaps in 2022, if we saw a comment criticizing the government or a leader being posted, everyone would say, “Wow, how can this person be so impressive, so brave? They actually dared to post something like that.” But by 2026, we find that this kind of thing has become commonplace.", "d": 7, "r": "一方面", "z": 4.48, "n": 24}, {"t": "", "p": "", "o": "0207 | 可能在2022年的时候，如果我们当时看到一条批评政府，或者批评领导人的评论被发出来，大家都会觉得：“哇，这个人怎么这么厉害，这么勇敢，他居然会去发这样的东西。”但是到了2026年，我们发现，哇，这些东西已经是习以为常的。", "e": "You open Douyin or Xiaohongshu, and it's full of things like that.", "d": 9, "r": "习以为常", "z": 3.44, "n": 52}, {"t": "", "p": "", "o": "0208 | 你打开抖音、打开小红书，全是这样的东西。", "e": "I think everyone has probably seen Threads. In fact, people are expressing an enormous amount on Threads.", "d": 4, "r": "抖", "z": 3.74, "n": 11}, {"t": "", "p": "", "o": "0209 | 我觉得大家应该都有看Threads，实际上Threads上面大家表达的东西已经非常非常多了。", "e": "On the other hand, what are we seeing?", "d": 5, "r": "实际上", "z": 4.92, "n": 18}, {"t": "", "p": "", "o": "0210 | 另外一方面，我们看到的是什么呢？", "e": "The Chinese government doesn't seem to think these feelings are caused by economic problems or failures of governance that need to be corrected. Instead, it sees them as a security issue.", "d": 3, "r": "一方面", "z": 4.48, "n": 8}, {"t": "", "p": "", "o": "0211 | 对于中国政府，并不觉得这些情绪是因为经济出问题，或者是因为治理出问题，所以要改正，而是觉得这是一个安全问题。", "e": "For example, a few months ago the Ministry of State Security suddenly classified “lying flat” as the result of interference by foreign forces.", "d": 8, "r": "改正", "z": 3.88, "n": 26}, {"t": "", "p": "", "o": "0212 | 比如说国安部前几个月突然把“躺平”列为境外势力干预的结果。", "e": "Of course, I don't know whether it considers me one of those “foreign forces,” but we find the whole thing baffling.", "d": 6, "r": "躺平", "z": 3.37, "n": 15}, {"t": "", "p": "", "o": "0213 | 当然我不知道他是不是说我是这个“境外势力”，但是我们是觉得这个东西很莫名其妙。", "e": "We've seen Xi Jinping say at many meetings, “We must dare to struggle and be willing to struggle.” He puts political security above the economy.", "d": 6, "r": "莫名其妙", "z": 3.73, "n": 20}, {"t": "", "p": "", "o": "0214 | 我们看到的是习近平在很多次的会上讲，“我们要敢于斗争，勇于斗争。”他把政治安全放在经济之上。", "e": "So what we're seeing is that, on the one hand, public discontent is growing, while on the other, the government is imposing even stricter controls.", "d": 7, "r": "敢于斗争", "z": 3.09, "n": 23}, {"t": "", "p": "", "o": "0215 | 所以我们看到的情况就是一方面大家的情绪在不满，但另外一方面，政府做了更加严格的管制。", "e": "For example, just like today, at this very moment, some of you have probably seen on Threads all the police in Shanghai's Julu Road area trying to stop people from celebrating Halloween.", "d": 6, "r": "一方面", "z": 4.48, "n": 22}, {"t": "", "p": "", "o": "0216 | 比如说就像今天，此时此刻，你们肯定有人在Threads上刷到很多很多的警察在上海的巨鹿路防止大家去过万圣节。", "e": "But we all know Halloween itself is just an ordinary holiday when people dress up in cosplay.", "d": 7, "r": "很多很多", "z": 3.35, "n": 22}, {"t": "", "p": "", "o": "0217 | 但我们都知道，万圣节本身只是一个普通的节日，大家Cosplay一下。", "e": "And yet they're now policing even Halloween. Recently, someone posted something in their WeChat Moments like, “I've gotten used to these uneventful days lately,” and then a chain reaction of account bans followed.", "d": 4, "r": "节日", "z": 4.48, "n": 13}, {"t": "", "p": "", "o": "0218 | 但就是他们现在连万圣节都在防，包括前段时间有人因为在朋友圈上发什么“习惯了近来平平淡淡的日子。”然后就被连锁的炸号。", "e": "It's an outrageous situation.", "d": 9, "r": "平平淡淡", "z": 1.96, "n": 29}, {"t": "", "p": "", "o": "0219 | 这个是很夸张的一个情况。", "e": "The last time a single post triggered mass account bans like this was when a rumor circulated online that a Chinese female celebrity had married a high-ranking official.", "d": 3, "r": "夸张", "z": 4.27, "n": 7}, {"t": "", "p": "", "o": "0220 | 上一次这样因为你发一个东西连锁账号，还是因为网传中国的一个女明星和一个高官结婚了。", "e": "It was just a rumor, but everyone who posted it had all the WeChat and Alipay accounts linked to their phone number collectively shut down.", "d": 7, "r": "女明星", "z": 3.28, "n": 22}, {"t": "", "p": "", "o": "0221 | 这只是一条谣言，但是所有发这个谣言的人，他们手机号关联的微信、支付宝全部都会集体炸号。", "e": "A few years ago, account purges happened over something like that. Today, simply posting a sentence like this can trigger mass account bans.", "d": 7, "r": "炸号", "z": 3.42, "n": 22}, {"t": "", "p": "", "o": "0222 | 几年前，炸号是那样的一个事情，今天只是发一段这样的话，然后就会被连锁炸号。", "e": "I think it's an extremely bizarre situation.", "d": 6, "r": "炸号", "z": 3.42, "n": 19}, {"t": "", "p": "", "o": "0223 | 我觉得这是一个非常莫名其妙的事情。", "e": "There's another point: the CCP's supervision and surveillance of society as a whole may actually be more extensive than people imagine.", "d": 4, "r": "莫名其妙", "z": 3.73, "n": 9}, {"t": "", "p": "", "o": "0224 | 我们觉得还有一个点，中共对于整个社会的监管监控，可能实际上是超过大家想象的。", "e": "In February this year, we posted a list that a civil servant in Chengdu had sent us.", "d": 5, "r": "监控", "z": 4.63, "n": 18}, {"t": "", "p": "", "o": "0225 | 我们在今年二月的时候发过一个帖子，是一个成都的公务员发给我们的一个名单。", "e": "The list showed what his daily life and work involved.", "d": 6, "r": "帖子", "z": 3.85, "n": 20}, {"t": "", "p": "", "o": "0226 | 这个名单上就是他每天的生活，每天的工作。", "e": "What was the job?", "d": 4, "r": "名单", "z": 4.85, "n": 11}, {"t": "", "p": "", "o": "0227 | 这个工作是什么呢？", "e": "Every day, he had to seek out the people on the list and talk with them to assess their mental state.", "d": 2, "r": "呢", "z": 5.76, "n": 5}, {"t": "", "p": "", "o": "0228 | 就是他需要每天去找去找这些名单上的人谈话，去确定他们的精神状态。", "e": "Besides Uyghurs and Tibetans—the groups we already know about—the list also included unemployed people, people whose businesses had failed, people suffering emotional setbacks, divorced people,", "d": 7, "r": "精神状态", "z": 3.05, "n": 19}, {"t": "", "p": "", "o": "0229 | 这些人除了维吾尔人、藏人这种我们知道的，还有失业的人、生意失败的人、情感受挫的人，离婚的人。", "e": "and even recent university graduates.", "d": 8, "r": "受挫", "z": 3.44, "n": 26}, {"t": "", "p": "", "o": "0230 | 甚至刚刚毕业的大学生都在这个名单上。", "e": "They had to visit the people on the list and check on them.", "d": 4, "r": "大学生", "z": 4.8, "n": 10}, {"t": "", "p": "", "o": "0231 | 他们要去找这些名单上的人，然后去关心他们。", "e": "They would ask, “Hey, how are you?", "d": 4, "r": "名单", "z": 4.85, "n": 13}, {"t": "", "p": "", "o": "0232 | 问：“哎，你怎么样啊？", "e": "Have you been feeling down lately?", "d": 3, "r": "哎", "z": 4.36, "n": 5}, {"t": "", "p": "", "o": "0233 | 你最近心情有没有不好啊？", "e": "Have you thought about taking revenge on society?” That last part is my own addition, but the actual intention is to keep these people under control. Some of them may not even know they're being monitored.", "d": 3, "r": "心情", "z": 4.69, "n": 6}, {"t": "", "p": "", "o": "0234 | 有没有想要报复社会啊？”后面这是我加的，但实际上他们的意思就是要管控这些人，甚至这些人自己可能都不知道自己被管控。", "e": "So I think society as a whole is becoming increasingly oppressive.", "d": 8, "r": "管控", "z": 3.88, "n": 32}, {"t": "", "p": "", "o": "0235 | 所以我觉得整个社会正在变得越来越压抑。", "e": "At the same time, public discontent is gradually increasing.", "d": 4, "r": "压抑", "z": 4.13, "n": 9}, {"t": "", "p": "", "o": "0236 | 但是呢，民众的不满正在慢慢的提高。", "e": "Yuan Li: You and your team sometimes also repost content from social media inside China and publish it on overseas platforms.", "d": 3, "r": "不满", "z": 4.71, "n": 9}, {"t": "", "p": "", "o": "0237 | 袁莉：你和你的团队现在有的时候也会从国内的社交媒体上搬运一些内容到外网来发布。", "e": "This has also generated some controversy.", "d": 7, "r": "搬运", "z": 3.82, "n": 25}, {"t": "", "p": "", "o": "0238 | 这也是有一些争议的。", "e": "I saw a comment on Threads saying, “Being reposted by Li Ying is no less ominous than being called up by the King of Hell.”", "d": 3, "r": "争议", "z": 4.84, "n": 7}, {"t": "", "p": "", "o": "0239 | 我在Threads上面看到有一个评论说：“被李颖搬运不亚于阎王点卯”。", "e": "Another comment said, “Being associated with Li Ying is worse than being associated with the Communist Party; at least with the latter, you can make money openly and legitimately.”", "d": 6, "r": "点卯", "z": 1.95, "n": 14}, {"t": "", "p": "", "o": "0240 | 还有个评论说“被李颖粘上还不如被共产党粘上，后者起码还能堂堂正正捞钱”。", "e": "What do you think of these comments?", "d": 8, "r": "堂堂正正", "z": 1.31, "n": 20}, {"t": "", "p": "", "o": "0241 | 你怎么看这些评论？", "e": "Do they cause you trouble?", "d": 2, "r": "评论", "z": 5.08, "n": 5}, {"t": "", "p": "", "o": "0242 | 这些对你造成困扰吗？", "e": "Perhaps you could first explain why you repost this material.", "d": 3, "r": "困扰", "z": 4.3, "n": 6}, {"t": "", "p": "", "o": "0243 | 你可能先说一下你们为什么要搬运。", "e": "Teacher Li: I think our account is no longer just an account that receives submissions.", "d": 4, "r": "搬运", "z": 3.82, "n": 9}, {"t": "", "p": "", "o": "0244 | 李老师：我觉得我们现在的账号也不仅仅是一个专门收投稿的账号。", "e": "We now also do a lot of collecting and publishing of domestic news.", "d": 6, "r": "投稿", "z": 3.75, "n": 16}, {"t": "", "p": "", "o": "0245 | 我们现在也会做很多国内新闻的采集和发布工作。", "e": "I think that's part of operating the account.", "d": 4, "r": "采集", "z": 4.17, "n": 12}, {"t": "", "p": "", "o": "0246 | 我觉得这是账号运营的一部分。", "e": "On the other hand, I think this kind of criticism is something I should accept, and I really, really understand people's fear—or their dissatisfaction.", "d": 3, "r": "账号", "z": 4.51, "n": 8}, {"t": "", "p": "", "o": "0247 | 另外一方面，我觉得其实这样的批评是我应该承受的，以及我认为我非常非常理解大家的恐惧，或者说是不满。", "e": "Because I think a very important reason the “Teacher Li Is Not Your Teacher” account has become what it is today is that we help people take on this part of the risk.", "d": 7, "r": "或者说", "z": 4.01, "n": 26}, {"t": "", "p": "", "o": "0248 | 因为我觉得“李老师不是你老师”这个账号之所以变成现在这个样子，很重要的一点就是我们帮助大家去承担这部分风险。", "e": "That may sound a little exaggerated, but to me it's very important: I put my own life on the line to help many, many people speak out and to repost accounts of their experiences. Those experiences are then seen by many people, or by the government, which may then have to address the problem, and so on.", "d": 8, "r": "这部分", "z": 3.7, "n": 26}, {"t": "", "p": "", "o": "0249 | 但这个说的可能有点夸张——但对我来说，我觉得这对我很重要——就是我用我的人生作为代价，帮很多很多的人去发声，帮很多很多人去转发他们的境遇，这些境遇发出来被很多很多人看见，或者被政府看见，然后政府要去解决等等。", "e": "So if one day this account is no longer important, and people start disliking it and saying, “Hey, stop speaking on my behalf,” I would actually see that as a good thing.", "d": 9, "r": "很多很多", "z": 3.35, "n": 58}, {"t": "", "p": "", "o": "0250 | 那对我来说，如果有一天这个账号不重要了，大家开始讨厌这个账号了，觉得：“哎，你不要再替我发言。”我反而觉得这是好事。", "e": "In my view, the less important the “Teacher Li” account becomes, the healthier society is.", "d": 8, "r": "哎", "z": 4.36, "n": 32}, {"t": "", "p": "", "o": "0251 | 在我看来，我觉得“李老师”这个账号它越来越不重要，这个社会才是健康的。", "e": "Because in a healthy society, everyone should be able to express themselves and speak out.", "d": 6, "r": "在我看来", "z": 3.74, "n": 16}, {"t": "", "p": "", "o": "0252 | 因为一个健康的社会，大家每个人都应该表达，每个人都应该可以发声。", "e": "There should be no need for an account overseas to speak for them and repost their content.", "d": 5, "r": "发声", "z": 4.33, "n": 17}, {"t": "", "p": "", "o": "0253 | 它不需要一个账号在海外帮他们发声，帮他们去搬运。", "e": "So I very, very much look forward to the day when suddenly nobody pays any attention to my account.", "d": 5, "r": "搬运", "z": 3.82, "n": 14}, {"t": "", "p": "", "o": "0254 | 所以我是非常非常的期待，有一天我这个账号突然就没有人理了。", "e": "(Applause)", "d": 6, "r": "人理", "z": 3.67, "n": 17}, {"t": "", "p": "", "o": "0255 | （掌声）", "e": "(Applause)", "d": 2, "r": "掌声", "z": 3.97, "n": 1}, {"t": "", "p": "", "o": "0256 | 李老师：谢谢。", "e": "Teacher Li: Thank you.", "d": 1, "r": "", "z": null, "n": 2}, {"t": "", "p": "", "o": "0257 | 袁莉：这周你在你的小号上写：“试想一下，如果我们这代人不做什么的话，三十年后的中国人会像今天怀念毛泽东一样怀念习近平。”然后你又补了一句，你说：“突然想到三十年后，习近平应该还在做总书记，不需要怀念。”我好奇，你写这两句话的时候是一个什么样的心理状态，是斗志昂扬还是悲从中来？", "e": "Yuan Li: This week, you wrote on your secondary account: “Imagine that if our generation does nothing, people in China thirty years from now will remember Xi Jinping the way people today remember Mao Zedong.” Then you added: “It suddenly occurred to me that thirty years from now, Xi Jinping will probably still be General Secretary, so there'll be no need to remember him.” I'm curious: what state of mind were you in when you wrote those two sentences? Were you full of fighting spirit, or overcome with sadness?", "d": 10, "r": "悲从中来", "z": 1.55, "n": 69}, {"t": "", "p": "", "o": "0258 | 李老师：当然是悲从中来。", "e": "Teacher Li: Of course I was overcome with sadness.", "d": 5, "r": "悲从中来", "z": 1.55, "n": 4}, {"t": "", "p": "", "o": "0259 | 我觉得姆巴佩的这个事情其实对我打击蛮大的。", "e": "I think the Mbappé incident hit me pretty hard.", "d": 5, "r": "姆巴", "z": 3.18, "n": 13}, {"t": "", "p": "", "o": "0260 | 当然后来我也和自己和解了。", "e": "Of course, later I also came to terms with it.", "d": 4, "r": "和解", "z": 4.14, "n": 8}, {"t": "", "p": "", "o": "0261 | 我意识到，实际上自己离开中国也有很多年了，可能我对中国的情况也不是很了解，所以我也尝试去共情为什么现在这么多的年轻人开始怀念毛泽东。", "e": "I realized that I've actually been away from China for many years, and perhaps I don't understand the situation there very well anymore. So I also tried to empathize with why so many young people are now starting to feel nostalgic for Mao Zedong.", "d": 9, "r": "很多年", "z": 3.66, "n": 36}, {"t": "", "p": "", "o": "0262 | 我觉得我们上学的时候，包括在我们再去教我们的下一代学生的时候，好像大家都会默认姆巴佩说的没有什么问题。", "e": "I think when we were in school, and when we later taught the next generation of students, everyone seemed to take it for granted that what Mbappé said wasn't particularly problematic.", "d": 9, "r": "佩说", "z": 2.77, "n": 29}, {"t": "", "p": "", "o": "0263 | 哪怕你觉得他不是独裁者，但是你觉得他说这个话可能也没什么。", "e": "Even if you didn't think he was a dictator, you might still feel that what he said wasn't a big deal.", "d": 5, "r": "独裁者", "z": 4.03, "n": 16}, {"t": "", "p": "", "o": "0264 | 但我们今天看到的是姆巴佩这个人道歉也完全没有用。", "e": "But what we're seeing today is that even Mbappé's apology has made no difference at all.", "d": 6, "r": "姆巴", "z": 3.18, "n": 15}, {"t": "", "p": "", "o": "0265 | 所有人都在批评他，包括很多很多的小孩子要专门买VPN出来翻墙批评他。", "e": "Everyone is criticizing him, including many, many children who specifically buy VPNs so they can get around the firewall and criticize him.", "d": 6, "r": "很多很多", "z": 3.35, "n": 16}, {"t": "", "p": "", "o": "0266 | 我觉得很莫名其妙。", "e": "I find it baffling.", "d": 3, "r": "莫名其妙", "z": 3.73, "n": 4}, {"t": "", "p": "", "o": "0267 | 后来，我回头想了一下，我就发现从2022年的白纸运动，其实就有很多的年轻人要求解封的时候是举着毛泽东的画像出来的。", "e": "Later, when I thought back on it, I realized that even during the 2022 White Paper Movement, many young people who demanded the end of lockdowns came out holding portraits of Mao Zedong.", "d": 9, "r": "白纸", "z": 3.07, "n": 32}, {"t": "", "p": "", "o": "0268 | 过去几年里，我们大概发了有二、三十起的中国国内的高中生抗争运动，其实每一次他们都会用到毛泽东的语录、用到毛泽东的头像等等等等。", "e": "Over the past few years, we've reported on roughly twenty or thirty protest movements by high school students inside China. In almost every case, they used Mao Zedong quotations, Mao's portraits, and so on.", "d": 9, "r": "语录", "z": 3.52, "n": 33}, {"t": "", "p": "", "o": "0269 | 所以我也开始想为什么会这样。", "e": "So I also began to wonder why this was happening.", "d": 3, "r": "为什么", "z": 5.76, "n": 8}, {"t": "", "p": "", "o": "0270 | 一方面可能是因为他们从小长大的这个环境，他们其实没有其他的选择方式。", "e": "On the one hand, it may be because of the environment in which they grew up. They actually have no other options.", "d": 5, "r": "从小", "z": 4.32, "n": 16}, {"t": "", "p": "", "o": "0271 | 其他的思想，其他的思潮都是被禁止的，你只有这个标准答案可以用。", "e": "Other ideas and intellectual currents are prohibited; the only thing available to them is this standard answer.", "d": 6, "r": "标准答案", "z": 3.69, "n": 17}, {"t": "", "p": "", "o": "0272 | 当然厚辰说是因为他们害怕，所以用这个方式当一个幌子。", "e": "Of course, Houchen says it's because they're afraid, so they use this as a kind of cover.", "d": 6, "r": "厚辰", "z": 2.44, "n": 13}, {"t": "", "p": "", "o": "0273 | 另外一方面，这个东西让我突然意识到一个问题。", "e": "On the other hand, this made me suddenly realize something.", "d": 4, "r": "一方面", "z": 4.48, "n": 11}, {"t": "", "p": "", "o": "0274 | 因为我们还会收到很多很多家长给我们投稿，说他们发现自己的孩子从小学一年级就要学习近平读本。", "e": "We also receive many submissions from parents saying they've discovered that their children have had to study the “Xi Jinping Reader” since first grade.", "d": 7, "r": "读本", "z": 3.28, "n": 22}, {"t": "", "p": "", "o": "0275 | 他们的语文书翻开第一页是什么“伟大的亲爱的习爷爷”。", "e": "When they open their Chinese-language textbook, the very first page says something like, “Our great and beloved Grandpa Xi.”", "d": 6, "r": "第一页", "z": 3.09, "n": 14}, {"t": "", "p": "", "o": "0276 | 所以我就意识到一个问题，就是文革时候的红卫兵那一代人，就是从1950年之后长大的那一批人，这一批人实际上没有经历过之前的时代。", "e": "So I realized something: the generation of Red Guards during the Cultural Revolution—the people who grew up after 1950—had not experienced the era before that.", "d": 9, "r": "一代人", "z": 3.25, "n": 33}, {"t": "", "p": "", "o": "0277 | 所以他们对于这个世界的所有的概念就是“毛泽东是一个神”。", "e": "So their entire understanding of the world was that “Mao Zedong is a god.”", "d": 4, "r": "概念", "z": 4.98, "n": 14}, {"t": "", "p": "", "o": "0278 | 但今天，可能2010年、2015年出生的这批年轻人，他们也是从小在习近平的教育下长大的。", "e": "But today's young people, perhaps those born in 2010 or 2015, have also grown up under Xi Jinping's education system.", "d": 6, "r": "从小", "z": 4.32, "n": 21}, {"t": "", "p": "", "o": "0279 | 他们从小学的是“亲爱的习爷爷”，可能再过五年、十年之后，他们也会觉得习近平是一个神圣不可侵犯的概念。", "e": "They've been taught about “beloved Grandpa Xi” since elementary school. Perhaps in another five or ten years, they'll also regard Xi Jinping as a sacred, untouchable figure.", "d": 8, "r": "神圣不可", "z": 3.3, "n": 26}, {"t": "", "p": "", "o": "0280 | 所以我觉得如果说我们再不抓紧做些什么的话，那可能过了五年、十年，我们的社会就会变得更糟糕。", "e": "So I think if we don't hurry up and do something, then in five or ten years our society may become even worse.", "d": 7, "r": "如果说", "z": 3.98, "n": 26}, {"t": "", "p": "", "o": "0281 | 袁莉：我下面先念一位观众的问题。", "e": "Yuan Li: I'll read a question from an audience member first.", "d": 4, "r": "先念", "z": 3.48, "n": 8}, {"t": "", "p": "", "o": "0282 | 它其实不是个问题，是一个致敬。", "e": "It's not really a question; it's a tribute.", "d": 4, "r": "致敬", "z": 4.05, "n": 8}, {"t": "", "p": "", "o": "0283 | 我不知道你听了以后会怎么想。", "e": "I don't know what you'll think when you hear it.", "d": 3, "r": "以后", "z": 5.46, "n": 10}, {"t": "", "p": "", "o": "0284 | TA说：李老师，我在现场。", "e": "They say: “Teacher Li, I'm here in the audience.", "d": 2, "r": "现场", "z": 5.21, "n": 5}, {"t": "", "p": "", "o": "0285 | 真的非常抱歉，我无法站起来向你表达敬意。", "e": "I'm truly sorry that I can't stand up to express my respect for you.", "d": 5, "r": "敬意", "z": 3.72, "n": 11}, {"t": "", "p": "", "o": "0286 | 很多人对刘慈欣《三体》中的价值观不屑一顾。", "e": "Many people dismiss the values in Liu Cixin's The Three-Body Problem.", "d": 5, "r": "不屑一顾", "z": 3.05, "n": 9}, {"t": "", "p": "", "o": "0287 | 我想说，在某一次采访中，我觉得你非常像是现实中的持剑人罗辑，无论有多少黑子在黑你，面对的重压和坚持都是其他人无法想象的。", "e": "I want to say that in one interview, I felt you were very much like Luo Ji, the Swordholder in real life. No matter how many haters attack you, the pressure you face and your perseverance are beyond what other people can imagine.", "d": 10, "r": "人罗辑", "z": 2.04, "n": 36}, {"t": "", "p": "", "o": "0288 | 我借今天活动的平台向你表达我的敬意，每个人都会做出选择，而你的选择改变了很多人的现在和未来。", "e": "Through this event today, I'd like to express my respect for you. Everyone makes choices, and your choices have changed the present and future of many people.”", "d": 9, "r": "敬意", "z": 3.72, "n": 30}, {"t": "", "p": "", "o": "0289 | 李老师：哇，谢谢。", "e": "Teacher Li: Wow, thank you.", "d": 2, "r": "哇", "z": 4.62, "n": 3}, {"t": "", "p": "", "o": "0290 | （现场鼓掌）", "e": "(Applause)", "d": 3, "r": "鼓掌", "z": 3.83, "n": 2}, {"t": "", "p": "", "o": "0291 | 袁莉：第二个问题是“你长期记录和传播中国各地的社会事件，面对大量彼此孤立、持续发生，却很难形成全国性公共讨论的事件。", "e": "Yuan Li: The second question is: “You have long documented and circulated social incidents from all over China. Faced with large numbers of isolated events that keep happening but rarely develop into nationwide public discussion,", "d": 8, "r": "全国性", "z": 4.03, "n": 29}, {"t": "", "p": "", "o": "0292 | 你如何判断他们是在积累社会变革的力量，还是最终会被信息审查和社会原子化消解？", "e": "how do you judge whether they are accumulating the forces for social change or will ultimately be neutralized by information censorship and the atomization of society?", "d": 7, "r": "原子化", "z": 3.08, "n": 20}, {"t": "", "p": "", "o": "0293 | 在你的观察中，什么样的社会事件才可能真正改变公众认知，甚至影响制度运行？”这个是个很大的问题。", "e": "In your observations, what kinds of social incidents might genuinely change public perceptions and even affect how institutions operate?” This is a very big question.", "d": 7, "r": "认知", "z": 4.33, "n": 25}, {"t": "", "p": "", "o": "0294 | 但很好。", "e": "But it's a good one.", "d": 2, "r": "好", "z": 6.24, "n": 3}, {"t": "", "p": "", "o": "0295 | 李老师：我可能这样思考——大家可能都会有一个概念，就是一个社会的变革，或者说一个历史的转折，它往往是因为一个人或者一件事。", "e": "Teacher Li: I might approach it this way. People may have a general idea that social change, or a historical turning point, often happens because of one person or one event.", "d": 8, "r": "转折", "z": 3.84, "n": 30}, {"t": "", "p": "", "o": "0296 | 但是实际上从我自己的经历和我所见证的这段历史来说，我觉得可能事情并不是这样。", "e": "But in fact, based on my own experience and the history I've witnessed, I don't think things necessarily work that way.", "d": 7, "r": "这段", "z": 4.14, "n": 22}, {"t": "", "p": "", "o": "0297 | 我们只看到了白纸运动的那一天晚上，但其实对于动态清零的抗争从很早很早就开始了。", "e": "We only saw the night of the White Paper Movement, but resistance to the dynamic zero-COVID policy had actually begun much, much earlier.", "d": 7, "r": "白纸", "z": 3.07, "n": 23}, {"t": "", "p": "", "o": "0298 | 我们从四月份的上海之声，然后到了之后拉萨的人民先走上街头，然后到富士康的暴动，乌鲁木齐当时也有几万的人走上街头、要求解封，再到后来才是白纸运动，后来其实也有一系列的运动，中间还有零零碎碎的全国各地的小区居民要自行解封。", "e": "It began with the Shanghai Voices in April, then people in Lhasa took to the streets first, followed by the unrest at Foxconn. Tens of thousands of people also took to the streets in Urumqi to demand an end to lockdowns. Only after that came the White Paper Movement. There was also a series of movements afterward, as well as scattered efforts by residents in communities across the country to end their own lockdowns.", "d": 10, "r": "零零碎碎", "z": 1.2, "n": 59}, {"t": "", "p": "", "o": "0299 | 这是一个不断发生变化的一个过程。", "e": "It was a process in which things kept changing.", "d": 4, "r": "发生变化", "z": 3.16, "n": 8}, {"t": "", "p": "", "o": "0300 | 所以从我的角度，我觉得可能并不是一个事情就会决定。", "e": "So from my perspective, it probably isn't one single event that determines everything.", "d": 5, "r": "角度", "z": 4.84, "n": 15}, {"t": "", "p": "", "o": "0301 | 这也是我们在做的一个工作。", "e": "This is also part of the work we're doing.", "d": 3, "r": "工作", "z": 5.99, "n": 9}, {"t": "", "p": "", "o": "0302 | 我们认为我们并不是要毕其功于一役，而是希望能够去拓展更多的空间，让社会里有更多的空间可以去讨论，可以去反思，可以促进很多事情的发展。", "e": "We don't believe in trying to accomplish everything in one decisive battle. Instead, we hope to expand the space available so that society has more room for discussion and reflection, and so that many things can move forward.", "d": 10, "r": "毕其功于一役", "z": 0.0, "n": 35}, {"t": "", "p": "", "o": "0303 | 如果有可能往好的地方发展，这些事情就不会发生。", "e": "If things could develop in a positive direction, these incidents wouldn't happen.", "d": 4, "r": "往", "z": 5.02, "n": 13}, {"t": "", "p": "", "o": "0304 | 如果我们设想一下，如果说共产党会改的话，那天晚上大家也不用上去说“共产党下台”之类的东西。", "e": "Just imagine: if the Communist Party were willing to change, people wouldn't have had to go out that night and chant things like “Down with the Communist Party.”", "d": 6, "r": "如果说", "z": 3.98, "n": 21}, {"t": "", "p": "", "o": "0305 | 但是它没有改，对吧？", "e": "But it didn't change, right?", "d": 3, "r": "改", "z": 5.03, "n": 6}, {"t": "", "p": "", "o": "0306 | 对于我们来说，我们可能没有办法看准哪一件事情一定会改变中国，但我觉得从我的角度，或者说从在座的很多人的角度，我们希望这个事情往一个好的、损失没有那么大的方向去发展。", "e": "For us, perhaps there's no way to identify which particular event will definitely change China. But from my perspective, and from that of many people here, we hope things will develop in a positive direction, with as little loss as possible.", "d": 9, "r": "看准", "z": 3.33, "n": 46}, {"t": "", "p": "", "o": "0307 | 所以这也是我们在努力的方向。", "e": "So that's the direction we're working toward.", "d": 3, "r": "方向", "z": 5.13, "n": 9}, {"t": "", "p": "", "o": "0308 | 袁莉：还有一个问题说：李老师，请问您的团队每天通过收件箱看到并处理大量来自中国的投稿时候，是如何调节自己的情绪的？", "e": "Yuan Li: There's another question: “Teacher Li, when you and your team see and process large numbers of submissions from China through your inbox every day, how do you manage your emotions?", "d": 9, "r": "收件箱", "z": 2.0, "n": 29}, {"t": "", "p": "", "o": "0309 | 会不会有政治抑郁等心理状况？", "e": "Do you ever experience psychological problems such as political depression?”", "d": 4, "r": "抑郁", "z": 3.73, "n": 8}, {"t": "", "p": "", "o": "0310 | 李老师：最开始当然会有了。", "e": "Teacher Li: Of course I did at the beginning.", "d": 2, "r": "当然", "z": 5.5, "n": 7}, {"t": "", "p": "", "o": "0311 | 有的时候我会觉得可能我把自己看得太重了。", "e": "Sometimes I felt that perhaps I took myself too seriously.", "d": 5, "r": "太重", "z": 3.57, "n": 13}, {"t": "", "p": "", "o": "0312 | 我会觉得好像自己需要去帮忙改变这些东西，但是我改变不了。", "e": "I felt that I had to help change these things, but I couldn't.", "d": 5, "r": "帮忙", "z": 4.64, "n": 14}, {"t": "", "p": "", "o": "0313 | 那个时候我会有政治抑郁。", "e": "At that time, I experienced political depression.", "d": 3, "r": "抑郁", "z": 3.73, "n": 6}, {"t": "", "p": "", "o": "0314 | 我的同事们最开始或多或少都会有，但这也是他们加入这个团队的原因。", "e": "My colleagues also experienced it to varying degrees at first, but that's also one of the reasons they joined this team.", "d": 7, "r": "或多或少", "z": 3.51, "n": 20}, {"t": "", "p": "", "o": "0315 | 他们后来怎么没有了呢？", "e": "So how did it go away for them?", "d": 2, "r": "后来", "z": 5.3, "n": 6}, {"t": "", "p": "", "o": "0316 | 反而是因为他们做了这些事情，做了更多的事情以后，他们意识到，我今天编辑这样一个内容可能会帮助到这个人。", "e": "It was actually because they did this work. After doing more and more, they realized that editing a particular piece of content today might help someone.", "d": 8, "r": "反而", "z": 4.75, "n": 29}, {"t": "", "p": "", "o": "0317 | 或者是他们在处理这些东西的时候，我会发给他们反馈，告诉他们今天有私信来感谢你们，说因为你们发的东西，他的事情被解决掉了。", "e": "Or, when they were processing these things, I would pass along feedback, telling them that someone had sent a private message to thank them and say that the problem they had posted about was resolved because of what they did.", "d": 9, "r": "私信", "z": 3.58, "n": 34}, {"t": "", "p": "", "o": "0318 | 所以他们反而是因为做了这个工作越来越有信心，因为他们发现他们在做的事情真的对这个社会有一些改变。", "e": "So doing this work actually gave them more and more confidence, because they saw that what they were doing really was changing society in some ways.", "d": 7, "r": "信心", "z": 4.69, "n": 26}, {"t": "", "p": "", "o": "0319 | 所以反而是因为真的做了事情，所以政治抑郁被大大的缓解。", "e": "So it was precisely by taking real action that their political depression was greatly alleviated.", "d": 5, "r": "抑郁", "z": 3.73, "n": 13}, {"t": "", "p": "", "o": "0320 | 袁莉：还有一个问题，应该是现场观众的问题，TA说：李老师，你好，您的收件箱让我们看到了许多原本不可见的中国社会现实，但随着影响力不断扩大，您已经不只是被动的信息接收者，也在主动塑造公众对中国的认识。", "e": "Yuan Li: Here's another question, probably from someone in the audience. They say: “Hello, Teacher Li. Your inbox has shown us many aspects of Chinese society that would otherwise remain invisible. But as your influence has grown, you are no longer merely a passive recipient of information; you are also actively shaping the public's understanding of China.", "d": 10, "r": "收件箱", "z": 2.0, "n": 49}, {"t": "", "p": "", "o": "0321 | 您如何看待这种权力，又由谁来监督您对信息的筛选和呈现？", "e": "How do you view this power, and who oversees your selection and presentation of information?”", "d": 5, "r": "由谁来", "z": 3.59, "n": 15}, {"t": "", "p": "", "o": "0322 | 李老师：哇，这其实是一个我觉得真的很厉害的问题，直击我的内心啊。", "e": "Teacher Li: Wow, I think this is genuinely an excellent question. It really gets to the heart of the matter for me.", "d": 6, "r": "直击", "z": 3.22, "n": 18}, {"t": "", "p": "", "o": "0323 | 实际上我觉得过去的几年里，就像我刚才说的，我一直是认定自己是个服务者的角色，我希望我们能够去忠实的还原这些投稿给我们的人。", "e": "Actually, as I just said, over the past few years I've consistently seen myself as a service provider. I hope we can faithfully present the submissions people send us.", "d": 8, "r": "投稿", "z": 3.75, "n": 37}, {"t": "", "p": "", "o": "0324 | 他们发布的内容，我们不对内容进行点评，或者说我们不加入自己的情绪。", "e": "We don't comment on the content they publish, or add our own emotions to it.", "d": 6, "r": "点评", "z": 3.94, "n": 17}, {"t": "", "p": "", "o": "0325 | 但这是一个很难的事情。", "e": "But this is very difficult.", "d": 3, "r": "难", "z": 5.19, "n": 8}, {"t": "", "p": "", "o": "0326 | 就像是这位朋友说的，你确实有一种权力，你可以选择你发什么，你可以选择哪一个事情更重要，你可以选择哪个事情可以在黄金的时候发。", "e": "As this person says, you really do have a kind of power. You can choose what to publish, which events are more important, and which ones get posted at prime time.", "d": 8, "r": "黄金", "z": 4.73, "n": 36}, {"t": "", "p": "", "o": "0327 | 这些都是权力。", "e": "All of these are forms of power.", "d": 2, "r": "权力", "z": 5.25, "n": 4}, {"t": "", "p": "", "o": "0328 | 这个东西，我觉得实际上我做的没有那么好。", "e": "I don't think I've handled this particularly well.", "d": 4, "r": "实际上", "z": 4.92, "n": 11}, {"t": "", "p": "", "o": "0329 | 但是我尽量在压抑我的这种东西。", "e": "But I try to restrain myself as much as possible.", "d": 4, "r": "压抑", "z": 4.13, "n": 9}, {"t": "", "p": "", "o": "0330 | 现在对我来说，我可能需要跟我的团队说，你们要压抑住，你们不要太想要动用这个东西去找你们自己想要的议题，或者想把你们觉得重要的东西给到大家。", "e": "Now I may need to tell my team that they have to restrain themselves too. They shouldn't be too eager to use this power to pursue the topics they personally want to pursue, or to push the things they consider important in front of everyone.", "d": 8, "r": "动用", "z": 4.07, "n": 41}, {"t": "", "p": "", "o": "0331 | 这是一个对抗的过程，但我觉得这也是一个学习的过程。", "e": "It's a process of resisting that impulse, but I think it's also a learning process.", "d": 5, "r": "对抗", "z": 4.65, "n": 16}, {"t": "", "p": "", "o": "0332 | 所以我不敢说我们已经完全克服了这一点，但是我们正在去努力的克服。", "e": "So I wouldn't dare say we've completely overcome this issue, but we're working hard to do so.", "d": 6, "r": "克服", "z": 4.37, "n": 18}, {"t": "", "p": "", "o": "0333 | 袁莉：我们再有两个问题。", "e": "Yuan Li: We have two more questions.", "d": 3, "r": "再有", "z": 4.01, "n": 5}, {"t": "", "p": "", "o": "0334 | 这个问题是：李老师，很多民主斗士似乎并不一定真正关心弱势群体的权利。", "e": "This question says: “Teacher Li, many democracy activists don't necessarily seem to genuinely care about the rights of disadvantaged groups.", "d": 6, "r": "弱势群体", "z": 3.07, "n": 14}, {"t": "", "p": "", "o": "0335 | 有些人即使已经翻墙出来，开始关注民主自由与人权，也未必会进一步关注妇女、儿童、残疾人、性少数甚至动物的权益。", "e": "Some people, even after getting around the firewall and beginning to pay attention to democracy, freedom, and human rights, may not go on to care about the rights of women, children, people with disabilities, sexual minorities, or even animals.", "d": 8, "r": "民主自由", "z": 3.09, "n": 25}, {"t": "", "p": "", "o": "0336 | 所以我想请教，随着社会逐渐走向民主，弱势群体的权利是否也会自然而然的得到改善？", "e": "So I'd like to ask: as society gradually moves toward democracy, will the rights of disadvantaged groups naturally improve as well?", "d": 7, "r": "弱势群体", "z": 3.07, "n": 19}, {"t": "", "p": "", "o": "0337 | 还是说民主制度本身并不足以保障他们的权益？", "e": "Or is democracy itself insufficient to protect their rights?", "d": 4, "r": "不足以", "z": 3.92, "n": 11}, {"t": "", "p": "", "o": "0338 | 这些权利仍然需要通过持续的社会运动、公共讨论才能真正争取到？", "e": "Do these rights still have to be won through sustained social movements and public discussion?”", "d": 4, "r": "争取", "z": 4.99, "n": 15}, {"t": "", "p": "", "o": "0339 | 这已经到了民主后了。", "e": "This question is already about the post-democratic era.", "d": 2, "r": "民主", "z": 5.51, "n": 7}, {"t": "", "p": "", "o": "0340 | 李老师：应该接吴国光老师那个“后共产党时代的中国”。", "e": "Teacher Li: This should come after Professor Wu Guoguang's session on “China in the Post-Communist Era.”", "d": 4, "r": "接", "z": 4.93, "n": 12}, {"t": "", "p": "", "o": "0341 | （笑）我大概能明白这个听众想表达的意思。", "e": "(Laughter) I think I more or less understand what this listener is trying to say.", "d": 4, "r": "听众", "z": 4.1, "n": 11}, {"t": "", "p": "", "o": "0342 | 但我觉得好像相比于小粉红、爱国博主等等，民主斗士们已经算是比较关心弱势群体了，对吧？", "e": "But compared with little pinks, patriotic bloggers, and the like, I think democracy activists are already relatively concerned about disadvantaged groups, right?", "d": 7, "r": "弱势群体", "z": 3.07, "n": 20}, {"t": "", "p": "", "o": "0343 | 实际上其他人的发言可能更加的社达、更加的纳粹。", "e": "In fact, other people's statements may be much more Social Darwinist, or even more Nazi-like.", "d": 5, "r": "社达", "z": 3.6, "n": 11}, {"t": "", "p": "", "o": "0344 | 所以我觉得他最后说的我是认同的。", "e": "So I agree with the point the questioner makes at the end.", "d": 4, "r": "认同", "z": 4.58, "n": 11}, {"t": "", "p": "", "o": "0345 | 就是我们不应该把希望寄托在这些民主斗士带领我们获得民主之后，他们会给予我们什么。", "e": "We shouldn't pin our hopes on democracy activists leading us to democracy and then giving us something in return.", "d": 7, "r": "寄托", "z": 3.76, "n": 21}, {"t": "", "p": "", "o": "0346 | 我觉得这是不对的，而是说民主斗士们可能能够创造一个民主的空间，接下来这个公民社会其实需要我们所有人共同去维护。", "e": "I think that's wrong. Rather, democracy activists may be able to create a democratic space, but from then on, maintaining civil society is something all of us need to do together.", "d": 8, "r": "斗士", "z": 3.86, "n": 29}, {"t": "", "p": "", "o": "0347 | 民主应该是一个生活方式。", "e": "Democracy should be a way of life.", "d": 2, "r": "民主", "z": 5.51, "n": 6}, {"t": "", "p": "", "o": "0348 | 比如像今天的台湾，虽然台湾的民主指数已经非常非常高，但是今天的台湾人依然对这些政治人物，对政治非常非常的敏感，他们依然很警惕，让政治人物不要乱想去做一些事情，如果说想要做什么事情，我们会反制你、我们会去抗议你等等等等。", "e": "For example, look at Taiwan today. Although Taiwan's democracy index is already very high, people there remain extremely sensitive to politicians and politics. They stay vigilant and make sure politicians don't go off and do whatever they want. If politicians try to do something, people will push back, protest, and so on.", "d": 9, "r": "反制", "z": 3.39, "n": 58}, {"t": "", "p": "", "o": "0349 | 所以我觉得对我们来说，民主其实应该是我们的一个生活方式，而不是说我们终于获得了一个很好的社会，我们继续躺平就可以了，并不是。", "e": "So I think that for us, democracy should be a way of life. It isn't that we finally obtain a good society and can then just lie back and do nothing. That's not how it works.", "d": 9, "r": "躺平", "z": 3.37, "n": 34}, {"t": "", "p": "", "o": "0350 | 民主需要你不停的去维护。", "e": "Democracy needs to be constantly maintained.", "d": 3, "r": "不停", "z": 4.57, "n": 7}, {"t": "", "p": "", "o": "0351 | 所以刚才他说的这些弱势群体的权益也是一样，我们是需要不断去巩固和维护我们这个公民社会，让这些权益有机会去通过立法成为法律，去成为一个能够保障大家的东西。", "e": "The same goes for the rights of disadvantaged groups mentioned just now. We need to keep strengthening and maintaining our civil society so that these rights have a chance to be established through legislation and become laws that protect everyone.", "d": 9, "r": "弱势群体", "z": 3.07, "n": 42}, {"t": "", "p": "", "o": "0352 | 如果说我们大家不去进一步的话，这些民主斗士上台之后，他们未必不会变成下一个习近平。", "e": "If we don't take things further, those democracy activists, once in power, may well turn into the next Xi Jinping.", "d": 6, "r": "斗士", "z": 3.86, "n": 19}, {"t": "", "p": "", "o": "0353 | 因为我从我自己的角度来想，如果大家真的选我当总统，那我当了这个总统之后，如果我发现好像你们对于政治也不关心，你们也不关心我去出台什么政策，你们也不关心怎么选你们的人大代表——当然那时候可能没有人大
