代表了——你们也不关心这些东西，那最后怎么办？", "e": "Because from my own perspective, imagine that everyone really did elect me president. After I became president, what if I found that you weren't interested in politics, didn't care what policies I introduced, and didn't care how you elected your people's congress representatives—although of course there might not be people's congress representatives then? What if you didn't care about any of these things? What would happen?", "d": 8, "r": "出台", "z": 4.41, "n": 67}, {"t": "", "p": "", "o": "0354 | 那我自然而然也想做个独裁者。", "e": "Then naturally I'd want to become a dictator too.", "d": 4, "r": "自然而然", "z": 3.74, "n": 8}, {"t": "", "p": "", "o": "0355 | 因为我当然希望自己的权力越来越大。", "e": "Because of course I'd want my power to keep growing.", "d": 3, "r": "越来越", "z": 5.07, "n": 9}, {"t": "", "p": "", "o": "0356 | 所以如果我都这样想，那其他人会不会这样想，我觉得这是肯定的。", "e": "So if even I would think that way, wouldn't other people think that way too? I think they certainly would.", "d": 5, "r": "其他人", "z": 4.71, "n": 18}, {"t": "", "p": "", "o": "0357 | 因此我觉得并不是民主斗士会给我们带来什么，而是说我们借着民主斗士争取到了公民社会之后，我们如何在一起去维护这个公民社会。", "e": "Therefore, I don't think the question is what democracy activists will bring us. It's that after we use their efforts to win a civil society, how do we maintain that civil society together?", "d": 9, "r": "借着", "z": 3.57, "n": 33}, {"t": "", "p": "", "o": "0358 | 袁莉：最后一个问题是我刚才突然想到的。", "e": "Yuan Li: The last question just occurred to me.", "d": 4, "r": "刚才", "z": 4.85, "n": 10}, {"t": "", "p": "", "o": "0359 | 如果中国有一天民主了，我们都能都能回去的时候，你会做什么？", "e": "If China becomes democratic one day, and we're all able to go back, what would you do?", "d": 5, "r": "回去", "z": 4.72, "n": 18}, {"t": "", "p": "", "o": "0360 | 李老师：有两个方向，一个就是从现实的角度，如果中国民主了，或者说中国可以让我们回去了。", "e": "Teacher Li: There are two possibilities. One is the practical one: if China becomes democratic, or if China allows us to return,", "d": 6, "r": "或者说", "z": 4.01, "n": 21}, {"t": "", "p": "", "o": "0361 | 那我的目标就像我刚才说的——我想带着我的团队一起回去，继续为中国的公民社会做贡献。", "e": "then my goal, as I said earlier, would be to take my team back with me and continue contributing to China's civil society.", "d": 7, "r": "回去", "z": 4.72, "n": 27}, {"t": "", "p": "", "o": "0362 | 如果你问我个人的话，我觉得我个人的话当然是想回家，因为就是我所有做的一切都是为了回家。", "e": "If you're asking about me personally, of course I want to go home, because everything I've done has been for the sake of going home.", "d": 7, "r": "一切都是", "z": 4.05, "n": 24}, {"t": "", "p": "", "o": "0363 | （现场鼓掌）", "e": "(Applause)", "d": 3, "r": "鼓掌", "z": 3.83, "n": 2}, {"t": "", "p": "", "o": "0364 | 袁莉：你会从政吗？", "e": "Yuan Li: Would you go into politics?", "d": 2, "r": "会", "z": 6.48, "n": 5}, {"t": "", "p": "", "o": "0365 | 李老师：从政啊？", "e": "Teacher Li: Go into politics?", "d": 2, "r": "啊", "z": 5.92, "n": 3}, {"t": "", "p": "", "o": "0366 | 噫——我个人并不是很喜欢政治的一个人，我觉得这些东西交给方脸来做就可以了。", "e": "Uh... I'm not really someone who likes politics very much. I think we can leave that kind of thing to Fanglian.", "d": 7, "r": "噫", "z": 2.75, "n": 22}, {"t": "", "p": "", "o": "0367 | （现场笑）", "e": "(Laughter)", "d": 2, "r": "笑", "z": 5.2, "n": 2}, {"t": "", "p": "", "o": "0368 | 袁莉：你还是去做一个文艺青年、文艺中年，是吧？", "e": "Yuan Li: So you'll go back to being an artsy young man—or an artsy middle-aged man—is that right?", "d": 4, "r": "文艺", "z": 4.52, "n": 12}, {"t": "", "p": "", "o": "0369 | 李老师：当然我觉得到了那个时候的话，我可能更想回到我原本的生活，但是我不知道能不能回到原本的生活。", "e": "Teacher Li: Of course, I think by then I'd probably want to return to my original life. But I don't know whether I'll be able to return to it.", "d": 7, "r": "原本", "z": 4.8, "n": 28}, {"t": "", "p": "", "o": "0370 | 袁莉：好，谢谢，谢谢李老师。", "e": "Yuan Li: All right. Thank you, thank you, Teacher Li.", "d": 2, "r": "好", "z": 6.24, "n": 5}, {"t": "", "p": "", "o": "0371 | 袁莉：大家好，欢迎来到不明白播客，我是主持人袁莉，谢谢你们一直以来对不明白播客的大力支持，在这里我希望大家采取更多行动来支持播客。", "e": "Yuan Li: Hello, everyone, and welcome to the Un-Breaking podcast. I'm your host, Yuan Li. Thank you for your tremendous support of the podcast over the years. Here, I'd like to encourage everyone to take more action to support the podcast.", "d": 9, "r": "播客", "z": 3.12, "n": 33}, {"t": "", "p": "", "o": "0372 | YouTube频道上的观众朋友们，你们可以点击视频下方的订阅按钮，关注我们的频道，并点击小铃铛打开提醒，以便第一时间看到最新的节目。", "e": "To everyone watching on our YouTube channel: you can click the Subscribe button below the video to follow our channel, and click the bell to turn on notifications so you'll be among the first to see our latest episodes.", "d": 9, "r": "铃铛", "z": 3.24, "n": 31}];

    out.append(s);
  });
}
function saveProgress(index){
  maxFlippedIndex=Math.max(maxFlippedIndex,index);
  const pct=Math.round(((maxFlippedIndex+1)/Math.max(D.length,1))*100);
  try{
    localStorage.setItem(storageKey,JSON.stringify({maxFlippedIndex}));
    progressStatus.textContent='Saved at '+pct+'%';
  }catch(error){
    progressStatus.textContent='Progress could not be saved in this browser';
  }
}
document.getElementById('all').onclick=()=>{
  document.querySelectorAll('.s').forEach(e=>e.classList.add('open'));
  if(D.length)saveProgress(D.length-1);
};
document.getElementById('none').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.remove('open'));
function goToPercent(){
  const percent=Number(gotoPercent.value);
  if(gotoPercent.value.trim()===''||!Number.isFinite(percent)||percent<0||percent>100){
    gotoPercent.setCustomValidity('Enter a percentage from 0 to 100.');
    gotoPercent.reportValidity();
    return;
  }
  gotoPercent.setCustomValidity('');
  const index=Math.max(0,Math.ceil((percent/100)*D.length)-1);
  const sentence=out.querySelector('.s[data-index="'+index+'"]');
  if(sentence){
    sentence.scrollIntoView({block:'start'});
    progressStatus.textContent='At '+percent+'% — open a sentence to save progress';
  }
}
document.getElementById('goto').onclick=goToPercent;
gotoPercent.onkeydown=e=>{if(e.key==='Enter')goToPercent()};
render();
if(maxFlippedIndex>=0){
  requestAnimationFrame(()=>{
    const sentence=out.querySelector('.s[data-index="'+maxFlippedIndex+'"]');
    if(sentence){
      sentence.scrollIntoView({block:'start'});
      const pct=Math.round(((maxFlippedIndex+1)/Math.max(D.length,1))*100);
      progressStatus.textContent='Resumed at '+pct+'%';
    }
  });
}else{
  progressStatus.textContent='Open a sentence to save progress';
}
</script></body></html>
