ne pourra pas défaire sa politique.", "e": "However, although Congress can slow Trump down on tariffs, withdrawal from NATO, or Iran, it will not be able to undo his policies.", "d": 9, "r": "tariffs", "z": 1.46, "n": 23}, {"t": "", "p": "", "o": "0011 | Le président américain conserve, outre son droit de veto d’importantes prérogatives exécutives en politique étrangère et son statut de commandant en chef, mais il voit son emprise sur son propre parti s’effriter.", "e": "In addition to his veto power, the American president retains significant executive powers in foreign policy and his status as commander-in-chief, but his grip on his own party is weakening.", "d": 9, "r": "effriter", "z": 2.36, "n": 32}, {"t": "", "p": "", "o": "0012 | Il avait supplié les électeurs de « faire comme si » son nom figurait sur les bulletins.", "e": "He had pleaded with voters to 'act as if' his name were on the ballot.", "d": 6, "r": "supplié", "z": 2.79, "n": 15}, {"t": "", "p": "", "o": "0013 | Ils l'ont pris au mot.", "e": "They took him at his word.", "d": 2, "r": "mot", "z": 5.22, "n": 5}, {"t": "", "p": "", "o": "0014 | Le tsunami démocrate est d'abord une déroute personnelle.", "e": "The Democratic tsunami is first and foremost a personal rout.", "d": 4, "r": "tsunami", "z": 3.44, "n": 8}, {"t": "", "p": "", "o": "0015 | Face à ces défaites, Donald Trump s’est empressé de rejeter la responsabilité sur ses troupes.", "e": "Faced with these defeats, Donald Trump hastened to shift the blame onto his troops.", "d": 6, "r": "empressé", "z": 3.05, "n": 15}, {"t": "", "p": "", "o": "0016 | Officiellement devenu un lame duck (un canard boiteux), il se retrouve dans une position inédite d’affaiblissement, politiquement et institutionnellement.", "e": "Officially a lame duck, he finds himself in an unprecedented position of political and institutional weakness.", "d": 7, "r": "institutionnellement", "z": 2.16, "n": 19}, {"t": "", "p": "", "o": "0017 | Il faut s'attendre à ce que la lutte de pouvoir constitutionnelle et les confrontations virulentes entre le Congrès et la Maison-Blanche rythment les deux années qui viennent.", "e": "We should expect constitutional power struggles and bitter confrontations between Congress and the White House to shape the next two years.", "d": 9, "r": "rythment", "z": 2.48, "n": 27}, {"t": "", "p": "", "o": "0018 | Le président américain a prévenu qu'il n'hésiterait pas à se transformer en « Monsieur Veto ».", "e": "The American president has warned that he would not hesitate to turn himself into 'Mr. Veto.'", "d": 6, "r": "hésiterait", "z": 2.57, "n": 14}, {"t": "", "p": "", "o": "0019 | Un veto, que seuls les deux tiers des deux chambres peuvent surmonter.", "e": "A veto that can be overridden only by two-thirds of both chambers.", "d": 5, "r": "veto", "z": 3.43, "n": 12}, {"t": "", "p": "", "o": "0020 | Le nouveau Congrès ne siégera que le 3 janvier 2027.", "e": "The new Congress will not convene until January 3, 2027.", "d": 5, "r": "siégera", "z": 2.24, "n": 8}, {"t": "", "p": "", "o": "0021 | Kontildondit ?", "e": "What do you say?", "d": 4, "r": "Kontildondit", "z": 0.0, "n": 1}, {"t": "", "p": "", "o": "0022 | Béatrice Giblin :", "e": "Béatrice Giblin:", "d": 3, "r": "Béatrice", "z": 3.55, "n": 2}, {"t": "", "p": "", "o": "0023 | Mercredi matin, tout le monde a poussé un « ouf » de soulagement devant cette déculottée, cette raclée infligée à Trump en son nom propre.", "e": "On Wednesday morning, everyone breathed a sigh of relief at this drubbing, this beating inflicted on Trump personally.", "d": 8, "r": "déculottée", "z": 2.28, "n": 22}, {"t": "", "p": "", "o": "0024 | Philippe vient de rappeler qu’il avait demandé aux électeurs d’imaginer que son nom figurait sur les bulletins.", "e": "Philippe has just reminded us that Trump had asked voters to imagine his name appearing on the ballot.", "d": 6, "r": "figurait", "z": 3.36, "n": 18}, {"t": "", "p": "", "o": "0025 | Les choses étaient donc claires : il s’ emocrats did not win only on the two coasts, but also in the center of the United States—in Kansas, the Carolinas, Iowa, and even Ohio, where a Democrat won the seat of J.", "d": 8, "r": "démocrates", "z": 4.01, "n": 39}, {"t": "", "p": "", "o": "0031 | D.", "e": "D.", "d": 1, "r": "", "z": null, "n": 0}, {"t": "", "p": "", "o": "0032 | Vance, devenu vice-président.", "e": "Vance, who became vice president.", "d": 3, "r": "Vance", "z": 3.02, "n": 3}, {"t": "", "p": "", "o": "0033 | Le charcutage électoral n’a pas davantage payé.", "e": "Gerrymandering did not pay off either.", "d": 5, "r": "charcutage", "z": 1.85, "n": 6}, {"t": "", "p": "", "o": "0034 | Face à une vague aussi importante, le redécoupage des circonscriptions, pourtant considérable en Floride, au Texas et ailleurs, n’a pas suffi.", "e": "In the face of such a major wave, redistricting—which was considerable in Florida, Texas, and elsewhere—was not enough.", "d": 7, "r": "redécoupage", "z": 2.84, "n": 20}, {"t": "", "p": "", "o": "0035 | Les électeurs latinos et noirs, dont le soutien à Trump en 2024 nous avait surpris, l’ont rejeté en raison de la brutalité insupportable de sa politique migratoire et d’une politique économique ouvertement favorable aux riches, surtout à sa propre famille, au détriment d’une population qui peine de plus en plus à faire face.", "e": "Latino and Black voters, whose support for Trump in 2024 had surprised us, rejected him because of the unbearable brutality of his immigration policy and an economic policy openly favorable to the wealthy, especially his own family, at the expense of a population that is finding it increasingly difficult to make ends meet.", "d": 9, "r": "latinos", "z": 3.01, "n": 52}, {"t": "", "p": "", "o": "0036 | Les inégalités violentes provoquent de puissantes réactions d’hostilité.", "e": "Extreme inequalities provoke powerful reactions of hostility.", "d": 4, "r": "provoquent", "z": 3.62, "n": 8}, {"t": "", "p": "", "o": "0037 | Nous ferions bien de t la donne internationale.", "e": "We are not there yet, but that would considerably change the international landscape.", "d": 5, "r": "changerait", "z": 3.43, "n": 13}, {"t": "", "p": "", "o": "0046 | Quant aux Démocrates, leur électorat est très hétérogène, ce qui est normal : il rassemble des jeunes très à gauche, des personnalités de centre gauche et de centre droit modérées.", "e": "As for the Democrats, their electorate is highly diverse, which is normal: it brings together very left-wing young people, moderate center-left figures, and moderate center-right figures.", "d": 9, "r": "modérées", "z": 3.04, "n": 29}, {"t": "", "p": "", "o": "0047 | Il leur faudra trouver un projet et un candidat pour l’incarner.", "e": "They will have to find a platform and a candidate to embody it.", "d": 5, "r": "incarner", "z": 3.56, "n": 11}, {"t": "", "p": "", "o": "0048 | Ce n’est pas gagné, mais ce n’est pas perdu non plus, car dans le camp adverse, les couteaux vont sortir pour déterminer qui s’éloignera le plus vite de Trump afin de préparer sa succession.", "e": "That is far from assured, but it is not impossible either, because in the opposing camp, knives will be out as people determine who can distance themselves from Trump most quickly in order to prepare for his succession.", "d": 9, "r": "éloignera", "z": 2.52, "n": 34}, {"t": "", "p": "", "o": "0049 | Nous entrons dans deux années qu’il faudra suivre de très près.", "e": "We are entering two years that will need to be watched very closely.", "d": 5, "r": "entrons", "z": 3.19, "n": 12}, {"t": "", "p": "", "o": "0050 | Akram Belkaïd :", "e": "Akram Belkaïd:", "d": 4, "r": "Akram", "z": 2.36, "n": 2}, {"t": "", "p": "", "o": "0051 | Nous avons assisté, d’une certaine manière, au pendant inverse de la révolution conservatrice de 1994, lorsque les républicains, sous la houlette de Newt Gingrich, avaient déferlé au Congrès pendant la présidence de Bill Clinton.", "e": "We have witnessed, in a sense, the opposite counterpart of the conservative revolution of 1994, when the Republicans, under Newt Gingrich's leadership, swept into Congress during Bill Clinton's presidency.", "d": 10, "r": "déferlé", "z": 2.16, "n": 33}, {"t": "", "p": "", "o": "0052 | Mais il faut rester prudent : les élections de mi-mandat provoquent régulièrement des bouleversements aux États-Unis, qui ne durent pas toujours.", "e": "But we must remain cautious: midterm elections regularly bring upheavals in the United States, and these do not always last.", "d": 7, "r": "bouleversements", "z": 3.31, "n": 20}, {"t": "", "p": "", "o": "0053 | Gardons-nous donc de tirer des conclusions définitives pour 2028, car c’est désormais la séquence qui s’ouvre.", "e": "So let us avoid drawing definitive conclusions about 2028, because that is now the next phase opening up.", "d": 6, "r": "définitives", "z": 3.05, "n": 15}, {"t": "", "p": "", "o": "0054 | Les raisons de la déroute républicaine ont été énoncées.", "e": "The reasons for the Republican rout have been laid out.", "d": 5, "r": "énoncées", "z": 2.97, "n": 9}, {"t": "", "p": "", "o": "0055 | La question est maintenant celle du projet démocrate.", "e": "The question now is what the Democrats' platform will be.", "d": 4, "r": "démocrate", "z": 4.15, "n": 8}, {"t": "", "p": "", "o": "0056 | Le Parti démocrate repose sur plusieurs piliers : un courant centriste et modéré, un courant conservateur, celui des fameux Blue Dogs, ces élus du Sud qui refont leur apparition, notamment avec James Talarico au Texas, et un courant plus à gauche, incarné par Bernie Sanders ou encore par l’élu du Michigan Abdul El-Sayed.", "e": "The Democratic Party rests on several pillars: a centrist and moderate current; a conservative current, that of the famous Blue Dogs, those Southern representatives who are reappearing, notably with James Talarico in Texas; and a more left-wing current, embodied by Bernie Sanders and Michigan representative Abdul El-Sayed.", "d": 9, "r": "refont", "z": 2.94, "n": 52}, {"t": "", "p": "", "o": "0057 | Une personnalité commence toutefois à se dégager pour la présidentielle de 2028 : le sénateur de Géorgie Jon Ossoff, l’un des plus jeunes élus au Sénat en 2021.", "e": "One figure is nevertheless beginning to stand out as a potential 2028 presidential candidate: Georgia Senator Jon Ossoff, one of the youngest people elected to the Senate in 2021.", "d": 7, "r": "dégager", "z": 4.09, "n": 25}, {"t": "", "p": "", "o": "0058 | Il symbolise l’évolution progressive du Parti démocrate.", "e": "He symbolizes the Democratic Party's gradual evolution.", "d": 4, "r": "symbolise", "z": 3.46, "n": 7}, {"t": "", "p": "", "o": "0059 | Initialement très modéré, prudent sur l’extension de l’assurance maladie et sur la fiscalité, il a vivement attaqué Trump pendant sa campagne, tout en intégrant davantage les revendications de l’aile gauche.", "e": "Initially very moderate, and cautious about expanding health insurance and taxation, he sharply attacked Trump during his campaign while increasingly incorporating the demands of the party's left wing.", "d": 8, "r": "intégrant", "z": 3.57, "n": 29}, {"t": "", "p": "", "o": "0060 | Ancien journaliste, auteur de documentaires dénonçant la corruption et les crimes de guerre, il est particulièrement engagé sur les droits humains et la justice sociale.", "e": "A former journalist and documentary filmmaker who exposed corruption and war crimes, he is particularly committed to human rights and social justice.", "d": 8, "r": "dénonçant", "z": 3.46, "n": 25}, {"t": "", "p": "", "o": "0061 | Il pourrait constituer un bon candidat de compromis, même si, aux États-Unis, tout reste possible.", "e": "He could make a good compromise candidate, although anything is possible in the United States.", "d": 5, "r": "constituer", "z": 4.15, "n": 15}, {"t": "", "p": "", "o": "0062 | C’est un homme éloquent, dont je trouve les discours plus structurés et moins « faiseur » que ceux d’Obama.", "e": "He is an eloquent man, and I find his speeches more structured and less performative than Obama's.", "d": 6, "r": "structurés", "z": 2.93, "n": 17}, {"t": "", "p": "", "o": "0063 | Ses interventions sont précises, étayées, et la presse américaine commence à lui consacrer de nombreux portraits en le présentant comme un possible candidat démocrate en 2028.", "e": "His interventions are precise and well-supported, and the American press is beginning to publish numerous profiles of him, presenting him as a possible Democratic candidate in 2028.", "d": 8, "r": "étayées", "z": 2.41, "n": 25}, {"t": "", "p": "", "o": "0064 | Un autre point essentiel de cette élection est l’importance de ce que les Américains appellent « the affordability ».", "e": "Another essential point about this election is the importance of what Americans call 'affordability.'", "d": 7, "r": "affordability", "z": 0.0, "n": 17}, {"t": "", "p": "", "o": "0065 | Nous traduisons souvent cette notion par le pouvoir d’achat, mais ce n’est pas exactement cela : il s’agit de la capacité à financer les dépenses essentielles.", "e": "We often translate this concept as purchasing power, but that is not quite right: it refers to the ability to pay for essential expenses.", "d": 8, "r": "traduisons", "z": 2.21, "n": 25}, {"t": "", "p": "", "o": "0066 | Aujourd’hui, de nombreux Américains ne peuvent plus assurer leur couverture santé.", "e": "Today, many Americans can no longer afford health insurance.", "d": 5, "r": "Aujourd", "z": 3.54, "n": 12}, {"t": "", "p": "", "o": "0067 | Quant aux prix de l’essence, ils atteignent des niveaux jamais vus.", "e": "As for gasoline prices, they have reached unprecedented levels.", "d": 4, "r": "atteignent", "z": 3.77, "n": 11}, {"t": "", "p": "", "o": "0068 | Cette question de la capacité financière, et donc de la lutte contre les inégalités, a été au centre de la campagne et sera déterminante.", "e": "This question of financial affordability, and therefore of fighting inequality, was at the heart of the campaign and will be decisive.", "d": 7, "r": "déterminante", "z": 3.34, "n": 23}, {"t": "", "p": "", "o": "0069 | Elle balaie les discours selon lesquels l’Amérique se déchirerait avant tout sur les questions woke.", "e": "It sweeps aside the arguments that America is supposedly tearing itself apart above all over woke issues.", "d": 7, "r": "déchirerait", "z": 1.57, "n": 15}, {"t": "", "p": "", "o": "0070 | C’est le réel qui a repris ses droits.", "e": "Reality has reasserted itself.", "d": 3, "r": "repris", "z": 4.52, "n": 7}, {"t": "", "p": "", "o": "0071 | Enfin, les Américains n’ont pas seulement voté pour le Sénat et la Chambre des représentants, mais aussi pour les gouverneurs et une multitude d’élus locaux.", "e": "Finally, Americans did not vote only for the Senate and the House of Representatives, but also for governors and a multitude of local officials.", "d": 8, "r": "gouverneurs", "z": 3.62, "n": 25}, {"t": "", "p": "", "o": "0072 | Nous avons vu des jeunes démocrates de 19 ans accéder à des fonctions de conseillers juridiques et même, dans un État du Sud, un candidat être élu à une assemblée locale alors qu’il avait annoncé son retrait de la course.", "e": "We saw 19-year-old young Democrats take up positions as legal advisers and, in one Southern state, a candidate elected to a local assembly even though he had announced that he was withdrawing from the race.", "d": 8, "r": "démocrates", "z": 4.01, "n": 40}, {"t": "", "p": "", "o": "0073 | Cette vague démocrate a touché tout le pays.", "e": "This Democratic wave swept across the entire country.", "d": 3, "r": "démocrate", "z": 4.15, "n": 7}, {"t": "", "p": "", "o": "0074 | Les exemples les plus emblématiques sont pour moi le Kansas, le Texas et le Mississippi, où le résultat définitif n’est pas encore connu, mais où le candidat démocrate est au coude-à-coude avec la candidate républicaine.", "e": "The most emblematic examples, in my view, are Kansas, Texas, and Mississippi, where the final result is not yet known but the Democratic candidate is neck and neck with the Republican candidate.", "d": 9, "r": "emblématiques", "z": 3.5, "n": 35}, {"t": "", "p": "", "o": "0075 | C’est du jamais-vu.", "e": "This has never been seen before.", "d": 2, "r": "jamais-vu", "z": 5.49, "n": 3}, {"t": "", "p": "", "o": "0076 | Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "0077 | Le Texas est particulièrement remarquable.", "e": "Texas is particularly remarkable.", "d": 3, "r": "remarquable", "z": 4.25, "n": 5}, {"t": "", "p": "", "o": "0078 | Le redécoupage électoral, le gerrymandering, y avait été d’une brutalité telle qu’il devait garantir tous les sièges aux Républicains.", "e": "Redistricting—the gerrymandering—there had been so brutal that it was supposed to guarantee every seat to the Republicans.", "d": 8, "r": "gerrymandering", "z": 1.48, "n": 20}, {"t": "", "p": "", "o": "0079 | Or, c’est précisément là qu’ils sont tombés.", "e": "Yet that is precisely where they fell.", "d": 4, "r": "tombés", "z": 3.89, "n": 8}, {"t": "", "p": "", "o": "0080 | Michaela Wiegel :", "e": "Michaela Wiegel:", "d": 3, "r": "Michaela", "z": 2.58, "n": 2}, {"t": "", "p": "", "o": "0081 | Je voudrais remettre en question l’affirmation selon laquelle ce résultat ne serait pas un soutien aux Démocrates.", "e": "I would like to challenge the assertion that this result does not represent support for the Democrats.", "d": 6, "r": "affirmation", "z": 3.99, "n": 17}, {"t": "", "p": "", "o": "0082 | Il y a certes eu du dégagisme, mais surtout la confirmation de la célèbre formule d’un conseiller de Bill Clinton en 1992 : « it’s the economy stupid. » Les analyses montrent que les électeurs passés de Trump aux Démocrates l’ont fait essentiellement pour des raisons économiques.", "e": "There was certainly an anti-incumbent backlash, but above all it confirmed the famous phrase coined by a Bill Clinton adviser in 1992: 'It's the economy, stupid.' Analyses show that voters who switched from Trump to the Democrats did so primarily for economic reasons.", "d": 10, "r": "dégagisme", "z": 1.72, "n": 42}, {"t": "", "p": "", "o": "0083 | Comme vient de le dire Akram, il s’agit de savoir comment continuer à participer à la vie quotidienne, alors même qu’on travaille.", "e": "As Akram has just said, the issue is how people can keep participating in everyday life even while they are working.", "d": 7, "r": "quotidienne", "z": 4.21, "n": 23}, {"t": "", "p": "", "o": "0084 | Il faut rappeler que, dans l’histoire récente des États-Unis, seuls deux présidents ont remporté les élections de mi-mandat : Bill Clinton en 1998 et George W.", "e": "We should remember that, in recent U.S. history, only two presidents have won the midterm elections: Bill Clinton in 1998 and George W.", "d": 7, "r": "présidents", "z": 4.14, "n": 23}, {"t": "", "p": "", "o": "0085 | Bush en 2002.", "e": "Bush in 2002.", "d": 3, "r": "Bush", "z": 3.88, "n": 2}, {"t": "", "p": "", "o": "0086 | Tous les autres ont perdu des majorités.", "e": "All the others lost their majorities.", "d": 4, "r": "majorités", "z": 2.95, "n": 7}, {"t": "", "p": "", "o": "0087 | Nous nous attendions donc à une défaite de Trump, mais pas à une défaite aussi spectaculaire.", "e": "So we expected Trump to lose, but not to suffer such a spectacular defeat.", "d": 6, "r": "attendions", "z": 3.09, "n": 16}, {"t": "", "p": "", "o": "0088 | Le Texas illustre quelque chose de plus profond.", "e": "Texas illustrates something deeper.", "d": 4, "r": "illustre", "z": 4.15, "n": 8}, {"t": "", "p": "", "o": "0089 | James Talarico, qui souhaitait devenir pasteur, a mené campagne sur des valeurs du protestantisme américain qui semblaient perdues.", "e": "James Talarico, who had wanted to become a pastor, campaigned on values of American Protestantism that seemed to have been lost.", "d": 6, "r": "protestantisme", "z": 3.39, "n": 17}, {"t": "", "p": "", "o": "0090 | La question de ce que la corruption révèle de l’état du pays pourrait devenir un fil conducteur.", "e": "The question of what corruption reveals about the state of the country could become a recurring theme.", "d": 5, "r": "conducteur", "z": 4.26, "n": 17}, {"t": "", "p": "", "o": "0091 | Le Congrès n’a pas tous les pouvoirs, et le veto présidentiel restera important, mais il peut lancer des investigations et engager des procédures judiciaires concernant le népotisme qui entoure Trump.", "e": "Congress does not have unlimited powers, and the presidential veto will remain important, but it can launch investigations and initiate legal proceedings concerning the nepotism surrounding Trump.", "d": 9, "r": "népotisme", "z": 2.74, "n": 29}, {"t": "", "p": "", "o": "0092 | Le président lui-même bénéficie de l’immunité présidentielle, mais ce n’est pas le cas de ses ministres et conseillers.", "e": "The president himself enjoys presidential immunity, but his ministers and advisers do not.", "d": 6, "r": "immunité", "z": 3.88, "n": 18}, {"t": "", "p": "", "o": "0093 | Je m’attends donc à une avalanche d’affaires judiciaires.", "e": "I therefore expect an avalanche of legal cases.", "d": 4, "r": "avalanche", "z": 3.52, "n": 8}, {"t": "", "p": "", "o": "0094 | L’émergence de nouvelles personnalités est également rassurante.", "e": "The emergence of new figures is also reassuring.", "d": 4, "r": "rassurante", "z": 3.07, "n": 7}, {"t": "", "p": "", "o": "0095 | Après la lourde défaite de Kamala Harris, nous avions l’impression que les jeunes Démocrates se tournaient vers Bernie Sanders, qui n’incarne pourtant pas le renouvellement.", "e": "After Kamala Harris's heavy defeat, we had the impression that young Democrats were turning toward Bernie Sanders, who hardly represents renewal.", "d": 8, "r": "tournaient", "z": 3.01, "n": 25}, {"t": "", "p": "", "o": "0096 | Jon Ossoff, en revanche, est particulièrement intéressant.", "e": "Jon Ossoff, by contrast, is particularly interesting.", "d": 4, "r": "Jon", "z": 3.75, "n": 7}, {"t": "", "p": "", "o": "0097 | Son élocution rappelle celle du jeune Obama, peut-être même en mieux.", "e": "His way of speaking is reminiscent of the young Obama, perhaps even better.", "d": 5, "r": "élocution", "z": 2.85, "n": 11}, {"t": "", "p": "", "o": "0098 | J’ai notamment regardé des extraits de son interrogatoire du secrétaire à la Guerre, Pete Hegseth, devant une commission du Sénat, sur les raisons pour lesquelles la guerre en Iran n’avait pas atteint ses objectifs.", "e": "In particular, I watched excerpts of his questioning of Secretary of War Pete Hegseth before a Senate committee, about why the war in Iran had failed to achieve its objectives.", "d": 9, "r": "interrogatoire", "z": 3.65, "n": 34}, {"t": "", "p": "", "o": "0099 | Il ne lâchait pas sa proie et Hegseth était manifestement en difficulté.", "e": "He would not let go of his prey, and Hegseth was clearly struggling.", "d": 5, "r": "lâchait", "z": 2.97, "n": 12}, {"t": "", "p": "", "o": "0100 | Avant même sa réélection, Ossoff avait ainsi mis en difficulté plusieurs personnalités de l’entourage de Trump.", "e": "Even before his reelection, Ossoff had thus put several figures close to Trump on the spot.", "d": 6, "r": "réélection", "z": 3.38, "n": 16}, {"t": "", "p": "", "o": "0101 | Son élection a aussi une résonance particulière en Allemagne.", "e": "His election also has particular resonance in Germany.", "d": 4, "r": "résonance", "z": 3.52, "n": 8}, {"t": "", "p": "", "o": "0102 | Juste avant le scrutin, le patron d’Audi, entreprise très fragilisée comme l’ensemble de l’industrie automobile européenne, avait envisagé de construire une nouvelle usine en Géorgie pour échapper aux droits de douane américains, alors même que le groupe licenciait massivement en Allemagne.", "e": "Just before the vote, Audi's chief executive, whose company is extremely vulnerable, like the European automotive industry as a whole, had considered building a new factory in Georgia to avoid American tariffs, even as the group was carrying out massive layoffs in Germany.", "d": 10, "r": "licenciait", "z": 1.33, "n": 41}, {"t": "", "p": "", "o": "0103 | Il s’était prêté à une campagne électorale aux côtés de Trump en Géorgie.", "e": "He had taken part in an election campaign alongside Trump in Georgia.", "d": 5, "r": "prêté", "z": 4.06, "n": 13}, {"t": "", "p": "", "o": "0104 | Or, au lendemain de l’élection, l’une des premières informations a été que cette usine ne se ferait probablement pas.", "e": "Yet the day after the election, one of the first reports was that this factory would probably not be built.", "d": 5, "r": "usine", "z": 4.6, "n": 18}, {"t": "", "p": "", "o": "0105 | Les industriels européens, nombreux à vouloir investir aux États-Unis, vont devoir procéder à un important réveil stratégique.", "e": "European industrialists, many of whom want to invest in the United States, will have to undergo a major strategic wake-up call.", "d": 5, "r": "réveil", "z": 4.15, "n": 17}, {"t": "", "p": "", "o": "0106 | Enfin, le rejet des data centers par une partie de la population américaine mérite aussi notre attention, notamment en Europe, alors qu’on nous présente constamment les États-Unis comme l’eldorado de l’Intelligence Artificielle.", "e": "Finally, the rejection of data centers by part of the American population also deserves our attention, particularly in Europe, where the United States is constantly presented to us as the promised land of artificial intelligence.", "d": 9, "r": "centers", "z": 2.67, "n": 33}, {"t": "", "p": "", "o": "0107 | Cette élection montre que l’enthousiasme pour les affaires aux États-Unis est peut-être prématuré.", "e": "This election shows that enthusiasm for doing business in the United States may be premature.", "d": 5, "r": "prématuré", "z": 3.31, "n": 13}, {"t": "", "p": "", "o": "0108 | Jean-Louis Bourlanges :", "e": "Jean-Louis Bourlanges:", "d": 2, "r": "Jean-Louis", "z": 4.92, "n": 2}, {"t": "", "p": "", "o": "0109 | Béatrice a dit « ouf », et c’est le mot juste.", "e": "Béatrice said 'phew,' and that is exactly the right word.", "d": 4, "r": "Béatrice", "z": 3.55, "n": 8}, {"t": "", "p": "", "o": "0110 | Nous avons tous ressenti une profonde satisfaction en constatant que l’Amérique n’avait pas quitté les rives de la démocratie.", "e": "We all felt profound satisfaction when we saw that America had not abandoned the shores of democracy.", "d": 6, "r": "constatant", "z": 3.35, "n": 19}, {"t": "", "p": "", "o": "0111 | Quels que soient les résultats et les incertitudes sur l’avenir de Trump, nous avions le sentiment effroyable que notre grand allié depuis la fin de la Seconde Guerre mondiale avait basculé dans ce qu’il faut bien appeler le fascisme.", "e": "Whatever the results and whatever the uncertainties surrounding Trump's future, we had the dreadful feeling that our great ally since the end of the Second World War had crossed over into what can only be called fascism.", "d": 9, "r": "effroyable", "z": 3.21, "n": 40}, {"t": "", "p": "", "o": "0112 | Je n’aime pas employer ce mot, souvent galvaudé, mais Trump en présentait toutes les caractéristiques : racisme, concentration du pouvoir, mépris des libertés, nationalisme.", "e": "I dislike using this word, which is often overused, but Trump displayed all its characteristics: racism, concentration of power, contempt for freedoms, and nationalism.", "d": 8, "r": "galvaudé", "z": 2.34, "n": 23}, {"t": "", "p": "", "o": "0113 | Nous ignorions jusqu’où cette dérive pouvait aller.", "e": "We did not know how far this drift might go.", "d": 5, "r": "ignorions", "z": 2.25, "n": 8}, {"t": "", "p": "", "o": "0114 | L’ampleur de la victoire démocrate nous a surpris, mais surtout réconfortés.", "e": "The scale of the Democratic victory surprised us, but above all it reassured us.", "d": 6, "r": "réconfortés", "z": 1.86, "n": 10}, {"t": "", "p": "", "o": "0115 | Certains résultats, notamment au Texas, avaient été anticipés, mais leur ampleur restait difficile à prévoir, compte tenu de la complexité du système électoral américain, où chaque État dispose de deux sénateurs, quelle que soit sa population.", "e": "Some results, particularly in Texas, had been anticipated, but their scale remained difficult to predict, given the complexity of the American electoral system, in which each state has two senators regardless of its population.", "d": 9, "r": "anticipés", "z": 2.61, "n": 36}, {"t": "", "p": "", "o": "0116 | Les grands États Démocrates et les petits États du Midwest sont ainsi représentés de la même manière.", "e": "Large Democratic states and small Midwestern states are therefore represented in the same way.", "d": 6, "r": "représentés", "z": 3.91, "n": 17}, {"t": "", "p": "", "o": "0117 | Le résultat constitue donc un immense soulagement, une sorte de plébiscite pour la démocratie.", "e": "The result is thus an immense relief, a kind of plebiscite in favor of democracy.", "d": 6, "r": "plébiscite", "z": 3.11, "n": 14}, {"t": "", "p": "", "o": "0118 | On peut désormais se demander si le mistigri n’a pas franchi l’Atlantique.", "e": "We can now wonder whether the hot potato has crossed the Atlantic.", "d": 6, "r": "mistigri", "z": 1.86, "n": 11}, {"t": "", "p": "", "o": "0119 | Jusqu’ici, c’étaient les États-Unis qui menaçaient l’ordre démocratique et libéral construit après la guerre.", "e": "Until now, it was the United States that threatened the democratic and liberal order built after the war.", "d": 6, "r": "menaçaient", "z": 2.89, "n": 15}, {"t": "", "p": "", "o": "0120 | Désormais, les fragilités apparaissent surtout en Europe occidentale, particulièrement en France.", "e": "Now, the vulnerabilities are appearing above all in Western Europe, particularly in France.", "d": 5, "r": "fragilités", "z": 2.45, "n": 11}, {"t": "", "p": "", "o": "0121 | La balle est dans notre camp.", "e": "The ball is in our court.", "d": 3, "r": "balle", "z": 4.6, "n": 6}, {"t": "", "p": "", "o": "0122 | Sur les raisons de cette défaite, j’ai toujours considéré Trump comme un personnage ubuesque, mêlant absurdité totale et violence dictatoriale, comme chez Jarry.", "e": "As for the reasons for this defeat, I have always regarded Trump as an absurd, grotesque character, combining total absurdity with dictatorial violence, as in Jarry.", "d": 8, "r": "dictatoriale", "z": 2.36, "n": 23}, {"t": "", "p": "", "o": "0123 | Plusieurs facteurs se sont combinés.", "e": "Several factors came together.", "d": 4, "r": "combinés", "z": 3.35, "n": 5}, {"t": "", "p": "", "o": "0124 | Les Américains ont été heurtés par les ruptures démocratiques et par une corruption à ciel ouvert, dont on pouvait d’ailleurs s’étonner qu’elle ne suscite pas plus tôt davantage de réactions.", "e": "Americans were appalled by the breakdown of democratic norms and by corruption in plain sight, which, incidentally, one might have wondered had not provoked stronger reactions earlier.", "d": 9, "r": "heurtés", "z": 2.53, "n": 31}, {"t": "", "p": "", "o": "0125 | Sur le plan économique, la politique des « tariffs » a échoué.", "e": "Economically, the policy of tariffs failed.", "d": 6, "r": "tariffs", "z": 1.46, "n": 9}, {"t": "", "p": "", "o": "0126 | Les économistes avaient prévenu que les droits de douane seraient payés par les habitants du pays qui les imposait.", "e": "Economists had warned that tariffs would be paid by the inhabitants of the country imposing them.", "d": 6, "r": "imposait", "z": 3.3, "n": 19}, {"t": "", "p": "", "o": "0127 | C’est exactement ce qui s’est produit : les consommateurs américains, y compris les conservateurs, ont dû payer plus cher de nombreux produits.", "e": "That is exactly what happened: American consumers, including conservatives, had to pay more for many products.", "d": 6, "r": "conservateurs", "z": 4.11, "n": 21}, {"t": "", "p": "", "o": "0128 | En politique extérieure, les fantaisies de Trump, comme le changement de nom du golfe du Mexique, ont garée", "z": 2.9, "n": 16}, {"t": "", "p": "", "o": "0134 | Quant aux conséquences, Trump conserve beaucoup de pouvoirs, mais n’a plus les moyens politiques de mener sa grande politique provocatrice.", "e": "As for the consequences, Trump retains many powers, but no longer has the political means to pursue his grand provocative agenda.", "d": 7, "r": "provocatrice", "z": 2.73, "n": 19}, {"t": "", "p": "", "o": "0135 | Son principal instrument était l’intimidation.", "e": "His main instrument was intimidation.", "d": 3, "r": "intimidation", "z": 3.51, "n": 5}, {"t": "", "p": "", "o": "0136 | Il faisait peur à la presse, aux parlementaires et aux partenaires internationaux.", "e": "He frightened the press, lawmakers, and international partners.", "d": 4, "r": "parlementaires", "z": 4.15, "n": 12}, {"t": "", "p": "", "o": "0137 | Désormais, il ne fait plus peur.", "e": "Now he no longer frightens them.", "d": 3, "r": "Désormais", "z": 4.97, "n": 6}, {"t": "", "p": "", "o": "0138 | Il est politiquement mort, même s’il ne l’est pas institutionnellement.", "e": "He is politically dead, even if he is not institutionally dead.", "d": 5, "r": "institutionnellement", "z": 2.16, "n": 10}, {"t": "", "p": "", "o": "0139 | Il conserve ses décrets présidentiels et d’importantes prérogatives exécutives, mais son autorité politique est brisée.", "e": "He retains his executive orders and significant executive powers, but his political authority is broken.", "d": 6, "r": "exécutives", "z": 2.52, "n": 15}, {"t": "", "p": "", "o": "0140 | Que va-t-il se passer pendant les deux prochaines années ?", "e": "What will happen over the next two years?", "d": 4, "r": "prochaines", "z": 4.3, "n": 9}, {"t": "", "p": "", "o": "0141 | Sans doute pas grand-chose, car chacun observe les autres.", "e": "Probably not much, because everyone is watching everyone else.", "d": 4, "r": "observe", "z": 4.25, "n": 9}, {"t": "", "p": "", "o": "0142 | Le trumpisme est terminé, y compris au sein du Parti républicain.", "e": "Trumpism is over, including within the Republican Party.", "d": 6, "r": "trumpisme", "z": 1.4, "n": 11}, {"t": "", "p": "", "o": "0143 | Vance, Rubio, Tucker Carlson et tous ceux qui envisagent de succéder à Trump ne pensent plus qu’à leur avenir.", "e": "Vance, Rubio, Tucker Carlson, and all those considering succeeding Trump are thinking only about their own futures.", "d": 7, "r": "Vance", "z": 3.02, "n": 20}, {"t": "", "p": "", "o": "0144 | Ils se retrouvent dans la même situation que le bloc central face à Macron.", "e": "They find themselves in the same situation as the centrist bloc facing Macron.", "d": 5, "r": "retrouvent", "z": 4.25, "n": 14}, {"t": "", "p": "", "o": "0145 | Les Démocrates, de leur côté, restent profondément divisés sur des sujets majeurs, notamment Israël.", "e": "The Democrats, for their part, remain deeply divided on major issues, particularly Israel.", "d": 5, "r": "divisés", "z": 3.58, "n": 14}, {"t": "", "p": "", "o": "0146 | Mais ils ont accompli une évolution importante en substituant à la croisade wokiste un vieux fonds ouvriériste, que Trump a évidemment qualifié de marxiste, alors qu’il constitue la base historique du Parti démocrate.", "e": "But they have made an important shift by replacing the woke crusade with an old working-class tradition, which Trump has of course called Marxist, even though it is the historical foundation of the Democratic Party.", "d": 10, "r": "wokiste", "z": 0.0, "n": 33}, {"t": "", "p": "", "o": "0147 | L’expression lame duck est d’ailleurs un peu abusive dans ce contexte.", "e": "The expression 'lame duck' is, moreover, somewhat misleading in this context.", "d": 5, "r": "duck", "z": 3.15, "n": 11}, {"t": "", "p": "", "o": "0148 | Aux États-Unis, elle désigne normalement la période qui sépare l’élection d’un nouveau président de sa prise de fonction, lorsque deux présidents coexistent en quelque sorte.", "e": "In the United States, it normally refers to the period between the election of a new president and that president's taking office, when two presidents effectively coexist.", "d": 8, "r": "coexistent", "z": 2.85, "n": 25}, {"t": "", "p": "", "o": "0149 | Mais l’image est parlante.", "e": "But the image is apt.", "d": 4, "r": "parlante", "z": 2.75, "n": 4}, {"t": "", "p": "", "o": "0150 | Nous avons donc une Amérique profondément incertaine, qui a fait un choix fondamental sans avoir rien résolu.", "e": "We therefore have a deeply uncertain America, which has made a fundamental choice without resolving anything.", "d": 6, "r": "incertaine", "z": 3.56, "n": 16}, {"t": "", "p": "", "o": "0151 | Il faut s’attendre à des épisodes très durs au Congrès, à de nouveaux shutdowns et à une paralysie réciproque des Démocrates et des Républicains.", "e": "We should expect very tough episodes in Congress, new government shutdowns, and mutual paralysis between the Democrats and Republicans.", "d": 9, "r": "shutdowns", "z": 0.0, "n": 24}, {"t": "", "p": "", "o": "0152 | Michaela Wiegel :", "e": "Michaela Wiegel:", "d": 3, "r": "Michaela", "z": 2.58, "n": 2}, {"t": "", "p": "", "o": "0153 | Je suis tout à fait d’accord sur la fin du trumpisme.", "e": "I completely agree about the end of Trumpism.", "d": 6, "r": "trumpisme", "z": 1.4, "n": 11}, {"t": "", "p": "", "o": "0154 | On le voit déjà avec la tentative de J.", "e": "We can already see it in J.", "d": 3, "r": "tentative", "z": 4.48, "n": 8}, {"t": "", "p": "", "o": "0155 | D.", "e": "D.", "d": 1, "r": "", "z": null, "n": 0}, {"t": "", "p": "", "o": "0156 | Vance de prendre ses distances avec la guerre en Iran, en affirmant qu’il y avait toujours été opposé.", "e": "Vance's attempt to distance himself from the war in Iran by claiming that he had always opposed it.", "d": 7, "r": "Vance", "z": 3.02, "n": 19}, {"t": "", "p": "", "o": "0157 | Mais que signifie cette évolution pour l’Europe ?", "e": "But what does this development mean for Europe?", "d": 3, "r": "signifie", "z": 4.73, "n": 7}, {"t": "", "p": "", "o": "0158 | Sur ce point, je serais beaucoup plus prudente.", "e": "On this point, I would be much more cautious.", "d": 4, "r": "prudente", "z": 3.48, "n": 8}, {"t": "", "p": "", "o": "0159 | Je ne vois pas de perspective de tournant favorable aux Européens, que ce soit sur l’Ukraine, l’OTAN ou les droits de douane.", "e": "I see no prospect of a shift favorable to Europeans, whether on Ukraine, NATO, or tariffs.", "d": 7, "r": "douane", "z": 3.68, "n": 22}, {"t": "", "p": "", "o": "0160 | Nous devons donc rester vigilants et engagés.", "e": "We must therefore remain vigilant and engaged.", "d": 4, "r": "vigilants", "z": 3.22, "n": 7}, {"t": "", "p": "", "o": "0161 | Le Parti démocrate est certes très divisé, mais nous assistons pour la première fois au début d’un renouvellement.", "e": "The Democratic Party is certainly very divided, but for the first time we are witnessing the beginning of a renewal.", "d": 6, "r": "assistons", "z": 3.12, "n": 18}, {"t": "", "p": "", "o": "0162 | Ce qui était particulièrement frustrant lors de la candidature de Kamala Harris, c’était cette impression de prolongation de l’ère Biden, sans aucune personnalité nouvelle.", "e": "What was particularly frustrating about Kamala Harris's candidacy was the sense that the Biden era was simply being extended, with no new figures at all.", "d": 7, "r": "frustrant", "z": 3.63, "n": 24}, {"t": "", "p": "", "o": "0163 | Il avait fallu se rabattre sur une vice-présidente qui avait déjà déçu.", "e": "We had been forced to settle for a vice president who had already disappointed.", "d": 5, "r": "rabattre", "z": 3.18, "n": 12}, {"t": "", "p": "", "o": "0164 | Aujourd’hui, une multitude de nouveaux talents émerge, y compris parmi les gouverneurs.", "e": "Today, a multitude of new talents are emerging, including among governors.", "d": 5, "r": "émerge", "z": 3.37, "n": 13}, {"t": "", "p": "", "o": "0165 | Cette élection a donné lieu à de nombreuses premières.", "e": "This election produced many firsts.", "d": 3, "r": "élection", "z": 4.81, "n": 8}, {"t": "", "p": "", "o": "0166 | Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "0167 | Je ne voudrais pas attrister la compagnie, et j’ai naturellement éprouvé le même soulagement en découvrant les résultats de mardi.", "e": "I would not want to bring the mood down, and naturally I felt the same relief when I saw Tuesday's results.", "d": 7, "r": "attrister", "z": 2.31, "n": 20}, {"t": "", "p": "", "o": "0168 | Mais je n’oublierai pas de sitôt le degré de servilité dans lequel le Sénat et la Chambre des représentants des États-Unis ont sombré pendant deux ans.", "e": "But I will not soon forget the degree of servility into which the United States Senate and House of Representatives sank over the course of two years.", "d": 9, "r": "servilité", "z": 2.29, "n": 26}, {"t": "", "p": "", "o": "0169 | Je n’ai jamais imaginé que « Monsieur Smith au Sénat », le film de Frank Capra avec James Stewart, reflétait fidèlement la réalité.", "e": "I never imagined that 'Mr. Smith Goes to Washington,' Frank Capra's film starring James Stewart, faithfully reflected reality.", "d": 7, "r": "reflétait", "z": 2.73, "n": 21}, {"t": "", "p": "", "o": "0170 | Mais voir les élus descendre à un tel degré de bassesse, de servilité et de flatterie laisse peu de raisons de leur accorder durablement notre confiance …", "e": "But seeing elected officials sink to such a level of baseness, servility, and flattery gives us little reason to place our trust in them for long ...", "d": 9, "r": "servilité", "z": 2.29, "n": 26}, {"t": "", "p": "", "o": "0171 | VERS LA LIQUÉFACTION DU « BLOC CENTRAL » ?", "e": "TOWARD THE DISINTEGRATION OF THE 'CENTRAL BLOC'?", "d": 2, "r": "", "z": null, "n": 6}, {"t": "", "p": "", "o": "0172 | Introduction", "e": "Introduction", "d": 2, "r": "Introduction", "z": 4.41, "n": 1}, {"t": "", "p": "", "o": "0173 | Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "0174 | Depuis l’échec du maintien de l’ordre des 17 et 18 octobre, le jeu politique se focalise sur l’opposition entre le Rassemblement national, dans le rôle du parti de l’ordre, et La France insoumise, dans celui du parti de la rue.", "e": "Since the failure to maintain public order on October 17 and 18, political debate has focused on the opposition between the National Rally, cast as the party of order, and La France Insoumise, cast as the party of the streets.", "d": 9, "r": "focalise", "z": 3.18, "n": 38}, {"t": "", "p": "", "o": "0175 | À six mois du premier tour de l'élection présidentielle, les candidats apparentés au bloc central - Gabriel Attal, Edouard Philippe et Bruno Retailleau - enregistrent un tassement marqué de leur potentiel électoral.", "e": "Six months before the first round of the presidential election, candidates associated with the central bloc—Gabriel Attal, Édouard Philippe, and Bruno Retailleau—are seeing a marked decline in their electoral potential.", "d": 9, "r": "tassement", "z": 2.77, "n": 30}, {"t": "", "p": "", "o": "0176 | Ils ne parviennent pas à se départager et voient Marine Le Pen poursuivre sa course en tête.", "e": "They are unable to pull ahead of one another, while Marine Le Pen continues to lead the race.", "d": 6, "r": "départager", "z": 3.19, "n": 17}, {"t": "", "p": "", "o": "0177 | Dans un sondage Ifop-Fiducial pour LCI et Le Figaro publié le 3 novembre, Édouard Philippe descend sous la barre des 10% sur laquelle Raphaël Glucksman se maintient en perdant 2 points et demi.", "e": "In an Ifop-Fiducial poll for LCI and Le Figaro published on November 3, Édouard Philippe falls below the 10% threshold, while Raphaël Glucksmann remains there after losing two and a half points.", "d": 8, "r": "perdant", "z": 3.89, "n": 30}, {"t": "", "p": "", "o": "0178 | Gabriel Attal, Bruno Retailleau, Éric Zemmour et David Lisnard vivotent à plus ou moins 5%, (7% pour David Lisnard) tandis que Marine Le Pen est à 35% et Jean-Luc Mélenchon à 18%.", "e": "Gabriel Attal, Bruno Retailleau, Éric Zemmour, and David Lisnard are hovering at around 5% (7% for David Lisnard), while Marine Le Pen is at 35% and Jean-Luc Mélenchon at 18%.", "d": 9, "r": "vivotent", "z": 1.75, "n": 28}, {"t": "", "p": "", "o": "0179 | L’une gagne 1 point, l’autre en engrange 3 de plus.", "e": "One gains one point, while the other picks up three more.", "d": 5, "r": "engrange", "z": 2.55, "n": 8}, {"t": "", "p": "", "o": "0180 | Malgré de très nombreuses propositions depuis le début d'une campagne rythmée par les crises, les deux anciens locataires de Matignon semblent inaudibles et pâtissent de leur image d’héritiers d’Emmanuel Macron.", "e": "Despite putting forward a great many proposals since the start of a campaign punctuated by crises, the two former occupants of Matignon seem unable to make themselves heard and are suffering from their image as heirs to Emmanuel Macron.", "d": 9, "r": "pâtissent", "z": 2.36, "n": 30}, {"t": "", "p": "", "o": "0181 | Éclipsés par la crise sociale et politique qui polarise le pays, et confrontés à un vent de dégagisme après un décennat d'Emmanuel Macron, les deux anciens Premiers ministres et candidats à l'Élysée s'efforcent plus que jamais de se démarquer du chef de l'État pour sauver leur campagne.", "e": "eclipsed by the social and political crisis polarizing the country, and facing a backlash against incumbents after Emmanuel Macron's decade in power, the two former prime ministers and presidential hopefuls are trying harder than ever to distance themselves from the head of state to save their campaigns.", "d": 10, "r": "décennat", "z": 0.0, "n": 47}, {"t": "", "p": "", "o": "0182 | Depuis le 17 octobre, la droite et le centre rivalisent d'inventivité répressive, avec des accents toujours plus éloignés du macronisme originel.", "e": "Since October 17, the right and the center have been competing to devise ever more repressive measures, with rhetoric increasingly far removed from original Macronism.", "d": 7, "r": "macronisme", "z": 2.23, "n": 20}, {"t": "", "p": "", "o": "0183 | Gabriel Attal et Bruno Retailleau, réclament à l'exécutif le recours à l'état d'urgence, un ensemble de dispositions exceptionnelles et provisoires surtout prévues pour lutter contre le terrorisme ou limiter les libertés publiques lors d'une crise sanitaire comme le Covid, tandis qu’Edouard Philippe déclare vouloir de rétablir la « double peine » contre les délinquants étrangers, ou encore de développer la reconnaissance faciale et les techniques de marquage indélébile pour mieux identifier les casseurs.", "e": "Gabriel Attal and Bruno Retailleau are demanding that the executive branch invoke a state of emergency, a set of exceptional and temporary measures mainly intended to fight terrorism or restrict civil liberties during a health crisis such as Covid, while Édouard Philippe says he wants to reinstate the 'double penalty' for foreign offenders, and to develop facial recognition and indelible marking techniques to identify rioters more effectively.", "d": 9, "r": "indélébile", "z": 2.91, "n": 72}, {"t": "", "p": "", "o": "0184 | À l'heure où le bloc central déserte l'Assemblée nationale, le gouvernement collectionne les défaites sur les textes budgétaires Depuis début octobre, l’Assemblée nationale examine le budget 2027.", "e": "At a time when the central bloc is abandoning the National Assembly, the government is piling up defeats on budget bills. Since early October, the National Assembly has been examining the 2027 budget.", "d": 8, "r": "collectionne", "z": 3.09, "n": 26}, {"t": "", "p": "", "o": "0185 | Conscients que tout ou presque se joue ailleurs : à Bercy, à Matignon, à l’Élysée, ou dans la rue, les députés renâclent à siéger en séance.", "e": "Conscious that almost everything is being decided elsewhere—in Bercy, Matignon, the Élysée, or out on the streets—members of parliament are reluctant to attend plenary sessions.", "d": 9, "r": "renâclent", "z": 1.43, "n": 25}, {"t": "", "p": "", "o": "0186 | Le 23 octobre le projet de loi de financement de la Sécurité sociale a été refusé en première lecture et mercredi ils ont rejeté en première lecture, à l’unanimité des votes exprimés, le projet de budget de l’État.", "e": "On October 23, the Social Security financing bill was rejected at first reading, and on Wednesday they rejected the state budget bill at first reading, with all votes cast opposing it.", "d": 8, "r": "exprimés", "z": 3.73, "n": 36}, {"t": "", "p": "", "o": "0187 | Kontildondit ?", "e": "What do you say?", "d": 4, "r": "Kontildondit", "z": 0.0, "n": 1}, {"t": "", "p": "", "o": "0188 | Michaela Wiegel :", "e": "Michaela Wiegel:", "d": 3, "r": "Michaela", "z": 2.58, "n": 2}, {"t": "", "p": "", "o": "0189 | Nous passons du soulagement à la consternation, sinon de l’espoir au désespoir.", "e": "We are moving from relief to dismay, if not from hope to despair.", "d": 5, "r": "consternation", "z": 3.0, "n": 12}, {"t": "", "p": "", "o": "0190 | J’ai essayé de prendre un peu de recul : il est normal qu’après dix ans au pouvoir, une fin de règne soit difficile, et que plusieurs candidats du camp présidentiel cherchent à succéder à Emmanuel Macron.", "e": "I have tried to take a step back: it is normal that, after ten years in power, the end of a reign should be difficult, and that several candidates from the president's camp should seek to succeed Emmanuel Macron.", "d": 9, "r": "succéder", "z": 3.68, "n": 36}, {"t": "", "p": "", "o": "0191 | Mais ce qui rend la situation si inquiétante, c’est l’absence totale d’accord sur la manière de désigner un candidat ou une candidate capable de rassembler le centre.", "e": "But what makes the situation so worrying is the complete lack of agreement on how to choose a candidate capable of uniting the center.", "d": 8, "r": "inquiétante", "z": 3.51, "n": 27}, {"t": "", "p": "", "o": "0192 | Nous avons en outre l’impression qu’il n’est question que de personnes.", "e": "We also have the impression that everything is about individuals.", "d": 4, "r": "outre", "z": 4.97, "n": 12}, {"t": "", "p": "", "o": "0193 | Certes, le système présidentiel français accorde davantage d’importance au caractère qu’au programme, mais il est stupéfiant que seuls l’extrême gauche et l’extrême droite déroulent leur programme, tandis que le centre reste incapable de proposer concrètement un avenir aux Français.", "e": "Certainly, the French presidential system gives more importance to character than to a platform, but it is astonishing that only the far left and far right are setting out their programs, while the center remains unable to offer the French people a concrete vision of the future.", "d": 9, "r": "stupéfiant", "z": 3.15, "n": 40}, {"t": "", "p": "", "o": "0194 | C’est aussi ce qui inquiète les autres pays européens.", "e": "This is also what worries other European countries.", "d": 4, "r": "inquiète", "z": 4.59, "n": 9}, {"t": "", "p": "", "o": "0195 | Nous retrouvons, d’une certaine manière, la situation du référendum de 2005, avec une alliance des extrêmes pour rejeter l’Union européenne de l’intérieur.", "e": "In a sense, we are back in the situation of the 2005 referendum, with an alliance of the extremes seeking to reject the European Union from within.", "d": 7, "r": "retrouvons", "z": 3.51, "n": 21}, {"t": "", "p": "", "o": "0196 | Il ne s’agit plus de défendre explicitement le Frexit, mais les promesses de Marine Le Pen, si elles étaient appliquées, conduiraient à un blocage de l’Union européenne.", "e": "It is no longer a matter of explicitly advocating Frexit, but Marine Le Pen's promises, if implemented, would lead to a deadlock in the European Union.", "d": 9, "r": "conduiraient", "z": 2.14, "n": 27}, {"t": "", "p": "", "o": "0197 | Jean-Luc Mélenchon annonce lui aussi qu’il ne respecterait plus les règles européennes qui lui déplaisent, en affirmant que lorsque la France dit non, les autres finiront par trouver un compromis avec elle.", "e": "Jean-Luc Mélenchon is also announcing that he would no longer abide by European rules he dislikes, claiming that when France says no, the others will eventually find a compromise with it.", "d": 9, "r": "respecterait", "z": 2.43, "n": 33}, {"t": "", "p": "", "o": "0198 | Nous aurions espéré que les candidats du centre proposent une vision de l’Europe, reconnaissant ce qui doit être critiqué dans son fonctionnement actuel, mais montrant une voie possible.", "e": "We would have hoped that the centrist candidates would put forward a vision for Europe, acknowledging what needs to be criticized about its current functioning while showing a possible way forward.", "d": 8, "r": "espéré", "z": 3.52, "n": 28}, {"t": "", "p": "", "o": "0199 | Cela paraît d’autant plus nécessaire au regard de la situation financière catastrophique de la France après dix ans de macronisme, aggravée par la suspension de la réforme des retraites, obtenue notamment par les socialistes en échange de leur soutien au gouvernement de Sébastien Lecornu.", "e": "This seems all the more necessary given France's catastrophic financial situation after ten years of Macronism, worsened by the suspension of pension reform, secured in particular by the Socialists in exchange for their support for Sébastien Lecornu's government.", "d": 10, "r": "macronisme", "z": 2.23, "n": 44}, {"t": "", "p": "", "o": "0200 | Or, aucune personnalité ne se dessine.", "e": "Yet no figure is emerging.", "d": 3, "r": "dessine", "z": 3.88, "n": 6}, {"t": "", "p": "", "o": "0201 | J’ai comparé cette situation à la fin du règne de Jacques Chirac, qui fut tout sauf agréable.", "e": "I compared this situation with the end of Jacques Chirac's time in power, which was anything but pleasant.", "d": 6, "r": "comparé", "z": 4.05, "n": 17}, {"t": "", "p": "", "o": "0202 | Mais à l’époque, deux personnalités se détachaient, dont l’une manifestait une énergie et une détermination extraordinaires pour accéder à la présidence.", "e": "But at the time, two figures stood out, one of whom displayed extraordinary energy and determination to reach the presidency.", "d": 8, "r": "détachaient", "z": 1.8, "n": 21}, {"t": "", "p": "", "o": "0203 | Chez Édouard Philippe, je ne ressens ni cette énergie ni cette volonté de s’imposer.", "e": "With Édouard Philippe, I do not sense that energy or that desire to assert himself.", "d": 5, "r": "ressens", "z": 3.95, "n": 14}, {"t": "", "p": "", "o": "0204 | Akram Belkaïd :", "e": "Akram Belkaïd:", "d": 4, "r": "Akram", "z": 2.36, "n": 2}, {"t": "", "p": "", "o": "0205 | Nous assistons à l’échec d’un récit politique fondé sur le postulat qu’il suffit, pour être élu président de la République, d’accéder au second tour face à Marine Le Pen ou Jordan Bardella.", "e": "We are witnessing the failure of a political narrative based on the assumption that, to be elected president of the Republic, all one has to do is reach the second round against Marine Le Pen or Jordan Bardella.", "d": 9, "r": "assistons", "z": 3.12, "n": 33}, {"t": "", "p": "", "o": "0206 | On compte alors sur le barrage républicain, les appels à la mobilisation et le rejet du Rassemblement national.", "e": "The idea is then to rely on the republican front, calls for mobilization, and rejection of the National Rally.", "d": 6, "r": "rejet", "z": 4.07, "n": 18}, {"t": "", "p": "", "o": "0207 | Tout a été organisé comme une fusée à deux étages, consistant à ménager un temps le Rassemblement national pour permettre ensuite à un candidat du centre, voire de l’extrême centre, de l’affronter.", "e": "Everything was organized like a two-stage rocket: give the National Rally some room for a while, then allow a centrist, or even far-centrist, candidate to face it.", "d": 9, "r": "ménager", "z": 3.54, "n": 31}, {"t": "", "p": "", "o": "0208 | Au passage, cher Philippe, on peut passer directement de l’état solide à l’état gazeux : cela s’appelle la sublimation, et c’est précisément ce à quoi nous assistons.", "e": "By the way, dear Philippe, one can go directly from a solid state to a gaseous state: that is called sublimation, and that is precisely what we are witnessing.", "d": 8, "r": "sublimation", "z": 2.69, "n": 26}, {"t": "", "p": "", "o": "0209 | Il est d’ailleurs assez amusant de voir Édouard Philippe et Gabriel Attal s’accuser mutuellement d’être macronistes.", "e": "It is also rather amusing to see Édouard Philippe and Gabriel Attal accusing each other of being Macronists.", "d": 6, "r": "macronistes", "z": 2.5, "n": 16}, {"t": "", "p": "", "o": "0210 | On croit rêver.", "e": "You could hardly make it up.", "d": 2, "r": "rêver", "z": 4.22, "n": 3}, {"t": "", "p": "", "o": "0211 | Je voudrais cependant aborder un point sur lequel je sais être minoritaire autour de cette table.", "e": "I would nevertheless like to address a point on which I know I am in the minority around this table.", "d": 6, "r": "minoritaire", "z": 3.64, "n": 16}, {"t": "", "p": "", "o": "0212 | Sans être électeur de La France insoumise et sans avoir jamais voté pour ce parti, je ne considère pas qu’il soit d’extrême gauche.", "e": "Although I am not a La France Insoumise voter and have never voted for that party, I do not consider it to be far left.", "d": 8, "r": "insoumise", "z": 3.29, "n": 24}, {"t": "", "p": "", "o": "0213 | Qualifier LFI d’extrême gauche revient à dire que Mitterrand et son programme commun de 1974 relevaient de l’extrême gauche.", "e": "Calling LFI far left is tantamount to saying that Mitterrand and his 1974 Common Program belonged to the far left.", "d": 7, "r": "relevaient", "z": 2.87, "n": 18}, {"t": "", "p": "", "o": "0214 | Je vous invite à comparer attentivement les deux programmes, mesure par mesure.", "e": "I invite you to compare the two programs carefully, measure by measure.", "d": 5, "r": "attentivement", "z": 3.73, "n": 12}, {"t": "", "p": "", "o": "0215 | Ce que propose LFI n’est pas de l’extrême gauche.", "e": "What LFI proposes is not far left.", "d": 3, "r": "extrême", "z": 4.74, "n": 9}, {"t": "", "p": "", "o": "0216 | Lutte ouvrière et le NPA sont des partis d’extrême gauche.", "e": "Lutte Ouvrière and the NPA are far-left parties.", "d": 4, "r": "ouvrière", "z": 3.88, "n": 10}, {"t": "", "p": "", "o": "0217 | On peut évidemment critiquer La France insoumise, notamment sur la faisabilité de son programme ou sa position vis-à-vis de l’Europe.", "e": "Of course, one can criticize La France Insoumise, particularly the feasibility of its platform or its position toward Europe.", "d": 7, "r": "insoumise", "z": 3.29, "n": 20}, {"t": "", "p": "", "o": "0218 | Mais ce qui me choque dans cette qualification, c’est qu’elle conduit à mettre sur le même plan, à égalité, les deux partis susceptibles de se retrouver au second tour.", "e": "But what shocks me about this label is that it leads to placing the two parties that could reach the second round on the same level, as equals.", "d": 8, "r": "choque", "z": 3.92, "n": 30}, {"t": "", "p": "", "o": "0219 | À mes yeux, ce discours témoigne d’une indulgence à l’égard du Rassemblement national.", "e": "In my view, this rhetoric shows indulgence toward the National Rally.", "d": 5, "r": "indulgence", "z": 3.19, "n": 13}, {"t": "", "p": "", "o": "0220 | Béatrice Giblin :", "e": "Béatrice Giblin:", "d": 3, "r": "Béatrice", "z": 3.55, "n": 2}, {"t": "", "p": "", "o": "0221 | La première question concernant l’avenir du bloc central est de savoir si l’on peut vraiment parler de « bloc ».", "e": "The first question concerning the future of the central bloc is whether we can really speak of a 'bloc.'", "d": 5, "r": "bloc", "z": 4.49, "n": 18}, {"t": "", "p": "", "o": "0222 | Un bloc est quelque chose de soudé, qui pèse.", "e": "A bloc is something cohesive, something with weight.", "d": 5, "r": "soudé", "z": 3.08, "n": 9}, {"t": "", "p": "", "o": "0223 | Ici, nous avons plutôt un ensemble de petits cailloux complètement dispersés.", "e": "Here, we have more of a collection of little stones scattered all over the place.", "d": 5, "r": "dispersés", "z": 3.41, "n": 11}, {"t": "", "p": "", "o": "0224 | La notion même de bloc central est illusoire.", "e": "The very notion of a central bloc is an illusion.", "d": 4, "r": "illusoire", "z": 3.31, "n": 8}, {"t": "", "p": "", "o": "0225 | Nous sommes face à une fragmentation totale, sans vision ni programme.", "e": "We are faced with total fragmentation, with no vision or platform.", "d": 5, "r": "fragmentation", "z": 3.21, "n": 11}, {"t": "", "p": "", "o": "0226 | Ces candidats défendent à peu près la même orientation, guère différente de celle que nous venons de subir pendant dix ans, sans parvenir à se distinguer véritablement.", "e": "These candidates defend more or less the same general direction, scarcely different from what we have just endured for ten years, without managing to distinguish themselves in any meaningful way.", "d": 8, "r": "défendent", "z": 3.79, "n": 27}, {"t": "", "p": "", "o": "0227 | Deux d’entre eux ont été Premiers ministres, dont l’un pendant plus de deux ans.", "e": "Two of them have been prime ministers, one for more than two years.", "d": 5, "r": "ministres", "z": 4.53, "n": 14}, {"t": "", "p": "", "o": "0228 | Il leur est difficile d’effacer ce passé, notamment à Édouard Philippe, dont la politique a contribué à la radicalisation des Gilets jaunes.", "e": "It is difficult for them to erase that past, particularly for Édouard Philippe, whose policies contributed to the radicalization of the Yellow Vests.", "d": 7, "r": "radicalisation", "z": 3.45, "n": 21}, {"t": "", "p": "", "o": "0229 | Il était à la tête du gouvernement et s’est montré sourd à un certain nombre de revendications.", "e": "He was head of government and turned a deaf ear to a number of demands.", "d": 6, "r": "sourd", "z": 3.75, "n": 17}, {"t": "", "p": "", "o": "0230 | Il n’est donc pas étonnant qu’il ne suscite aujourd’hui guère d’enthousiasme.", "e": "It is therefore hardly surprising that he inspires little enthusiasm today.", "d": 5, "r": "aujourd", "z": 3.54, "n": 13}, {"t": "", "p": "", "o": "0231 | Nous sommes en outre dans un contexte général de dégagisme.", "e": "We are also in a broader climate of anti-incumbent sentiment.", "d": 6, "r": "dégagisme", "z": 1.72, "n": 10}, {"t": "", "p": "", "o": "0232 | On l’observe aussi en Suède, où un parti de droite soutenu par l’extrême droite peut être rejeté tout autant qu’un gouvernement de gauche.", "e": "We can see it in Sweden too, where a right-wing party supported by the far right can be rejected just as much as a left-wing government.", "d": 7, "r": "rejeté", "z": 3.99, "n": 24}, {"t": "", "p": "", "o": "0233 | Ce phénomène ne frappe pas seulement la gauche : la droite est également concernée.", "e": "This phenomenon does not affect only the left: the right is also concerned.", "d": 5, "r": "concernée", "z": 3.7, "n": 13}, {"t": "", "p": "", "o": "0234 | Dans ces conditions, la situation du bloc central est extrêmement difficile.", "e": "Under these conditions, the central bloc is in an extremely difficult position.", "d": 4, "r": "bloc", "z": 4.49, "n": 11}, {"t": "", "p": "", "o": "0235 | D’une certaine manière, les électeurs ne veulent plus voir ses représentants.", "e": "In a sense, voters no longer want to see its representatives.", "d": 4, "r": "électeurs", "z": 4.47, "n": 11}, {"t": "", "p": "", "o": "0236 | Le problème est que les alternatives ne sont pas nécessairement rassurantes.", "e": "The problem is that the alternatives are not necessarily reassuring.", "d": 5, "r": "rassurantes", "z": 2.68, "n": 11}, {"t": "", "p": "", "o": "0237 | Les événements du 17 octobre ont aggravé cette situation.", "e": "The events of October 17 made this situation worse.", "d": 4, "r": "aggravé", "z": 3.21, "n": 8}, {"t": "", "p": "", "o": "0238 | Je voudrais rappeler la carte des pillages, comparée à celle du parcours de la manifestation.", "e": "I would like to recall the map of the looting, compared with the route of the demonstration.", "d": 6, "r": "pillages", "z": 3.23, "n": 15}, {"t": "", "p": "", "o": "0239 | Hormis les abords de la place de la République, les deux ne coïncidaient absolument pas.", "e": "Except for the area around Place de la République, the two did not coincide at all.", "d": 7, "r": "coïncidaient", "z": 1.85, "n": 15}, {"t": "", "p": "", "o": "0240 | La manifestation du côté de la place de Clichy et les pillages commis dans les quartiers aisés de la rive droite étaient totalement dissociés.", "e": "The demonstration around Place de Clichy and the looting in the affluent neighborhoods on the Right Bank were entirely separate.", "d": 8, "r": "dissociés", "z": 2.31, "n": 24}, {"t": "", "p": "", "o": "0241 | Il n’y avait donc pas de lien direct entre les deux phénomènes.", "e": "There was therefore no direct link between the two phenomena.", "d": 4, "r": "phénomènes", "z": 4.1, "n": 12}, {"t": "", "p": "", "o": "0242 | Pourtant, ces événements ont entraîné une radicalisation des discours sur le maintien de l’ordre à droite, confortant Marine Le Pen dans son image de représentante du parti de l’ordre.", "e": "Yet these events led to a radicalization of right-wing rhetoric on maintaining public order, reinforcing Marine Le Pen's image as the representative of the party of order.", "d": 9, "r": "confortant", "z": 2.28, "n": 29}, {"t": "", "p": "", "o": "0243 | Je serais d’ailleurs curieuse de voir ce qu’il en serait réellement si elle arrivait au pouvoir …", "e": "I would, moreover, be curious to see what would actually happen if she came to power ...", "d": 6, "r": "curieuse", "z": 3.78, "n": 17}, {"t": "", "p": "", "o": "0244 | C’est là que la situation s’est cristallisée.", "e": "That is where the situation crystallized.", "d": 5, "r": "cristallisée", "z": 2.29, "n": 7}, {"t": "", "p": "", "o": "0245 | Je trouve extrêmement grave que plusieurs dirigeants du bloc central dérivent aussi clairement vers la droite.", "e": "I find it extremely serious that several leaders of the central bloc are moving so clearly to the right.", "d": 6, "r": "dérivent", "z": 2.83, "n": 16}, {"t": "", "p": "", "o": "0246 | Je ne vois pas comment les qualifier autrement.", "e": "I do not see how else to describe them.", "d": 4, "r": "qualifier", "z": 4.11, "n": 8}, {"t": "", "p": "", "o": "0247 | Si l’on refuse de parler d’extrême gauche à propos de LFI, on ne peut plus véritablement parler de centre à propos de certains de ces responsables.", "e": "If we refuse to call LFI far left, then we can no longer really call some of these leaders centrist.", "d": 7, "r": "véritablement", "z": 4.05, "n": 26}, {"t": "", "p": "", "o": "0248 | Jean-Louis Bourlanges :", "e": "Jean-Louis Bourlanges:", "d": 2, "r": "Jean-Louis", "z": 4.92, "n": 2}, {"t": "", "p": "", "o": "0249 | Nous sommes effectivement dans une situation dramatique pour ce qui n’est absolument pas un bloc.", "e": "We are indeed in a dramatic situation for something that is absolutely not a bloc.", "d": 5, "r": "dramatique", "z": 4.16, "n": 15}, {"t": "", "p": "", "o": "0250 | Béatrice a raison : c’est plutôt un arc, une plateforme qui déborde de tous côtés et qui, de surcroît, se rétrécit.", "e": "Béatrice is right: it is more of an arc, a platform spilling over on all sides and, on top of that, shrinking.", "d": 7, "r": "rétrécit", "z": 2.87, "n": 19}, {"t": "", "p": "", "o": "0251 | Les causes sont profondes.", "e": "The causes are deep-rooted.", "d": 3, "r": "profondes", "z": 3.96, "n": 4}, {"t": "", "p": "", "o": "0252 | Sans être exagérément marxiste, bien que j’aie beaucoup d’admiration pour le grand sociologue allemand, il faut reconnaître que les classes moyennes traversent une situation extrêmement difficile en France, en Europe et aux États-Unis.", "e": "Without being excessively Marxist, although I greatly admire the great German sociologist, we must acknowledge that the middle classes are going through an extremely difficult time in France, Europe, and the United States.", "d": 9, "r": "exagérément", "z": 2.7, "n": 33}, {"t": "", "p": "", "o": "0253 | La mondialisation, Alain Minc avait raison sur ce point, a été heureuse pour le tiers-monde.", "e": "Globalization—Alain Minc was right on this point—has been beneficial for the Third World.", "d": 5, "r": "mondialisation", "z": 3.82, "n": 14}, {"t": "", "p": "", "o": "0254 | Elle a considérablement réduit la famine et la pauvreté.", "e": "It has considerably reduced famine and poverty.", "d": 4, "r": "famine", "z": 3.74, "n": 8}, {"t": "", "p": "", "o": "0255 | Mais elle a été extrêmement préjudiciable aux classes moyennes des pays développés, désormais plongées dans une profonde précarité, encore aggravée par les perspectives terrifiantes de l’Intelligence Artificielle.", "e": "But it has been extremely harmful to the middle classes in developed countries, which are now plunged into deep insecurity, further aggravated by the terrifying prospects of artificial intelligence.", "d": 8, "r": "terrifiantes", "z": 2.63, "n": 26}, {"t": "", "p": "", "o": "0256 | Ces populations ont le sentiment de ne plus avoir d’issue.", "e": "These populations feel they have no way out.", "d": 4, "r": "populations", "z": 4.5, "n": 10}, {"t": "", "p": "", "o": "0257 | Elles ne réagissent pas rationnellement, mais par le déni et le refus, en réclamant toujours davantage de crédits pour s’en sortir, ce qui constitue évidemment une impasse et les éloigne du bloc central.", "e": "They do not react rationally, but through denial and refusal, demanding ever more credit to get by, which is obviously a dead end and drives them away from the central bloc.", "d": 9, "r": "rationnellement", "z": 2.88, "n": 33}, {"t": "", "p": "", "o": "0258 | Face à cette situation, les responsables du centre ont d’abord fait preuve de paresse.", "e": "Faced with this situation, centrist leaders initially showed laziness.", "d": 5, "r": "paresse", "z": 3.34, "n": 14}, {"t": ""
