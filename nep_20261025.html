<script>
const D=[{"t": "", "p": "", "o": "Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "Comme le prouve le rapport du Reuters Institute de 2026, l’Intelligence artificielle bouscule tous les secteurs, et en premier lieu peut-être celui de l’information : 10% des sondés dans 48 pays utilisent un chatbot quotidiennement, et seuls 17% acceptent de payer pour accéder à une information de qualité, alors que 62% des personnes craignent la désinformation.", "e": "As the 2026 Reuters Institute report shows, artificial intelligence is shaking up every sector, and perhaps information above all: 10% of respondents in 48 countries use a chatbot daily, and only 17% are willing to pay for access to quality information, while 62% of people fear disinformation.", "d": 9, "r": "chatbot", "z": 2.28, "n": 50}, {"t": "", "p": "", "o": "Ce rapport montre également que pour la première fois de l’histoire la plupart des sondés passent par une plateforme intermédiaire (chatbot IA, réseau social …) pour accéder à l’information, ce qui hyper-personnalise cette dernière et rend le travail des journalistes de plus en plus invisible.", "e": "The report also shows that, for the first time in history, most respondents go through an intermediary platform (an AI chatbot, social network, etc.) to access information, making it hyper-personalized and rendering journalists’ work increasingly invisible.", "d": 9, "r": "hyper-personnalise", "z": 2.21, "n": 44}, {"t": "", "p": "", "o": "Ces derniers perdent non seulement en visibilité mais aussi en revenu : déjà paupérisés depuis l’arrivée des réseaux sociaux et la fin de leur contrôle sur la diffusion de l’information, les journalistes n’ont désormais plus le monopole de la production d’information.", "e": "Journalists are losing not only visibility but also income: already impoverished since the arrival of social networks and the loss of their control over information distribution, they no longer have a monopoly on producing information.", "d": 10, "r": "paupérisés", "z": 1.3, "n": 40}, {"t": "", "p": "", "o": "Devenu liquide, l’information n’a plus de forme précise, peut d’un texte devenir un audio voire une vidéo avec un simple clic.", "e": "Information has become fluid; it no longer has a fixed form and can be turned from text into audio or even video with a single click.", "d": 5, "r": "clic", "z": 3.79, "n": 20}, {"t": "", "p": "", "o": "Non seulement les journalistes n’ont plus le contrôle de la production, mais les machines deviennent également les principales lectrices de l’information, pouvant désormais fonctionner en boucles autonomes.", "e": "Not only have journalists lost control of production, but machines are also becoming the main readers of information and can now operate in autonomous loops.", "d": 7, "r": "lectrices", "z": 2.91, "n": 27}, {"t": "", "p": "", "o": "À quoi bon les journalistes aujourd’hui alors ?", "e": "What is the point of journalists today, then?", "d": 5, "r": "aujourd", "z": 3.54, "n": 8}, {"t": "", "p": "", "o": "« Pendant longtemps, le journalisme a été défini par ce qu’il produisait.", "e": "“For a long time, journalism was defined by what it produced.", "d": 6, "r": "produisait", "z": 3.35, "n": 11}, {"t": "", "p": "", "o": "À l’ère de l’IA, il sera de plus en plus jugé sur ce qu’il garantit : des faits établis, des méthodes transparentes, une chaîne de responsabilité identifiable.", "e": "In the age of AI, it will increasingly be judged by what it guarantees: established facts, transparent methods, and an identifiable chain of accountability.", "d": 7, "r": "identifiable", "z": 3.11, "n": 27}, {"t": "", "p": "", "o": "Y parvenir ne dépend que de l’homme, pas de la machine.", "e": "Achieving this depends on human beings alone, not machines.", "d": 4, "r": "parvenir", "z": 4.25, "n": 11}, {"t": "", "p": "", "o": "C’est ce qui rend la transformation en cours passionnante. »", "e": "That is what makes the transformation underway so fascinating.”", "d": 5, "r": "passionnante", "z": 3.32, "n": 9}, {"t": "", "p": "", "o": "C’est par ces mots que se concluait une tribune parue dans Le Monde le 2 juin dernier, intitulée : « Avec l’IA, la machine devient un public du journalisme, et même son premier lecteur ».", "e": "Those were the words that concluded an opinion piece published in Le Monde on June 2, entitled “With AI, the machine becomes an audience for journalism—and even its first reader.”", "d": 7, "r": "concluait", "z": 2.98, "n": 31}, {"t": "", "p": "", "o": "Fabrice Fries, vous êtes l’auteur de cette tribune, qui cherche à dresser le bilan de la révolution historique que nous vivons.", "e": "Fabrice Fries, you wrote this opinion piece, which seeks to take stock of the historic revolution we are experiencing.", "d": 5, "r": "dresser", "z": 3.76, "n": 21}, {"t": "", "p": "", "o": "En tant que président-directeur général de l’AFP, vous êtes en effet aux premières loges de la déshumanisation de l’information, un processus qui a atteint un tel point qu’on peut aujourd’hui interviewer une IA sur ses méthodes mais aussi ses représentations, comme l’a fait un journaliste de TTSO avec l’IA Claude le 2 octobre dernier.", "e": "As chief executive officer and chairman of AFP, you are on the front lines of the dehumanization of information—a process that has gone so far that today one can interview an AI about its methods and representations, as a TTSO journalist did with Claude AI on October 2.", "d": 8, "r": "déshumanisation", "z": 2.58, "n": 53}, {"t": "", "p": "", "o": "À la croyance que cette déshumanisation peut être totale, que tout peut – doit ? – être délégué à l’IA, vous répondez que les journalistes sont et seront toujours aussi importants, si ce n’est plus : gardiens de la vérité dans une chaîne de responsabilité complète, ils peuvent et doivent continuer leur tâche de veilleurs de la démocratie, dans un monde qui s’est profondément transformé en quelques années.", "e": "In response to the belief that this dehumanization can be total, that everything can—or should?—be delegated to AI, you argue that journalists are and will remain just as important, if not more so: as guardians of truth within a complete chain of accountability, they can and must continue their work as sentinels of democracy in a world that has changed profoundly in just a few years.", "d": 8, "r": "déshumanisation", "z": 2.58, "n": 64}, {"t": "", "p": "", "o": "Pour reprendre vos mots, l’IA n’est « ni une fatalité technologique ni une nécessité économique, n’est pas un projet informatique », mais une réalité qui, comme toutes les autres, s’ouvre à l’ingéniosité comme à la responsabilité humaines.", "e": "To use your words, AI is “neither a technological inevitability nor an economic necessity, and it is not an IT project,” but a reality that, like all others, is open to human ingenuity and responsibility.", "d": 7, "r": "ingéniosité", "z": 3.14, "n": 35}, {"t": "", "p": "", "o": "Peut-être pourrions-nous, avant d’aborder directement l’IA et ses conséquences sur le journalisme, faire avec vous un point sur la situation générale de la profession : les attaques populistes dont elle est l’objet, les plans sociaux dans les médias, les nouveaux usages des plateformes pour accéder à l’information vidéo, la perte d’influence des médias traditionnels, la position de votre agence dans le débat sur le pluralisme et le nouveau rôle du journalisme, que je viens d’évoquer en reprenant votre tribune.", "e": "Perhaps before addressing AI and its consequences for journalism directly, we could take stock with you of the profession’s overall situation: the populist attacks it faces, layoffs in the media, new ways of using platforms to access video news, the loss of influence of traditional media, your agency’s position in the debate over pluralism, and the new role of journalism that I just mentioned by referring to your opinion piece.", "d": 7, "r": "populistes", "z": 3.1, "n": 78}, {"t": "", "p": "", "o": "Kontildondit ?", "e": "Kontildondit?", "d": 8, "r": "Kontildondit", "z": 0.0, "n": 1}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "J’ai commencé à travailler dans le secteur de l’information en 1996, il y a exactement 30 ans.", "e": "I began working in the information sector in 1996, exactly 30 years ago.", "d": 3, "r": "secteur", "z": 4.91, "n": 14}, {"t": "", "p": "", "o": "J’étais chez Vivendi Universal Publishing, en charge de la presse.", "e": "I was at Vivendi Universal Publishing, in charge of the press.", "d": 2, "r": "charge", "z": 5.02, "n": 10}, {"t": "", "p": "", "o": "À l’époque, la presse était florissante, la télévision dominante et le JT de TF1 rassemblait 15 à 20 millions de téléspectateurs.", "e": "At the time, the press was thriving, television was dominant, and TF1’s evening news attracted 15 to 20 million viewers.", "d": 7, "r": "rassemblait", "z": 2.86, "n": 19}, {"t": "", "p": "", "o": "Pour un politique, passer au JT était le graal, et la profession de journaliste était encore très désirable.", "e": "For a politician, appearing on the evening news was the ultimate prize, and journalism was still a highly desirable profession.", "d": 6, "r": "désirable", "z": 3.14, "n": 18}, {"t": "", "p": "", "o": "Aujourd’hui, le paysage s’est beaucoup assombri.", "e": "Today, the landscape has grown much darker.", "d": 7, "r": "assombri", "z": 2.49, "n": 7}, {"t": "", "p": "", "o": "Les plans sociaux se multiplient dans la presse, le JT de TF1 rassemble environ 5 millions de téléspectateurs et la télévision commence elle aussi à subir la crise des recettes publicitaires, qui migrent vers les plateformes.", "e": "Layoff plans are multiplying in the press, TF1’s evening news attracts around 5 million viewers, and television is also beginning to suffer from an advertising-revenue crisis, as those revenues migrate to platforms.", "d": 8, "r": "migrent", "z": 2.63, "n": 35}, {"t": "", "p": "", "o": "Comme vous l’avez indiqué, la majorité des gens dans le monde s’informe désormais par l’intermédiaire d’un réseau social, d’une plateforme vidéo ou, nouveauté, d’un assistant conversationnel, d’un chatbot comme Claude, ChatGPT, Gemini ou autre.", "e": "As you said, most people around the world now get their news through a social network, a video platform or, more recently, a conversational assistant—a chatbot such as Claude, ChatGPT, Gemini, or another.", "d": 9, "r": "conversationnel", "z": 1.99, "n": 34}, {"t": "", "p": "", "o": "La profession de journaliste est contestée, paupérisée et attaquée comme elle ne l’a jamais été.", "e": "Journalism is being challenged, impoverished, and attacked as never before.", "d": 9, "r": "paupérisée", "z": 1.53, "n": 14}, {"t": "", "p": "", "o": "Puisque vous m’avez tendu une perche, je voudrais évoquer un phénomène qui est peu médiatisé : les attaques contre le journalisme prennent des proportions très inquiétantes.", "e": "Since you have given me an opening, I would like to mention a phenomenon that receives little media coverage: attacks on journalism are reaching very worrying proportions.", "d": 7, "r": "inquiétantes", "z": 3.09, "n": 25}, {"t": "", "p": "", "o": "À l’AFP, où nous avons un réseau mondial, il ne se passe pas une semaine, voire un jour, sans incident sérieux.", "e": "At AFP, where we have a worldwide network, hardly a week—or even a day—goes by without a serious incident.", "d": 5, "r": "incident", "z": 4.25, "n": 21}, {"t": "", "p": "", "o": "Il peut s’agir de violences physiques.", "e": "These can involve physical violence.", "d": 3, "r": "physiques", "z": 4.37, "n": 6}, {"t": "", "p": "", "o": "La semaine dernière, un journaliste a été gravement blessé en Cisjordanie.", "e": "Last week, a journalist was seriously injured in the West Bank.", "d": 4, "r": "gravement", "z": 3.94, "n": 10}, {"t": "", "p": "", "o": "L’appartement d’un journaliste à Kharkiv a été démoli par un missile.", "e": "A journalist’s apartment in Kharkiv was destroyed by a missile.", "d": 6, "r": "démoli", "z": 3.28, "n": 10}, {"t": "", "p": "", "o": "Nous avons aussi de nombreux cas de cyberharcèlement et de doxing, c’est-à-dire l’exposition publique sur Internet des coordonnées de nos journalistes.", "e": "We also see many cases of cyberharassment and doxing, meaning the public disclosure of our journalists’ contact details online.", "d": 9, "r": "doxing", "z": 0.0, "n": 21}, {"t": "", "p": "", "o": "D’autres attaques font moins de bruit, mais sont extrêmement sournoises et efficaces : un jour, un audit est déclenché dans l’un de nos bureaux parce que nous avons publié une dépêche qui a déplu.", "e": "Other attacks make less noise but are extremely insidious and effective: one day, an audit is launched at one of our offices because we published a news report someone disliked.", "d": 9, "r": "sournoises", "z": 2.3, "n": 32}, {"t": "", "p": "", "o": "C’est absolument quotidien.", "e": "This happens every day.", "d": 3, "r": "quotidien", "z": 4.74, "n": 3}, {"t": "", "p": "", "o": "L’exemple vient désormais d’en haut, du pays le plus identifié au quatrième pouvoir.", "e": "The example now comes from the top, from the country most associated with the Fourth Estate.", "d": 4, "r": "identifié", "z": 4.11, "n": 13}, {"t": "", "p": "", "o": "Dans les démocraties, il existait encore un surmoi qui conduisait à éviter d’attaquer trop frontalement les médias.", "e": "In democracies, there used to be an internal restraint that discouraged people from attacking the media too directly.", "d": 8, "r": "surmoi", "z": 2.37, "n": 17}, {"t": "", "p": "", "o": "Aujourd’hui, c’est devenu un argument électoral assez efficace.", "e": "Today, doing so has become a fairly effective electoral argument.", "d": 5, "r": "Aujourd", "z": 3.54, "n": 9}, {"t": "", "p": "", "o": "Le petit manuel du populiste est bien connu et se développe : il ne s’agit plus tant de censurer, d’intimider ou d’interdire, comme auparavant, que de noyer et de disqualifier la parole du journaliste, afin que l’écosystème serve plutôt les puissants.", "e": "The populist playbook is well known and is spreading: rather than censoring, intimidating, or banning as in the past, the aim is now to drown out and discredit journalists’ voices so that the ecosystem serves the powerful instead.", "d": 8, "r": "disqualifier", "z": 2.85, "n": 40}, {"t": "", "p": "", "o": "Et c’est très efficace.", "e": "And it is very effective.", "d": 3, "r": "efficace", "z": 4.64, "n": 4}, {"t": "", "p": "", "o": "On voit qu’il est très facile de démolir cet écosystème : quelques mois suffisent.", "e": "We can see how easy it is to dismantle this ecosystem: a few months are enough.", "d": 5, "r": "démolir", "z": 3.48, "n": 14}, {"t": "", "p": "", "o": "On l’a encore constaté récemment dans un pays comme la Slovaquie.", "e": "We have seen it again recently in a country such as Slovakia.", "d": 4, "r": "constaté", "z": 4.15, "n": 10}, {"t": "", "p": "", "o": "En un an, l’audiovisuel public est tombé en ruines, l’agence domestique a été fermée et de nombreux médias ont disparu ou ont été rachetés par des proches du pouvoir.", "e": "In one year, public broadcasting was reduced to ruins, the national news agency was shut down, and many media outlets disappeared or were bought by people close to those in power.", "d": 7, "r": "rachetés", "z": 2.88, "n": 28}, {"t": "", "p": "", "o": "En Pologne, huit ans après le passage du PiS, il reste très difficile de reconstruire un audiovisuel public équilibré, qui ne soit pas trop politisé.", "e": "In Poland, eight years after the PiS party came to power, rebuilding balanced public broadcasting that is not overly politicized remains very difficult.", "d": 8, "r": "politisé", "z": 2.57, "n": 25}, {"t": "", "p": "", "o": "Les dégâts sont donc très profonds.", "e": "The damage is therefore very deep.", "d": 5, "r": "profonds", "z": 3.65, "n": 6}, {"t": "", "p": "", "o": "Ce qui me frappe, c’est qu’on n’en parle pas tant que ça.", "e": "What strikes me is that people do not talk about it all that much.", "d": 4, "r": "frappe", "z": 4.52, "n": 13}, {"t": "", "p": "", "o": "Cette perte statutaire du journalisme contribue aussi à en faire une profession facilement attaquable, parce qu’elle a perdu de son magnétisme.", "e": "This loss of status for journalism also makes it an easy profession to attack, because it has lost some of its appeal.", "d": 8, "r": "attaquable", "z": 2.11, "n": 21}, {"t": "", "p": "", "o": "Lucile Schmid :", "e": "Lucile Schmid:", "d": 6, "r": "Lucile", "z": 3.06, "n": 2}, {"t": "", "p": "", "o": "Ce que vous venez de dire est fondamental à l’aune de l’actualité.", "e": "What you have just said is fundamental in light of current events.", "d": 6, "r": "aune", "z": 3.19, "n": 12}, {"t": "", "p": "", "o": "Nous sommes dans une situation où organiser un débat public de qualité est particulièrement important.", "e": "We are in a situation where organizing high-quality public debate is especially important.", "d": 4, "r": "organiser", "z": 4.47, "n": 15}, {"t": "", "p": "", "o": "C’est à la fois une question institutionnelle et une question qui relève des journalistes eux-mêmes, en tant que personnes, alors qu’en France, nous sommes à la veille d’élections essentielles, qui suscitent des craintes liées au populisme et aux menaces pesant sur les journalistes.", "e": "This is both an institutional question and one that concerns journalists themselves as individuals, at a time when France is on the eve of crucial elections that raise fears about populism and threats against journalists.", "d": 7, "r": "populisme", "z": 3.22, "n": 44}, {"t": "", "p": "", "o": "Le sujet que nous traitons aujourd’hui, les liens entre intelligence artificielle et avenir du journalisme, est au fond celui de la structuration du débat public.", "e": "The subject we are discussing today—the links between artificial intelligence and the future of journalism—is ultimately about how public debate is structured.", "d": 7, "r": "traitons", "z": 2.88, "n": 26}, {"t": "", "p": "", "o": "Comment peut-on avoir, en démocratie, un débat public de qualité ?", "e": "How can we have high-quality public debate in a democracy?", "d": 3, "r": "démocratie", "z": 4.61, "n": 10}, {"t": "", "p": "", "o": "Comment l’intelligence artificielle peut-elle soit nuire à ce débat, soit y contribuer ?", "e": "How can artificial intelligence either harm that debate or contribute to it?", "d": 5, "r": "nuire", "z": 3.94, "n": 12}, {"t": "", "p": "", "o": "Ce qui est intéressant dans la position que vous avez adoptée, notamment en concluant un accord avec Mistral, c’est que lorsque vous dites que l’IA peut être la première lectrice des articles des journalistes, vous montrez qu’elle peut être utilisée comme un outil contribuant à la qualité d’une information sourcée et factuelle.", "e": "What is interesting about the position you have taken, particularly by concluding an agreement with Mistral, is that when you say AI can be the first reader of journalists’ articles, you show that it can be used as a tool to help ensure that information is sourced and factual.", "d": 9, "r": "sourcée", "z": 1.8, "n": 53}, {"t": "", "p": "", "o": "On considère souvent qu’elle peut aussi contribuer à la désinformation.", "e": "It is often thought that AI can also contribute to disinformation.", "d": 5, "r": "désinformation", "z": 3.38, "n": 11}, {"t": "", "p": "", "o": "J’aimerais donc vous entendre sur ce point essentiel pour la structuration du débat public : l’IA est-elle au service de l’information ou de la désinformation ?", "e": "I would therefore like to hear your thoughts on this essential question for the structure of public debate: does AI serve information or disinformation?", "d": 7, "r": "structuration", "z": 3.18, "n": 24}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Commençons par le volet de la désinformation, qui est le plus facile.", "e": "Let us start with disinformation, which is the easier part.", "d": 6, "r": "désinformation", "z": 3.38, "n": 12}, {"t": "", "p": "", "o": "L’IA n’est évidemment pas à l’origine de la désinformation, qui existe depuis toujours et qui a été rendue massive et quotidienne par les réseaux sociaux.", "e": "AI is obviously not the origin of disinformation, which has always existed and which social networks have made widespread and commonplace.", "d": 6, "r": "désinformation", "z": 3.38, "n": 24}, {"t": "", "p": "", "o": "En revanche, elle constitue un extraordinaire accélérateur de sa propagation.", "e": "However, AI is an extraordinary accelerator of its spread.", "d": 5, "r": "accélérateur", "z": 3.44, "n": 10}, {"t": "", "p": "", "o": "On l’a vu avec un conflit récent comme la guerre en Iran.", "e": "We saw this during a recent conflict, the war in Iran.", "d": 4, "r": "récent", "z": 4.21, "n": 11}, {"t": "", "p": "", "o": "Aujourd’hui, il n’y a plus un événement saillant qui ne soit accompagné de flots de contenus synthétiques, voire de réécritures complotistes.", "e": "Today, there is no major event that is not accompanied by a flood of synthetic content, or even conspiracy-driven rewrites.", "d": 8, "r": "réécritures", "z": 2.14, "n": 21}, {"t": "", "p": "", "o": "Dans cette guerre, les faux contenus proviennent des comptes officiels eux-mêmes, celui de Donald Trump sur Truth Social, mais aussi des comptes officiels iraniens, avec la pratique du meme, où l’on tourne l’adversaire en dérision, notamment en insérant des images de jeux vidéo de type Top Gun.", "e": "In this war, fake content comes from official accounts themselves—from Donald Trump’s account on Truth Social, but also from official Iranian accounts—using memes that mock the adversary, notably by inserting images from video games such as Top Gun.", "d": 8, "r": "insérant", "z": 2.73, "n": 47}, {"t": "", "p": "", "o": "L’IA rend tellement facile la fabrication de vidéos, de photos et de montages truqués que le phénomène devient massif.", "e": "AI makes it so easy to create videos, photos, and doctored montages that the phenomenon has become widespread.", "d": 7, "r": "truqués", "z": 2.84, "n": 19}, {"t": "", "p": "", "o": "Le principal problème est que cela banalise le faux, le rend quotidien, mais fragilise aussi le vrai.", "e": "The main problem is that this normalizes fakes and makes them part of everyday life, while also undermining the truth.", "d": 7, "r": "banalise", "z": 2.61, "n": 17}, {"t": "", "p": "", "o": "Un épisode de la guerre en Iran l’a particulièrement montré.", "e": "One episode in the war in Iran showed this particularly clearly.", "d": 3, "r": "montré", "z": 4.58, "n": 9}, {"t": "", "p": "", "o": "Très tôt dans le conflit, une école a été bombardée, faisant une centaine de victimes parmi les écolières.", "e": "Very early in the conflict, a school was bombed, killing around a hundred schoolgirls.", "d": 8, "r": "écolières", "z": 2.4, "n": 17}, {"t": "", "p": "", "o": "Aux véritables images prises sur le terrain se sont rapidement mêlées de fausses images synthétiques, si bien que la vérité est devenue indécidable et que la réalité de cette frappe a longtemps été contestée, jusqu’à ce que les Américains finissent par l’admettre.", "e": "Real images taken on the ground were quickly mixed with fake, synthetic images, making the truth impossible to determine; the reality of the strike was disputed for a long time, until the Americans eventually acknowledged it.", "d": 9, "r": "indécidable", "z": 1.86, "n": 42}, {"t": "", "p": "", "o": "Nous sommes donc dans une situation où la désinformation, accélérée mais non créée par l’IA, fragilise le vrai et entretient une extrême confusion.", "e": "We are therefore in a situation where disinformation, accelerated but not created by AI, undermines the truth and fuels extreme confusion.", "d": 7, "r": "fragilise", "z": 2.79, "n": 23}, {"t": "", "p": "", "o": "C’est ce que les spécialistes des médias appellent le « dividende du menteur » : créer une confusion totale autour des faits établis.", "e": "Media specialists call this the “liar’s dividend”: creating total confusion around established facts.", "d": 6, "r": "dividende", "z": 3.39, "n": 20}, {"t": "", "p": "", "o": "Quant à l’impact de l’IA sur l’information, sa première conséquence est de briser le monopole de l’homme sur sa production.", "e": "As for AI’s impact on information, its first consequence is to break the human monopoly on producing it.", "d": 5, "r": "monopole", "z": 3.93, "n": 20}, {"t": "", "p": "", "o": "En trente ans, depuis que j’ai commencé dans ce métier, nous avons connu trois grandes révolutions.", "e": "In the thirty years since I began working in this profession, we have experienced three major revolutions.", "d": 6, "r": "révolutions", "z": 3.53, "n": 16}, {"t": "", "p": "", "o": "La première, au tournant des années 2000, est la généralisation d’Internet, qui brise le monopole des médias sur la distribution de l’information.", "e": "The first, around the turn of the 2000s, was the widespread adoption of the Internet, which broke the media’s monopoly on distributing information.", "d": 6, "r": "généralisation", "z": 3.65, "n": 21}, {"t": "", "p": "", "o": "Il n’est plus nécessaire de détenir une licence de radiodiffusion ou un titre de presse pour diffuser de l’information et toucher une population potentiellement immense.", "e": "You no longer need a broadcasting license or a press publication to disseminate information and potentially reach a huge audience.", "d": 7, "r": "radiodiffusion", "z": 3.11, "n": 25}, {"t": "", "p": "", "o": "La deuxième, au tournant des années 2010, est la généralisation des réseaux sociaux, qui introduisent des intermédiaires.", "e": "The second, around the turn of the 2010s, was the widespread adoption of social networks, which introduced intermediaries.", "d": 6, "r": "introduisent", "z": 3.0, "n": 16}, {"t": "", "p": "", "o": "Comme Philippe l’a rappelé dans son introduction, la majorité des gens accèdent désormais à l’information non plus en lisant leur journal, en écoutant leur émission de radio ou en regardant un JT, mais par l’intermédiaire d’une plateforme.", "e": "As Philippe recalled in his introduction, most people now access information not by reading a newspaper, listening to a radio program, or watching the evening news, but through a platform.", "d": 7, "r": "accèdent", "z": 3.06, "n": 36}, {"t": "", "p": "", "o": "C’est un bouleversement très profond.", "e": "This is a profound upheaval.", "d": 5, "r": "bouleversement", "z": 3.25, "n": 5}, {"t": "", "p": "", "o": "La troisième révolution, celle de l’IA, marque la fin du monopole humain sur la production de l’information.", "e": "The third revolution, AI, marks the end of the human monopoly on producing information.", "d": 5, "r": "monopole", "z": 3.93, "n": 17}, {"t": "", "p": "", "o": "On estime à 30 % la part des contenus d’information d’origine synthétique.", "e": "An estimated 30% of information content is synthetic in origin.", "d": 5, "r": "synthétique", "z": 3.65, "n": 10}, {"t": "", "p": "", "o": "Sur certaines plateformes, comme LinkedIn, cette proportion atteindrait même 50 %.", "e": "On some platforms, such as LinkedIn, that proportion may even reach 50%.", "d": 6, "r": "atteindrait", "z": 2.83, "n": 9}, {"t": "", "p": "", "o": "Par ailleurs, l’IA pousse encore plus loin un mouvement amorcé par les réseaux sociaux : l’hyperpersonnalisation de l’information.", "e": "AI is also taking a movement that began with social networks—the hyper-personalization of information—even further.", "d": 9, "r": "hyperpersonnalisation", "z": 0.0, "n": 17}, {"t": "", "p": "", "o": "Aujourd’hui, vous posez une question à un chatbot qui vous fournit une réponse qui ne ressemble à aucune autre, et avec lequel vous pouvez converser.", "e": "Today, you ask a chatbot a question and it gives you an answer unlike anyone else’s, and you can have a conversation with it.", "d": 8, "r": "chatbot", "z": 2.28, "n": 26}, {"t": "", "p": "", "o": "Avec très peu de moyens, vous pouvez donner à un agent accès à vos abonnements et à des sources ouvertes pour qu’il vous construise une synthèse quotidienne.", "e": "With very little effort, you can give an agent access to your subscriptions and open sources so that it can prepare a daily briefing for you.", "d": 8, "r": "construise", "z": 2.55, "n": 28}, {"t": "", "p": "", "o": "Si vous souhaitez un podcast quotidien sur les sujets qui vous intéressent, avec le niveau d’approfondissement que vous choisissez, vous pouvez l’obtenir.", "e": "If you want a daily podcast on the topics that interest you, at whatever level of depth you choose, you can get one.", "d": 7, "r": "approfondissement", "z": 3.06, "n": 22}, {"t": "", "p": "", "o": "C’est l’hyperpersonnalisation de l’information, qui comporte évidemment beaucoup d’aspects extrêmement positifs.", "e": "This is the hyper-personalization of information, and it obviously has many very positive aspects.", "d": 9, "r": "hyperpersonnalisation", "z": 0.0, "n": 11}, {"t": "", "p": "", "o": "Je ne veux surtout pas tenir un discours de vieux réac hostile à l’innovation.", "e": "I certainly do not want to sound like an old reactionary hostile to innovation.", "d": 7, "r": "réac", "z": 2.78, "n": 14}, {"t": "", "p": "", "o": "Mais, pour revenir à votre question sur le débat public, cette évolution conduit à une fragmentation encore plus poussée de celui-ci.", "e": "But to return to your question about public debate, this development leads to even greater fragmentation.", "d": 6, "r": "fragmentation", "z": 3.21, "n": 21}, {"t": "", "p": "", "o": "Auparavant, l’information venait à nous.", "e": "In the past, information came to us.", "d": 3, "r": "venait", "z": 4.55, "n": 5}, {"t": "", "p": "", "o": "Désormais, c’est nous qui allons à l’information, au gré de la configuration de nos fils, de nos réseaux et des plateformes que nous suivons.", "e": "Now we go to the information, depending on how our feeds, networks, and the platforms we follow are configured.", "d": 6, "r": "suivons", "z": 3.33, "n": 24}, {"t": "", "p": "", "o": "Aucun fil Twitter n’est identique à un autre.", "e": "No two Twitter feeds are identical.", "d": 4, "r": "identique", "z": 4.17, "n": 8}, {"t": "", "p": "", "o": "Les algorithmes, qui dictent désormais le débat public, nous proposent les contenus qui correspondent à nos préférences.", "e": "The algorithms that now dictate public debate offer us content that matches our preferences.", "d": 7, "r": "dictent", "z": 2.69, "n": 17}, {"t": "", "p": "", "o": "Sur les grèves lycéennes, selon que vous vous situez plutôt à droite ou à gauche de l’échiquier politique, vous recevrez des contenus sur les violences policières ou sur le phénomène inverse.", "e": "On student strikes, depending on whether you lean to the right or the left politically, you will receive content about police violence or about the opposite phenomenon.", "d": 8, "r": "situez", "z": 2.37, "n": 31}, {"t": "", "p": "", "o": "Cette fragmentation du débat public, combinée à la confusion sur les faits et au brouillage de la distinction entre le vrai et le faux, est extrêmement inquiétante.", "e": "This fragmentation of public debate, combined with confusion about the facts and the blurring of the distinction between truth and falsehood, is extremely worrying.", "d": 8, "r": "brouillage", "z": 2.76, "n": 27}, {"t": "", "p": "", "o": "Marc-Olivier Padis :", "e": "Marc-Olivier Padis:", "d": 3, "r": "Marc-Olivier", "z": 4.28, "n": 2}, {"t": "", "p": "", "o": "Pour poursuivre sur la rupture introduite par l’IA, vous avez rappelé que la précédente, au tournant des années 2010, était le développement des réseaux sociaux.", "e": "To continue discussing the break introduced by AI, you recalled that the previous one, around the turn of the 2010s, was the rise of social networks.", "d": 6, "r": "introduite", "z": 3.63, "n": 24}, {"t": "", "p": "", "o": "Or, ceux-ci ont produit un effet particulier sur le débat public : la polarisation.", "e": "These had a particular effect on public debate: polarization.", "d": 6, "r": "polarisation", "z": 3.25, "n": 13}, {"t": "", "p": "", "o": "Dans l’économie de l’attention qui constitue leur modèle économique, les algorithmes privilégient les contenus clivants, parce qu’ils retiennent davantage l’attention des usagers, suscitent de la colère et des émotions qui les incitent à rester sur leur fil et à continuer de le faire défiler.", "e": "In the attention economy that underpins their business model, algorithms favor divisive content because it holds users’ attention, provokes anger and emotions, and encourages them to stay on their feed and keep scrolling.", "d": 10, "r": "clivants", "z": 1.67, "n": 45}, {"t": "", "p": "", "o": "Nous constatons donc depuis plusieurs années un phénomène de montée aux extrêmes des opinions par l’intermédiaire des réseaux sociaux.", "e": "For several years, then, we have seen opinions move toward extremes through social networks.", "d": 6, "r": "constatons", "z": 3.13, "n": 19}, {"t": "", "p": "", "o": "Avec l’IA, nous n’en sommes qu’au début, mais certains craignent déjà un effet inverse, celui d’une uniformisation.", "e": "With AI, we are only at the beginning, but some people already fear the opposite effect: homogenization.", "d": 7, "r": "uniformisation", "z": 2.88, "n": 18}, {"t": "", "p": "", "o": "Par la manière dont elles ont été entraînées, les IA tendent à laisser de côté les opinions les plus extrêmes, les propos irritants, et à privilégier des formulations très équilibrées.", "e": "Because of how they have been trained, AIs tend to leave out the most extreme opinions and irritating statements, favoring very balanced formulations.", "d": 8, "r": "irritants", "z": 2.62, "n": 30}, {"t": "", "p": "", "o": "On les reconnaît d’ailleurs à ces formules caractéristiques : « d’un côté, de l’autre », « mais il faut voir aussi que … » etc.", "e": "You can recognize them by their characteristic phrases: “on the one hand, on the other,” “but we should also consider that…,” and so on.", "d": 5, "r": "formules", "z": 3.89, "n": 19}, {"t": "", "p": "", "o": "Allons-nous donc assister à un mouvement inverse ?", "e": "Are we therefore going to see a movement in the opposite direction?", "d": 4, "r": "assister", "z": 4.29, "n": 7}, {"t": "", "p": "", "o": "Là où nous redoutions une polarisation, risquons-nous de voir apparaître une sorte de consensus forcé technologique ?", "e": "Where we feared polarization, might we see a kind of technologically enforced consensus?", "d": 9, "r": "redoutions", "z": 1.73, "n": 16}, {"t": "", "p": "", "o": "Et ces deux mouvements peuvent-ils s’équilibrer ?", "e": "And can these two movements balance each other out?", "d": 5, "r": "équilibrer", "z": 3.43, "n": 6}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Les grands modèles de langage sont des modèles statistiques qui prédisent le mot suivant en fonction de sa probabilité d’apparition.", "e": "Large language models are statistical models that predict the next word according to how likely it is to appear.", "d": 7, "r": "prédisent", "z": 2.75, "n": 20}, {"t": "", "p": "", "o": "De ce fait, c’est un peu le plus petit dénominateur commun qui émerge, avec une tendance à lisser les points de vue plutôt qu’à les radicaliser.", "e": "As a result, what emerges is something like the lowest common denominator, with a tendency to smooth out viewpoints rather than radicalize them.", "d": 8, "r": "radicaliser", "z": 2.67, "n": 27}, {"t": "", "p": "", "o": "On peut y voir un effet bénéfique, même si cela pose des problèmes pour la diversité des opinions et la représentation du monde.", "e": "That may be beneficial, although it raises questions about diversity of opinion and the representation of the world.", "d": 6, "r": "bénéfique", "z": 3.75, "n": 23}, {"t": "", "p": "", "o": "Selon que vous interrogez un modèle ouvert chinois ou un modèle propriétaire américain sur un même sujet, vous pouvez obtenir des réponses radicalement différentes.", "e": "If you ask an open Chinese model or a proprietary American model about the same subject, you may get radically different answers.", "d": 8, "r": "interrogez", "z": 2.65, "n": 24}, {"t": "", "p": "", "o": "C’est un élément à prendre en compte.", "e": "That is something to take into account.", "d": 3, "r": "élément", "z": 4.58, "n": 7}, {"t": "", "p": "", "o": "Aujourd’hui, les effets des bulles de filtrage des réseaux sociaux, qui vous enferment dans des « terriers à lapin », selon l’expression très utilisée dans les médias, restent extrêmement puissants et contribuent énormément à la dégradation du débat public.", "e": "Today, the effects of social-media filter bubbles, which trap you in “rabbit holes,” as the media often call them, remain extremely powerful and contribute greatly to the deterioration of public debate.", "d": 8, "r": "terriers", "z": 2.72, "n": 38}, {"t": "", "p": "", "o": "L’IA va-t-elle lisser tout cela ?", "e": "Will AI smooth all this out?", "d": 6, "r": "lisser", "z": 3.1, "n": 5}, {"t": "", "p": "", "o": "Peut-être.", "e": "Perhaps.", "d": 1, "r": "Peut-être", "z": 5.97, "n": 1}, {"t": "", "p": "", "o": "Espérons que ce soit l’un de ses effets bénéfiques.", "e": "Let us hope that this will be one of its beneficial effects.", "d": 6, "r": "bénéfiques", "z": 3.28, "n": 9}, {"t": "", "p": "", "o": "Nicole Gnesotto :", "e": "Nicole Gnesotto:", "d": 4, "r": "Nicole", "z": 4.0, "n": 2}, {"t": "", "p": "", "o": "Je voudrais revenir sur le début de notre conversation, sur les attaques contre les journalistes et la désinformation.", "e": "I would like to return to the beginning of our conversation, to attacks on journalists and disinformation.", "d": 6, "r": "désinformation", "z": 3.38, "n": 18}, {"t": "", "p": "", "o": "Ce qui me paraît nouveau, c’est que désormais la désinformation n’est plus clandestine.", "e": "What seems new to me is that disinformation is no longer covert.", "d": 6, "r": "désinformation", "z": 3.38, "n": 13}, {"t": "", "p": "", "o": "Elle est revendiquée comme telle, notamment aux États-Unis.", "e": "It is openly embraced as such, particularly in the United States.", "d": 6, "r": "revendiquée", "z": 3.07, "n": 8}, {"t": "", "p": "", "o": "En 2017, à peine Donald Trump élu, l’une de ses conseillères en communication a parlé de « vérité alternative ».", "e": "In 2017, shortly after Donald Trump was elected, one of his communications advisers spoke of “alternative facts.”", "d": 7, "r": "conseillères", "z": 2.65, "n": 16}, {"t": "", "p": "", "o": "Alors qu’il n’y avait pratiquement personne à une cérémonie, elle a affirmé qu’il y avait foule.", "e": "Although hardly anyone was at a ceremony, she claimed that it was packed.", "d": 5, "r": "affirmé", "z": 4.01, "n": 17}, {"t": "", "p": "", "o": "Quand on lui a fait remarquer que c’était faux, elle a répondu que ce n’était pas faux, mais que c’était une « vérité alternative ».", "e": "When she was told that this was false, she replied that it was not false, but an “alternative fact.”", "d": 5, "r": "alternative", "z": 4.25, "n": 21}, {"t": "", "p": "", "o": "Il existe donc, dans les mouvements populistes et d’extrême droite, une revendication de cette désinformation officielle.", "e": "There is therefore an explicit embrace of official disinformation within populist and far-right movements.", "d": 6, "r": "populistes", "z": 3.1, "n": 16}, {"t": "", "p": "", "o": "On a également inventé le concept de post-vérité, selon lequel, face à un événement, le ressenti du fait est aussi important que le fait lui-même.", "e": "The concept of post-truth has also been invented, according to which, when an event occurs, how people feel about it is just as important as the event itself.", "d": 5, "r": "ressenti", "z": 4.09, "n": 24}, {"t": "", "p": "", "o": "C’est véritablement une nouveauté, caractéristique des mouvements antidémocratiques qui contestent notamment la science et la notion de vérité.", "e": "This is genuinely new, and characteristic of anti-democratic movements that challenge science and the very notion of truth.", "d": 8, "r": "antidémocratiques", "z": 2.09, "n": 18}, {"t": "", "p": "", "o": "Il ne s’agit même pas de vérité, mais de la véracité d’un événement.", "e": "It is not even about truth, but about whether an event actually happened.", "d": 6, "r": "véracité", "z": 3.3, "n": 13}, {"t": "", "p": "", "o": "Ma question concerne notamment les jeunes journalistes qui arrivent dans cet univers.", "e": "My question concerns, in particular, young journalists entering this world.", "d": 3, "r": "arrivent", "z": 4.6, "n": 12}, {"t": "", "p": "", "o": "J’ai une petite-nièce qui commence justement cette année son école de journalisme.", "e": "I have a great-niece who is starting journalism school this year.", "d": 5, "r": "petite-nièce", "z": 3.82, "n": 12}, {"t": "", "p": "", "o": "Comment les journalistes peuvent-ils témoigner de ce qu’on appelle la vérité, plutôt que de se battre contre des idées fausses ?", "e": "How can journalists bear witness to what we call the truth, rather than spending their time fighting false ideas?", "d": 5, "r": "témoigner", "z": 3.96, "n": 21}, {"t": "", "p": "", "o": "Cette désinformation officielle entraîne une forme de perversion, de détournement du métier de journaliste : ils risquent de passer leur temps à démonter des informations fausses plutôt qu’à établir la vérité des faits.", "e": "This official disinformation leads to a kind of perversion and distortion of the journalistic profession: journalists risk spending all their time debunking false information instead of establishing the truth of the facts.", "d": 7, "r": "perversion", "z": 3.1, "n": 33}, {"t": "", "p": "", "o": "C’est particulièrement sensible sur la question du climat et du réchauffement climatique, où cette perversion de l’information est la plus manifeste.", "e": "This is especially evident on the subject of climate and global warming, where this distortion of information is most apparent.", "d": 7, "r": "perversion", "z": 3.1, "n": 21}, {"t": "", "p": "", "o": "Comment une agence comme l’AFP traite-t-elle ce genre de sujet ?", "e": "How does an agency such as AFP handle this kind of subject?", "d": 4, "r": "traite-t-elle", "z": 4.44, "n": 10}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Une agence ne prétend pas dire la vérité.", "e": "A news agency does not claim to tell the truth.", "d": 4, "r": "prétend", "z": 4.12, "n": 8}, {"t": "", "p": "", "o": "Nous cherchons à établir les faits de la manière la plus honnête possible.", "e": "We seek to establish the facts as honestly as possible.", "d": 5, "r": "cherchons", "z": 3.6, "n": 13}, {"t": "", "p": "", "o": "Il nous arrive de nous tromper, mais l’une des forces d’une agence et d’un éditeur, par rapport à un moteur d’IA, c’est que nous reconnaissons nos erreurs et les corrigeons, ce qui n’arrive jamais avec une IA.", "e": "We sometimes make mistakes, but one of the strengths of a news agency and a publisher, compared with an AI engine, is that we acknowledge and correct our mistakes, something an AI never does.", "d": 9, "r": "corrigeons", "z": 1.83, "n": 37}, {"t": "", "p": "", "o": "Historiquement, les agences entretenaient un rapport assez curieux au faux.", "e": "Historically, news agencies had a rather curious relationship with falsehood.", "d": 7, "r": "entretenaient", "z": 2.62, "n": 10}, {"t": "", "p": "", "o": "Naturellement, elles vérifiaient ce qu’elles publiaient, mais refusaient de commenter les rumeurs et les manipulations.", "e": "Naturally, they checked what they published, but refused to comment on rumors and manipulations.", "d": 9, "r": "vérifiaient", "z": 1.84, "n": 16}, {"t": "", "p": "", "o": "Le tournant historique a été 2016, avec Trump et le Brexit.", "e": "The historic turning point was 2016, with Trump and Brexit.", "d": 4, "r": "tournant", "z": 4.18, "n": 9}, {"t": "", "p": "", "o": "Nous avons alors pris conscience que le faux faisait partie des stratégies d’information et avait un impact sur la vie quotidienne.", "e": "We then realized that falsehood was part of information strategies and had an impact on everyday life.", "d": 5, "r": "stratégies", "z": 3.98, "n": 21}, {"t": "", "p": "", "o": "Les agences et les médias ont donc commencé à s’y intéresser.", "e": "News agencies and media outlets therefore began to take an interest in it.", "d": 4, "r": "agences", "z": 4.16, "n": 11}, {"t": "", "p": "", "o": "Prenons un exemple dans le sport : l’AFP ne commente jamais le mercato du football, parce que tant que le contrat n’est pas signé, nous refusons de traiter des rumeurs.", "e": "Take an example from sports: AFP never comments on football transfer rumors, because until a contract is signed, we refuse to cover rumors.", "d": 7, "r": "refusons", "z": 2.99, "n": 29}, {"t": "", "p": "", "o": "Mais le monde a complètement changé.", "e": "But the world has changed completely.", "d": 3, "r": "changé", "z": 4.83, "n": 5}, {"t": "", "p": "", "o": "Aujourd’hui, les ingérences étrangères et les manipulations sont quotidiennes.", "e": "Today, foreign interference and manipulation happen every day.", "d": 7, "r": "ingérences", "z": 2.54, "n": 10}, {"t": "", "p": "", "o": "Le mensonge des politiques ne tue plus les carrières et il est devenu industriel.", "e": "Politicians’ lies no longer end careers, and lying has become industrialized.", "d": 5, "r": "carrières", "z": 3.87, "n": 14}, {"t": "", "p": "", "o": "Nous avons donc commencé à couvrir davantage le faux et les stratégies de manipulation.", "e": "We therefore began covering falsehoods and manipulation strategies more extensively.", "d": 5, "r": "stratégies", "z": 3.98, "n": 14}, {"t": "", "p": "", "o": "Nous nous sommes également équipés pour faire ce qu’on appelle du fact-checking, qui consiste non pas à vérifier les contenus que nous allons publier, mais ceux qui ont déjà été publiés par d’autres sur les réseaux sociaux.", "e": "We also equipped ourselves to do what is called fact-checking, which means checking not the content we are about to publish, but content that others have already published on social networks.", "d": 8, "r": "fact-checking", "z": 2.36, "n": 38}, {"t": "", "p": "", "o": "Il y a une histoire assez intéressante derrière cela, qui nous ramène à la technologie.", "e": "There is a rather interesting story behind this, which brings us back to technology.", "d": 4, "r": "ramène", "z": 4.17, "n": 14}, {"t": "", "p": "", "o": "En 2016, Facebook est accusé d’avoir participé au massacre des Rohingyas, à une entreprise génocidaire.", "e": "In 2016, Facebook was accused of having contributed to the massacre of the Rohingya, to a genocidal campaign.", "d": 7, "r": "génocidaire", "z": 2.68, "n": 14}, {"t": "", "p": "", "o": "Pourquoi ?", "e": "Why?", "d": 1, "r": "Pourquoi", "z": 5.66, "n": 1}, {"t": "", "p": "", "o": "Parce que Facebook a servi à alimenter les haines contre les musulmans en Birmanie, un peu comme Radio Mille Collines au Rwanda.", "e": "Because Facebook had been used to fuel hatred against Muslims in Burma, much like Radio Mille Collines in Rwanda.", "d": 6, "r": "haines", "z": 3.2, "n": 21}, {"t": "", "p": "", "o": "On découvre alors que Facebook ne dispose que d’un seul modérateur parlant birman, basé à Dublin.", "e": "It then emerged that Facebook had only one moderator who spoke Burmese, based in Dublin.", "d": 7, "r": "birman", "z": 2.73, "n": 16}, {"t": "", "p": "", "o": "Prenant peur devant ces accusations, Mark Zuckerberg décide de lancer un programme de fact-checking, en finançant environ 200 médias dans le monde pour établir ce qui est avéré ou faux.", "e": "Alarmed by these accusations, Mark Zuckerberg decided to launch a fact-checking program, funding around 200 media outlets around the world to establish what was verified and what was false.", "d": 8, "r": "fact-checking", "z": 2.36, "n": 29}, {"t": "", "p": "", "o": "Il ne s’agit pas de se poser en arbitres de la vérité, mais de corriger un certain nombre de fausses informations, particulièrement sur le climat et sur tous les sujets clivants, comme l’immigration ou les religions.", "e": "The idea was not to appoint ourselves arbiters of truth, but to correct certain false claims, particularly about climate and divisive topics such as immigration or religion.", "d": 10, "r": "clivants", "z": 1.67, "n": 36}, {"t": "", "p": "", "o": "L’AFP s’engage pleinement dans ce programme, au moment où j’arrive à sa tête.", "e": "AFP fully joined this program just as I took the helm.", "d": 4, "r": "pleinement", "z": 4.18, "n": 13}, {"t": "", "p": "", "o": "Cela nous a beaucoup aidés à constituer un réseau.", "e": "It helped us considerably in building a network.", "d": 5, "r": "aidés", "z": 3.65, "n": 8}, {"t": "", "p": "", "o": "Nous avons aujourd’hui 150 journalistes qui font quotidiennement du fact-checking et maîtrisent des techniques très utiles, comme la recherche inversée d’images.", "e": "Today, we have 150 journalists doing fact-checking every day and mastering very useful techniques, such as reverse image search.", "d": 8, "r": "fact-checking", "z": 2.36, "n": 21}, {"t": "", "p": "", "o": "Que se passe-t-il depuis le début de 2025 ?", "e": "What has happened since the beginning of 2025?", "d": 2, "r": "début", "z": 5.4, "n": 7}, {"t": "", "p": "", "o": "Donald Trump, arrivé au pouvoir, déclare que le fact-checking est une forme de censure.", "e": "Donald Trump came to power and declared that fact-checking was a form of censorship.", "d": 7, "r": "fact-checking", "z": 2.36, "n": 14}, {"t": "", "p": "", "o": "Il assimile tous les médias qui le pratiquent à ce qu’il appelle le « cartel de la censure ».", "e": "He lumped all media outlets that practice it together into what he calls the “censorship cartel.”", "d": 6, "r": "assimile", "z": 3.14, "n": 18}, {"t": "", "p": "", "o": "Mark Zuckerberg, le petit doigt sur la couture du pantalon, débranche en janvier 2025 le programme aux États-Unis pour faire plaisir à Trump, alors qu’un mois auparavant, il le trouvait fabuleux.", "e": "Mark Zuckerberg, obediently falling into line, switched off the program in the United States in January 2025 to please Trump, even though just a month earlier he had considered it fantastic.", "d": 8, "r": "débranche", "z": 2.76, "n": 31}, {"t": "", "p": "", "o": "Nos opérations aux États-Unis sont donc balayées.", "e": "Our operations in the United States were therefore wiped out.", "d": 7, "r": "balayées", "z": 2.4, "n": 7}, {"t": "", "p": "", "o": "Depuis quelques mois, Zuckerberg étend cette politique à l’Amérique latine.", "e": "For the past few months, Zuckerberg has been extending this policy to Latin America.", "d": 4, "r": "latine", "z": 4.15, "n": 10}, {"t": "", "p": "", "o": "Pourquoi ?", "e": "Why?", "d": 1, "r": "Pourquoi", "z": 5.66, "n": 1}, {"t": "", "p": "", "o": "Parce qu’il y a des gouvernements d’extrême droite au pouvoir et peu de résistance politique.", "e": "Because far-right governments are in power there and there is little political resistance.", "d": 4, "r": "gouvernements", "z": 4.35, "n": 15}, {"t": "", "p": "", "o": "Nous craignons que le programme soit progressivement démantelé, en commençant par les régions où il n’existe ni régulation ni volonté politique de corriger les fausses informations.", "e": "We fear the program will gradually be dismantled, starting in regions where there is neither regulation nor political will to correct false information.", "d": 7, "r": "craignons", "z": 2.8, "n": 26}, {"t": "", "p": "", "o": "J’en viens à nos relations avec les plateformes.", "e": "This brings me to our relationship with the platforms.", "d": 4, "r": "plateformes", "z": 3.87, "n": 8}, {"t": "", "p": "", "o": "Au début du programme, en 2018, nous allions à New York rencontrer Campbell Brown, une journaliste très connue qui dirigeait le dispositif.", "e": "At the beginning of the program, in 2018, we went to New York to meet Campbell Brown, a well-known journalist who was running the initiative.", "d": 6, "r": "allions", "z": 3.37, "n": 21}, {"t": "", "p": "", "o": "Nous avions des interlocuteurs de très haut niveau.", "e": "We had very senior-level contacts.", "d": 5, "r": "interlocuteurs", "z": 3.59, "n": 8}, {"t": "", "p": "", "o": "Puis, chaque année, nous avons vu ces relations se dégrader.", "e": "Then, year after year, we watched those relationships deteriorate.", "d": 5, "r": "dégrader", "z": 3.41, "n": 10}, {"t": "", "p": "", "o": "Lors de notre dernière réunion, où l’on nous annonçait l’arrêt du programme en Amérique latine, notre interlocutrice était une jeune femme basée à Singapour, qui semblait être stagiaire, lisait une feuille et ne répondait à aucune question.", "e": "At our last meeting, when we were told that the program was being stopped in Latin America, our contact was a young woman based in Singapore who seemed to be an intern, read from a sheet of paper, and answered none of our questions.", "d": 8, "r": "interlocutrice", "z": 2.58, "n": 37}, {"t": "", "p": "", "o": "Nous nous sommes dit que la prochaine étape serait probablement un avatar IA chargé de nous annoncer les décisions.", "e": "We said to ourselves that the next step would probably be an AI avatar tasked with announcing the decisions to us.", "d": 5, "r": "avatar", "z": 3.67, "n": 19}, {"t": "", "p": "", "o": "Voilà ce qu’est devenue l’attitude des plateformes à l’égard de l’information, et ce que sont aujourd’hui nos relations avec ces acteurs de la tech.", "e": "That is what the platforms’ attitude toward information has become, and that is what our relationship with these tech companies looks like today.", "d": 6, "r": "aujourd", "z": 3.54, "n": 26}, {"t": "", "p": "", "o": "Lucile Schmid :", "e": "Lucile Schmid:", "d": 6, "r": "Lucile", "z": 3.06, "n": 2}, {"t": "", "p": "", "o": "Je voudrais citer le pape qui, dans sa dernière encyclique, Magnifica Humanitas, traite de l’IA de manière assez équilibrée.", "e": "I would like to quote the Pope, who addresses AI in a fairly balanced way in his latest encyclical, Magnifica Humanitas.", "d": 7, "r": "encyclique", "z": 2.95, "n": 19}, {"t": "", "p": "", "o": "Il considère que l’IA est un outil qui peut apporter à la démocratie, mais que le véritable problème réside dans la concentration du capital et le risque de confiscation de cet outil par des entrepreneurs puissantsqui pourraient avoir de mauvaises intentions.", "e": "He considers AI a tool that can benefit democracy, but says the real problem lies in the concentration of capital and the risk that powerful entrepreneurs with bad intentions could monopolize this tool.", "d": 10, "r": "puissantsqui", "z": 0.0, "n": 41}, {"t": "", "p": "", "o": "Au niveau de l’Union européenne, avec le Digital Services Act notamment, il y a eu des tentatives de régulation qui, aujourd’hui, ne débouchent pas sur grand-chose.", "e": "At the European Union level, there have been attempts at regulation, notably through the Digital Services Act, but so far they have not led to much.", "d": 7, "r": "débouchent", "z": 2.85, "n": 26}, {"t": "", "p": "", "o": "À partir de ces deux références, l’Union européenne et le pape, comment peut-on concrètement développer un journalisme indépendant face à de telles puissances ?", "e": "With these two reference points—the European Union and the Pope—how can we concretely develop independent journalism in the face of such powerful forces?", "d": 5, "r": "concrètement", "z": 3.98, "n": 23}, {"t": "", "p": "", "o": "Les enjeux de capital et de moyens financiers sont évidents, mais vous avez également souligné, dans certaines de vos prises de position, que le journaliste restait plus important que jamais pour le travail d’enquête et de terrain.", "e": "The issues of capital and financial resources are obvious, but you have also emphasized in some of your statements that journalists remain more important than ever for investigative and field reporting.", "d": 7, "r": "évidents", "z": 3.25, "n": 37}, {"t": "", "p": "", "o": "Lorsque vous évoquez l’AFP, on voit bien l’importance de ce travail.", "e": "When you talk about AFP, the importance of this work is clear.", "d": 7, "r": "évoquez", "z": 2.56, "n": 11}, {"t": "", "p": "", "o": "Il faut évidemment faire du fact-checking et disposer d’un réseau pour cela, mais il y a aussi la question de l’enquête, particulièrement importante lorsqu’on est écologiste.", "e": "Fact-checking and having a network to carry it out are obviously necessary, but there is also the question of investigative reporting, which is particularly important from an environmentalist perspective.", "d": 8, "r": "fact-checking", "z": 2.36, "n": 26}, {"t": "", "p": "", "o": "Comment peut-on articuler cette dématérialisation incarnée par l’IA, les enjeux de capitaux et la nécessité de préserver l’enquête de terrain, en lui donnant toute l’importance qu’elle mérite ?", "e": "How can we reconcile the dematerialization embodied by AI, the issue of capital, and the need to preserve field investigations, giving them all the importance they deserve?", "d": 7, "r": "dématérialisation", "z": 2.9, "n": 28}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Le problème de l’IA pour les journalistes se résume en un mot : le parasitisme.", "e": "The problem AI poses for journalists can be summed up in one word: parasitism.", "d": 7, "r": "parasitisme", "z": 2.58, "n": 14}, {"t": "", "p": "", "o": "L’IA propose des choses bluffantes, que nous utilisons nous-mêmes.", "e": "AI produces astonishing things, and we use them ourselves.", "d": 9, "r": "bluffantes", "z": 1.6, "n": 9}, {"t": "", "p": "", "o": "Il ne faut pas présenter les médias comme des entreprises rétives à la technologie.", "e": "We should not portray media organizations as companies that resist technology.", "d": 9, "r": "rétives", "z": 1.55, "n": 14}, {"t": "", "p": "", "o": "Toutes les semaines, nous déployons de nouveaux outils d’IA qui facilitent énormément le travail des rédactions.", "e": "Every week, we roll out new AI tools that make newsroom work much easier.", "d": 8, "r": "déployons", "z": 1.97, "n": 16}, {"t": "", "p": "", "o": "Le sujet n’est pas le devenir du journalisme, car le journaliste n’est pas remplaçable par une IA pour tout ce qui concerne le travail de terrain : cultiver des sources, mener des interviews, vérifier des informations contradictoires.", "e": "The issue is not the future of journalism, because AI cannot replace journalists in any aspect of fieldwork: cultivating sources, conducting interviews, and checking conflicting information.", "d": 8, "r": "remplaçable", "z": 2.64, "n": 36}, {"t": "", "p": "", "o": "Tout cela nécessite une présence humaine.", "e": "All of that requires a human presence.", "d": 4, "r": "nécessite", "z": 4.14, "n": 6}, {"t": "", "p": "", "o": "Une IA ne va pas encore sur le terrain, que je sache.", "e": "As far as I know, AI does not go out into the field yet.", "d": 4, "r": "sache", "z": 4.34, "n": 12}, {"t": "", "p": "", "o": "Il faut également exercer un jugement éditorial, déterminer ce qui est important, ce qui doit être su, et assumer la responsabilité éditoriale, c’est-à-dire répondre des erreurs et des publications.", "e": "Editorial judgment is also necessary: deciding what matters, what people need to know, and taking editorial responsibility—that is, being answerable for mistakes and publications.", "d": 6, "r": "éditoriale", "z": 3.55, "n": 29}, {"t": "", "p": "", "o": "Toutes ces fonctions ne peuvent pas être déléguées à des intermédiaires.", "e": "None of these functions can be delegated to intermediaries.", "d": 7, "r": "déléguées", "z": 2.52, "n": 11}, {"t": "", "p": "", "o": "Le véritable problème aujourd’hui n’est donc pas l’innovation de l’IA en tant que telle, mais le pillage des contenus sur lesquels elle repose.", "e": "The real problem today is therefore not AI innovation as such, but the looting of the content on which it depends.", "d": 6, "r": "pillage", "z": 3.47, "n": 24}, {"t": "", "p": "", "o": "C’est le modèle économique des acteurs de l’IA.", "e": "That is the business model of AI companies.", "d": 3, "r": "acteurs", "z": 4.71, "n": 8}, {"t": "", "p": "", "o": "Le parasitisme est une notion juridique : en droit, il consiste à se placer dans le sillage d’un acteur, à profiter de ses investissements et à remplacer son produit.", "e": "Parasitism is a legal concept: in law, it means riding on another actor’s coattails, benefiting from their investment, and replacing their product.", "d": 8, "r": "parasitisme", "z": 2.58, "n": 28}, {"t": "", "p": "", "o": "C’est exactement ce qui se passe aujourd’hui.", "e": "That is exactly what is happening today.", "d": 5, "r": "aujourd", "z": 3.54, "n": 8}, {"t": "", "p": "", "o": "Quelle est la grande nouveauté et la véritable menace de fond de l’IA ?", "e": "What is the major novelty and the fundamental threat posed by AI?", "d": 4, "r": "nouveauté", "z": 4.04, "n": 13}, {"t": "", "p": "", "o": "Hier, lorsque vous vous demandiez ce qu’était Le Nouvel Esprit Public, vous alliez sur Google, qui jouait un rôle d’intermédiaire.", "e": "In the past, if you wondered what Le Nouvel Esprit Public was, you went to Google, which acted as an intermediary.", "d": 7, "r": "demandiez", "z": 2.63, "n": 21}, {"t": "", "p": "", "o": "Sa fonction était d’indexer les meilleurs sites susceptibles de vous renseigner et, généralement, il vous renvoyait vers le site du Nouvel Esprit Public.", "e": "Its role was to index the best sites likely to inform you and generally direct you to the Le Nouvel Esprit Public website.", "d": 8, "r": "indexer", "z": 2.62, "n": 23}, {"t": "", "p": "", "o": "Aujourd’hui, en France, depuis le mois d’août, vous voyez apparaître ce qu’on appelle l’aperçu Google.", "e": "Today, in France, since August, you have been seeing what is called Google’s AI Overview.", "d": 6, "r": "Aujourd", "z": 3.54, "n": 17}, {"t": "", "p": "", "o": "Il s’agit d’un texte qui résume tout ce que vous devez savoir sur Le Nouvel Esprit Public.", "e": "It is a text summarizing everything you need to know about Le Nouvel Esprit Public.", "d": 4, "r": "résume", "z": 4.21, "n": 17}, {"t": "", "p": "", "o": "J’ai fait l’exercice, et c’est très bien fait : l’origine de l’émission, son passage de Radio France à un podcast à part entière, les intervenants, etc. Vous pourriez considérer que ce n’est pas très grave, puisque cette information est relativement stable.", "e": "I tried it, and it is very well done: the program’s origins, its move from Radio France to becoming a standalone podcast, the contributors, and so on. You might think that is not very serious, since this information is relatively stable.", "d": 6, "r": "podcast", "z": 3.57, "n": 40}, {"t": "", "p": "", "o": "Mais vous perdez la relation avec le lecteur.", "e": "But you lose the relationship with the reader.", "d": 5, "r": "perdez", "z": 3.61, "n": 8}, {"t": "", "p": "", "o": "Et lorsque vous souhaitez lancer une campagne de sponsoring, vous êtes bien embarrassé, puisque le résumé ne la propose pas.", "e": "And when you want to launch a sponsorship campaign, you are in a difficult position, because the summary does not offer it.", "d": 7, "r": "sponsoring", "z": 3.03, "n": 20}, {"t": "", "p": "", "o": "C’est exactement ce qui se passe aujourd’hui pour l’information.", "e": "That is exactly what is happening to news today.", "d": 5, "r": "aujourd", "z": 3.54, "n": 10}, {"t": "", "p": "", "o": "Vous posez une question à un moteur d’IA.", "e": "You ask an AI engine a question.", "d": 4, "r": "posez", "z": 3.95, "n": 8}, {"t": "", "p": "", "o": "Précisons que les gens ne recourent pas principalement aux chatbots pour s’informer, mais pour obtenir des conseils pratiques.", "e": "To be clear, people do not primarily use chatbots to get news, but to obtain practical advice.", "d": 8, "r": "chatbots", "z": 2.04, "n": 18}, {"t": "", "p": "", "o": "Seulement, ces conseils reposent très souvent sur de l’information.", "e": "However, that advice very often relies on information.", "d": 5, "r": "reposent", "z": 3.69, "n": 9}, {"t": "", "p": "", "o": "Or, aujourd’hui, vous n’obtenez plus une liste de liens, mais une réponse construite à partir de milliers de sources, souvent journalistiques, qui sont complètement diluées, effacées, malaxées.", "e": "Today, instead of receiving a list of links, you get an answer assembled from thousands of sources, often journalistic ones, which are completely diluted, erased, and blended together.", "d": 10, "r": "malaxées", "z": 1.06, "n": 28}, {"t": "", "p": "", "o": "Là où Google servait hier d’intermédiaire, le moteur d’IA se substitue désormais au journalisme.", "e": "Where Google once served as an intermediary, the AI engine now substitutes itself for journalism.", "d": 6, "r": "substitue", "z": 3.15, "n": 14}, {"t": "", "p": "", "o": "Il fournit directement sa réponse et vous n’apparaissez plus.", "e": "It gives you the answer directly, and you no longer appear.", "d": 8, "r": "apparaissez", "z": 2.11, "n": 9}, {"t": "", "p": "", "o": "C’est du parasitisme, parce que ces acteurs ne paient pas un rond pour financer le journalisme dont ils exploitent les contenus.", "e": "That is parasitism, because these companies pay not a penny toward funding the journalism whose content they exploit.", "d": 8, "r": "parasitisme", "z": 2.58, "n": 21}, {"t": "", "p": "", "o": "C’est cette captation de valeur qu’il faut corriger.", "e": "This value capture is what needs to be corrected.", "d": 6, "r": "captation", "z": 3.09, "n": 9}, {"t": "", "p": "", "o": "Pour le reste, encore une fois, l’IA est bluffante.", "e": "For the rest, once again, AI is astonishing.", "d": 7, "r": "bluffante", "z": 2.22, "n": 9}, {"t": "", "p": "", "o": "Je l’utilise tous les jours.", "e": "I use it every day.", "d": 3, "r": "utilise", "z": 4.79, "n": 5}, {"t": "", "p": "", "o": "Mais ce qui est tout à fait anormal, c’est ce déséquilibre de marché, avec des acteurs qui ne paient pas ce qu’ils devraient payer.", "e": "But what is completely abnormal is this market imbalance, in which companies do not pay what they should.", "d": 6, "r": "déséquilibre", "z": 3.6, "n": 25}, {"t": "", "p": "", "o": "Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "Comment les journalistes de l’AFP utilisent-ils l’intelligence artificielle ?", "e": "How do AFP journalists use artificial intelligence?", "d": 4, "r": "artificielle", "z": 3.95, "n": 8}, {"t": "", "p": "", "o": "Avez-vous des exemples à nous donner ?", "e": "Can you give us some examples?", "d": 3, "r": "exemples", "z": 4.52, "n": 6}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Il y a d’abord tout ce qui relève de l’automatisation des tâches un peu ingrates et chronophages : le sous-titrage de vidéos, la transcription d’interviews.", "e": "First, there is the automation of somewhat tedious and time-consuming tasks: subtitling videos and transcribing interviews.", "d": 9, "r": "chronophages", "z": 1.94, "n": 23}, {"t": "", "p": "", "o": "Vous le faites probablement aussi pour ce podcast.", "e": "You probably do that for this podcast too.", "d": 5, "r": "podcast", "z": 3.57, "n": 8}, {"t": "", "p": "", "o": "Vous n’avez plus quelqu’un qui tape tout, mais des logiciels qui s’en chargent.", "e": "You no longer need someone to type everything out; software takes care of it.", "d": 6, "r": "quelqu", "z": 3.27, "n": 14}, {"t": "", "p": "", "o": "Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "C’est intéressant parce que nous avons évidemment essayé.", "e": "That is interesting, because of course we have tried it.", "d": 3, "r": "essayé", "z": 4.64, "n": 8}, {"t": "", "p": "", "o": "D’ailleurs, celui qui s’occupe de la transcription, Benoit Carré, a proposé de lui-même de faire l’expérience.", "e": "In fact, Benoit Carré, who handles the transcription, suggested trying it himself.", "d": 5, "r": "transcription", "z": 3.59, "n": 15}, {"t": "", "p": "", "o": "Ça ne marche pas.", "e": "It does not work.", "d": 2, "r": "marche", "z": 5.16, "n": 4}, {"t": "", "p": "", "o": "Enfin, ça marche, mais je vais faire une comparaison cruelle, que je ne devrais peut-être pas faire.", "e": "Well, it works, but I am going to make a harsh comparison that perhaps I should not make.", "d": 6, "r": "cruelle", "z": 3.55, "n": 17}, {"t": "", "p": "", "o": "L’intelligence artificielle, pour le moment, ne comprend pas la dynamique d’une conversation.", "e": "For now, artificial intelligence does not understand the dynamics of a conversation.", "d": 5, "r": "artificielle", "z": 3.95, "n": 12}, {"t": "", "p": "", "o": "Elle peut restituer ce qu’ont dit M. Padis, Mme Schmid, Mme Gnesotto et M. Meyer au milieu de tout cela.", "e": "It can reproduce what Mr. Padis, Ms. Schmid, Ms. Gnesotto, and Mr. Meyer said amid all of this.", "d": 6, "r": "restituer", "z": 3.43, "n": 19}, {"t": "", "p": "", "o": "Mais comment ces interventions se répondent-elles ?", "e": "But how do their contributions respond to one another?", "d": 4, "r": "répondent-elles", "z": 4.12, "n": 6}, {"t": "", "p": "", "o": "Comment produire un compte rendu analytique de l’ensemble ?", "e": "How can you produce an analytical account of the whole discussion?", "d": 5, "r": "analytique", "z": 3.55, "n": 8}, {"t": "", "p": "", "o": "Ce n’est pas simplement un résumé qui juxtapose les interventions.", "e": "It is not simply a summary that places the contributions side by side.", "d": 8, "r": "juxtapose", "z": 2.14, "n": 10}, {"t": "", "p": "", "o": "Je vais finalement faire cette comparaison méchante, en l’atténuant un peu : c’est un peu la différence entre Le Nouvel Esprit Public et certaines émissions qui s’apparentent, ou croient s’apparenter, à ce qu’est L’Esprit public.", "e": "I will go ahead and make this unkind comparison after all, though I will soften it a little: it is somewhat like the difference between Le Nouvel Esprit Public and certain programs that resemble—or think they resemble—what L’Esprit public is.", "d": 9, "r": "atténuant", "z": 2.33, "n": 35}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Je reprends mon exemple, mais il y en a d’autres.", "e": "I will return to my example, though there are others.", "d": 5, "r": "reprends", "z": 3.71, "n": 9}, {"t": "", "p": "", "o": "Pendant la Coupe du monde, par exemple, l’IA permet de rédiger les légendes des photos.", "e": "During the World Cup, for example, AI can write photo captions.", "d": 5, "r": "rédiger", "z": 3.78, "n": 15}, {"t": "", "p": "", "o": "Auparavant, il était très difficile d’avoir tous les joueurs en base de données.", "e": "Previously, it was very difficult to have every player in a database.", "d": 3, "r": "Auparavant", "z": 4.58, "n": 13}, {"t": "", "p": "", "o": "Désormais, grâce aux systèmes de reconnaissance faciale, les légendes sont produites automatiquement.", "e": "Now, thanks to facial-recognition systems, captions are generated automatically.", "d": 5, "r": "faciale", "z": 3.46, "n": 12}, {"t": "", "p": "", "o": "Voilà pour les tâches chronophages.", "e": "That covers time-consuming tasks.", "d": 8, "r": "chronophages", "z": 1.94, "n": 5}, {"t": "", "p": "", "o": "Une deuxième famille d’usages est celle de la génération assistée.", "e": "A second category of uses is assisted generation.", "d": 5, "r": "assistée", "z": 3.38, "n": 10}, {"t": "", "p": "", "o": "Cela va de l’outil d’IA qui vous propose un titre ou un angle à des applications beaucoup plus élaborées.", "e": "This ranges from an AI tool that suggests a headline or angle to much more sophisticated applications.", "d": 6, "r": "élaborées", "z": 3.18, "n": 19}, {"t": "", "p": "", "o": "Vous l’avez évoqué tout à l’heure en parlant des contenus liquides : à partir d’un texte, on peut produire une vidéo ou un contenu audio.", "e": "As you mentioned earlier when talking about fluid content, a video or audio item can be produced from a text.", "d": 6, "r": "liquides", "z": 3.73, "n": 24}, {"t": "", "p": "", "o": "C’est de la génération de contenus.", "e": "That is content generation.", "d": 4, "r": "contenus", "z": 4.14, "n": 6}, {"t": "", "p": "", "o": "La troisième famille, particulièrement intéressante, montre tout ce que l’IA peut apporter de positif : c’est ce qu’on appelle le journalisme augmenté.", "e": "The third category, which is particularly interesting, demonstrates everything positive AI can offer: what we call augmented journalism.", "d": 5, "r": "journalisme", "z": 3.99, "n": 22}, {"t": "", "p": "", "o": "L’IA permet à un journaliste qui pouvait consulter 100 documents en une journée d’en consulter 100.000.", "e": "AI allows a journalist who could previously consult 100 documents in a day to consult 100,000.", "d": 4, "r": "consulter", "z": 4.28, "n": 14}, {"t": "", "p": "", "o": "Elle permet aussi de faire de la reconnaissance visuelle pour suivre les avancées de l’armée ukrainienne ou la déforestation amazonienne, ainsi que de la veille sur des milliers de sources.", "e": "It also enables visual recognition to track the Ukrainian army’s advances or deforestation in the Amazon, as well as monitoring thousands of sources.", "d": 7, "r": "amazonienne", "z": 2.97, "n": 30}, {"t": "", "p": "", "o": "En cela, l’IA est extrêmement positive.", "e": "In this respect, AI is extremely positive.", "d": 4, "r": "positive", "z": 4.28, "n": 6}, {"t": "", "p": "", "o": "La question est de savoir comment utiliser ces outils dans une rédaction sans que l’IA finisse par phagocyter tout le travail journalistique.", "e": "The question is how to use these tools in a newsroom without letting AI eventually swallow up all journalistic work.", "d": 9, "r": "phagocyter", "z": 1.77, "n": 22}, {"t": "", "p": "", "o": "La règle adoptée par la très grande majorité des rédactions est qu’en dernier ressort, c’est toujours le journaliste qui décide, vérifie et publie.", "e": "The rule adopted by the vast majority of newsrooms is that, ultimately, the journalist always decides, verifies, and publishes.", "d": 7, "r": "rédactions", "z": 3.19, "n": 24}, {"t": "", "p": "", "o": "À l’AFP, nous avons pour principe qu’aucun contenu conçu par l’IA ne peut être publié.", "e": "At AFP, our principle is that no content created by AI may be published.", "d": 4, "r": "conçu", "z": 4.37, "n": 16}, {"t": "", "p": "", "o": "Il faut distinguer la conception de l’assistance.", "e": "We must distinguish between creation and assistance.", "d": 4, "r": "distinguer", "z": 4.08, "n": 7}, {"t": "", "p": "", "o": "Vous pouvez utiliser l’IA pour préparer votre article, consulter des sources ou effectuer une traduction.", "e": "You can use AI to prepare your article, consult sources, or carry out a translation.", "d": 4, "r": "consulter", "z": 4.28, "n": 15}, {"t": "", "p": "", "o": "Mais la conception, c’est-à-dire l’ensemble du cheminement intellectuel, doit rester du ressort de l’homme.", "e": "But the act of creation—that is, the entire intellectual process—must remain the responsibility of a human being.", "d": 5, "r": "cheminement", "z": 3.48, "n": 14}, {"t": "", "p": "", "o": "Je citais tout à l’heure l’exemple du fact-checking.", "e": "I mentioned fact-checking earlier.", "d": 7, "r": "citais", "z": 2.24, "n": 8}, {"t": "", "p": "", "o": "Nous disposons aujourd’hui d’outils très efficaces pour démontrer qu’une image a été sortie de son contexte ou fabriquée par l’IA.", "e": "Today we have highly effective tools for demonstrating that an image has been taken out of context or generated by AI.", "d": 6, "r": "disposons", "z": 3.28, "n": 21}, {"t": "", "p": "", "o": "Mais il faut toujours conserver un jugement humain, pour éviter de se laisser absorber par ces outils et de devenir de simples superviseurs passifs d’agents d’IA.", "e": "But human judgment must always be retained, to avoid being absorbed by these tools and becoming passive supervisors of AI agents.", "d": 8, "r": "superviseurs", "z": 2.64, "n": 26}, {"t": "", "p": "", "o": "Il faut toujours un humain dans la boucle.", "e": "There must always be a human in the loop.", "d": 4, "r": "boucle", "z": 4.29, "n": 8}, {"t": "", "p": "", "o": "C’est absolument fondamental.", "e": "That is absolutely fundamental.", "d": 4, "r": "fondamental", "z": 3.95, "n": 3}, {"t": "", "p": "", "o": "Marc-Olivier Padis :", "e": "Marc-Olivier Padis:", "d": 3, "r": "Marc-Olivier", "z": 4.28, "n": 2}, {"t": "", "p": "", "o": "Vous avez expliqué comment une rédaction pouvait utiliser positivement les outils d’IA.", "e": "You have explained how a newsroom can use AI tools positively.", "d": 5, "r": "positivement", "z": 3.57, "n": 12}, {"t": "", "p": "", "o": "Vous avez également montré, avec l’exemple de la page d’accueil de Google, comment ces grands acteurs modifient unilatéralement le contrat d’usage en introduisant de nouvelles fonctionnalités.", "e": "You have also shown, with the example of Google’s homepage, how these major players unilaterally change the terms of use by introducing new features.", "d": 7, "r": "unilatéralement", "z": 3.14, "n": 26}, {"t": "", "p": "", "o": "Google se défend en affirmant que l’on peut désactiver soi-même l’aperçu d’IA si on ne souhaite pas l’utiliser.", "e": "Google defends itself by saying that users can disable the AI Overview themselves if they do not want to use it.",
