"d": 6, "r": "désactiver", "z": 3.55, "n": 18}, {"t": "", "p": "", "o": "Mais ils savent très bien que nous utilisons généralement les outils tels qu’ils se présentent et que nous modifions très peu les paramètres.", "e": "But they know perfectly well that we generally use tools as they are presented to us and change the settings very little.", "d": 9, "r": "modifions", "z": 1.94, "n": 24}, {"t": "", "p": "", "o": "Encore faudrait-il savoir où se trouve ce réglage.", "e": "We would first have to know where that setting is.", "d": 5, "r": "réglage", "z": 3.38, "n": 8}, {"t": "", "p": "", "o": "Je ne l’ai pas moi-même cherché précisément.", "e": "I have not looked for it myself in any detail.", "d": 4, "r": "cherché", "z": 4.32, "n": 7}, {"t": "", "p": "", "o": "Or, pour fonctionner, les grands modèles de langage ont besoin de se nourrir de documentation.", "e": "Yet large language models need documentation to function.", "d": 5, "r": "documentation", "z": 4.01, "n": 15}, {"t": "", "p": "", "o": "À ce titre, ils ont aussi besoin de vous.", "e": "In that respect, they need you too.", "d": 2, "r": "titre", "z": 5.33, "n": 9}, {"t": "", "p": "", "o": "Il existe donc une dépendance mutuelle : vous dépendez de ces grandes entreprises d’IA, mais elles ont également besoin de vos contenus.", "e": "There is therefore mutual dependence: you depend on these large AI companies, but they also need your content.", "d": 8, "r": "dépendez", "z": 2.09, "n": 21}, {"t": "", "p": "", "o": "Comment s’établit l’équilibre entre les deux ?", "e": "How is a balance between the two established?", "d": 4, "r": "établit", "z": 4.16, "n": 6}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "J’irais encore plus loin : l’IA a davantage besoin du journaliste que le journaliste n’a besoin de l’IA.", "e": "I would go even further: AI needs journalists more than journalists need AI.", "d": 5, "r": "irais", "z": 3.96, "n": 15}, {"t": "", "p": "", "o": "Aujourd’hui, les grands modèles de langage ont probablement épuisé leurs possibilités d’entraînement sur les contenus existants.", "e": "Today, large language models have probably exhausted the possibilities for training on existing content.", "d": 6, "r": "Aujourd", "z": 3.54, "n": 17}, {"t": "", "p": "", "o": "Ce qui leur manque, c’est la fraîcheur, la nouveauté.", "e": "What they lack is freshness and novelty.", "d": 5, "r": "fraîcheur", "z": 3.76, "n": 9}, {"t": "", "p": "", "o": "Et seuls les sites d’information peuvent les leur apporter.", "e": "Only news websites can provide that.", "d": 3, "r": "apporter", "z": 4.6, "n": 9}, {"t": "", "p": "", "o": "Il existe un processus que les Anglo-Saxons appellent le « model collapse » : les modèles, de plus en plus entraînés à partir de contenus synthétiques, finissent par se dégrader, avec une perte de diversité et d’exactitude.", "e": "There is a process that English speakers call “model collapse”: models increasingly trained on synthetic content eventually deteriorate, losing diversity and accuracy.", "d": 9, "r": "collapse", "z": 2.22, "n": 34}, {"t": "", "p": "", "o": "Ce processus a déjà commencé.", "e": "That process has already begun.", "d": 3, "r": "processus", "z": 4.79, "n": 4}, {"t": "", "p": "", "o": "Je vous donnais l’exemple de LinkedIn, où l’on estime que 50% des contenus sont écrits artificiellement.", "e": "I gave you the example of LinkedIn, where an estimated 50% of content is artificially written.", "d": 6, "r": "donnais", "z": 3.27, "n": 15}, {"t": "", "p": "", "o": "Il y a désormais une recherche d’authenticité, et les plateformes commencent à revenir sur ces pratiques.", "e": "There is now a search for authenticity, and platforms are beginning to back away from these practices.", "d": 5, "r": "authenticité", "z": 3.73, "n": 15}, {"t": "", "p": "", "o": "C’est un phénomène très courant dans la tech, que nous avons déjà observé avec les réseaux sociaux.", "e": "This is a very common phenomenon in tech, and we have already observed it with social networks.", "d": 5, "r": "tech", "z": 4.09, "n": 17}, {"t": "", "p": "", "o": "Il existe un autre concept anglo-saxon, l’« enshittification of the Internet », que je traduirais par la « merdification de l’Internet ».", "e": "There is another English expression, “enshittification of the Internet,” which I would translate as “the shittification of the Internet.”", "d": 9, "r": "enshittification", "z": 0.0, "n": 18}, {"t": "", "p": "", "o": "Nous l’avons vécu.", "e": "We have experienced it.", "d": 3, "r": "vécu", "z": 4.67, "n": 3}, {"t": "", "p": "", "o": "Souvenez-vous de Facebook : au départ, c’était un outil pour communiquer entre amis.", "e": "Remember Facebook: at first, it was a tool for communicating with friends.", "d": 5, "r": "Souvenez-vous", "z": 3.85, "n": 12}, {"t": "", "p": "", "o": "Aujourd’hui, les réseaux sociaux se sont particulièrement dégradés.", "e": "Today, social networks have deteriorated considerably.", "d": 6, "r": "dégradés", "z": 3.11, "n": 9}, {"t": "", "p": "", "o": "Ils sont devenus, selon une expression que j’aime beaucoup, des réseaux de cas sociaux.", "e": "They have become, as one expression I like puts it, networks for social misfits.", "d": 4, "r": "devenus", "z": 4.26, "n": 14}, {"t": "", "p": "", "o": "On y reçoit énormément de contenus haineux.", "e": "You receive huge amounts of hateful content there.", "d": 5, "r": "haineux", "z": 3.6, "n": 7}, {"t": "", "p": "", "o": "Mais cette évolution concerne toutes les plateformes.", "e": "But this evolution affects all platforms.", "d": 4, "r": "plateformes", "z": 3.87, "n": 7}, {"t": "", "p": "", "o": "Sur Google, cela fait longtemps que les premiers résultats sont des liens sponsorisés.", "e": "On Google, the top results have long been sponsored links.", "d": 7, "r": "sponsorisés", "z": 2.84, "n": 13}, {"t": "", "p": "", "o": "Des études ont également montré que, sur Amazon, les premiers produits proposés lors d’une recherche ne sont ni les plus appréciés ni les moins chers, mais ceux qui sont sponsorisés.", "e": "Studies have also shown that on Amazon, the first products offered in a search are neither the most popular nor the cheapest, but the sponsored ones.", "d": 8, "r": "sponsorisés", "z": 2.84, "n": 30}, {"t": "", "p": "", "o": "Ce phénomène touche donc toutes les plateformes, et il est en train de se reproduire avec l’IA.", "e": "So this phenomenon affects every platform, and it is now being repeated with AI.", "d": 5, "r": "plateformes", "z": 3.87, "n": 17}, {"t": "", "p": "", "o": "Vous avez tout à fait raison : le raisonnement de ces acteurs est, comme souvent, à courte vue.", "e": "You are absolutely right: as is often the case, these companies are short-sighted.", "d": 5, "r": "raisonnement", "z": 4.01, "n": 17}, {"t": "", "p": "", "o": "En refusant de rémunérer les contenus d’information, ils se tirent une balle dans le pied.", "e": "By refusing to pay for news content, they are shooting themselves in the foot.", "d": 6, "r": "rémunérer", "z": 3.07, "n": 15}, {"t": "", "p": "", "o": "Ils rémunèrent les talents à prix d’or, tout comme les puces et l’électricité.", "e": "They pay talent exorbitant sums, as well as for chips and electricity.", "d": 8, "r": "rémunèrent", "z": 2.27, "n": 13}, {"t": "", "p": "", "o": "La seule composante indispensable à l’IA qu’ils ne rémunèrent pas, c’est ce qu’ils appellent les « données ».", "e": "The only component essential to AI that they do not pay for is what they call “data.”", "d": 8, "r": "rémunèrent", "z": 2.27, "n": 18}, {"t": "", "p": "", "o": "Moi, j’appelle cela des films, des vidéos, des contenus de presse.", "e": "I call it films, videos, and press content.", "d": 4, "r": "contenus", "z": 4.14, "n": 11}, {"t": "", "p": "", "o": "Sur ce point, ils refusent de payer.", "e": "On this point, they refuse to pay.", "d": 4, "r": "refusent", "z": 4.08, "n": 7}, {"t": "", "p": "", "o": "Une quinzaine de groupes seulement ont conclu des accords avec des acteurs de l’IA.", "e": "Only about fifteen groups have signed agreements with AI companies.", "d": 4, "r": "quinzaine", "z": 4.03, "n": 14}, {"t": "", "p": "", "o": "Pour vous donner un autre exemple de nos relations concrètes avec ces entreprises, OpenAI ne dispose que de deux personnes chargées des relations avec les éditeurs.", "e": "To give you another example of our practical dealings with these companies, OpenAI has only two people responsible for relations with publishers.", "d": 6, "r": "chargées", "z": 3.65, "n": 26}, {"t": "", "p": "", "o": "Il leur est donc très facile de répondre qu’ils n’ont pas les moyens humains de traiter les demandes.", "e": "It is therefore very easy for them to say they do not have the staff to handle requests.", "d": 4, "r": "traiter", "z": 4.55, "n": 19}, {"t": "", "p": "", "o": "Ils ne s’organisent pas, et c’est délibéré.", "e": "They do not organize themselves to do so, and that is deliberate.", "d": 5, "r": "délibéré", "z": 3.44, "n": 7}, {"t": "", "p": "", "o": "D’ailleurs, ils le disent désormais dans les conférences : ils ne veulent pas rémunérer les contenus parce qu’ils considèrent disposer d’une sorte de droit d’usage.", "e": "Indeed, they now say at conferences that they do not want to pay for content because they believe they have a kind of right to use it.", "d": 7, "r": "rémunérer", "z": 3.07, "n": 25}, {"t": "", "p": "", "o": "Aux États-Unis, il existe une doctrine appelée le « fair use », ou usage équitable, selon laquelle l’utilisation de contenus peut être gratuite si elle est limitée et transformatrice.", "e": "In the United States, there is a doctrine called “fair use,” under which content may be used for free if the use is limited and transformative.", "d": 9, "r": "transformatrice", "z": 1.93, "n": 27}, {"t": "", "p": "", "o": "Un procès oppose actuellement le New York Times à OpenAI.", "e": "The New York Times is currently suing OpenAI.", "d": 4, "r": "oppose", "z": 4.21, "n": 10}, {"t": "", "p": "", "o": "Le New York Times soutient que cet usage n’a rien de limité, puisque l’entreprise s’approprie l’ensemble de ses contenus pour proposer un produit qui leur fait directement concurrence.", "e": "The New York Times argues that this use is not limited at all, since the company appropriates all its content to offer a product that directly competes with it.", "d": 7, "r": "approprie", "z": 3.0, "n": 27}, {"t": "", "p": "", "o": "Il conteste également le caractère transformateur de cet usage, puisque l’on retrouve très souvent des passages reproduits verbatim dans les réponses des modèles.", "e": "It also disputes that the use is transformative, since passages are very often reproduced verbatim in model responses.", "d": 8, "r": "verbatim", "z": 2.51, "n": 23}, {"t": "", "p": "", "o": "C’est un procès extrêmement important, dont l’issue déterminera en partie notre capacité à faire payer les acteurs de l’IA.", "e": "This is an extremely important lawsuit, whose outcome will partly determine our ability to make AI companies pay.", "d": 7, "r": "déterminera", "z": 3.07, "n": 19}, {"t": "", "p": "", "o": "Encore une fois, le problème fondamental est de mettre fin à ce parasitisme et de faire comprendre à ces entreprises qu’elles ont elles-mêmes intérêt à disposer d’une information fraîche.", "e": "Once again, the fundamental problem is to put an end to this parasitism and make these companies understand that they themselves have an interest in having fresh information available.", "d": 8, "r": "parasitisme", "z": 2.58, "n": 30}, {"t": "", "p": "", "o": "Sinon, à mesure que les plans sociaux se poursuivront et que le journalisme se dégradera, elles finiront par s’alimenter dans un désert.", "e": "Otherwise, as layoffs continue and journalism deteriorates, they will eventually be feeding on a desert.", "d": 9, "r": "dégradera", "z": 1.68, "n": 22}, {"t": "", "p": "", "o": "Et cela peut aller très vite.", "e": "And that can happen very quickly.", "d": 2, "r": "vite", "z": 5.31, "n": 6}, {"t": "", "p": "", "o": "C’est même déjà le cas, et la situation est extrêmement inquiétante.", "e": "It is already happening, in fact, and the situation is extremely worrying.", "d": 5, "r": "inquiétante", "z": 3.51, "n": 11}, {"t": "", "p": "", "o": "On parle toujours des grandes marques prestigieuses, comme le New York Times, Le Monde ou Le Figaro, mais elles sont l’arbre qui cache la forêt.", "e": "People always talk about prestigious brands such as The New York Times, Le Monde, or Le Figaro, but they are the visible tip of the iceberg.", "d": 6, "r": "prestigieuses", "z": 3.31, "n": 25}, {"t": "", "p": "", "o": "Aujourd’hui, tout le monde crève la gueule ouverte.", "e": "Today, everyone is being left to bleed out.", "d": 5, "r": "Aujourd", "z": 3.54, "n": 9}, {"t": "", "p": "", "o": "C’est la réalité.", "e": "That is the reality.", "d": 2, "r": "réalité", "z": 5.04, "n": 3}, {"t": "", "p": "", "o": "Les médias d’information locale sont particulièrement touchés.", "e": "Local news media are particularly affected.", "d": 5, "r": "touchés", "z": 3.77, "n": 7}, {"t": "", "p": "", "o": "Aux États-Unis, le phénomène des déserts d’information est désormais bien documenté : environ 50 millions d’Américains n’ont accès à aucun média local.", "e": "In the United States, news deserts are now well documented: around 50 million Americans have no access to any local media.", "d": 6, "r": "déserts", "z": 3.33, "n": 20}, {"t": "", "p": "", "o": "On en observe les conséquences sur la participation électorale et la montée de la corruption.", "e": "We can see the consequences in electoral participation and rising corruption.", "d": 4, "r": "observe", "z": 4.25, "n": 15}, {"t": "", "p": "", "o": "Tout cela est mécanique.", "e": "All of this follows mechanically.", "d": 3, "r": "mécanique", "z": 4.38, "n": 4}, {"t": "", "p": "", "o": "Il faut que les acteurs de l’IA prennent conscience de cette situation.", "e": "AI companies need to become aware of this situation.", "d": 3, "r": "acteurs", "z": 4.71, "n": 12}, {"t": "", "p": "", "o": "Mais nous en sommes encore très loin.", "e": "But we are still a long way from that.", "d": 2, "r": "sommes", "z": 5.31, "n": 7}, {"t": "", "p": "", "o": "Nicole Gnesotto :", "e": "Nicole Gnesotto:", "d": 4, "r": "Nicole", "z": 4.0, "n": 2}, {"t": "", "p": "", "o": "Sur ce point, il y a eu, quelques années avant le Covid, une directive européenne sur les droits voisins, dont l’objectif était précisément d’obliger les plateformes, puisqu’il n’y avait pas encore l’IA, à rémunérer les agences de presse dont elles utilisaient les contenus.", "e": "On this point, a few years before Covid, there was a European directive on related rights, whose purpose was precisely to require platforms—before AI existed—to pay news agencies for the content they used.", "d": 8, "r": "puisqu", "z": 2.71, "n": 43}, {"t": "", "p": "", "o": "Cette directive a eu certains effets.", "e": "That directive had some effect.", "d": 4, "r": "directive", "z": 3.92, "n": 5}, {"t": "", "p": "", "o": "Il s’agit maintenant d’étendre ce dispositif à l’IA, ce qui semble beaucoup plus compliqué.", "e": "The next step is to extend this system to AI, which seems much more complicated.", "d": 4, "r": "étendre", "z": 4.12, "n": 14}, {"t": "", "p": "", "o": "J’aimerais comprendre pourquoi.", "e": "I would like to understand why.", "d": 2, "r": "aimerais", "z": 4.8, "n": 3}, {"t": "", "p": "", "o": "J’ai beaucoup de mal à parler de l’IA, parce que je ne sais pas qui se trouve derrière ce terme.", "e": "I find it very difficult to talk about AI, because I do not know who is behind that term.", "d": 3, "r": "derrière", "z": 5.16, "n": 20}, {"t": "", "p": "", "o": "Mais ces entreprises pillent des milliards et des milliards de données, en temps réel, 24 heures sur 24.", "e": "But these companies plunder billions and billions of pieces of data in real time, 24 hours a day.", "d": 7, "r": "pillent", "z": 2.88, "n": 16}, {"t": "", "p": "", "o": "Si elles devaient rémunérer toutes leurs sources, cela leur coûterait des milliards de dollars.", "e": "If they had to pay all their sources, it would cost them billions of dollars.", "d": 6, "r": "rémunérer", "z": 3.07, "n": 14}, {"t": "", "p": "", "o": "Le problème étant mondial, puisque ce pillage des données des agences de presse s’effectue à l’échelle de la planète, la somme totale à verser serait considérable.", "e": "The problem is global, since news-agency data is plundered across the entire planet, so the total amount payable would be enormous.", "d": 6, "r": "pillage", "z": 3.47, "n": 26}, {"t": "", "p": "", "o": "Comment faire pour que ces entreprises d’IA acceptent de rémunérer leurs sources sans être ruinées par le montant des sommes engagées ?", "e": "How can we get these AI companies to agree to pay their sources without being bankrupted by the sums involved?", "d": 8, "r": "ruinées", "z": 2.35, "n": 21}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Une première partie de la réponse est qu’elles dépensent déjà des milliards pour leurs centres de données ou pour recruter des talents.", "e": "One part of the answer is that they already spend billions on their data centers and on recruiting talent.", "d": 7, "r": "dépensent", "z": 3.2, "n": 23}, {"t": "", "p": "", "o": "Je ne vois pas pourquoi elles ne dépenseraient pas également des milliards pour rémunérer les créateurs de contenus d’information.", "e": "I do not see why they should not also spend billions to compensate creators of news content.", "d": 9, "r": "dépenseraient", "z": 1.53, "n": 19}, {"t": "", "p": "", "o": "Nicole Gnesotto :", "e": "Nicole Gnesotto:", "d": 4, "r": "Nicole", "z": 4.0, "n": 2}, {"t": "", "p": "", "o": "Parce qu’elles n’auraient plus de quoi payer leurs centres de données …", "e": "Because then they would have nothing left to pay for their data centers…", "d": 3, "r": "centres", "z": 4.53, "n": 12}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "C’est donc un choix qu’ils font.", "e": "So that is a choice they are making.", "d": 2, "r": "choix", "z": 5.31, "n": 7}, {"t": "", "p": "", "o": "Par ailleurs, la grande difficulté, c’est l’opacité complète de ces acteurs sur l’utilisation des contenus d’information.", "e": "Another major difficulty is these companies’ complete lack of transparency about how they use news content.", "d": 6, "r": "opacité", "z": 3.25, "n": 16}, {"t": "", "p": "", "o": "La directive sur les droits voisins a été votée en 2019.", "e": "The directive on related rights was passed in 2019.", "d": 5, "r": "votée", "z": 3.62, "n": 9}, {"t": "", "p": "", "o": "Nous avons obtenu des accords, notamment grâce à l’appui de l’Autorité de la concurrence et aux amendes très importantes qui leur ont été infligées pour les obliger à bouger.", "e": "We secured agreements, notably with support from the Competition Authority and the very substantial fines imposed on the platforms to force them to act.", "d": 7, "r": "infligées", "z": 3.02, "n": 29}, {"t": "", "p": "", "o": "Cela n’a pas été facile.", "e": "It was not easy.", "d": 2, "r": "facile", "z": 5.1, "n": 4}, {"t": "", "p": "", "o": "Et tous ces accords ont été forfaitaires : à la fin, les plateformes ont simplement dit qu’elles mettaient telle somme sur la table.", "e": "And all these agreements were lump-sum deals: in the end, the platforms simply said they were putting a certain amount on the table.", "d": 8, "r": "forfaitaires", "z": 2.5, "n": 23}, {"t": "", "p": "", "o": "Mais nous ne voulons ni de la charité ni d’un cadeau.", "e": "But we want neither charity nor a gift.", "d": 4, "r": "charité", "z": 4.03, "n": 11}, {"t": "", "p": "", "o": "Nous voulons une méthode objective permettant de déterminer comment nos contenus sont utilisés et quels revenus ils rapportent aux plateformes, qu’il s’agisse de Meta, LinkedIn, Google ou d’autres.", "e": "We want an objective method for determining how our content is used and what revenue it generates for platforms such as Meta, LinkedIn, Google, and others.", "d": 6, "r": "objective", "z": 3.64, "n": 29}, {"t": "", "p": "", "o": "Quelle part des recettes publicitaires leur est attribuable ?", "e": "What share of advertising revenue can be attributed to it?", "d": 6, "r": "attribuable", "z": 2.89, "n": 8}, {"t": "", "p": "", "o": "Quels sont les revenus directs et indirects générés par ces contenus ?", "e": "What direct and indirect revenue does this content generate?", "d": 6, "r": "générés", "z": 3.26, "n": 11}, {"t": "", "p": "", "o": "Il faut prendre en compte tous ces éléments.", "e": "All these factors need to be taken into account.", "d": 2, "r": "éléments", "z": 4.96, "n": 8}, {"t": "", "p": "", "o": "Or, nous sommes en 2026, sept ans après l’adoption de la directive, et nous n’avons toujours aucune visibilité sur ces données.", "e": "Yet here we are in 2026, seven years after the directive was adopted, and we still have no visibility into this data.", "d": 5, "r": "directive", "z": 3.92, "n": 20}, {"t": "", "p": "", "o": "Il y a trois ans, nous avons engagé une procédure contre X (ex-Twitter) pour obtenir le paiement des droits voisins.", "e": "Three years ago, we launched proceedings against X (formerly Twitter) to obtain payment of related rights.", "d": 4, "r": "engagé", "z": 4.42, "n": 18}, {"t": "", "p": "", "o": "Depuis trois ans, nous sommes devant la justice et nous ne demandons même pas encore un montant.", "e": "For three years, we have been in court, and we have not even asked for a sum yet.", "d": 5, "r": "demandons", "z": 3.85, "n": 17}, {"t": "", "p": "", "o": "Nous demandons simplement que X nous communique les données d’utilisation qu’il est seul à posséder.", "e": "We are simply asking X to provide us with the usage data that only it possesses.", "d": 5, "r": "communique", "z": 3.68, "n": 15}, {"t": "", "p": "", "o": "Cette opacité est une stratégie.", "e": "This opacity is a strategy.", "d": 5, "r": "opacité", "z": 3.25, "n": 5}, {"t": "", "p": "", "o": "Bien sûr qu’ils disposent de toutes ces données, mais ils refusent de les communiquer.", "e": "Of course they have all this data, but they refuse to disclose it.", "d": 5, "r": "disposent", "z": 3.98, "n": 15}, {"t": "", "p": "", "o": "Nous demandons donc de pouvoir établir la valeur réelle de nos contenus.", "e": "We are therefore asking to be able to establish the real value of our content.", "d": 5, "r": "demandons", "z": 3.85, "n": 12}, {"t": "", "p": "", "o": "Peut-être s’agit-il de centaines de millions et non de milliards, je n’en sais rien.", "e": "Perhaps it is hundreds of millions rather than billions; I have no idea.", "d": 4, "r": "centaines", "z": 4.56, "n": 14}, {"t": "", "p": "", "o": "Les éditeurs soupçonnent que leurs contenus sont utilisés, mais ils ne peuvent pas le prouver.", "e": "Publishers suspect their content is being used, but they cannot prove it.", "d": 7, "r": "soupçonnent", "z": 2.85, "n": 15}, {"t": "", "p": "", "o": "Avant l’IA, nous disposions d’outils permettant de repérer certaines reprises de contenus, notamment pour la photo et la vidéo.", "e": "Before AI, we had tools to detect certain instances of content reuse, particularly for photographs and videos.", "d": 8, "r": "disposions", "z": 2.22, "n": 19}, {"t": "", "p": "", "o": "C’était beaucoup plus compliqué pour le texte.", "e": "It was much more complicated for text.", "d": 3, "r": "compliqué", "z": 4.53, "n": 7}, {"t": "", "p": "", "o": "Nos accords sur les droits voisins portaient donc largement sur la photographie.", "e": "Our related-rights agreements therefore largely concerned photography.", "d": 5, "r": "portaient", "z": 3.69, "n": 12}, {"t": "", "p": "", "o": "Aujourd’hui, avec l’IA, tous ces contenus sont malaxés.", "e": "Today, with AI, all this content is blended together.", "d": 9, "r": "malaxés", "z": 1.16, "n": 9}, {"t": "", "p": "", "o": "Les acteurs de l’IA peuvent facilement nous répondre : « mais attendez, on n’a pas utilisé vos contenus ».", "e": "AI companies can easily tell us, “Wait a minute, we haven’t used your content.”", "d": 4, "r": "contenus", "z": 4.14, "n": 15}, {"t": "", "p": "", "o": "Et il devient très difficile de démontrer le contraire.", "e": "And it becomes very difficult to prove otherwise.", "d": 4, "r": "démontrer", "z": 4.19, "n": 9}, {"t": "", "p": "", "o": "Tant qu’ils maintiendront cette stratégie d’opacité, nous n’y arriverons pas.", "e": "As long as they maintain this strategy of opacity, we will not succeed.", "d": 8, "r": "maintiendront", "z": 2.24, "n": 11}, {"t": "", "p": "", "o": "Ce que nous souhaitons, c’est l’organisation d’un véritable marché, avec des mécanismes de valorisation des contenus.", "e": "What we want is a properly organized market, with mechanisms for valuing content.", "d": 5, "r": "souhaitons", "z": 3.78, "n": 16}, {"t": "", "p": "", "o": "Or, seuls ces acteurs maîtrisent les paramètres permettant d’en fixer la valeur.", "e": "But only these companies control the parameters needed to set that value.", "d": 6, "r": "maîtrisent", "z": 3.1, "n": 12}, {"t": "", "p": "", "o": "C’est tout à fait anormal.", "e": "That is completely abnormal.", "d": 5, "r": "anormal", "z": 3.62, "n": 5}, {"t": "", "p": "", "o": "C’est un marché de la prédation.", "e": "It is a market based on predation.", "d": 6, "r": "prédation", "z": 2.89, "n": 6}, {"t": "", "p": "", "o": "C’est d’ailleurs pour cette raison que nous avons engagé des procédures devant l’Autorité de la concurrence, plutôt que devant les tribunaux judiciaires sur le fondement du droit de la propriété intellectuelle.", "e": "That is also why we brought proceedings before the Competition Authority rather than civil courts under intellectual-property law.", "d": 6, "r": "fondement", "z": 3.88, "n": 31}, {"t": "", "p": "", "o": "Pour nous, il s’agit d’un abus de position dominante, et c’est ce qu’a retenu l’Autorité de la concurrence.", "e": "For us, this is an abuse of a dominant position, which is what the Competition Authority found.", "d": 5, "r": "dominante", "z": 3.96, "n": 18}, {"t": "", "p": "", "o": "Nous nous sommes battus comme des chiens et nous avons obtenu des succès.", "e": "We fought like dogs and achieved some successes.", "d": 5, "r": "battus", "z": 3.87, "n": 13}, {"t": "", "p": "", "o": "La France est d’ailleurs le seul pays qui se soit véritablement battu sur cette question.", "e": "France is, in fact, the only country that has truly fought on this issue.", "d": 5, "r": "véritablement", "z": 4.05, "n": 15}, {"t": "", "p": "", "o": "Même en Europe, il est désastreux de constater le désintérêt de nombreux pays.", "e": "Even in Europe, it is disastrous to see how little interest many countries have shown.", "d": 6, "r": "désintérêt", "z": 3.01, "n": 13}, {"t": "", "p": "", "o": "Il faut également reconnaître l’efficacité extraordinaire du lobbying de ces entreprises, qui a abouti à des textes un peu boiteux, à des compromis dont elles exploitent toutes les failles.", "e": "We must also acknowledge the extraordinary effectiveness of these companies’ lobbying, which has produced somewhat flawed legislation and compromises whose every loophole they exploit.", "d": 7, "r": "boiteux", "z": 3.16, "n": 28}, {"t": "", "p": "", "o": "Aujourd’hui, tous les dossiers finissent devant la justice.", "e": "Today, every case ends up in court.", "d": 5, "r": "Aujourd", "z": 3.54, "n": 9}, {"t": "", "p": "", "o": "Nous sommes en procédure contre l’ensemble de ces acteurs.", "e": "We are in legal proceedings against all these players.", "d": 3, "r": "procédure", "z": 4.63, "n": 9}, {"t": "", "p": "", "o": "Le seul qui joue un peu le jeu, c’est Google, qui se montre plus ouvert et reconnaît devoir payer des droits voisins.", "e": "The only one that is playing along to some extent is Google, which is more open and acknowledges that it has to pay related rights.", "d": 4, "r": "reconnaît", "z": 4.35, "n": 22}, {"t": "", "p": "", "o": "Nous sommes en procédure contre Meta et contre X, alors même que le droit a été établi et que le législateur européen s’est prononcé.", "e": "We are in legal proceedings against Meta and X, even though the law has been established and the European legislature has taken a position.", "d": 6, "r": "législateur", "z": 3.57, "n": 22}, {"t": "", "p": "", "o": "Ils s’en moquent et préfèrent multiplier les procès et payer des amendes, qu’ils intègrent et provisionnent dans leurs coûts d’exploitation.", "e": "They do not care; they prefer to multiply lawsuits and pay fines, which they factor into and set aside for in their operating costs.", "d": 9, "r": "provisionnent", "z": 0.0, "n": 21}, {"t": "", "p": "", "o": "Pendant ce temps, nous devons financer des études d’économistes et payer des frais d’avocats.", "e": "Meanwhile, we have to fund economic studies and pay legal fees.", "d": 5, "r": "économistes", "z": 3.85, "n": 14}, {"t": "", "p": "", "o": "C’est une situation complètement anormale.", "e": "This is a completely abnormal situation.", "d": 5, "r": "anormale", "z": 3.26, "n": 5}, {"t": "", "p": "", "o": "Et ces mêmes entreprises ont beau jeu de nous stigmatiser en affirmant que nous n’avons pas fait notre révolution numérique.", "e": "And these same companies have the nerve to stigmatize us, claiming that we have not undergone our digital revolution.", "d": 7, "r": "stigmatiser", "z": 3.06, "n": 20}, {"t": "", "p": "", "o": "C’est n’importe quoi.", "e": "That is nonsense.", "d": 2, "r": "importe", "z": 5.24, "n": 3}, {"t": "", "p": "", "o": "Les éditeurs français et européens se mobilisent énormément et ne sont absolument pas rétifs à la technologie.", "e": "French and European publishers are making enormous efforts and are in no way resistant to technology.", "d": 8, "r": "rétifs", "z": 2.13, "n": 17}, {"t": "", "p": "", "o": "Ce que nous voulons, ce sont des règles du jeu claires et de la transparence sur l’utilisation des données.", "e": "What we want are clear rules of the game and transparency about how data is used.", "d": 5, "r": "claires", "z": 3.95, "n": 19}, {"t": "", "p": "", "o": "Pour régler ce problème, il faudrait trois choses.", "e": "Three things would be needed to solve this problem.", "d": 3, "r": "régler", "z": 4.5, "n": 8}, {"t": "", "p": "", "o": "D’abord, de la transparence sur les données d’entraînement.", "e": "First, transparency about training data.", "d": 4, "r": "transparence", "z": 4.12, "n": 8}, {"t": "", "p": "", "o": "Nous demandons simplement que les entreprises nous disent quels contenus elles ont utilisés, puisque nous ne pouvons pas le déterminer nous-mêmes pour les raisons que je viens d’expliquer.", "e": "We simply ask companies to tell us what content they have used, since we cannot determine that ourselves for the reasons I have just explained.", "d": 6, "r": "demandons", "z": 3.85, "n": 28}, {"t": "", "p": "", "o": "Ensuite, il faut mettre fin à l’activité illégale des robots qui explorent Internet pour aspirer les contenus, ce qu’on appelle le « scraping ».", "e": "Second, we need to put an end to the illegal activity of bots that crawl the Internet to vacuum up content, a practice known as “scraping.”", "d": 10, "r": "scraping", "z": 1.23, "n": 23}, {"t": "", "p": "", "o": "Aujourd’hui, tous les éditeurs ont recours à l’« opt-out », c’est-à-dire qu’ils placent sur leur site un fichier indiquant aux robots qu’ils n’ont pas le droit d’en aspirer les contenus.", "e": "Today, all publishers use “opt-out,” meaning they place a file on their website telling bots they are not allowed to extract its content.", "d": 8, "r": "opt-out", "z": 2.76, "n": 31}, {"t": "", "p": "", "o": "Mais c’est comme si vous mettiez un panneau « propriété privée » sur votre pelouse : cela n’empêche pas les robots d’entrer.", "e": "But that is like putting a “private property” sign on your lawn: it does not stop the robots from coming in.", "d": 7, "r": "mettiez", "z": 2.7, "n": 19}, {"t": "", "p": "", "o": "Et c’est ce qu’ils font.", "e": "And that is what they do.", "d": 1, "r": "font", "z": 5.47, "n": 6}, {"t": "", "p": "", "o": "Nous savons que l’essentiel de ce trafic est illégal.", "e": "We know that most of this traffic is illegal.", "d": 4, "r": "illégal", "z": 4.06, "n": 9}, {"t": "", "p": "", "o": "Parfois, les acteurs de l’IA passent par des intermédiaires qui utilisent eux-mêmes ces robots.", "e": "Sometimes AI companies use intermediaries that themselves use these bots.", "d": 5, "r": "intermédiaires", "z": 3.92, "n": 14}, {"t": "", "p": "", "o": "Enfin, il faut instaurer des mécanismes obligeant ces entreprises à négocier, ce qu’on appelle des licences obligatoires.", "e": "Finally, we need mechanisms that require these companies to negotiate, known as compulsory licensing.", "d": 6, "r": "obligeant", "z": 3.54, "n": 18}, {"t": "", "p": "", "o": "Et, pour éviter la multiplication incessante des recours en justice, prévoir une procédure d’arbitrage avec des arbitres neutres, capables de fixer un montant et de permettre à tout le monde d’avancer.", "e": "And to avoid an endless multiplication of court cases, we should provide for an arbitration process with neutral arbitrators who can set an amount and allow everyone to move forward.", "d": 7, "r": "incessante", "z": 2.91, "n": 31}, {"t": "", "p": "", "o": "Nicole Gnesotto :", "e": "Nicole Gnesotto:", "d": 4, "r": "Nicole", "z": 4.0, "n": 2}, {"t": "", "p": "", "o": "Au niveau européen ou français ?", "e": "At the European or French level?", "d": 3, "r": "européen", "z": 4.78, "n": 5}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Européen.", "e": "European.", "d": 2, "r": "Européen", "z": 4.78, "n": 1}, {"t": "", "p": "", "o": "Le cadre est européen.", "e": "The framework is European.", "d": 3, "r": "européen", "z": 4.78, "n": 4}, {"t": "", "p": "", "o": "Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "Quels sont les pays européens les plus actifs dans le soutien à ces démarches face à ces prédateurs ?", "e": "Which European countries are most active in supporting these efforts against these predators?", "d": 6, "r": "prédateurs", "z": 3.55, "n": 18}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "L’Europe est le continent qui a le plus cherché à réguler ces acteurs.", "e": "Europe is the continent that has made the greatest effort to regulate these companies.", "d": 5, "r": "réguler", "z": 3.42, "n": 12}, {"t": "", "p": "", "o": "Elle a d’ailleurs été caricaturée pour cela, accusée de vouloir réguler ce qu’elle n’était pas capable de produire.", "e": "It has been caricatured for doing so, accused of trying to regulate things it was incapable of producing.", "d": 9, "r": "caricaturée", "z": 1.92, "n": 18}, {"t": "", "p": "", "o": "Mais aujourd’hui, l’Europe a peur, face au chantage exercé par les États-Unis, que vous connaissez.", "e": "But today Europe is afraid, in the face of the blackmail exerted by the United States, which you know about.", "d": 5, "r": "aujourd", "z": 3.54, "n": 15}, {"t": "", "p": "", "o": "Et je peux le comprendre.", "e": "And I can understand that.", "d": 2, "r": "comprendre", "z": 5.14, "n": 5}, {"t": "", "p": "", "o": "L’ambition du Digital Services Act, en particulier, tarde donc à se concrétiser.", "e": "The ambition of the Digital Services Act in particular is therefore taking a long time to materialize.", "d": 5, "r": "concrétiser", "z": 3.42, "n": 12}, {"t": "", "p": "", "o": "Dans cet ensemble européen, la France a toujours été aux avant-postes de la défense du droit d’auteur.", "e": "Within Europe, France has always been at the forefront of defending copyright.", "d": 4, "r": "avant-postes", "z": 4.56, "n": 16}, {"t": "", "p": "", "o": "Et je dois dire chapeau aux responsables politiques, d’une manière générale, parce que sans intervention politique, sans régulation, nous n’y arriverons pas.", "e": "And I must commend political leaders in general, because without political intervention and regulation, we will not succeed.", "d": 7, "r": "arriverons", "z": 2.97, "n": 22}, {"t": "", "p": "", "o": "Le rapport de force est complètement inégal.", "e": "The balance of power is completely unequal.", "d": 6, "r": "inégal", "z": 3.1, "n": 7}, {"t": "", "p": "", "o": "Les six principaux acteurs de l’IA représentent trois fois le PIB de la France.", "e": "The six biggest AI players are worth three times France’s GDP.", "d": 4, "r": "représentent", "z": 4.43, "n": 14}, {"t": "", "p": "", "o": "Les recettes publicitaires de Facebook sont huit fois supérieures à celles de tous les journaux du monde réunis.", "e": "Facebook’s advertising revenue is eight times greater than that of all the world’s newspapers combined.", "d": 5, "r": "publicitaires", "z": 3.87, "n": 18}, {"t": "", "p": "", "o": "Face à une telle disproportion, il faut qu’un correcteur intervienne.", "e": "Faced with such a disparity, a corrective force has to intervene.", "d": 7, "r": "disproportion", "z": 2.67, "n": 11}, {"t": "", "p": "", "o": "Puisque ces acteurs ne jouent pas le jeu, c’est au régulateur d’agir.", "e": "Since these companies are not playing by the rules, it is up to the regulator to act.", "d": 5, "r": "régulateur", "z": 3.61, "n": 12}, {"t": "", "p": "", "o": "Or, aux États-Unis, il n’existe aucun consensus bipartisan pour avancer dans cette direction, c’est le moins qu’on puisse dire.", "e": "In the United States, there is no bipartisan consensus to move in this direction, to say the least.", "d": 9, "r": "bipartisan", "z": 1.81, "n": 20}, {"t": "", "p": "", "o": "L’Europe se retrouve donc seule, avec un peu de soutien de l’Inde et du Brésil.", "e": "Europe is therefore left on its own, with a little support from India and Brazil.", "d": 3, "r": "soutien", "z": 4.91, "n": 15}, {"t": "", "p": "", "o": "Jusqu’à quand ?", "e": "For how long?", "d": 4, "r": "Jusqu", "z": 3.97, "n": 3}, {"t": "", "p": "", "o": "Je ne sais pas.", "e": "I do not know.", "d": 1, "r": "sais", "z": 5.64, "n": 4}, {"t": "", "p": "", "o": "Ailleurs, le sujet est pratiquement tabou.", "e": "Elsewhere, the subject is practically taboo.", "d": 4, "r": "tabou", "z": 3.78, "n": 6}, {"t": "", "p": "", "o": "La situation est donc très compliquée et assez inquiétante.", "e": "The situation is therefore very complicated and quite worrying.", "d": 5, "r": "inquiétante", "z": 3.51, "n": 9}, {"t": "", "p": "", "o": "Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "Un mot sur la situation de la presse.", "e": "A word about the state of the press.", "d": 2, "r": "presse", "z": 5.04, "n": 8}, {"t": "", "p": "", "o": "Vous avez évoqué tout à l’heure les plans sociaux qui se multiplient dans la presse locale.", "e": "Earlier, you mentioned the growing number of layoffs in the local press.", "d": 5, "r": "multiplient", "z": 3.7, "n": 16}, {"t": "", "p": "", "o": "Pouvez-vous développer cet aspect ?", "e": "Could you expand on that?", "d": 3, "r": "aspect", "z": 4.57, "n": 4}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "On dit souvent que ce qui se produit aux États-Unis finit par nous arriver quelques années plus tard.", "e": "People often say that what happens in the United States reaches us a few years later.", "d": 4, "r": "finit", "z": 4.59, "n": 18}, {"t": "", "p": "", "o": "Or, ce qui s’y passe est très inquiétant.", "e": "What is happening there is very worrying.", "d": 4, "r": "inquiétant", "z": 3.84, "n": 8}, {"t": "", "p": "", "o": "J’ai un chiffre en tête : il y avait, il y a une dizaine d’années, environ 375.000 journalistes aux États-Unis.", "e": "I have one figure in mind: about ten years ago, there were around 375,000 journalists in the United States.", "d": 4, "r": "dizaine", "z": 4.36, "n": 17}, {"t": "", "p": "", "o": "Aujourd’hui, ils ne seraient plus que 90.000.", "e": "Today, there may be only 90,000.", "d": 5, "r": "Aujourd", "z": 3.54, "n": 7}, {"t": "", "p": "", "o": "Une statistique publiée hier indique que trois journaux ferment chaque semaine.", "e": "A statistic published yesterday says that three newspapers close every week.", "d": 5, "r": "ferment", "z": 3.71, "n": 11}, {"t": "", "p": "", "o": "Et rien ne vient les remplacer.", "e": "And nothing comes along to replace them.", "d": 3, "r": "remplacer", "z": 4.57, "n": 6}, {"t": "", "p": "", "o": "Il se constitue donc aux États-Unis un marché de l’information à deux vitesses, avec des médias très prestigieux, dont les abonnements sont relativement chers et qui sont réservés à une élite.", "e": "The United States is therefore developing a two-tier news market, with highly prestigious media outlets whose subscriptions are relatively expensive and which are reserved for an elite.", "d": 6, "r": "abonnements", "z": 3.75, "n": 31}, {"t": "", "p": "", "o": "L’information de qualité devient, en quelque sorte, un produit de luxe.", "e": "Quality information is becoming, in a sense, a luxury product.", "d": 4, "r": "luxe", "z": 4.45, "n": 11}, {"t": "", "p": "", "o": "Est-ce que cela va nous arriver en France ?", "e": "Will this happen to us in France?", "d": 2, "r": "arriver", "z": 4.99, "n": 8}, {"t": "", "p": "", "o": "Nous n’en sommes pas encore là.", "e": "We are not there yet.", "d": 2, "r": "sommes", "z": 5.31, "n": 6}, {"t": "", "p": "", "o": "Nous disposons notamment d’une presse locale qui reste forte.", "e": "In particular, we still have a strong local press.", "d": 6, "r": "disposons", "z": 3.28, "n": 9}, {"t": "", "p": "", "o": "Mais lorsqu’on examine la situation des groupes de presse français, quatre groupes seulement réalisent aujourd’hui des profits.", "e": "But when you look at the situation of French press groups, only four groups are making a profit today.", "d": 7, "r": "lorsqu", "z": 3.07, "n": 19}, {"t": "", "p": "", "o": "Pour tous les autres, c’est un bain de sang.", "e": "For all the others, it is a bloodbath.", "d": 3, "r": "bain", "z": 4.55, "n": 9}, {"t": "", "p": "", "o": "Les suppressions d’emplois se multiplient, chez Prisma dans la presse magazine, chez le groupe ÉBRA dans la presse locale.", "e": "Job cuts are multiplying, at Prisma in magazine publishing and at the ÉBRA group in the local press.", "d": 6, "r": "suppressions", "z": 3.19, "n": 19}, {"t": "", "p": "", "o": "Et cela va très vite.", "e": "And it is happening very quickly.", "d": 2, "r": "vite", "z": 5.31, "n": 5}, {"t": "", "p": "", "o": "Chez ÉBRA, on parle de 400 postes supprimés.", "e": "At ÉBRA, 400 jobs are said to be at risk.", "d": 5, "r": "supprimés", "z": 3.66, "n": 7}, {"t": "", "p": "", "o": "Vous imaginez ce que cela représente pour l’emploi dans les territoires.J’espère que nous ne connaîtrons pas la même évolution qu’aux États-Unis, mais il faut prendre conscience de la gravité de la situation.", "e": "You can imagine what that means for employment in local communities. I hope we do not experience the same evolution as the United States, but we must recognize how serious the situation is.", "d": 8, "r": "connaîtrons", "z": 2.48, "n": 34}, {"t": "", "p": "", "o": "Lucile Schmid :", "e": "Lucile Schmid:", "d": 6, "r": "Lucile", "z": 3.06, "n": 2}, {"t": "", "p": "", "o": "Je voudrais revenir à la question du débat public.", "e": "I would like to return to the question of public debate.", "d": 3, "r": "voudrais", "z": 4.53, "n": 9}, {"t": "", "p": "", "o": "Ce qui me frappe, dans votre présentation du travail de l’AFP, c’est que vous cherchez à objectiver l’information et que vous faites des choix sur ce que vous traitez ou non.", "e": "What strikes me in your description of AFP’s work is that you seek to make information objective and make choices about what you cover and what you do not.", "d": 9, "r": "objectiver", "z": 2.28, "n": 31}, {"t": "", "p": "", "o": "Pendant longtemps, par exemple, vous avez refusé de traiter les rumeurs.", "e": "For a long time, for example, you refused to cover rumors.", "d": 4, "r": "rumeurs", "z": 4.15, "n": 11}, {"t": "", "p": "", "o": "Comment pourrait-on imaginer une organisation de la presse et des médias qui garantisse un débat public de qualité ?", "e": "How could we imagine an organization of the press and media that guarantees high-quality public debate?", "d": 7, "r": "garantisse", "z": 2.5, "n": 18}, {"t": "", "p": "", "o": "Nous avons parlé du journalisme et des journalistes en général, mais les situations sont très différentes selon que l’on travaille dans l’audiovisuel, dans la presse écrite ou dans une agence.", "e": "We have talked about journalism and journalists in general, but the situations are very different depending on whether someone works in broadcasting, print media, or a news agency.", "d": 6, "r": "audiovisuel", "z": 3.69, "n": 30}, {"t": "", "p": "", "o": "Or, c’est l’ensemble de ce système médiatique qui, aujourd’hui, ne parvient pas à garantir la qualité du débat public.", "e": "Yet it is this entire media system that is currently failing to guarantee the quality of public debate.", "d": 6, "r": "aujourd", "z": 3.54, "n": 20}, {"t": "", "p": "", "o": "Nous avons vu récemment les attaques contre l’audiovisuel public, notamment à travers la commission d’enquête parlementaire.", "e": "We have recently seen attacks on public broadcasting, notably through the parliamentary inquiry committee.", "d": 5, "r": "audiovisuel", "z": 3.69, "n": 16}, {"t": "", "p": "", "o": "Nous sommes donc confrontés à des enjeux qui dépassent les seules questions de l’IA et de la concentration du capital.", "e": "We are therefore facing issues that go beyond AI and the concentration of capital alone.", "d": 6, "r": "confrontés", "z": 3.66, "n": 20}, {"t": "", "p": "", "o": "Il y a aussi, comme vous le rappeliez en introduction, les attaques contre le journalisme en tant que contre-pouvoir, alors même que ce contre-pouvoir apparaît plus nécessaire que jamais dans une période de grande incertitude institutionnelle.", "e": "There are also, as you recalled in your introduction, attacks on journalism as a counterweight to power, even though that counterweight seems more necessary than ever in a period of great institutional uncertainty.", "d": 10, "r": "rappeliez", "z": 1.73, "n": 35}, {"t": "", "p": "", "o": "Comment analysez-vous cette situation ?", "e": "How do you analyze this situation?", "d": 6, "r": "analysez-vous", "z": 2.59, "n": 4}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "Le journalisme, comme tous les corps intermédiaires entre la réalité et le peuple, est attaqué, au même titre que les juges, notamment.", "e": "Journalism, like all the intermediaries between reality and the people, is under attack, as are judges, for example.", "d": 5, "r": "intermédiaires", "z": 3.92, "n": 22}, {"t": "", "p": "", "o": "L’une des manifestations particulières du populisme en Europe, ce sont les attaques contre l’audiovisuel public.Je ne vais pas commenter la situation française, mais regardez ce qui se passe à la BBC : elle supprime un poste sur dix.", "e": "One particular manifestation of populism in Europe is the attacks on public broadcasting. I will not comment on the situation in France, but look at what is happening at the BBC: it is cutting one job in ten.", "d": 7, "r": "populisme", "z": 3.22, "n": 38}, {"t": "", "p": "", "o": "Vous imaginez ce qui se passerait si France Télévisions annonçait demain la suppression de 10 % de ses effectifs ?", "e": "Can you imagine what would happen if France Télévisions announced tomorrow that it was cutting 10% of its workforce?", "d": 5, "r": "annonçait", "z": 3.67, "n": 17}, {"t": "", "p": "", "o": "On en entendrait parler.", "e": "We would hear plenty about it.", "d": 6, "r": "entendrait", "z": 2.81, "n": 4}, {"t": "", "p": "", "o": "Dans de nombreux pays, l’audiovisuel public est pris pour cible.", "e": "In many countries, public broadcasting is being targeted.", "d": 5, "r": "audiovisuel", "z": 3.69, "n": 10}, {"t": "", "p": "", "o": "Il y a eu un référendum en Suisse, et la question se pose également en Italie.", "e": "There was a referendum in Switzerland, and the question is also being raised in Italy.", "d": 4, "r": "référendum", "z": 4.32, "n": 15}, {"t": "", "p": "", "o": "Pourquoi ?", "e": "Why?", "d": 1, "r": "Pourquoi", "z": 5.66, "n": 1}, {"t": "", "p": "", "o": "Parce qu’il est stigmatisé comme un repaire de gauchistes, de wokistes et de partisans.", "e": "Because it is stigmatized as a den of leftists, woke activists, and partisans.", "d": 9, "r": "wokistes", "z": 0.0, "n": 15}, {"t": "", "p": "", "o": "C’est évidemment ravageur, car nous avons besoin d’un service public fort, particulièrement face aux évolutions que nous connaissons.", "e": "This is obviously devastating, because we need a strong public service, especially in light of the changes we are experiencing.", "d": 7, "r": "ravageur", "z": 2.85, "n": 18}, {"t": "", "p": "", "o": "Mais ces attaques deviennent un argument électoral qui porte, et nous le constatons.", "e": "But these attacks have become an effective electoral argument, and we can see that.", "d": 6, "r": "constatons", "z": 3.13, "n": 13}, {"t": "", "p": "", "o": "À mesure que les médias s’appauvrissent, ils ont malheureusement de plus en plus besoin des agences, parce que nous sommes souvent les seuls à disposer encore de journalistes sur le terrain.", "e": "As media outlets become poorer, they unfortunately need news agencies more and more, because we are often the only ones who still have journalists on the ground.", "d": 8, "r": "appauvrissent", "z": 2.34, "n": 31}, {"t": "", "p": "", "o": "Regardez les réseaux de correspondants étrangers de la plupart des médias : ils se sont considérablement réduits.", "e": "Look at the foreign correspondent networks of most media outlets: they have shrunk considerably.", "d": 5, "r": "correspondants", "z": 3.56, "n": 16}, {"t": "", "p": "", "o": "Si nous parvenons à maintenir notre présence, ce n’est pas parce que nous sommes plus forts que les autres.", "e": "If we manage to maintain our presence, it is not because we are stronger than the others.", "d": 7, "r": "parvenons", "z": 2.68, "n": 19}, {"t": "", "p": "", "o": "C’est parce que nous recevons une subvention publique qui sert précisément à cela : à employer huit salariés à Kaboul, sept à Kinshasa ...", "e": "It is because we receive a public subsidy specifically for that purpose: to employ eight staff members in Kabul, seven in Kinshasa…", "d": 6, "r": "recevons", "z": 3.28, "n": 22}, {"t": "", "p": "", "o": "Une entreprise privée ordinaire ne pourrait pas se le permettre.", "e": "An ordinary private company could not afford that.", "d": 4, "r": "ordinaire", "z": 4.33, "n": 10}, {"t": "", "p": "", "o": "La production d’information n’est pas, en elle-même, une activité rentable.", "e": "Producing news is not, in itself, a profitable activity.", "d": 5, "r": "rentable", "z": 3.84, "n": 10}, {"t": "", "p": "", "o": "La plupart des groupes de presse qui survivent le doivent à d’autres activités.", "e": "Most press groups that survive do so thanks to other activities.", "d": 6, "r": "survivent", "z": 3.32, "n": 13}, {"t": "", "p": "", "o": "Dans la presse locale, il existe de très bons exemples.", "e": "There are some very good examples in the local press.", "d": 3, "r": "exemples", "z": 4.52, "n": 10}, {"t": "", "p": "", "o": "Celui qu’on cite toujours est Le Télégramme de Brest, qui est florissant parce qu’il s’est diversifié dans l’événementiel, notamment dans l’organisation de manifestations sportives.", "e": "The one always cited is Le Télégramme de Brest, which is thriving because it diversified into events, notably organizing sporting events.", "d": 7, "r": "florissant", "z": 2.9, "n": 26}, {"t": "", "p": "", "o": "Beaucoup de ces groupes investissent dans des restaurants locaux, organisent des événements ou des colloques.", "e": "Many of these groups invest in local restaurants, organize events, or hold conferences.", "d": 6, "r": "colloques", "z": 3.25, "n": 15}, {"t": "", "p": "", "o": "Ce n’est pas leur activité de presse qui assure leur équilibre économique.", "e": "It is not their press activity that keeps them financially balanced.", "d": 3, "r": "équilibre", "z": 4.53, "n": 12}, {"t": "", "p": "", "o": "Tous ces phénomènes sont évidemment liés.", "e": "All these phenomena are obviously connected.", "d": 4, "r": "phénomènes", "z": 4.1, "n": 6}, {"t": "", "p": "", "o": "Marc-Olivier Padis :", "e": "Marc-Olivier Padis:", "d": 3, "r": "Marc-Olivier", "z": 4.28, "n": 2}, {"t": "", "p": "", "o": "Je voudrais vous poser une question un peu différente, qui concerne l’écriture et le style.", "e": "I would like to ask you a somewhat different question, about writing and style.", "d": 4, "r": "différente", "z": 4.5, "n": 15}, {"t": "", "p": "", "o": "On parle beaucoup de la possibilité de reconnaître les textes produits par l’IA à certains traits stylistiques.", "e": "There is a lot of talk about the possibility of recognizing AI-generated texts by certain stylistic traits.", "d": 7, "r": "stylistiques", "z": 2.76, "n": 17}, {"t": "", "p": "", "o": "Et chacun cherche désormais à s’en différencier, pour montrer que ses textes n’ont pas été produits artificiellement, en s’éloignant de ce style un peu moyen, que j’aurais du mal à définir précisément.", "e": "And everyone is now trying to distinguish their writing to show that it was not artificially produced, moving away from that somewhat average style, which I would find difficult to define precisely.", "d": 7, "r": "éloignant", "z": 3.07, "n": 32}, {"t": "", "p": "", "o": "Or, l’AFP est réputée pour une certaine sobriété de l’écriture, un style très factuel, avec des articles non signés puisqu’ils émanent de l’agence.Est-ce que l’arrivée de l’IA vous conduit à réfléchir à ce qui caractérise l’écriture journalistique de l’AFP ?", "e": "AFP, however, is known for a certain restraint in its writing, a very factual style, with unsigned articles because they come from the agency. Has the arrival of AI led you to reflect on what characterizes AFP’s journalistic writing?", "d": 8, "r": "puisqu", "z": 2.71, "n": 41}, {"t": "", "p": "", "o": "Ne risquez-vous pas, précisément à cause de cette sobriété et de cette neutralité stylistique, de voir votre écriture se confondre avec celle de l’IA ?", "e": "Precisely because of this restrained and stylistically neutral approach, do you risk seeing your writing confused with AI’s?", "d": 7, "r": "stylistique", "z": 3.05, "n": 24}, {"t": "", "p": "", "o": "Philippe Meyer :", "e": "Philippe Meyer:", "d": 2, "r": "Philippe", "z": 4.88, "n": 2}, {"t": "", "p": "", "o": "J’ajoute une question un peu triviale à celle de Marc-Olivier, puisque ce sera la dernière.", "e": "I will add a somewhat trivial question to Marc-Olivier’s, since this will be the last one.", "d": 7, "r": "triviale", "z": 2.65, "n": 15}, {"t": "", "p": "", "o": "Avec l’arrivée de l’IA, est-ce que vous embauchez davantage ou, au contraire, réduisez vos effectifs par rapport aux années précédentes ?", "e": "With the arrival of AI, are you hiring more people or, on the contrary, reducing staff compared with previous years?", "d": 8, "r": "embauchez", "z": 2.17, "n": 20}, {"t": "", "p": "", "o": "L’intelligence artificielle a-t-elle déjà eu des conséquences sur les recrutements à l’AFP ?", "e": "Has artificial intelligence already had an impact on hiring at AFP?", "d": 6, "r": "recrutements", "z": 3.22, "n": 12}, {"t": "", "p": "", "o": "Fabrice Fries :", "e": "Fabrice Fries:", "d": 4, "r": "Fabrice", "z": 3.79, "n": 2}, {"t": "", "p": "", "o": "On parle beaucoup, dans les médias, d’un âge post-littéraire.", "e": "There is a lot of talk in the media about a post-literary age.", "d": 4, "r": "post-littéraire", "z": 4.19, "n": 9}, {"t": "", "p": "", "o": "De fait, la principale porte d’entrée dans l’information aujourd’hui, c’est la vidéo.", "e": "In fact, the main gateway to news today is video.", "d": 5, "r": "aujourd", "z": 3.54, "n": 13}, {"t": "", "p": "", "o": "TikTok a imposé un format dominant : la vidéo verticale, sur mobile, sous-titrée.", "e": "TikTok has established a dominant format: vertical video, on mobile, with subtitles.", "d": 8, "r": "TikTok", "z": 1.99, "n": 11}, {"t": "", "p": "", "o": "Quand vous regardez les sites du Monde ou du New York Times, vous trouvez de plus en plus de ces vidéos sur leur page d’accueil.", "e": "When you look at the websites of Le Monde or The New York Times, you find more and more of these videos on their homepages.", "d": 4, "r": "trouvez", "z": 4.41, "n": 25}, {"t": "", "p": "", "o": "Tout le monde s’y met.", "e": "Everyone is getting into it.", "d": 2, "r": "met", "z": 5.12, "n": 5}, {"t": "", "p": "", "o": "La vidéo domine désormais le paysage médiatique.", "e": "Video now dominates the media landscape.", "d": 4, "r": "domine", "z": 4.0, "n": 7}, {"t": "", "p": "", "o": "Quant au texte, nous allons conserver notre style d’écriture, parce que c’est ce que nos clients attendent de nous.", "e": "As for text, we will keep our writing style, because that is what our clients expect from us.", "d": 4, "r": "attendent", "z": 4.39, "n": 19}, {"t": "", "p": "", "o": "Ils ne nous demandent ni commentaires ni éditoriaux, mais une information extrêmement sobre.", "e": "They do not ask us for commentary or editorials, but for extremely restrained reporting.", "d": 6, "r": "éditoriaux", "z": 3.02, "n": 13}, {"t": "", "p": "", "o": "Tout cela est très codifié, et je ne vois aucune raison que cela change.", "e": "It is all highly codified, and I see no reason for that to change.", "d": 7, "r": "codifié", "z": 2.7, "n": 14}, {"t": "", "p": "", "o": "Sur la question de l’emploi, notre raisonnement est que l’IA peut nous être utile en nous permettant de redéployer vers le terrain des ressources aujourd’hui mobilisées derrière des ordinateurs.", "e": "As for employment, our thinking is that AI can be useful by allowing us to redeploy resources currently tied to computers into fieldwork.", "d": 9, "r": "redéployer", "z": 2.18, "n": 30}, {"t": "", "p": "", "o": "Le terrain reste notre métier de base.", "e": "Fieldwork remains our core business.", "d": 3, "r": "métier", "z": 4.66, "n": 7}, {"t": "", "p": "", "o": "Notre grand problème, c’est que notre santé économique dépend de celle de nos clients.", "e": "Our main problem is that our economic health depends on that of our clients.", "d": 3, "r": "dépend", "z": 4.65, "n": 14}, {"t": "", "p": "", "o": "Or, nos clients sont les médias du monde entier, et il ne se passe pas une semaine sans que nous subissions les conséquences de leurs difficultés.", "e": "Our clients are media organizations around the world, and not a week goes by without us feeling the consequences of their difficulties.", "d": 10, "r": "subissions", "z": 1.37, "n": 26}, {"t": "", "p": "", "o": "Ce matin encore, nous avons appris le désabonnement de Channel 4, qui nous dit : « on adore votre produit vidéo.", "e": "Just this morning, we learned that Channel 4 was ending its subscription, telling us, “We love your video product.", "d": 8, "r": "désabonnement", "z": 2.13, "n": 18}, {"t": "", "p": "", "o": "Je ne sais pas comment on va faire sans, mais on n’y arrive plus. » Des exemples comme celui-là, nous en avons toutes les semaines.", "e": "I don’t know how we’ll manage without it, but we can no longer make it work.” We have examples like that every week.", "d": 4, "r": "exemples", "z": 4.52, "n": 24}, {"t": "", "p": "", "o": "Nous ne sommes donc pas inquiets pour l’avenir de notre métier, mais certains médias peuvent l’être pour le leur, parce que certaines de leurs activités sont davantage substituables par l’IA, notamment tout ce qui relève de l’information de service.", "e": "So we are not worried about the future of our profession, but some media outlets may be worried about theirs, because some of their activities are more easily replaceable by AI, especially service information.", "d": 9, "r": "substituables", "z": 1.9, "n": 39}, {"t": "", "p": "", "o": "Aujourd’hui, le volume d’informations n’est plus ce qui fait la rareté.", "e": "Today, the volume of information is no longer what makes it scarce.", "d": 5, "r": "rareté", "z": 3.45, "n": 12}, {"t": "", "p": "", "o": "Ce qui est rare, c’est le travail de terrain, l’information exclusive, l’accès à des sources intéressantes.", "e": "What is scarce is fieldwork, exclusive information, and access to interesting sources.", "d": 5, "r": "exclusive", "z": 3.84, "n": 16}, {"t": "", "p": "", "o": "Nous continuons donc à recruter, notamment des jeunes.", "e": "We therefore continue to recruit, particularly young people.", "d": 5, "r": "continuons", "z": 3.62, "n": 8}, {"t": "", "p": "", "o": "Nous considérons qu’il n’y a pas d’âge pour être reporter sur le terrain.", "e": "We believe there is no age limit to being a field reporter.", "d": 6, "r": "considérons", "z": 3.4, "n": 13}, {"t": "", "p": "", "o": "Notre cheffe de bureau à Kaboul a 35 ans, et nous voulons justement donner davantage leur chance aux jeunes journalistes.", "e": "Our bureau chief in Kabul is 35, and we specifically want to give young journalists more opportunities.", "d": 7, "r": "cheffe", "z": 2.99, "n": 18}, {"t": "", "p": "", "o": "Cela étant, j’ai rencontré récemment une directrice d’école de journalisme qui m’a confié que, pour la première fois, elle était très inquiète.", "e": "That said, I recently met the director of a journalism school who told me that, for the first time, she was very worried.", "d": 5, "r": "journalisme", "z": 3.99, "n": 21}, {"t": "", "p": "", "o": "Jusqu’à présent, son école avait toujours réussi à obtenir un bon taux d’embauche de ses étudiants.", "e": "Until now, her school had always managed to achieve a good employment rate for its students.", "d": 5, "r": "Jusqu", "z": 3.97, "n": 17}, {"t": "", "p": "", "o": "Mais aujourd’hui, tous les médias souffrent.", "e": "But today, all media outlets are struggling.", "d": 5, "r": "aujourd", "z": 3.54, "n": 7}, {"t": "", "p": "", "o": "Et les emplois de début de carrière deviennent particulièrement difficiles d’accès, comme dans beaucoup de métiers de cols blancs.", "e": "And entry-level jobs are becoming particularly difficult to access, as in many white-collar professions.", "d": 6, "r": "cols", "z": 3.47, "n": 19}, {"t": "", "p": "", "o": "Ce sont souvent des postes où l’on apprend sur le tas, en accomplissant des tâches qui peuvent désormais être automatisées.", "e": "These are often positions where people learn on the job by carrying out tasks that can now be automated.", "d": 7, "r": "automatisées", "z": 2.58, "n": 20}, {"t": "", "p": "", "o": "À l’AFP, nous échappons encore un peu à cette évolution, heureusement.", "e": "At AFP, fortunately, we are still somewhat shielded from this trend.", "d": 8, "r": "échappons", "z": 1.82, "n": 11}];
const out=document.getElementById('out'),f=document.getElementById('f'),histogram=document.getElementById('histogram');
const col=n=>`hsl(${Math.round(130-(n-1)*13)},55%,45%)`;
function renderHistogram(){
  const counts=Array.from({length:10}, (_,i)=>({level:i+1,count:D.filter(x=>x.d===i+1).length}));
  const max=Math.max(...counts.map(c=>c.count),1);
  histogram.innerHTML='<div class="hist-title">Difficulty distribution</div>' + counts.map(c=>`
    <div class="hist-row">
      <span>${c.level}</span>
      <div class="hist-track"><span class="hist-fill" style="width:${(c.count/max)*100}%"></span></div>
      <span>${c.count}</span>
    </div>
  `).join('');
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){
  renderHistogram();
  out.replaceChildren();let last=null;const level=f.value;
  D.forEach(x=>{
    if(level !== 'all' && x.d !== Number(level)) return;
    const key=x.t+'|'+x.p;
    if(key!==last&&(x.t||x.p)){last=key;const h=el('div','t');
      if(x.t)h.append('['+x.t+'] ');
      if(x.p){const b=el('b','',x.p+':');h.append(b)}
      out.append(h)}
    const s=el('div','s');s.tabIndex=0;s.setAttribute('role','button');
    s.append(el('div','',x.e||x.o));
    const d=el('div','d',x.d+'/10');const m=el('div','m');const i=el('i');
    i.style.width=(x.d*10)+'%';i.style.background=col(x.d);m.append(i);d.append(m);s.append(d);
    const z=el('div','zh');
    if(x.e){const o=el('div','o',x.o);o.lang="fr";z.append(o)}
    z.append(el('div','i',x.r?('Rarest word: '+x.r+'  (Zipf '+(x.z===null?'?':x.z.toFixed(2))+')  ·  '+x.n+' words'):(x.n+' words')));
    s.append(z);
    const tg=()=>s.classList.toggle('open');
    s.onclick=tg;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
    out.append(s);
  });
}
f.onchange=render;
document.getElementById('all').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.add('open'));
document.getElementById('none').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.remove('open'));
render();
</script></body></html>
