int: happiness is the ultimate goal of human beings.", "d": 5, "r": "ultime", "z": 4.22, "n": 16}, {"t": "", "p": "", "o": "Ça veut dire que l’homme fait tout pour le trouver.", "e": "That means people do everything to find it.", "d": 3, "r": "trouver", "z": 5.43, "n": 10}, {"t": "", "p": "", "o": "La cause de toutes ses actions, c’est cette recherche du bonheur.", "e": "The reason behind all their actions is this search for happiness.", "d": 4, "r": "bonheur", "z": 4.8, "n": 11}, {"t": "", "p": "", "o": "Par exemple, on travaille pour gagner de l’argent, et cet argent doit nous rendre heureux.", "e": "For example, we work to earn money, and that money is supposed to make us happy.", "d": 5, "r": "travaille", "z": 4.84, "n": 15}, {"t": "", "p": "", "o": "Avec cet argent, on peut acheter des choses qui vont nous rendre heureux : une maison, une voiture, partir en vacances.", "e": "With that money, we can buy things that will make us happy: a house, a car, or a vacation.", "d": 6, "r": "vacances", "z": 4.91, "n": 20}, {"t": "", "p": "", "o": "Un autre exemple : quand vous cherchez quelqu’un pour partager votre vie, un mari ou une femme, c’est parce que vous pensez que vous serez plus heureux ou plus heureuse avec cette personne.", "e": "Another example: when you look for someone to share your life with, a husband or a wife, it’s because you think you’ll be happier with that person.", "d": 9, "r": "quelqu", "z": 3.27, "n": 33}, {"t": "", "p": "", "o": "Alors voilà, quand on réfléchit, on comprend que toutes nos actions sont motivées par la recherche du bonheur.", "e": "So there you have it: when we think about it, we realize that all our actions are motivated by the search for happiness.", "d": 6, "r": "motivées", "z": 3.04, "n": 18}, {"t": "", "p": "", "o": "Le bonheur, c’est le but ultime de l’homme.", "e": "Happiness is the ultimate goal of human beings.", "d": 4, "r": "ultime", "z": 4.22, "n": 8}, {"t": "", "p": "", "o": "Sur ce point, les philosophes grecs étaient d’accord.", "e": "On this point, the Greek philosophers agreed.", "d": 4, "r": "philosophes", "z": 3.71, "n": 8}, {"t": "", "p": "", "o": "Mais derrière le bonheur, il y a aussi l’idée de plaisir.", "e": "But happiness is also connected to the idea of pleasure.", "d": 4, "r": "bonheur", "z": 4.8, "n": 10}, {"t": "", "p": "", "o": "Car le plaisir vient de la satisfaction d’une envie ou d’un besoin.", "e": "That’s because pleasure comes from satisfying a desire or a need.", "d": 4, "r": "satisfaction", "z": 4.19, "n": 12}, {"t": "", "p": "", "o": "Par exemple, le plaisir de manger un plat délicieux, votre plat préféré, le plaisir de voir un ami qu’on n’avait pas vu depuis longtemps.", "e": "For example, the pleasure of eating a delicious dish, your favorite dish, or the pleasure of seeing a friend you haven’t seen for a long time.", "d": 7, "r": "délicieux", "z": 4.01, "n": 25}, {"t": "", "p": "", "o": "Mais attention, parfois le plaisir peut nuire au bonheur.", "e": "But be careful: sometimes pleasure can harm happiness.", "d": 4, "r": "nuire", "z": 3.94, "n": 9}, {"t": "", "p": "", "o": "« Nuire », c’est un verbe qui veut dire « être mauvais », « faire du mal à quelqu’un ou à quelque chose ».", "e": "“To harm” is a verb meaning “to be bad for” or “to cause harm to someone or something.”", "d": 6, "r": "quelqu", "z": 3.27, "n": 19}, {"t": "", "p": "", "o": "On dit que la cigarette nuit à la santé, que fumer est mauvais pour la santé.", "e": "We say that cigarettes are harmful to health, that smoking is bad for your health.", "d": 5, "r": "cigarette", "z": 4.1, "n": 16}, {"t": "", "p": "", "o": "Pourquoi le plaisir peut-il nuire au bonheur ?", "e": "Why can pleasure harm happiness?", "d": 4, "r": "nuire", "z": 3.94, "n": 7}, {"t": "", "p": "", "o": "Parce qu’il est souvent éphémère, temporaire.", "e": "Because it is often fleeting, temporary.", "d": 4, "r": "éphémère", "z": 3.79, "n": 7}, {"t": "", "p": "", "o": "Vous savez bien, quand on fait la fête et qu’on boit de l’alcool, par exemple, on passe un bon moment, on est un peu euphorique.", "e": "You know, when we party and drink alcohol, for example, we have a good time and feel a little euphoric.", "d": 8, "r": "euphorique", "z": 2.77, "n": 26}, {"t": "", "p": "", "o": "Mais le jour d’après, le lendemain, on se sent mal.", "e": "But the next day, the day after, we feel bad.", "d": 4, "r": "sent", "z": 4.73, "n": 10}, {"t": "", "p": "", "o": "On a mal à la tête, on n’a rien envie de faire.", "e": "We have a headache and don’t feel like doing anything.", "d": 3, "r": "envie", "z": 5.19, "n": 10}, {"t": "", "p": "", "o": "En français, ça s’appelle « avoir la gueule de bois ».", "e": "In French, this is called “having a hangover.”", "d": 3, "r": "gueule", "z": 4.79, "n": 9}, {"t": "", "p": "", "o": "« Avoir la gueule de bois », c’est quand vous avez bu trop d’alcool le jour précédent, le jour d’avant et que vous vous sentez mal, que vous avez mal à la tête, que vous n’avez pas d’énergie.", "e": "“Having a hangover” is when you drank too much alcohol the previous day, the day before, and you feel unwell, have a headache, and have no energy.", "d": 8, "r": "sentez", "z": 3.92, "n": 36}, {"t": "", "p": "", "o": "En français, ça s’appelle « avoir la gueule de bois ».", "e": "In French, this is called “having a hangover.”", "d": 3, "r": "gueule", "z": 4.79, "n": 9}, {"t": "", "p": "", "o": "Ça, c’est donc un bon exemple.", "e": "So that’s a good example.", "d": 2, "r": "exemple", "z": 5.4, "n": 6}, {"t": "", "p": "", "o": "Le soir, vous êtes heureux, vous éprouvez du plaisir parce que vous buvez, parce que vous êtes content d’être avec vos amis et de faire la fête.", "e": "In the evening, you’re happy and feel pleasure because you’re drinking, because you’re glad to be with your friends and partying.", "d": 9, "r": "éprouvez", "z": 2.62, "n": 27}, {"t": "", "p": "", "o": "Mais le lendemain, vous regrettez un peu vos actions, vos décisions.", "e": "But the next day, you regret your actions and decisions a little.", "d": 5, "r": "regrettez", "z": 2.83, "n": 11}, {"t": "", "p": "", "o": "Donc oui, le plaisir, parfois, nuit au bonheur.", "e": "So yes, pleasure can sometimes harm happiness.", "d": 3, "r": "bonheur", "z": 4.8, "n": 8}, {"t": "", "p": "", "o": "Ça nous amène à une troisième idée qui est liée au bonheur : l’idée de stabilité.", "e": "That brings us to a third idea related to happiness: the idea of stability.", "d": 5, "r": "stabilité", "z": 4.2, "n": 15}, {"t": "", "p": "", "o": "Le bonheur, ça n’est pas être heureux pour 5 minutes ou même pour 5 heures.", "e": "Happiness isn’t being happy for five minutes or even five hours.", "d": 4, "r": "bonheur", "z": 4.8, "n": 13}, {"t": "", "p": "", "o": "Le bonheur, c’est un état stable, durable.", "e": "Happiness is a stable, lasting state.", "d": 3, "r": "stable", "z": 4.26, "n": 7}, {"t": "", "p": "", "o": "C’est ça qui différencie le bonheur et le plaisir.", "e": "That’s what distinguishes happiness from pleasure.", "d": 4, "r": "différencie", "z": 3.39, "n": 9}, {"t": "", "p": "", "o": "On peut dire que le bonheur, c’est un plaisir stable, constant, un état dans lequel on se sent complètement satisfait.", "e": "We can say that happiness is stable, constant pleasure, a state in which we feel completely satisfied.", "d": 6, "r": "constant", "z": 4.06, "n": 20}, {"t": "", "p": "", "o": "On dit en français « être comblé ».", "e": "In French, we say “to feel fulfilled.”", "d": 4, "r": "comblé", "z": 3.4, "n": 6}, {"t": "", "p": "", "o": "« Être comblé », c’est quand tous vos désirs, vos souhaits sont réalisés.", "e": "“To feel fulfilled” means that all your desires and wishes have come true.", "d": 5, "r": "comblé", "z": 3.4, "n": 11}, {"t": "", "p": "", "o": "Vous ne voulez rien d’autre, vous n’attendez rien de plus.", "e": "You don’t want anything else, and you’re not expecting anything more.", "d": 4, "r": "attendez", "z": 4.25, "n": 10}, {"t": "", "p": "", "o": "Le philosophe Aristote pensait que c’est seulement à la fin de sa vie qu’un homme sait s’il a vraiment trouvé le bonheur.", "e": "The philosopher Aristotle thought that it is only at the end of a person’s life that they know whether they have truly found happiness.", "d": 7, "r": "philosophe", "z": 4.17, "n": 22}, {"t": "", "p": "", "o": "Quand il regarde en arrière, quand il regarde sa vie pour voir s’il a été heureux.", "e": "When they look back, when they review their life to see whether they have been happy.", "d": 5, "r": "arrière", "z": 4.93, "n": 15}, {"t": "", "p": "", "o": "Ok, alors ça, c’était la partie philosophique du bonheur.", "e": "Okay, that was the philosophical part of happiness.", "d": 4, "r": "philosophique", "z": 3.93, "n": 9}, {"t": "", "p": "", "o": "Maintenant, je vais vous parler du World Happiness Report.", "e": "Now I’m going to tell you about the World Happiness Report.", "d": 3, "r": "parler", "z": 5.52, "n": 9}, {"t": "", "p": "", "o": "C’est un rapport annuel qui est publié par les Nations Unies et qui existe depuis 2012.", "e": "It’s an annual report published by the United Nations, and it has existed since 2012.", "d": 5, "r": "annuel", "z": 4.32, "n": 15}, {"t": "", "p": "", "o": "Cette année, en 2017, ils ont donc publié leur 5e rapport.", "e": "This year, in 2017, they published their fifth report.", "d": 3, "r": "publié", "z": 5.01, "n": 9}, {"t": "", "p": "", "o": "Alors, à votre avis, comment les chercheurs peuvent-ils mesurer le niveau de bonheur d’un pays ?", "e": "So, in your opinion, how can researchers measure a country’s level of happiness?", "d": 5, "r": "mesurer", "z": 4.19, "n": 15}, {"t": "", "p": "", "o": "C’est un peu bizarre, non, de mesurer le niveau de bonheur des habitants ?", "e": "It’s a little strange, isn’t it, to measure how happy a country’s inhabitants are?", "d": 5, "r": "mesurer", "z": 4.19, "n": 13}, {"t": "", "p": "", "o": "Pour faire ça, les chercheurs ont choisi différents critères, différents paramètres : des indicateurs objectifs et des critères subjectifs.", "e": "To do this, researchers chose various criteria and parameters: objective indicators and subjective criteria.", "d": 7, "r": "subjectifs", "z": 2.86, "n": 18}, {"t": "", "p": "", "o": "Pour les critères subjectifs, ils ont interrogé, ils ont posé des questions à 1 000 personnes dans 150 pays différents.", "e": "For the subjective criteria, they interviewed people, asking questions of 1,000 people in 150 different countries.", "d": 6, "r": "subjectifs", "z": 2.86, "n": 17}, {"t": "", "p": "", "o": "Ils ont interrogé 1 000 personnes dans chacun des pays.", "e": "They interviewed 1,000 people in each country.", "d": 4, "r": "interrogé", "z": 3.88, "n": 8}, {"t": "", "p": "", "o": "Avec les réponses de ces habitants, les chercheurs ont pu évaluer leur niveau de bonheur.", "e": "Using these residents’ answers, the researchers were able to assess their level of happiness.", "d": 5, "r": "évaluer", "z": 4.19, "n": 15}, {"t": "", "p": "", "o": "À votre avis, quels sont les critères, les indicateurs, qui sont utilisés pour mesurer le niveau de bonheur d’un pays ?", "e": "In your opinion, what criteria or indicators are used to measure a country’s level of happiness?", "d": 6, "r": "indicateurs", "z": 3.92, "n": 20}, {"t": "", "p": "", "o": "Est-ce que vous avez une petite idée ?", "e": "Do you have any idea?", "d": 3, "r": "idée", "z": 5.38, "n": 7}, {"t": "", "p": "", "o": "Je vais vous aider un peu.", "e": "I’ll give you a little help.", "d": 3, "r": "aider", "z": 5.09, "n": 6}, {"t": "", "p": "", "o": "Le premier critère, c’est le Produit Intérieur Brut par habitant.", "e": "The first criterion is Gross Domestic Product per capita.", "d": 4, "r": "critère", "z": 3.97, "n": 10}, {"t": "", "p": "", "o": "Généralement, on dit le PIB : Produit Intérieur Brut.", "e": "Generally, we say GDP: Gross Domestic Product.", "d": 3, "r": "Généralement", "z": 4.88, "n": 8}, {"t": "", "p": "", "o": "Le PIB, c’est la richesse d’un pays, la richesse que produit un pays chaque année.", "e": "GDP is a country’s wealth, the wealth a country produces each year.", "d": 5, "r": "richesse", "z": 4.4, "n": 15}, {"t": "", "p": "", "o": "Et le PIB par habitant, c’est cette richesse divisée par le nombre d’habitants du pays.", "e": "And GDP per capita is this wealth divided by the country’s population.", "d": 5, "r": "divisée", "z": 3.8, "n": 15}, {"t": "", "p": "", "o": "Logiquement, les petits pays riches, comme le Luxembourg, la Suisse ou la Norvège ont un très grand avantage ici.", "e": "Logically, small, wealthy countries such as Luxembourg, Switzerland, and Norway have a big advantage here.", "d": 6, "r": "Logiquement", "z": 3.86, "n": 19}, {"t": "", "p": "", "o": "Le PIB par habitant, c’est un indicateur très important.", "e": "GDP per capita is a very important indicator.", "d": 4, "r": "indicateur", "z": 3.86, "n": 9}, {"t": "", "p": "", "o": "Ça veut aussi dire qu’on associe le bonheur à la richesse.", "e": "This also means that we associate happiness with wealth.", "d": 5, "r": "associe", "z": 3.87, "n": 12}, {"t": "", "p": "", "o": "Pourtant, en français, on a un proverbe qui dit « l’argent ne fait pas le bonheur ».", "e": "Yet in French, we have a proverb that says, “Money can’t buy happiness.”", "d": 5, "r": "proverbe", "z": 3.55, "n": 14}, {"t": "", "p": "", "o": "Mais parfois, on ajoute « mais il y contribue ».", "e": "But sometimes we add, “but it helps.”", "d": 4, "r": "contribue", "z": 4.11, "n": 8}, {"t": "", "p": "", "o": "« L’argent ne fait pas le bonheur, mais il y contribue ».", "e": "“Money can’t buy happiness, but it helps.”", "d": 4, "r": "contribue", "z": 4.11, "n": 10}, {"t": "", "p": "", "o": "Ça veut dire que l’argent n’est pas suffisant pour être heureux, il faut d’autres choses, mais l’argent peut aider, il peut nous aider à être heureux.", "e": "That means money isn’t enough to be happy; other things are needed, but money can help—it can help us be happy.", "d": 7, "r": "suffisant", "z": 4.24, "n": 26}, {"t": "", "p": "", "o": "Le deuxième critère, c’est l’espérance de vie.", "e": "The second criterion is life expectancy.", "d": 4, "r": "critère", "z": 3.97, "n": 7}, {"t": "", "p": "", "o": "L’espérance de vie, c’est la durée de vie moyenne d’une population, d’une génération.", "e": "Life expectancy is the average lifespan of a population or generation.", "d": 5, "r": "espérance", "z": 4.1, "n": 13}, {"t": "", "p": "", "o": "En France, l’espérance de vie, c’est 82 ans.", "e": "In France, life expectancy is 82 years.", "d": 3, "r": "espérance", "z": 4.1, "n": 7}, {"t": "", "p": "", "o": "Ça veut dire que les bébés qui naissent actuellement en France vont statistiquement vivre jusqu’à 82 ans.", "e": "That means babies currently being born in France will statistically live to the age of 82.", "d": 6, "r": "statistiquement", "z": 3.21, "n": 17}, {"t": "", "p": "", "o": "Évidemment, ça n’est qu’une statistique.", "e": "Obviously, this is only a statistic.", "d": 3, "r": "statistique", "z": 4.23, "n": 6}, {"t": "", "p": "", "o": "Si un pays a une espérance de vie élevée, il a sûrement un bon système de santé pour soigner les personnes malades, beaucoup d’hôpitaux et de cliniques.", "e": "If a country has a high life expectancy, it surely has a good healthcare system to treat sick people, and plenty of hospitals and clinics.", "d": 7, "r": "cliniques", "z": 3.89, "n": 25}, {"t": "", "p": "", "o": "Grâce à tout ça, grâce à ces infrastructures, à ce système de santé, les habitants sont en bonne santé.", "e": "Thanks to all of that, thanks to this infrastructure and healthcare system, residents are healthy.", "d": 6, "r": "infrastructures", "z": 4.22, "n": 19}, {"t": "", "p": "", "o": "S’ils sont en bonne santé, ils vont vivre plus longtemps.", "e": "If they are healthy, they will live longer.", "d": 3, "r": "vivre", "z": 5.21, "n": 10}, {"t": "", "p": "", "o": "Et logiquement c’est plus facile d’être heureux quand on est en bonne santé.", "e": "And logically, it’s easier to be happy when you’re healthy.", "d": 5, "r": "logiquement", "z": 3.86, "n": 13}, {"t": "", "p": "", "o": "Vous savez quels pays ont l’espérance de vie la plus élevée ?", "e": "Do you know which countries have the highest life expectancy?", "d": 4, "r": "espérance", "z": 4.1, "n": 11}, {"t": "", "p": "", "o": "Eh bien, les trois pays qui ont l’espérance de vie la plus élevée dans le monde, ce sont le Japon, la Suisse et Singapour.", "e": "Well, the three countries with the highest life expectancy in the world are Japan, Switzerland, and Singapore.", "d": 7, "r": "espérance", "z": 4.1, "n": 24}, {"t": "", "p": "", "o": "Le troisième critère du World Happiness Report c’est l’assistance sociale.", "e": "The third criterion in the World Happiness Report is social support.", "d": 4, "r": "critère", "z": 3.97, "n": 10}, {"t": "", "p": "", "o": "L’assistance sociale, ça veut dire que vous avez quelqu’un sur qui compter quand vous avez un problème : vos parents, votre compagnon, vos amis.", "e": "Social support means having someone you can count on when you have a problem: your parents, your partner, or your friends.", "d": 8, "r": "quelqu", "z": 3.27, "n": 24}, {"t": "", "p": "", "o": "Là aussi, c’est logique, non ?", "e": "That makes sense too, doesn’t it?", "d": 3, "r": "logique", "z": 4.7, "n": 5}, {"t": "", "p": "", "o": "On se sent plus en sécurité quand on sait qu’il y a des personnes pour nous aider si on a un problème.", "e": "We feel safer when we know there are people who can help us if we have a problem.", "d": 6, "r": "sent", "z": 4.73, "n": 21}, {"t": "", "p": "", "o": "En français, on dit « se serrer les coudes».", "e": "In French, we say “to stand shoulder to shoulder.”", "d": 4, "r": "coudes", "z": 3.45, "n": 8}, {"t": "", "p": "", "o": "« se serrer les coudes », ça signifie s’entraider, être solidaire.", "e": "“To stand shoulder to shoulder” means to help one another and show solidarity.", "d": 5, "r": "entraider", "z": 2.91, "n": 9}, {"t": "", "p": "", "o": "Si un membre de votre famille ou un ami a des problèmes financiers, par exemple, vous allez l’aider.", "e": "If a family member or friend has financial problems, for example, you’ll help them.", "d": 5, "r": "financiers", "z": 4.38, "n": 17}, {"t": "", "p": "", "o": "Alors que si on ne se sent pas en sécurité, si on a peur pour son futur, il est difficile d’être heureux.", "e": "Whereas if we don’t feel safe, if we’re afraid for our future, it’s difficult to be happy.", "d": 6, "r": "sent", "z": 4.73, "n": 21}, {"t": "", "p": "", "o": "On retrouve l’idée de stabilité, dont nous avons parlé un peu plus tôt, qui est essentielle au bonheur.", "e": "This brings us back to the idea of stability, which we discussed a little earlier and which is essential to happiness.", "d": 6, "r": "essentielle", "z": 4.05, "n": 18}, {"t": "", "p": "", "o": "Les pays qui sont les mieux classés, là où les personnes sont les plus solidaires, ce sont l’Islande, l’Irlande et le Danemark.", "e": "The highest-ranking countries, where people show the most solidarity, are Iceland, Ireland, and Denmark.", "d": 7, "r": "solidaires", "z": 3.69, "n": 22}, {"t": "", "p": "", "o": "La France est 46e dans le classement pour ce critère.", "e": "France ranks 46th for this criterion.", "d": 4, "r": "critère", "z": 3.97, "n": 9}, {"t": "", "p": "", "o": "Ça veut dire que les Français devraient faire des efforts pour s’entraider davantage, pour davantage se serrer les coudes, pour être plus solidaires entre eux.", "e": "That means the French should make an effort to help one another more, to stand together more, and to show greater solidarity with each other.", "d": 8, "r": "entraider", "z": 2.91, "n": 25}, {"t": "", "p": "", "o": "Ensuite, il y a l’indicateur de confiance, le 4e critère.", "e": "Next comes the trust indicator, the fourth criterion.", "d": 4, "r": "indicateur", "z": 3.86, "n": 8}, {"t": "", "p": "", "o": "En français, on dit « avoir confiance en quelqu’un » ou « faire confiance à quelqu’un ».", "e": "In French, we say “to have confidence in someone” or “to trust someone.”", "d": 6, "r": "quelqu", "z": 3.27, "n": 15}, {"t": "", "p": "", "o": "Il y a deux possibilités : « avoir confiance en quelqu’un », par exemple « j’ai confiance en lui » ou « faire confiance à quelqu’un », par exemple « je lui fais confiance ».", "e": "There are two possibilities: “to have confidence in someone,” for example, “I have confidence in him,” or “to trust someone,” for example, “I trust him.”", "d": 8, "r": "quelqu", "z": 3.27, "n": 27}, {"t": "", "p": "", "o": "« Faire confiance à quelqu’un », c’est penser que cette personne est honnête et qu’elle ne va pas vous tromper.", "e": "“To trust someone” means believing that the person is honest and won’t deceive you.", "d": 7, "r": "quelqu", "z": 3.27, "n": 20}, {"t": "", "p": "", "o": "Dans le rapport sur le bonheur, ils demandent aux habitants s’ils font confiance à leur gouvernement et aux entreprises.", "e": "In the happiness report, they ask residents whether they trust their government and businesses.", "d": 6, "r": "demandent", "z": 4.39, "n": 19}, {"t": "", "p": "", "o": "Les habitants ont confiance en ces institutions quand il n’y a pas de corruption, quand le gouvernement fait bien son travail et que les entreprises ne sont pas corrompues.", "e": "Residents trust these institutions when there is no corruption, when the government does its job well, and when businesses are not corrupt.", "d": 9, "r": "corrompues", "z": 2.7, "n": 28}, {"t": "", "p": "", "o": "Quand tout le monde a les mêmes chances de réussir.", "e": "When everyone has the same opportunities to succeed.", "d": 4, "r": "réussir", "z": 4.51, "n": 9}, {"t": "", "p": "", "o": "Effectivement, c’est difficile de se sentir bien dans un pays quand on ne peut pas faire confiance au système.", "e": "Indeed, it’s difficult to feel good in a country when you can’t trust the system.", "d": 6, "r": "Effectivement", "z": 4.53, "n": 19}, {"t": "", "p": "", "o": "La liberté est le 5e indicateur utilisé dans ce classement.", "e": "Freedom is the fifth indicator used in this ranking.", "d": 4, "r": "indicateur", "z": 3.86, "n": 9}, {"t": "", "p": "", "o": "La liberté, ici, ça signifie la possibilité de prendre ses propres décisions, de faire ses propres choix quand personne ne vous oblige à prendre des décisions qui sont contre votre volonté.", "e": "Freedom here means being able to make your own decisions and choices, when nobody forces you to make decisions against your will.", "d": 8, "r": "oblige", "z": 4.25, "n": 31}, {"t": "", "p": "", "o": "Si vous voulez changer de travail, vous pouvez le faire.", "e": "If you want to change jobs, you can.", "d": 4, "r": "voulez", "z": 4.9, "n": 10}, {"t": "", "p": "", "o": "Si vous voulez déménager, aller vivre dans une autre ville ou un autre pays, vous pouvez le faire.", "e": "If you want to move, to live in another city or another country, you can.", "d": 6, "r": "déménager", "z": 3.89, "n": 18}, {"t": "", "p": "", "o": "Si vous voulez vous marier ou divorcer, vous pouvez le faire.", "e": "If you want to get married or divorced, you can.", "d": 5, "r": "divorcer", "z": 3.2, "n": 11}, {"t": "", "p": "", "o": "Le contraire de cette liberté, c’est quand vous êtes en prison.", "e": "The opposite of this freedom is being in prison.", "d": 4, "r": "prison", "z": 4.95, "n": 11}, {"t": "", "p": "", "o": "Quand vous êtes en prison, vous n’avez quasiment aucune liberté.", "e": "When you’re in prison, you have virtually no freedom.", "d": 4, "r": "quasiment", "z": 4.35, "n": 10}, {"t": "", "p": "", "o": "Encore une fois c’est plutôt logique, je ne pense pas qu’il existe des gens qui soient contents d’être en prison.", "e": "Once again, that seems fairly logical; I don’t think there are people who are happy to be in prison.", "d": 7, "r": "contents", "z": 3.87, "n": 21}, {"t": "", "p": "", "o": "Le 6e et dernier critère, c’est le plus intéressant à mon avis, c’est le critère de la générosité.", "e": "The sixth and final criterion is, in my opinion, the most interesting: generosity.", "d": 6, "r": "générosité", "z": 3.85, "n": 17}, {"t": "", "p": "", "o": "Cette générosité, elle est mesurée par les dons et les donations.", "e": "This generosity is measured through gifts and donations.", "d": 5, "r": "donations", "z": 3.32, "n": 11}, {"t": "", "p": "", "o": "Autrement dit, quand on donne de l’argent à une association qui s’occupe d’aider les personnes handicapées, les enfants, les animaux, ou de toute autre cause.", "e": "In other words, when people give money to an organization that helps people with disabilities, children, animals, or any other cause.", "d": 8, "r": "handicapées", "z": 3.58, "n": 25}, {"t": "", "p": "", "o": "D’après le classement, les pays dans lesquels les gens sont les plus généreux sont la Birmanie, l’Indonésie et Malte.", "e": "According to the ranking, the countries where people are most generous are Myanmar, Indonesia, and Malta.", "d": 6, "r": "généreux", "z": 4.12, "n": 19}, {"t": "", "p": "", "o": "C’est intéressant parce que je pense qu’être généreux, penser aux autres, essayer de les aider est une chose qui nous rend heureux parce qu’on se sent utile.", "e": "That’s interesting because I think being generous, thinking about others, and trying to help them makes us happy because we feel useful.", "d": 8, "r": "généreux", "z": 4.12, "n": 29}, {"t": "", "p": "", "o": "C’est très important de se sentir utile.", "e": "It’s very important to feel useful.", "d": 3, "r": "sentir", "z": 4.68, "n": 7}, {"t": "", "p": "", "o": "Mais je vous parlerai de ça un peu plus tard.", "e": "But I’ll talk to you about that a little later.", "d": 4, "r": "parlerai", "z": 3.46, "n": 10}, {"t": "", "p": "", "o": "Avec tous ces critères, quels sont les pays où les gens sont les plus heureux, à votre avis ?", "e": "Taking all these criteria into account, which countries do you think have the happiest people?", "d": 6, "r": "critères", "z": 4.41, "n": 18}, {"t": "", "p": "", "o": "Une petite idée ?", "e": "Any idea?", "d": 2, "r": "idée", "z": 5.38, "n": 3}, {"t": "", "p": "", "o": "Quand on calcule la moyenne des différents indicateurs, ce sont surtout les pays scandinaves qui arrivent en tête.", "e": "When the different indicators are averaged, it’s mainly the Scandinavian countries that come out on top.", "d": 6, "r": "scandinaves", "z": 3.44, "n": 18}, {"t": "", "p": "", "o": "« Arriver en tête », ça signifie « être le ou les premiers d’un classement ».", "e": "“To come out on top” means “to be first, or among the first, in a ranking.”", "d": 4, "r": "classement", "z": 4.71, "n": 12}, {"t": "", "p": "", "o": "La Norvège est 1re, le Danemark 2e, l’Islande 3e, ensuite il y a la Suisse 4e et la Finlande 5e.", "e": "Norway is first, Denmark second, Iceland third, followed by Switzerland in fourth place and Finland in fifth.", "d": 5, "r": "re", "z": 4.49, "n": 15}, {"t": "", "p": "", "o": "Et vous pensez que votre pays est bien classé ?", "e": "And do you think your country ranks highly?", "d": 4, "r": "classé", "z": 4.11, "n": 9}, {"t": "", "p": "", "o": "Si vous voulez vérifier, vous pouvez trouver le classement de votre pays sur internet en cherchant le World Happiness Report 2017.", "e": "If you want to check, you can find your country’s ranking online by searching for the World Happiness Report 2017.", "d": 6, "r": "cherchant", "z": 4.05, "n": 20}, {"t": "", "p": "", "o": "Voilà, maintenant nous avons vu que le bonheur est un état durable dans lequel nous sommes satisfaits, dans lequel tous nos désirs sont comblés.", "e": "So, we’ve now seen that happiness is a lasting state in which we are satisfied, in which all our desires are fulfilled.", "d": 8, "r": "comblés", "z": 3.0, "n": 24}, {"t": "", "p": "", "o": "Mais, pour arriver à cet état, il y a des conditions extérieures, des conditions qui ne dépendent pas de nous, qui dépendent du pays dans lequel on vit, par exemple.", "e": "But to reach this state, there are external conditions, conditions beyond our control that depend, for example, on the country we live in.", "d": 8, "r": "dépendent", "z": 3.82, "n": 29}, {"t": "", "p": "", "o": "Cependant, dans les pays occidentaux, le bonheur est devenu une obsession, une obsession égoïste, narcissique.", "e": "However, in Western countries, happiness has become an obsession, a selfish, narcissistic obsession.", "d": 6, "r": "narcissique", "z": 3.36, "n": 15}, {"t": "", "p": "", "o": "Tout le monde fait tout pour le trouver.", "e": "Everyone does everything to find it.", "d": 3, "r": "trouver", "z": 5.43, "n": 8}, {"t": "", "p": "", "o": "Certains journalistes parlent même de la « dictature du bonheur ».", "e": "Some journalists even talk about the “dictatorship of happiness.”", "d": 4, "r": "dictature", "z": 4.01, "n": 9}, {"t": "", "p": "", "o": "La « dictature du bonheur », qu’est-ce que ça signifie ?", "e": "What does the “dictatorship of happiness” mean?", "d": 4, "r": "dictature", "z": 4.01, "n": 9}, {"t": "", "p": "", "o": "Ça veut dire que cette recherche du bonheur est comme une sorte de tyrannie.", "e": "It means that this search for happiness is like a kind of tyranny.", "d": 5, "r": "tyrannie", "z": 3.45, "n": 14}, {"t": "", "p": "", "o": "Elle impose aux gens de vivre d’une certaine façon s’ils veulent être heureux.", "e": "It forces people to live in a certain way if they want to be happy.", "d": 4, "r": "impose", "z": 4.5, "n": 13}, {"t": "", "p": "", "o": "Dans les médias et les publicités, on nous donne des ordres pour être heureux : faites du sport, mangez équilibré, partez en vacances ici ou là, achetez cette voiture ou ce smartphone.", "e": "In the media and in advertisements, we’re given orders about how to be happy: exercise, eat a balanced diet, go on vacation here or there, buy this car or smartphone.", "d": 9, "r": "mangez", "z": 3.59, "n": 31}, {"t": "", "p": "", "o": "Il faut faire un travail qui nous passionne, trouver la femme ou le mari idéal.", "e": "We have to do work we’re passionate about and find the ideal wife or husband.", "d": 6, "r": "passionne", "z": 3.38, "n": 15}, {"t": "", "p": "", "o": "C’est un peu stressant tout ça, non ?", "e": "It’s all a little stressful, isn’t it?", "d": 4, "r": "stressant", "z": 3.35, "n": 7}, {"t": "", "p": "", "o": "Vous ne pensez pas ?", "e": "Don’t you think?", "d": 2, "r": "pensez", "z": 4.67, "n": 4}, {"t": "", "p": "", "o": "Après tout, chacun a une vision différente du bonheur, non ?", "e": "After all, everyone has a different vision of happiness, don’t they?", "d": 4, "r": "différente", "z": 4.5, "n": 9}, {"t": "", "p": "", "o": "Peut-être que les choses qui me rendent heureux ne plaisent pas à mon voisin.", "e": "Maybe the things that make me happy don’t appeal to my neighbor.", "d": 5, "r": "plaisent", "z": 3.58, "n": 14}, {"t": "", "p": "", "o": "J’adore faire du vélo le dimanche quand il fait beau, par exemple.", "e": "For example, I love cycling on Sundays when the weather is nice.", "d": 4, "r": "vélo", "z": 4.56, "n": 12}, {"t": "", "p": "", "o": "Ça, ça me rend heureux.", "e": "That makes me happy.", "d": 2, "r": "heureux", "z": 4.98, "n": 5}, {"t": "", "p": "", "o": "Mais il y a aussi des gens qui n’aiment pas faire de vélo et qui préfèrent d’autres activités comme, je ne sais pas, la méditation, le running ou bien aller au cinéma.", "e": "But there are also people who don’t like cycling and prefer other activities such as, I don’t know, meditation, running, or going to the movies.", "d": 9, "r": "running", "z": 3.5, "n": 31}, {"t": "", "p": "", "o": "Ou bien certaines personnes préfèrent aller au bord de la mer pour les vacances, et d’autres à la montagne.", "e": "Or some people prefer to go to the seaside for their vacation, while others prefer the mountains.", "d": 6, "r": "préfèrent", "z": 4.03, "n": 19}, {"t": "", "p": "", "o": "Ça dépend des goûts, des préférences !", "e": "It depends on people’s tastes and preferences!", "d": 4, "r": "préférences", "z": 3.61, "n": 6}, {"t": "", "p": "", "o": "Alors, comment des « experts du bonheur » peuvent-ils nous aider à être heureux ?", "e": "So how can “happiness experts” help us be happy?", "d": 4, "r": "experts", "z": 4.47, "n": 12}, {"t": "", "p": "", "o": "Le plus important, à mon avis, c’est d’apprendre à se connaître.", "e": "The most important thing, in my opinion, is to learn to know yourself.", "d": 4, "r": "connaître", "z": 4.92, "n": 11}, {"t": "", "p": "", "o": "« Connais-toi toi-même » disaient les philosophes grecs.", "e": "“Know thyself,” the Greek philosophers used to say.", "d": 3, "r": "philosophes", "z": 3.71, "n": 6}, {"t": "", "p": "", "o": "Tout le monde est différent, il faut apprendre à apprécier ses différences, sa singularité, pour savoir ce qui nous rend heureux.", "e": "Everyone is different; we need to learn to appreciate our differences and individuality in order to know what makes us happy.", "d": 7, "r": "singularité", "z": 3.38, "n": 21}, {"t": "", "p": "", "o": "Si vous essayez d’imiter les autres, de copier leur recette du bonheur, cela va sûrement créer de la frustration, de la jalousie.", "e": "If you try to imitate others, to copy their recipe for happiness, it will surely create frustration and jealousy.", "d": 7, "r": "imiter", "z": 3.67, "n": 22}, {"t": "", "p": "", "o": "Ça risque même de vous rendre malheureux.", "e": "It might even make you unhappy.", "d": 3, "r": "malheureux", "z": 4.18, "n": 7}, {"t": "", "p": "", "o": "Si vous vous conformez à la définition générale que la société donne du bonheur, peut-être que ça ne marchera pas non plus.", "e": "If you conform to society’s general definition of happiness, that might not work either.", "d": 8, "r": "conformez", "z": 1.82, "n": 22}, {"t": "", "p": "", "o": "Il n’existe pas d’ingrédients universels qui créent le bonheur, sinon on le saurait et tout le monde serait déjà heureux.", "e": "There are no universal ingredients that create happiness; otherwise, we would know about them and everyone would already be happy.", "d": 7, "r": "universels", "z": 3.12, "n": 20}, {"t": "", "p": "", "o": "Au contraire, il faut trouver sa propre recette.", "e": "On the contrary, you have to find your own recipe.", "d": 3, "r": "recette", "z": 4.35, "n": 8}, {"t": "", "p": "", "o": "Prenez du temps pour vous, pour vous poser des questions et trouvez ce qui vous rend vraiment heureux.", "e": "Take time for yourself, to ask yourself questions, and find what truly makes you happy.", "d": 6, "r": "trouvez", "z": 4.41, "n": 18}, {"t": "", "p": "", "o": "Et surtout, ouvrez-vous aux autres.", "e": "And above all, open yourself up to others.", "d": 3, "r": "ouvrez-vous", "z": 3.7, "n": 5}, {"t": "", "p": "", "o": "Ne cherchez pas simplement votre bonheur personnel, mais essayez d’aider d’autres personnes à trouver le leur.", "e": "Don’t just seek your own personal happiness; try to help other people find theirs.", "d": 5, "r": "cherchez", "z": 4.23, "n": 16}, {"t": "", "p": "", "o": "Le bonheur ne doit pas être un plaisir égoïste, c’est une chose que l’on doit essayer de partager le plus possible.", "e": "Happiness shouldn’t be a selfish pleasure; it’s something we should try to share as much as possible.", "d": 7, "r": "égoïste", "z": 3.75, "n": 21}, {"t": "", "p": "", "o": "C’est une richesse qui peut grandir en la partageant, contrairement aux autres richesses.", "e": "It is a form of wealth that can grow when shared, unlike other kinds of wealth.", "d": 5, "r": "partageant", "z": 3.54, "n": 13}, {"t": "", "p": "", "o": "Nous arrivons donc à la fin de ce podcast.", "e": "So we’ve reached the end of this podcast.", "d": 4, "r": "arrivons", "z": 3.54, "n": 9}, {"t": "", "p": "", "o": "J’espère que ce sujet du bonheur vous a intéressés, j’espère que vous avez appris de nouvelles choses, des choses peut-être intéressantes dont vous aurez envie de parler avec vos amis, avec votre famille.", "e": "I hope you found this topic of happiness interesting, and I hope you learned new things, perhaps interesting things you’ll want to talk about with your friends and family.", "d": 8, "r": "intéressantes", "z": 4.04, "n": 32}, {"t": "", "p": "", "o": "Et j’espère aussi que vous aurez envie d’écouter le prochain podcast.", "e": "And I also hope you’ll want to listen to the next podcast.", "d": 5, "r": "podcast", "z": 3.57, "n": 11}, {"t": "", "p": "", "o": "Comme d’habitude, je vous encourage à écouter ce podcast plusieurs fois.", "e": "As usual, I encourage you to listen to this podcast several times.", "d": 5, "r": "podcast", "z": 3.57, "n": 11}, {"t": "", "p": "", "o": "Plus vous l’écouterez, plus vous comprendrez de choses.", "e": "The more you listen to it, the more you’ll understand.", "d": 5, "r": "écouterez", "z": 2.06, "n": 8}, {"t": "", "p": "", "o": "Et, pour vous aider, vous pouvez aussi trouver la transcription de ce podcast, ça veut dire toutes les choses que j’ai dites, sur mon site internet cottongue.com.", "e": "And to help you, you can also find the transcript of this podcast—that is, everything I said—on my website, cottongue.com.", "d": 10, "r": "cottongue", "z": 0.0, "n": 28}, {"t": "", "p": "", "o": "Allez sur cottongue.com, dans la rubrique podcast, et si vous vous inscrivez (c’est gratuit), vous aurez accès à toutes les transcriptions de tous les podcasts.", "e": "Go to cottongue.com, to the podcast section, and if you sign up (it’s free), you’ll have access to the transcripts of all the podcasts.", "d": 9, "r": "cottongue", "z": 0.0, "n": 26}, {"t": "", "p": "", "o": "Merci à tous d’avoir écouté ce podcast.", "e": "Thank you all for listening to this podcast.", "d": 4, "r": "podcast", "z": 3.57, "n": 7}, {"t": "", "p": "", "o": "J’espère qu’il vous a aidé à apprendre le français d’une façon un petit peu différente, un petit peu plus amusante, peut-être.", "e": "I hope it helped you learn French in a slightly different, perhaps slightly more fun, way.", "d": 7, "r": "amusante", "z": 3.43, "n": 21}, {"t": "", "p": "", "o": "La semaine prochaine, pour notre nouveau podcast, nous parlerons de la théorie du genre.", "e": "Next week, for our new podcast, we’ll talk about gender theory.", "d": 5, "r": "parlerons", "z": 3.27, "n": 14}, {"t": "", "p": "", "o": "Donc, si vous ne savez pas ce que c’est que la théorie du genre, rendez-vous la semaine prochaine avec le nouveau podcast.", "e": "So if you don’t know what gender theory is, join me next week for the new podcast.", "d": 7, "r": "podcast", "z": 3.57, "n": 22}, {"t": "", "p": "", "o": "En attendant, essayez de faire un peu de français tous les jours, de lire, d’écouter ou de regarder des choses intéressantes et on se retrouve la semaine prochaine.", "e": "In the meantime, try to do a little French every day, to read, listen to, or watch interesting things, and I’ll see you next week.", "d": 8, "r": "intéressantes", "z": 4.04, "n": 28}, {"t": "", "p": "", "o": "À bientôt, salut !", "e": "See you soon, bye!", "d": 2, "r": "salut", "z": 4.79, "n": 3}];
const out=document.getElementById('out'),f=document.getElementById('f'),histogram=document.getElementById('histogram');
const col=n=>`hsl(${Math.round(130-(n-1)*13)},55%,45%)`;
function renderHistogram(){
  const counts=Array.from({length:10}, (_,i)=>({level:i+1,count:D.filter(x=>x.d===i+1).length}));
  const max=Math.max(...counts.map(c=>c.count),1);
  histogram.innerHTML='<div class="hist-title">Difficulty distribution</div>' + counts.map(c=>`
    <div class="hist-row">
      <span>${c.level}</span>
      <div class="hist-track"><span class="hist-fill" style="width:${(c.count/max)*100}%"></span></div>
      <span>${c.count}</span>
    </div>
  `).join('');
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){
  renderHistogram();
  out.replaceChildren();let last=null;const level=f.value;const total=Math.max(D.length,1);
  D.forEach((x,idx)=>{
    if(level !== 'all' && x.d !== Number(level)) return;
    const key=x.t+'|'+x.p;
    if(key!==last&&(x.t||x.p)){last=key;const h=el('div','t');
      if(x.t)h.append('['+x.t+'] ');
      if(x.p){const b=el('b','',x.p+':');h.append(b)}
      out.append(h)}
    const s=el('div','s');s.tabIndex=0;s.setAttribute('role','button');
    const prog=el('div','progress');
    const track=el('div','progress-track');
    const fill=el('div','progress-fill');
    const pct=Math.round(((idx+1)/total)*100);
    fill.style.height=pct+'%';
    track.append(fill);
    prog.append(track);
    prog.append(el('div','progress-label',pct+'%'));
    s.append(prog);
    s.append(el('div','',x.e||x.o));
    const d=el('div','d',x.d+'/10');const m=el('div','m');const i=el('i');
    i.style.width=(x.d*10)+'%';i.style.background=col(x.d);m.append(i);d.append(m);s.append(d);
    const z=el('div','zh');
    if(x.e){const o=el('div','o',x.o);o.lang="fr";z.append(o)}
    z.append(el('div','i',x.r?('Rarest word: '+x.r+'  (Zipf '+(x.z===null?'?':x.z.toFixed(2))+')  ·  '+x.n+' words'):(x.n+' words')));
    s.append(z);
    const tg=()=>s.classList.toggle('open');
    s.onclick=tg;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
    out.append(s);
  });
}
f.onchange=render;
document.getElementById('all').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.add('open'));
document.getElementById('none').onclick=()=>document.querySelectorAll('.s').forEach(e=>e.classList.remove('open'));
render();
</script></body></html>
